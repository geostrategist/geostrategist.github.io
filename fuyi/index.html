<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>服儀群島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：海面上的學籍檔案——介面沿用專題網站的檔案夾語彙，島名是繡線名牌，右側是學籍卡 */
:root{
  --bg:#edf0ec;--panel:#fbfcf9;--panel2:#f1f4ef;
  --ink:#1c2633;--ink2:#4b5664;--ink3:#6c7682;--line:#d2d8d0;
  --navy:#1f2f55;--thread:#b3263a;
  --sel-bg:#1f2f55;--sel-ink:#ffffff;
  --ok-bg:#dfeee2;--ok-ink:#285f36;--warn-bg:#f6ead2;--warn-ink:#7d5410;--info-bg:#e1e8f4;--info-ink:#1f2f55;
  --shadow:0 6px 22px rgba(20,40,70,.22);
  --f-display:"LXGW WenKai TC","BiauKai","DFKai-SB","標楷體","Kaiti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161d1a;--panel:#1d2622;--panel2:#25302b;
  --ink:#e6ebe4;--ink2:#aab4ac;--ink3:#8a958d;--line:#36423c;
  --navy:#a9bde6;--thread:#e8808d;
  --sel-bg:#a9bde6;--sel-ink:#161d1a;
  --ok-bg:#1f3527;--ok-ink:#a3d7b0;--warn-bg:#3a2e17;--warn-ink:#efc77f;--info-bg:#1f2a3e;--info-ink:#bccbec;
  --shadow:0 6px 22px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161d1a;--panel:#1d2622;--panel2:#25302b;
  --ink:#e6ebe4;--ink2:#aab4ac;--ink3:#8a958d;--line:#36423c;
  --navy:#a9bde6;--thread:#e8808d;
  --sel-bg:#a9bde6;--sel-ink:#161d1a;
  --ok-bg:#1f3527;--ok-ink:#a3d7b0;--warn-bg:#3a2e17;--warn-ink:#efc77f;--info-bg:#1f2a3e;--info-ink:#bccbec;
  --shadow:0 6px 22px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--thread);outline-offset:2px}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none;background:#128bf0}
#stage canvas{display:block}

/* 島名繡線名牌 */
.tag{position:absolute;left:0;top:0;display:none;flex-direction:column;align-items:center;background:var(--panel);border:1.5px dashed var(--c);border-radius:4px;padding:2px 9px;white-space:nowrap;font-family:var(--f-display);font-size:15px;line-height:1.3;box-shadow:0 2px 8px rgba(20,40,70,.25);cursor:pointer;will-change:transform}
.tag.on{display:flex}
.tag small{font-family:var(--f-body);font-size:11px;color:var(--ink2)}
.far .tag{font-size:12px;padding:1px 6px}.far .tag small{display:none}

/* 刊頭 */
#mast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:2px solid var(--navy);border-radius:6px;padding:8px 14px;box-shadow:var(--shadow);max-width:min(330px,calc(100vw - 32px))}
#mast h1{font-size:22px;line-height:1.2;color:var(--navy)}
#mast p{margin:2px 0 0;font-size:12px;color:var(--ink2)}

/* 下方工具列 */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);width:max-content;max-width:calc(100vw - 16px)}
#bar .grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
#bar .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--ink3);margin-right:2px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:14px;line-height:1.4}
.chip:hover{border-color:var(--ink3)}
.chip[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
.chip.go{border-color:var(--navy);color:var(--navy);font-weight:500}
.chip.go[aria-pressed="true"]{color:var(--sel-ink)}

/* 學籍卡 */
#panel{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:420px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden}
#panel.open{display:flex}
@media (min-width:900px){body:has(#panel.open) #bar{left:calc((100vw - 444px)/2);max-width:calc(100vw - 460px)}}
#p-head{padding:12px 44px 10px 16px;border-bottom:2px solid var(--pc,var(--navy))}
#p-eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--ink3);margin:0}
#p-title{font-size:26px;line-height:1.25;color:var(--navy)}
#p-close{position:absolute;right:8px;top:8px;width:34px;height:34px;border:none;background:transparent;font-size:20px;color:var(--ink2);border-radius:6px}
#p-close:hover{background:var(--panel2)}
#p-body{padding:12px 16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.occ-now{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.occ-now strong{font-family:var(--f-display);font-size:17px}
.pill{font-size:12px;font-weight:500;padding:1px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok-ink)}.p-warn{background:var(--warn-bg);color:var(--warn-ink)}.p-info{background:var(--info-bg);color:var(--info-ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.k{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--ink3);margin:0}
.v{margin:0}
.note{margin:0;padding-top:10px;border-top:1px solid var(--line);color:var(--ink2);font-size:14px}
.facets{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
.facets dt{font-family:var(--f-mono);font-size:12px;color:var(--ink3);padding-top:2px;white-space:nowrap}
.facets dd{margin:0;min-width:0}
.none{color:var(--ink3)}
.thread{display:inline-block;width:24px;border-top:3px dashed currentColor;vertical-align:middle;margin-right:6px}
.src{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.src h3{font-size:15px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:14px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
.row{display:flex;flex-wrap:wrap;gap:6px}
#p-body h3{font-size:17px;color:var(--navy)}
#p-body ul,#p-body ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.lv{display:flex;flex-direction:column;gap:6px}
.lv-name{font-family:var(--f-display);font-size:16px;margin:0}
.lv-desc{font-size:13px;color:var(--ink2);margin:0}
.tl{list-style:none;margin:0;padding:0 0 0 14px!important;border-left:2px solid var(--line);gap:8px!important}
.tl li{font-size:13.5px;color:var(--ink2)}
.tl .yr{font-family:var(--f-mono);font-size:12.5px;color:var(--ink3);display:block}
.tl button{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 8px;margin-left:-8px}
.tl button:hover{border-color:var(--line)}
.tl button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink)}
.tl button[aria-pressed="true"] .yr{color:inherit}
.tl strong{font-family:var(--f-display);font-size:16px}
.it{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.it .pr{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2)}
.it .ch{grid-column:1/-1;font-size:12.5px;color:var(--ink2)}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tot b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:500;color:var(--navy)}

/* 開場 */
#intro{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(470px,calc(100vw - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border-radius:10px;padding:20px 22px;box-shadow:var(--shadow);border-top:3px solid var(--navy);display:flex;flex-direction:column;gap:10px;z-index:5}
#intro.off{display:none}
body:has(#intro:not(.off)) #bar{display:none}
#intro .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--ink3);margin:0}
#intro h1{font-size:clamp(34px,6vw,46px);line-height:1.12;color:var(--navy)}
#intro p{margin:0}
.dash{display:inline-flex;align-self:flex-start;padding:2px 10px;border:1.5px dashed var(--thread);border-radius:3px;color:var(--thread);font-size:12.5px}
#loading{font-size:13.5px;color:var(--ink2)}
#go:disabled{opacity:.5;cursor:wait}

/* 導覽卡 */
#tour{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:min(430px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;font-size:14px}
#tour .tt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#tour strong{font-family:var(--f-display);font-size:18px;color:var(--navy)}
#tour .st{font-family:var(--f-mono);font-size:12px;color:var(--ink3);white-space:nowrap}

/* 比較表 */
#cmp{position:fixed;inset:0;background:var(--bg);z-index:8;display:flex;flex-direction:column;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}
#cmp .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#cmp h2{font-size:24px;color:var(--navy)}
#cmp .wrap{overflow:auto;flex:1;min-height:0;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
#cmp table{border-collapse:collapse;font-size:13.5px;min-width:1040px;width:100%}
#cmp th,#cmp td{padding:7px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
#cmp thead th{position:sticky;top:0;background:var(--panel2);font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--ink2);z-index:1}
#cmp td:nth-child(2),#cmp td:nth-child(3){white-space:nowrap}
#cmp tbody th{font-family:var(--f-display);font-size:16px;font-weight:700;white-space:nowrap}
#cmp tbody th button{background:none;border:none;padding:0;color:var(--navy);text-decoration:underline;text-underline-offset:3px;font:inherit}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--sel-bg);color:var(--sel-ink);padding:5px 14px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}

@media (max-width:899px){
  #panel{left:8px;right:8px;width:auto;max-width:none;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));height:62%}
  #mast p{display:none}
  #mast{padding:5px 10px}
  #mast h1{font-size:17px}
  #bar{gap:5px 8px;padding:6px}
  #bar .lab{display:none}
  .chip{padding:4px 8px;font-size:13px}
  #fs{display:none}
  #toast{bottom:auto;top:calc(52px + env(safe-area-inset-top,0px))}
  #tour{top:calc(52px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body><div id="stage" role="img" aria-label="十所高中與四座主題島的 3D 群島，每座學校島上站著該校夏季與冬季制服的人物；同樣內容可在比較表以文字閱讀"></div>
<header id="mast"><h1>服儀群島</h1><p>場合一切換，每座島的人物都會換裝</p></header>
<nav id="bar" aria-label="群島操作">
  <div class="grp" id="b-occ"><span class="lab">場合</span></div>
  <div class="grp" id="b-reg"></div>
  <div class="grp"><button class="chip go" id="b-train" type="button" aria-pressed="false">環島火車</button><button class="chip" id="b-cmp" type="button">比較表</button><button class="chip" id="fs" type="button">全螢幕</button></div>
</nav>
<aside id="panel" aria-label="島嶼資料">
  <button id="p-close" type="button" aria-label="關閉">×</button>
  <div id="p-head"><p id="p-eyebrow"></p><h2 id="p-title"></h2></div>
  <div id="p-body"></div>
</aside>
<section id="tour" hidden aria-live="polite"></section>
<section id="cmp" hidden aria-label="十校比較表">
  <div class="hd"><h2>十校服儀比較表</h2><button class="btn pri" id="cmp-x" type="button">回到群島</button></div>
  <div class="wrap" id="cmp-body"></div>
</section>
<div id="toast" role="status"></div>
<section id="intro">
  <p class="eyebrow">服儀鬆綁之後｜北中南十校女生制服</p>
  <h1>服儀群島</h1>
  <p>十所高中各佔一座島，島上站著該校的夏季與冬季制服。切換上課日、體育課、典禮或班服日，所有人物一起換裝；點一座島，就看得到那所學校的規定與出處。</p>
  <span class="dash">示意模型 · 配色為近似值 · 灰色或告示牌為未查證</span>
  <p style="font-size:13.5px;color:var(--ink2)">島的地形與建築只是裝飾。人物穿著與卡片內容才是資料，來自各校公開規定。</p>
  <div class="row" style="align-items:center"><button class="btn pri" id="go" type="button" disabled>出發</button><button class="btn" id="go-cmp" type="button">先看比較表</button><span id="loading">正在造島</span></div>
</section>

function hubBody(){return `<p class="v">2016 年教育部發布服儀原則，2020 年修正。這份原則是所有學校共同的底線，學校可以訂得比它寬鬆。</p>
 <h3>學生可以</h3><ul><li>混合穿著校服與學校認可的服裝，例如班服、社團服</li><li>依自己對冷熱的感受選長短袖、長短褲；天冷時在校服內外加穿保暖衣物</li><li>上學穿皮鞋或運動鞋</li></ul>
 <h3>學校可以統一規定的例外</h3><ul><li>重要活動：週會、開學與畢業典禮、校慶、休業式、校外參訪、受獎或競賽、國際或校際交流</li><li>體育課：學校運動服或認可的運動服裝，並穿運動鞋</li><li>實習、實驗課：為了安全</li></ul>
 <h3>假日到校</h3><p class="v">自習、課輔、補考、重補修、補救教學穿校服；參加校內其他活動可穿便服並帶證件。</p>
 <h3>服裝儀容委員會</h3><ul><li>委員 7 至 15 人，學生代表占三分之一以上</li><li>任一性別不少於三分之一</li><li>規定每三年至少檢討一次</li><li>校務會議除明顯違法外，不得修改委員會通過的內容</li></ul>
 <h3>違規時</h3><p class="v">不得處罰。管教措施只限正向管教、口頭糾正、列入日常生活表現紀錄、通知監護人、書面自省、靜坐反省。除了防止危害安全、健康、公共衛生或疾病傳染，學校不得限制髮式。</p>
 <div class="src"><h3>規定出處 <span class="pill p-ok">已核對原文</span></h3><span><a href="${U.moe20}" target="_blank" rel="noopener">高級中等學校訂定學生服裝儀容規定之原則（修正）</a></span><span>109年8月3日臺教授國部字第1090072127號</span><span><a href="${U.moe16}" target="_blank" rel="noopener">2016 年發布新聞稿</a></span></div>`}
