<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;height:100%}[hidden]{display:none!important}img{max-width:100%}</style>
<title>實踐國企群島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Nunito:wght@700;800&family=Noto+Sans:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* Layout: full-screen toy archipelago in three.js; a floating header, a slide-in dossier panel for the selected island, and overlay views (list / timeline / log). */
:root{
  --bg:#1F5F8F;          /* harbour blue (host ground) */
  --bg-2:#FFF8EC;
  --fg:#2B2320;          /* ink */
  --muted:#6E5A50;
  --panel:#FFFDF8;
  --line:#2B2320;
  --accent:#DB6A41;      /* policy-island terracotta */
  --accent-2:#1F6FB2;    /* sea blue */
  --chip:#FFE9D6;
  --insight:#0E7C86;      /* teal insight line */
  --insight-bg:#DDF4F1;
  --shadow:0 8px 0 rgba(43,35,32,.18),0 14px 30px rgba(10,40,70,.28);
  --font-display:"M PLUS Rounded 1c","Nunito","Noto Sans TC","Noto Sans JP","Noto Sans SC",system-ui,sans-serif;
  --font-body:"Noto Sans TC","Noto Sans","Noto Sans JP","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13243B; --bg-2:#2A2F3E; --fg:#FFF4E6; --muted:#D3B9A6;
    --panel:#1E2536; --line:#FFF4E6; --accent:#F08A5C; --accent-2:#6FB6F0;
    --chip:#3A3140; --insight:#6FE0D6; --insight-bg:#1F3A40; --shadow:0 8px 0 rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13243B; --bg-2:#2A2F3E; --fg:#FFF4E6; --muted:#D3B9A6;
  --panel:#1E2536; --line:#FFF4E6; --accent:#F08A5C; --accent-2:#6FB6F0;
  --chip:#3A3140; --insight:#6FE0D6; --insight-bg:#1F3A40; --shadow:0 8px 0 rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden;position:relative;font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#stage{position:absolute;inset:0;touch-action:none}
canvas{display:block;outline:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:12px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* header */
#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#hud>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .eyebrow{font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#fff;background:var(--accent);padding:2px 8px;border-radius:6px;align-self:flex-start}
.brand h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3.6vw,32px);line-height:1.1;text-wrap:balance;color:#fff;text-shadow:0 2px 0 rgba(43,35,32,.6),0 0 18px rgba(0,0,0,.35)}
.brand .sub{font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(43,35,32,.6)}
.lang{display:flex;gap:3px;max-width:52vw;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow);flex-wrap:wrap;justify-content:flex-end}
.lang button{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;color:var(--fg);white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* toolbar */
#bar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:8px;padding-top:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;flex-wrap:wrap}
#bar>*{pointer-events:auto}
.group{display:flex;gap:2px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.group button{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:800;color:var(--fg);white-space:nowrap;display:flex;align-items:center;gap:6px}
.group button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
.group button .k{font-family:var(--font-display);font-size:14px;line-height:1}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--barh,72px) + var(--rbarh,0px) + 8px);z-index:4;font-size:14px;font-weight:800;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:var(--shadow);white-space:nowrap;transition:opacity .4s}
#hint.off{opacity:0;pointer-events:none}

/* floating island labels */
.tag{position:absolute;left:0;top:0;z-index:3;transform:translate(-50%,-100%);pointer-events:none;font-family:var(--font-display);font-weight:800;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--panel);border:3px solid var(--line);border-bottom-width:5px;border-bottom-color:var(--c,var(--accent));color:var(--fg);box-shadow:var(--shadow);white-space:nowrap;opacity:0;transition:opacity .2s}
.tag.on{opacity:1}
.tag small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--muted)}

/* dossier panel */
#panel{position:absolute;top:0;right:0;bottom:0;z-index:6;width:min(420px,100%);background:var(--panel);border-left:3px solid var(--line);box-shadow:var(--shadow);transform:translateX(104%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
#panel.open{transform:none}
#panel .head{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
#panel .swatch{width:44px;height:44px;border-radius:14px;flex:none;background:var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
#panel h2{margin:0;font-family:var(--font-display);font-size:20px;font-weight:800;line-height:1.15;text-wrap:balance}
#panel .head p{margin:4px 0 0;font-size:12px;color:var(--muted)}
#panel .x{margin-left:auto;font-size:20px;line-height:1;padding:4px 8px;border-radius:10px;color:var(--muted)}
#panel .body{overflow:auto;padding:14px 20px 28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.desc{margin:0;font-size:14px;line-height:1.7;padding:12px 14px;border-left:5px solid var(--c);background:var(--chip);border-radius:0 12px 12px 0}
.item{border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg-2);box-shadow:4px 4px 0 var(--c);display:flex;flex-direction:column;gap:6px}
.item .k{margin:2px 0 0;font-size:13.5px;font-weight:700;color:var(--insight);line-height:1.5;padding:7px 10px;border-radius:10px;background:var(--insight-bg);display:flex;gap:8px;align-items:flex-start}
.item .k span{flex:none;font-size:10px;letter-spacing:.12em;padding:2px 6px;border-radius:6px;background:var(--insight);color:#fff;margin-top:2px}
.quote{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.quote b{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--fg)}
.quote span{font-weight:800;color:var(--accent-2)}
.quote i{font-style:normal;font-size:11px;color:var(--muted)}
.item .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .meta .d{font-family:var(--font-display);font-weight:800;color:var(--accent)}
.item h3{margin:0;font-size:15px;font-weight:700;line-height:1.4}
.item p{margin:0;font-size:13px;color:var(--fg)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.links button{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.links button::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.src{font-size:11px;color:var(--muted)}
.src a{color:var(--accent-2)}

/* overlay views */
body.in-view #bar{z-index:8}
.view{position:absolute;inset:0;z-index:7;background:var(--bg-2);overflow:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(var(--barh,72px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view .wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.view h2{font-family:var(--font-display);font-weight:800;font-size:22px;margin:0}
.view .lede{color:var(--fg);margin:0;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{border:2px solid var(--line);border-radius:18px;background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;border-top:8px solid var(--c);box-shadow:5px 5px 0 rgba(43,35,32,.25)}
.card h3{margin:0;font-family:var(--font-display);font-weight:800;font-size:17px}
.card .n{font-size:12px;color:var(--muted)}
.card .cd{margin:0;font-size:13px;line-height:1.6;color:var(--fg)}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.card li{font-size:13px;display:flex;gap:8px;align-items:flex-start}
.card li .d{font-family:var(--font-display);font-weight:800;color:var(--accent);font-size:11px;white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
.card li button{text-align:left;padding:0;line-height:1.4}
.card li button:hover{color:var(--accent)}
.card li button em{display:block;font-style:normal;font-size:12px;color:var(--insight);font-weight:700}
.tl{display:flex;flex-direction:column;gap:0;border-left:3px solid var(--line);margin-left:6px;padding-left:18px}
.tl .row{position:relative;padding:8px 0 14px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.tl .row::before{content:"";position:absolute;left:-26.5px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--c);border:3px solid var(--bg)}
.tl .d{font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.tl .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.tl .t b{font-weight:700;font-size:14px;line-height:1.4}
.tl .t button{text-align:left;padding:0}
.tl .isl{font-size:11px;font-weight:700;color:var(--c)}
@media (max-width:520px){.tl .row{grid-template-columns:1fr}.tl .d{padding-top:0}}

/* log drawer */
#log{position:absolute;left:0;top:0;bottom:0;z-index:6;width:min(340px,100%);background:var(--panel);border-right:3px solid var(--line);box-shadow:var(--shadow);transform:translateX(-104%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
#log.open{transform:none}
#log .head{padding:18px 18px 10px;border-bottom:1px solid var(--line)}
#log .eyebrow{font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.18em;color:var(--accent);display:flex;align-items:center;gap:8px}
#log .eyebrow i{width:8px;height:8px;border-radius:50%;background:#4CC37A;box-shadow:0 0 0 4px rgba(76,195,122,.25);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(76,195,122,.1)}}
#log h2{margin:4px 0 0;font-family:var(--font-display);font-weight:800;font-size:18px}
#log .body{overflow:auto;padding:10px 18px 24px;display:flex;flex-direction:column;gap:2px;font-size:13px}
#log .ln{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);align-items:start}
#log .ln .d{font-family:var(--font-display);font-weight:800;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
#log .ln button{text-align:left;padding:0;line-height:1.4}
#log .ln button b{color:var(--c);font-size:11px;display:block}

/* intro */
#intro{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(20,50,85,.45);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .5s}
#intro.off{opacity:0;pointer-events:none}
.intro-card{max-height:calc(100dvh - 32px);overflow:auto;background:var(--panel);border:3px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:28px 28px 24px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px}
.intro-card .eyebrow{font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.2em;color:var(--accent)}
.intro-card h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(24px,5vw,34px);line-height:1.15;text-wrap:balance}
.intro-card p{margin:0;color:var(--muted)}
.intro-card .count{display:flex;gap:18px;font-family:var(--font-display);font-weight:800;font-size:14px}
.intro-card .count b{font-size:28px;display:block;color:var(--accent);line-height:1}
.intro-card .go{align-self:flex-start;background:var(--accent);color:#fff;font-family:var(--font-display);font-weight:800;font-size:16px;padding:12px 24px;border-radius:999px;border:2px solid var(--line);box-shadow:0 5px 0 var(--line);transition:transform .1s}
.intro-card .go:active{transform:translateY(3px)}
.intro-card .legend{display:flex;flex-wrap:wrap;gap:6px}
.intro-card .legend span{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.intro-card .legend span i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
#loading{font-size:12px;color:var(--muted)}
#toast{position:absolute;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:8;background:var(--fg);color:var(--panel);font-weight:800;font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%) translateY(6px)}
#rbar{position:absolute;left:0;right:0;bottom:var(--barh,72px);z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#rbar>*{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
#rbar .rb-bar{width:120px;padding:0;height:14px;overflow:hidden;background:var(--chip)}
#rbar .rb-bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
#rbar input{font:inherit;font-weight:700;width:150px;border:2px solid var(--line);background:var(--bg-2);color:var(--fg);padding:6px 12px}
#rbar #r-cert{cursor:pointer;background:var(--accent);color:#fff}
#rbar #r-cert:disabled{background:var(--chip);color:var(--muted);cursor:not-allowed}
.rpg{display:flex;flex-direction:column;gap:10px;border:2px dashed var(--line);border-radius:16px;padding:12px;background:var(--bg-2)}
.rpg-h{font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--accent)}
.npc{display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--c);padding-left:10px}
.npc .who{font-weight:800;font-size:13px}
.npc p{margin:0;font-size:13px;line-height:1.6}
.npc .tip{color:var(--insight);font-weight:700}
.qz{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.qz.ok{border-color:#3DBB7A;background:var(--chip)}
.qz.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qz .qh{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.qz p{margin:0;font-size:13.5px;font-weight:700;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:5px}
.opts button{text-align:left;border:2px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;background:var(--bg-2)}
.opts button:hover{background:var(--chip)}
.qz .fb{font-size:12.5px;font-weight:800;color:var(--insight)}
#cert[hidden],#rbar[hidden],.view[hidden]{display:none!important}
#cert{position:absolute;inset:0;z-index:12;background:rgba(10,30,55,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px));overflow:auto}
.cert-card{background:var(--panel);border:5px double var(--accent);border-radius:20px;padding:30px 28px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);position:relative;text-align:center}
.cert-seal{position:absolute;top:14px;right:16px;font-family:var(--font-display);font-weight:800;font-size:11px;color:#fff;background:var(--accent);padding:4px 10px;border-radius:999px}
.cert-card h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:.1em}
.cert-who{font-family:var(--font-display);font-weight:800;font-size:26px;border-bottom:3px solid var(--line);padding-bottom:6px;margin:0 auto;min-width:200px}
.cert-rank{font-weight:800;color:var(--accent)}
.cert-stats{font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--insight);font-variant-numeric:tabular-nums}
.cert-card p{margin:0;font-size:14px;line-height:1.9;text-align:left}
.cert-stamps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cert-stamps span{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;border:2px solid var(--c);background:var(--chip)}
.cert-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700}
#cert-close{align-self:center;background:var(--fg);color:var(--panel);font-weight:800;padding:9px 22px;border-radius:999px}
@media (min-width:900px){body.pan #bar,body.pan #rbar,body.pan #hint{padding-right:calc(436px + max(16px,env(safe-area-inset-right,0px)))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="stage"></div>

<header id="hud">
  <div class="brand">
    <span class="eyebrow">SHIH CHIEN · IBM ISLANDS</span>
    <h1 data-i="brand">實踐國企群島</h1>
    <span class="sub" data-i="sub">一座島一個主題，一座相連的商業城市</span>
  </div>
  <nav class="lang" aria-label="language">
    <button data-lang="tw" aria-pressed="true">繁體</button>
    <button data-lang="cn" aria-pressed="false">简体</button>
    <button data-lang="ja" aria-pressed="false">日本語</button>
    <button data-lang="id" aria-pressed="false">Indonesia</button>
    <button data-lang="vi" aria-pressed="false">Tiếng Việt</button>
    <button data-lang="en" aria-pressed="false">English</button>
    <button data-lang="ru" aria-pressed="false">Русский</button>
  </nav>
</header>

<div id="hint" data-i="hint">點一座島，開始探索</div>
<div id="toast"></div>
<div id="rbar" hidden>
  <div class="rb-l"><b id="r-lv">Lv 1</b><span id="r-xp">0 XP</span></div>
  <div class="rb-bar"><i id="r-fill"></i></div>
  <span id="r-st">🏅 0/16</span>
  <input id="cert-name" placeholder="name" maxlength="20">
  <button id="r-cert" disabled></button>
</div>
<div id="cert" hidden><div class="cert-card">
  <div class="cert-seal">實踐國企群島</div>

 {date:"2026-10-29",links:["prod"],t:L("什麼是生產管理","什么是生产管理","生産管理とは","Apa itu manajemen produksi","Quản trị sản xuất là gì","What is production management","Что такое управление производством"),b:L("把原料變成產品並送到客戶手上的流程：產能、採購、工廠、物流、庫存。","把原料变成产品并送到客户手上的流程：产能、采购、工厂、物流、库存。","原材料を製品にして顧客へ届ける流れ。生産能力、調達、工場、物流、在庫。","Alur mengubah bahan baku menjadi produk sampai ke pelanggan: kapasitas, pengadaan, pabrik, logistik, persediaan.","Quy trình biến nguyên liệu thành sản phẩm tới tay khách: công suất, mua hàng, nhà máy, logistics, tồn kho.","The process of turning raw materials into products and getting them to the customer: capacity, procurement, plants, logistics, inventory.","Процесс превращения сырья в продукт и его доставки клиенту: мощности, закупки, заводы, логистика, запасы."),k:L("缺料與擴產是今年生產島的兩個關鍵字。","缺料与扩产是今年生产岛的两个关键词。","今年の生産島のキーワードは部材不足と増産。","Dua kata kunci tahun ini: kelangkaan dan ekspansi.","Hai từ khóa năm nay: thiếu hụt và mở rộng.","Material shortages and capacity expansion are the two keywords on Production Island this year.","Нехватка материалов и расширение мощностей это два ключевых слова года на острове производства.")},
 {date:"2026-10-29",links:["mkt"],t:L("什麼是行銷管理","什么是营销管理","マーケティング管理とは","Apa itu manajemen pemasaran","Quản trị tiếp thị là gì","What is marketing management","Что такое управление маркетингом"),b:L("找到顧客、說服顧客、留住顧客：定位、定價、通路、推廣，加上社群、數據與AI。","找到顾客、说服顾客、留住顾客：定位、定价、渠道、推广，加上社群、数据与AI。","顧客を見つけ、説得し、つなぎとめる。位置づけ、価格、チャネル、販促、SNS、データ、AI。","Menemukan, meyakinkan, mempertahankan pelanggan: positioning, harga, saluran, promosi, plus media sosial, data, AI.","Tìm, thuyết phục, giữ chân khách: định vị, giá, kênh, khuyến mãi, cộng thêm mạng xã hội, dữ liệu và AI.","Finding customers, convincing them and keeping them: positioning, pricing, channels and promotion, plus social media, data and AI.","Найти клиента, убедить его и удержать: позиционирование, цена, каналы и продвижение, плюс соцсети, данные и ИИ."),k:L("今年的行銷戰場從搜尋移到AI引用。","今年的营销战场从搜索移到AI引用。","今年の主戦場は検索からAIの引用へ。","Medan tahun ini bergeser dari pencarian ke kutipan AI.","Chiến trường năm nay dời từ tìm kiếm sang trích dẫn AI.","This year the marketing battlefield has moved from search to AI citations.","В этом году поле маркетинговой битвы сместилось от поиска к упоминаниям в ответах ИИ.")},
 {date:"2026-10-29",links:["hr"],t:L("什麼是人力資源管理","什么是人力资源管理","人事管理とは","Apa itu manajemen SDM","Quản trị nhân sự là gì","What is human resource management","Что такое управление персоналом"),b:L("處理企業裡的人：招募、薪資、訓練、留才、勞資關係。","处理企业里的人：招募、薪资、训练、留才、劳资关系。","企業の人を扱う。採用、給与、教育、定着、労使関係。","Mengurus orang di perusahaan: rekrutmen, gaji, pelatihan, retensi, hubungan industrial.","Xử lý con người trong doanh nghiệp: tuyển dụng, lương, đào tạo, giữ chân, quan hệ lao động.","Dealing with the people inside a company: recruiting, pay, training, retention and labour relations.","Работа с людьми внутри компании: найм, оплата труда, обучение, удержание и трудовые отношения."),k:L("最低工資與AI技能缺口同時推高人力成本。","最低工资与AI技能缺口同时推高人力成本。","最低賃金とAIスキル不足が人件費を押し上げる。","Upah minimum dan kesenjangan skill AI sama-sama menaikkan biaya SDM.","Lương tối thiểu và thiếu kỹ năng AI cùng đẩy chi phí nhân sự.","The minimum wage and the AI skills gap are pushing labour costs up at the same time.","Минимальная зарплата и дефицит навыков в сфере ИИ одновременно поднимают расходы на персонал.")},
 {date:"2026-10-29",links:["rd"],t:L("什麼是研發管理","什么是研发管理","研究開発管理とは","Apa itu manajemen R&D","Quản trị R&D là gì","What is R&D management","Что такое управление НИОКР"),b:L("把技術變成競爭力：製程與產品開發、專利、產學合作、研發投入與回收。","把技术变成竞争力：制程与产品开发、专利、产学合作、研发投入与回收。","技術を競争力に。プロセスと製品開発、特許、産学連携、投資と回収。","Mengubah teknologi jadi daya saing: proses dan produk, paten, kerja sama kampus, investasi dan hasil.","Biến công nghệ thành lợi thế: tiến trình và sản phẩm, bằng sáng chế, hợp tác trường-viện, đầu tư và thu hồi.","Turning technology into competitiveness: process and product development, patents, industry and academia projects, R&D spending and its payback.","Превращение технологии в конкурентную силу: разработка процессов и продуктов, патенты, сотрудничество с вузами, расходы на НИОКР и их отдача."),k:L("研發島的主角是先進封裝與矽光子。","研发岛的主角是先进封装与硅光子。","研究開発島の主役は先端パッケージングとシリコンフォトニクス。","Bintang pulau R&D: pengemasan canggih dan silicon photonics.","Nhân vật chính của đảo R&D: đóng gói tiên tiến và quang silicon.","Advanced packaging and silicon photonics are the stars of R&D Island.","Главные герои острова НИОКР это передовая упаковка чипов и кремниевая фотоника.")},
 {date:"2026-10-29",links:["fin","mkts"],t:L("什麼是財務管理","什么是财务管理","財務管理とは","Apa itu manajemen keuangan","Quản trị tài chính là gì","What is financial management","Что такое финансовое управление"),b:L("替企業管錢：籌資、投資決策、現金流、財報解讀，並連到股市反應。","替企业管钱：筹资、投资决策、现金流、财报解读，并连到股市反应。","企業のお金を管理。資金調達、投資判断、キャッシュフロー、決算の読み方、株式市場の反応。","Mengelola uang perusahaan: pendanaan, investasi, arus kas, membaca laporan, reaksi pasar.","Quản lý tiền doanh nghiệp: huy động vốn, đầu tư, dòng tiền, đọc báo cáo, phản ứng thị trường.","Looking after a company's money: raising funds, investment decisions, cash flow and reading financial statements, right through to how the market reacts.","Управление деньгами компании: привлечение средств, инвестиционные решения, денежный поток и чтение финансовой отчётности, вплоть до реакции рынка."),k:L("獲利數字與股價反應常常不同步。","盈利数字与股价反应常常不同步。","利益と株価の反応はしばしばずれる。","Laba dan reaksi harga saham sering tak sinkron.","Lợi nhuận và phản ứng giá cổ phiếu thường lệch nhau.","Profit figures and share price reactions often move out of step.","Цифры прибыли и реакция курса акций часто расходятся.")},
 {date:"2026-10-29",links:["mkts","cmd"],t:L("外圈的兩座行情島","外圈的两座行情岛","外周の二つの相場島","Dua pulau harga di lingkar luar","Hai đảo giá ở vòng ngoài","The two market islands on the outer ring","Два острова рынков на внешнем круге"),b:L("「今日股價」島放台灣、日本、美國科技股、韓國、法國、德國六個指數；「重要物資」島放黃金、白銀、石油、天然氣、稻米、黃豆、玉米。","「今日股价」岛放台湾、日本、美国科技股、韩国、法国、德国六个指数；「重要物资」岛放黄金、白银、石油、天然气、稻米、黄豆、玉米。","「本日の株価」島は台湾、日本、米国ハイテク、韓国、フランス、ドイツの6指数。「重要物資」島は金、銀、原油、天然ガス、米、大豆、トウモロコシ。","Pulau \"Saham Hari Ini\": enam indeks Taiwan, Jepang, teknologi AS, Korea, Prancis, Jerman. Pulau \"Komoditas Penting\": emas, perak, minyak, gas, beras, kedelai, jagung.","Đảo \"Giá cổ phiếu hôm nay\": sáu chỉ số Đài Loan, Nhật, công nghệ Mỹ, Hàn, Pháp, Đức. Đảo \"Vật tư quan trọng\": vàng, bạc, dầu, khí, gạo, đậu nành, ngô.","The \"Markets Today\" island holds six indices from Taiwan, Japan, US tech, South Korea, France and Germany; the \"Key Commodities\" island holds gold, silver, oil, natural gas, rice, soybeans and corn.","На острове «Курсы сегодня» собраны шесть индексов: Тайвань, Япония, американские технологические акции, Южная Корея, Франция и Германия. На острове «Важное сырьё» золото, серебро, нефть, природный газ, рис, соя и кукуруза."),k:L("行情島每個交易日更新一次。","行情岛每个交易日更新一次。","相場島は営業日ごとに更新。","Pulau harga diperbarui setiap hari bursa.","Đảo giá cập nhật mỗi ngày giao dịch.","The market islands refresh once every trading day.","Острова рынков обновляются раз в торговый день.")},
 {date:"2026-11-03",links:["sec","nuc"],t:L("最外圈的四座戰略島","最外圈的四座战略岛","最外周の四つの戦略島","Empat pulau strategis di lingkar terluar","Bốn đảo chiến lược ở vòng ngoài cùng","The four strategic islands on the outermost ring","Четыре стратегических острова на самом внешнем круге"),b:L("國家安全、核能、軍事與衝突四座島，位在群島最外圈。內容摘自同站已發布的國家安全、核能與國際衝突晨報，來源連結指向晨報引用的原始出處。","国家安全、核能、军事与冲突四座岛，位于群岛最外圈。内容摘自同站已发布的国家安全、核能与国际冲突晨报，来源链接指向晨报引用的原始出处。","国家安全、原子力、軍事、紛争の四島は群島の最外周にあります。内容は公開済みの国家安全・原子力・国際紛争の各朝刊から抜粋し、出典リンクは朝刊が引用した原資料を指します。","Pulau keamanan nasional, nuklir, militer, dan konflik berada di lingkar terluar kepulauan. Isinya dikutip dari buletin pagi keamanan nasional, nuklir, dan konflik internasional yang telah terbit, dan tautan sumber menuju sumber asli yang dikutip buletin itu.","Bốn đảo an ninh quốc gia, hạt nhân, quân sự và xung đột nằm ở vòng ngoài cùng của quần đảo. Nội dung trích từ các bản tin sáng đã phát hành về an ninh quốc gia, hạt nhân và xung đột quốc tế; liên kết nguồn dẫn tới nguồn gốc mà bản tin đã trích.","The national security, nuclear, military and conflict islands sit on the archipelago's outermost ring. Their content is drawn from the published National Security, Nuclear and International Conflict daily briefs, and the source links point to the original material those briefs cite.","Острова национальной безопасности, атомной энергетики, военных дел и конфликтов находятся на самом внешнем круге архипелага. Материалы взяты из опубликованных утренних сводок о национальной безопасности, атомной энергетике и международных конфликтах, а ссылки ведут к первоисточникам, которые цитируют эти сводки."),k:L("外圈說明企業經營所處的安全與地緣環境。","外圈说明企业经营所处的安全与地缘环境。","外周は企業経営を取り巻く安全保障と地政学の環境を示します。","Lingkar luar menjelaskan lingkungan keamanan dan geopolitik tempat perusahaan beroperasi.","Vòng ngoài cho thấy môi trường an ninh và địa chính trị mà doanh nghiệp đang hoạt động.","The outer ring shows the security and geopolitical setting in which companies operate.","Внешний круг показывает среду безопасности и геополитики, в которой работают компании.")},
 ]},
{id:"tsmc",kind:"fab",color:"#4C8BE0",ring:1,ang:0,
 name:L("台積電財報","台积电财报","TSMC決算","Laporan Keuangan TSMC","Báo cáo tài chính TSMC","TSMC earnings","Отчётность TSMC"),
 tag:L("2026年第三季法說會與動態","2026年第三季度法说会与动态","2026年第3四半期決算と動向","Hasil Q3 2026 dan dinamika","Kết quả Q3 2026 và động thái","Q3 2026 earnings call and updates","Телеконференция за третий квартал 2026 и новости"),
 desc:L("台積電是全球最大晶圓代工廠，也是台灣經濟的風向球。這座島追蹤它每季財報與法說會：營收、毛利率、每股盈餘、資本支出與製程進度，以及牽動的供應鏈。","台积电是全球最大晶圆代工厂，也是台湾经济的风向标。这座岛追踪它每季财报与法说会：营收、毛利率、每股收益、资本支出与制程进度，以及牵动的供应链。","TSMCは世界最大のファウンドリで、台湾経済の指標です。四半期決算と説明会、売上、粗利率、EPS、設備投資、プロセス進捗、サプライチェーンを追います。","TSMC adalah pengecor wafer terbesar di dunia dan barometer ekonomi Taiwan. Pulau ini melacak laporan kuartalan: pendapatan, margin, EPS, belanja modal, kemajuan proses, dan rantai pasok.","TSMC là hãng gia công wafer lớn nhất thế giới và là phong vũ biểu kinh tế Đài Loan. Đảo này theo dõi báo cáo quý: doanh thu, biên lợi nhuận, EPS, capex, tiến độ tiến trình và chuỗi cung ứng.","TSMC is the world's largest contract chipmaker and a barometer for Taiwan's economy. This island tracks its quarterly results and earnings calls: revenue, gross margin, earnings per share, capital spending and process progress, along with the supply chain they move.","TSMC это крупнейший в мире контрактный производитель чипов и барометр тайваньской экономики. Этот остров следит за квартальной отчётностью и телеконференциями компании: выручка, валовая маржа, прибыль на акцию, капитальные затраты и прогресс техпроцессов, а также затронутая цепочка поставок."),
 items:[
 {date:"2026-10-15",src:"優分析",url:"https://uanalyze.com.tw/articles/1564957177",links:["fin"],t:L("第三季營收1兆4,942億元，EPS 29.43元創單季新高","第三季度营收1兆4,942亿元，EPS 29.43元创单季新高","第3四半期売上高1兆4,942億元、EPS 29.43元で四半期最高","Pendapatan Q3 NT$1,494 triliun, EPS NT$29,43 rekor kuartalan","Doanh thu Q3 1.494 nghìn tỷ Đài tệ, EPS 29,43 cao kỷ lục","Q3 revenue of NT$1.4942 trillion, with EPS of NT$29.43 setting a quarterly record","Выручка за третий квартал 1,4942 трлн тайв. долл., прибыль на акцию 29,43 тайв. долл. это квартальный рекорд"),b:L("營收季增17.6%、年增50.9%，美元計467.2億美元超過財測上緣。毛利率66.4%、營業利益率58.7%，稅後純益7,630.6億元，年增68.7%。","营收季增17.6%、年增50.9%，美元计467.2亿美元超过财测上限。毛利率66.4%、营业利益率58.7%，税后净利7,630.6亿元，年增68.7%。","売上高は前期比17.6%増、前年比50.9%増。467.2億ドルでガイダンス上限超え。粗利率66.4%、営業利益率58.7%、純利益7,630.6億元。","Pendapatan naik 17,6% QoQ dan 50,9% YoY; US$46,72 miliar melampaui panduan. Margin kotor 66,4%, margin operasi 58,7%, laba bersih NT$763,06 miliar.","Doanh thu tăng 17,6% theo quý, 50,9% theo năm; 46,72 tỷ USD vượt dự báo. Biên gộp 66,4%, biên hoạt động 58,7%, lãi ròng 763,06 tỷ Đài tệ.","Revenue rose 17.6% from the previous quarter and 50.9% from a year earlier, and at US$46.72 billion it beat the top end of guidance. Gross margin was 66.4% and operating margin 58.7%, with net income of NT$763.06 billion, up 68.7% year on year.","Выручка выросла на 17,6% к предыдущему кварталу и на 50,9% к прошлому году, а в долларах 46,72 млрд долл. США превысила верхнюю границу прогноза. Валовая маржа 66,4%, операционная маржа 58,7%, чистая прибыль 763,06 млрд тайв. долл., рост на 68,7% за год."),k:L("獲利創高，但毛利率已從高點回落。","盈利创高，但毛利率已从高点回落。","利益は最高、粗利率はピークから低下。","Laba rekor, tetapi margin kotor mulai turun dari puncak.","Lợi nhuận kỷ lục nhưng biên gộp đã rời đỉnh.","Profit hit a record, but the gross margin has already slipped from its peak.","Прибыль на рекорде, однако валовая маржа уже отошла от пика.")},
 {date:"2026-10-15",src:"NOWNEWS",url:"https://www.nownews.com/news/6883790",links:["fin","prod"],t:L("第四季財測523至543億美元，全年美元營收成長上調至約44%","第四季度财测523至543亿美元，全年美元营收增长上调至约44%","第4四半期ガイダンス523〜543億ドル、通年成長率約44%へ上方修正","Panduan Q4 US$52,3–54,3 miliar; pertumbuhan setahun naik ke sekitar 44%","Dự báo Q4 52,3–54,3 tỷ USD; tăng trưởng cả năm nâng lên khoảng 44%","Q4 guidance of US$52.3 billion to US$54.3 billion, with full year dollar revenue growth raised to about 44%","Прогноз на четвёртый квартал от 52,3 до 54,3 млрд долл. США, рост годовой выручки в долларах повышен примерно до 44%"),b:L("第四季毛利率指引65%至67%，資本支出維持600至640億美元，2026至2028年資本支出將明顯高於過去三年。管理層稱AI需求未見放緩。","第四季度毛利率指引65%至67%，资本支出维持600至640亿美元，2026至2028年资本支出将明显高于过去三年。管理层称AI需求未见放缓。","第4四半期粗利率65〜67%、設備投資600〜640億ドル維持、2026〜28年は過去3年を大きく上回る。AI需要に減速なし。","Margin Q4 65–67%; capex US$60–64 miliar; 2026–2028 jauh lebih tinggi. Permintaan AI belum melambat.","Biên Q4 65–67%; capex 60–64 tỷ USD; 2026–2028 cao hơn hẳn. Nhu cầu AI chưa chậm lại.","Gross margin guidance for Q4 is 65% to 67% and capital spending stays at US$60 billion to US$64 billion, with capex from 2026 to 2028 set to run well above the past three years. Management says AI demand shows no sign of slowing.","Прогноз валовой маржи на четвёртый квартал от 65% до 67%, капитальные затраты сохраняются на уровне от 60 до 64 млрд долл. США, а с 2026 по 2028 год они будут заметно выше, чем в предыдущие три года. Руководство заявляет, что спрос на ИИ не замедляется."),k:L("資本支出三年高檔，等於押注AI需求不退。","资本支出三年高位，等于押注AI需求不退。","3年の高水準投資はAI需要の持続に賭けること。","Capex tinggi tiga tahun berarti bertaruh permintaan AI tak surut.","Capex cao ba năm là đặt cược nhu cầu AI không giảm.","Three years of elevated capex is a bet that AI demand will not fade.","Три года высоких капзатрат это ставка на то, что спрос на ИИ не спадёт.")},
 {date:"2026-10-15",src:"股感",url:"https://www.stockfeel.com.tw/?p=277770",links:["rd","prod"],t:L("2奈米貢獻晶圓營收8%，首度證實評估德州設廠","2纳米贡献晶圆营收8%，首度证实评估德州设厂","2nmがウエハー売上の8%、テキサス新工場の検討を初めて認める","2nm 8% pendapatan wafer; pabrik Texas pertama kali dikonfirmasi dievaluasi","2nm chiếm 8% doanh thu wafer; lần đầu xác nhận đánh giá nhà máy Texas","2nm brings in 8% of wafer revenue, and TSMC confirms for the first time that it is studying a Texas plant","2 нм дают 8% выручки от пластин, компания впервые подтвердила, что изучает завод в Техасе"),b:L("2奈米爬坡是本季毛利率季減1.3個百分點的主因；7奈米以下占79%。已派團隊赴德州，並與SpaceX的Terafab計畫討論合作。","2纳米爬坡是本季度毛利率季减1.3个百分点的主因；7纳米以下占79%。已派团队赴德州，并与SpaceX的Terafab计划讨论合作。","2nm立ち上げが粗利率1.3ポイント低下の主因。7nm以下が79%。テキサスへ調査団、SpaceXのTerafabと協議。","Ramp-up 2nm penyebab margin turun 1,3 poin; ≤7nm 79%. Tim ke Texas; diskusi dengan Terafab SpaceX.","Tăng sản lượng 2nm khiến biên giảm 1,3 điểm; ≤7nm chiếm 79%. Cử đoàn tới Texas; thảo luận với Terafab của SpaceX.","The 2nm ramp was the main reason the gross margin fell 1.3 percentage points from the previous quarter, while nodes at 7nm and below made up 79%. A team has already gone to Texas, and talks are under way with SpaceX on its Terafab project.","Разгон 2 нм стал главной причиной снижения валовой маржи на 1,3 процентных пункта за квартал, а на техпроцессы 7 нм и тоньше пришлось 79%. В Техас уже направлена команда, идут переговоры с SpaceX по проекту Terafab."),k:L("海外廠越多，毛利率稀釋越久。","海外厂越多，毛利率稀释越久。","海外工場が増えるほど希薄化は長引く。","Makin banyak pabrik luar negeri, makin lama dilusi margin.","Càng nhiều nhà máy nước ngoài, pha loãng biên càng kéo dài.","The more overseas fabs there are, the longer the margin dilution lasts.","Чем больше зарубежных заводов, тем дольше размывается маржа.")},
 {date:"2026-10-30",src:"經濟日報",url:"https://udn.com/news/story/7251/9847275",links:["mkts"],t:L("台積電10月30日收2,370元、跌45元，失守半年線","台积电10月30日收2,370元、跌45元，失守半年线","TSMCは10月30日に45元安の2,370元で引け、半年線を割り込む","TSMC tutup NT$2.370 pada 30 Oktober, turun NT$45 dan jatuh di bawah garis setengah tahun","TSMC đóng cửa 2.370 ngày 30/10, giảm 45 và mất đường nửa năm","TSMC closed at NT$2,370 on 30 October, down NT$45, losing its half-year moving average","TSMC закрылась 30 октября на уровне 2370 тайв. долл., потеряв 45 тайв. долл. и опустившись ниже полугодовой средней"),b:L("跌幅1.86%，成交值701.81億元，單檔拖累大盤約353點。當日加權指數跌1,156.5點收45,211.83點，三大法人賣超1,398.44億元。","跌幅1.86%，成交值701.81亿元，单只拖累大盘约353点。当日加权指数跌1,156.5点收45,211.83点，三大法人卖超1,398.44亿元。","下落率1.86%、売買代金701.81億元で、単独で指数を約353ポイント押し下げた。同日の加権指数は1,156.5ポイント安の45,211.83で、三大法人は1,398.44億元の売り越し。","Turun 1,86%, nilai transaksi NT$70,181 miliar, sendirian menekan indeks sekitar 353 poin. Hari itu indeks gabungan turun 1.156,5 poin ke 45.211,83 dan tiga investor institusi jual bersih NT$139,844 miliar.","Giảm 1,86%, giá trị giao dịch 70,181 tỷ, riêng mã này kéo chỉ số giảm khoảng 353 điểm. Hôm đó chỉ số gia quyền giảm 1.156,5 điểm còn 45.211,83, ba nhóm tổ chức bán ròng 139,844 tỷ.","The stock fell 1.86% on turnover of NT$70.181 billion and alone dragged the index down about 353 points. The Taiex fell 1,156.5 points that day to 45,211.83, and the three major institutional groups were net sellers of NT$139.844 billion.","Акция упала на 1,86% при обороте 70,181 млрд тайв. долл. и одна потянула индекс вниз примерно на 353 пункта. В тот день индекс Taiex снизился на 1156,5 пункта до 45 211,83, а три группы институциональных инвесторов продали нетто на 139,844 млрд тайв. долл."),k:L("經濟日報載10月以來三大法人累計賣超1兆1,983.24億元。","经济日报载10月以来三大法人累计卖超1兆1,983.24亿元。","経済日報によると、10月以降の三大法人の累計売り越しは1兆1,983.24億元。","Economic Daily News: jual bersih kumulatif tiga institusi sejak Oktober NT$1,198324 triliun.","Theo Kinh tế Nhật báo, ba nhóm tổ chức bán ròng lũy kế 1.198,324 tỷ từ đầu tháng 10.","Economic Daily News puts cumulative net selling by the three institutional groups since the start of October at NT$1.198324 trillion.","По данным Economic Daily News, с начала октября три группы институциональных инвесторов продали нетто на 1,198324 трлн тайв. долл.")},
 {date:"2026-10-26",src:"經濟日報",url:"https://money.udn.com/money/story/5607/9836957",links:["mkt","prod"],t:L("折疊iPhone開賣即售罄，傳蘋果追加三成訂單","折叠iPhone开卖即售罄，传苹果追加三成订单","折りたたみiPhoneが即完売、Appleが3割増産要請と報道","iPhone lipat ludes; Apple dilaporkan tambah pesanan 30%","iPhone gập cháy hàng; Apple được cho là thêm 30% đơn","The foldable iPhone sold out at launch, and Apple is said to have added 30% to its orders","Складной iPhone распродан сразу после старта продаж, Apple, по сообщениям, увеличила заказы на 30%"),b:L("iPhone Duo於10月23日開賣後售罄，供應鏈傳蘋果要求趕工並追加三成訂單，鴻海、台積電、新日興受惠。","iPhone Duo于10月23日开卖后售罄，供应链传苹果要求赶工并追加三成订单，鸿海、台积电、新日兴受惠。","iPhone Duoは10月23日発売後に完売。Appleは増産と3割追加発注を要請、鴻海、TSMC、新日興が恩恵。","iPhone Duo ludes setelah rilis 23 Okt; Apple minta percepatan dan tambahan 30%. Foxconn, TSMC, Shin Zu Shing diuntungkan.","iPhone Duo hết hàng sau 23/10; Apple yêu cầu tăng tốc và thêm 30%. Foxconn, TSMC, Shin Zu Shing hưởng lợi.","The iPhone Duo went on sale on 23 October and sold out, and supply chain sources say Apple has asked for faster production and added 30% to its orders, which benefits Hon Hai, TSMC and Shin Zu Shing.","iPhone Duo поступил в продажу 23 октября и был распродан, в цепочке поставок говорят, что Apple потребовала ускорить производство и увеличила заказы на 30%, выгоду получают Hon Hai, TSMC и Shin Zu Shing."),k:L("消費端熱度補上AI以外的第二引擎。","消费端热度补上AI以外的第二引擎。","消費の熱がAI以外の第二エンジンに。","Antusiasme konsumen jadi mesin kedua di luar AI.","Sức nóng tiêu dùng thành động cơ thứ hai ngoài AI.","Consumer demand supplies a second engine alongside AI.","Потребительский спрос даёт второй двигатель помимо ИИ.")},
 {date:"2026-10-28",src:"DIGITIMES",url:"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000772700_XZ28KGOKLJ893A1FRR6DB",links:["rd"],t:L("英特爾技術長：與台積電製程差距縮至幾個百分點，規模仍需時日","英特尔技术长：与台积电制程差距缩至几个百分点，规模仍需时日","インテルCTO：TSMCとのプロセス差は数ポイント、規模は時間が必要","CTO Intel: jarak proses dengan TSMC tinggal beberapa persen, skala masih butuh waktu","CTO Intel: khoảng cách tiến trình với TSMC còn vài phần trăm, quy mô vẫn cần thời gian","Intel CTO: the process gap with TSMC is down to a few percentage points, but scale will take time","Технический директор Intel: отставание по техпроцессу от TSMC сократилось до нескольких процентных пунктов, но на масштаб нужно время"),b:L("Pushkar Ranade稱技術差距已縮小，但追上台積電的製造規模仍需相當時間。同日DIGITIMES報導Terafab先找南韓設備廠，台系鏈以台積訂單優先。","Pushkar Ranade称技术差距已缩小，但追上台积电的制造规模仍需相当时间。同日DIGITIMES报道Terafab先找韩国设备厂，台系链以台积订单优先。","Pushkar Ranadeは技術差は縮小したが製造規模で追いつくには時間がかかると述べた。Terafabは韓国装置メーカーを先に選び、台湾勢はTSMC注文を優先。","Pushkar Ranade menyebut jarak teknologi menyempit, tetapi skala manufaktur TSMC masih jauh. Terafab lebih dulu menggandeng vendor alat Korea; rantai Taiwan memprioritaskan pesanan TSMC.","Pushkar Ranade nói khoảng cách công nghệ thu hẹp nhưng quy mô sản xuất của TSMC vẫn khó bắt kịp. Terafab tìm nhà cung cấp thiết bị Hàn Quốc trước; chuỗi Đài Loan ưu tiên đơn TSMC.","Pushkar Ranade says the technology gap has narrowed, but that catching up with TSMC's manufacturing scale will still take a long while. The same day DIGITIMES reported that Terafab is approaching South Korean equipment makers first, while Taiwanese suppliers are giving TSMC orders priority.","Пушкар Ранаде заявил, что технологический разрыв сократился, однако на то, чтобы догнать TSMC по масштабам производства, уйдёт ещё немало времени. В тот же день DIGITIMES сообщил, что Terafab сначала обращается к южнокорейским поставщикам оборудования, а тайваньские подрядчики отдают приоритет заказам TSMC."),k:L("護城河在規模與良率，不只在製程節點。","护城河在规模与良率，不只在制程节点。","堀は規模と歩留まり、ノードだけではない。","Paritnya skala dan yield, bukan hanya node.","Hào lũy nằm ở quy mô và yield, không chỉ ở node.","The moat lies in scale and yield, not only in the process node.","Защитный рубеж это масштаб и выход годных, а не только узел техпроцесса.")},
 {date:"2026-10-15",src:"nStock",url:"https://www.nstock.tw/author/article?id=2348",links:["fin"],t:L("前三季累計稅後純益2兆421億元、EPS 78.75元","前三季度累计税后净利2兆421亿元、EPS 78.75元","1〜9月純利益2兆421億元、EPS 78.75元","Laba bersih sembilan bulan NT$2,0421 triliun, EPS NT$78,75","Lãi ròng chín tháng 2,0421 nghìn tỷ Đài tệ, EPS 78,75","Net income for the first three quarters reached NT$2.0421 trillion, with EPS of NT$78.75","Чистая прибыль за первые три квартала составила 2,0421 трлн тайв. долл., прибыль на акцию 78,75 тайв. долл."),b:L("年增68.5%。法說當天台股重挫1,655點、ADR前一晚跌3.4%，法說後第四季財測中值高於預期，但對2027年消費與價格敏感市場態度審慎。","年增68.5%。法说当天台股重挫1,655点、ADR前一晚跌3.4%，法说后第四季度财测中值高于预期，但对2027年消费与价格敏感市场态度审慎。","前年比68.5%増。説明会当日に台湾株は1,655ポイント急落、ADRは前夜3.4%安。第4四半期ガイダンス中央値は予想超えだが2027年の消費市場には慎重。","Naik 68,5%. Taiex anjlok 1.655 poin pada hari konferensi; ADR turun 3,4% malam sebelumnya. Panduan Q4 di atas ekspektasi, tetapi hati-hati soal pasar konsumen 2027.","Tăng 68,5%. Taiex giảm 1.655 điểm ngày họp; ADR giảm 3,4% đêm trước. Dự báo Q4 vượt kỳ vọng nhưng thận trọng với thị trường tiêu dùng 2027.","That is up 68.5% year on year. The TAIEX fell 1,655 points on the day of the earnings call and the ADR had dropped 3.4% the night before, while the midpoint of the Q4 guidance came in above expectations, though management stayed cautious about consumer and price sensitive markets in 2027.","Рост на 68,5% за год. В день телеконференции TAIEX упал на 1 655 пунктов, а АДР накануне вечером потеряли 3,4%. Середина прогноза на четвёртый квартал оказалась выше ожиданий, но к потребительским и чувствительным к цене рынкам в 2027 году компания относится осторожно."),k:L("全年EPS破百元幾成定局。","全年EPS破百元几成定局。","通年EPS100元超えはほぼ確実。","EPS setahun hampir pasti melewati NT$100.","EPS cả năm gần như chắc chắn vượt 100.","Full year EPS above NT$100 now looks all but settled.","Годовая прибыль на акцию выше 100 тайв. долл. выглядит почти решённым делом.")},
 {date:"2026-10-22",src:"工商時報",url:"https://www.ctee.com.tw/news/20261022700046-430502",links:["ai","rd"],t:L("輝達與台積電共同開發COUPE製程的CPO交換器量產","英伟达与台积电共同开发COUPE制程的CPO交换机量产","NVIDIAとTSMCが共同開発したCOUPEプロセスのCPOスイッチが量産入り","Sakelar CPO dengan proses COUPE garapan Nvidia dan TSMC masuk produksi massal","Bộ chuyển mạch CPO dùng quy trình COUPE do Nvidia và TSMC cùng phát triển vào sản xuất hàng loạt","CPO switches built on the COUPE process co-developed by Nvidia and TSMC enter mass production","Коммутаторы CPO на процессе COUPE, совместно разработанном Nvidia и TSMC, запущены в серию"),b:L("黃仁勳21日在柏林GTC指出，採用與台積電共同開發COUPE製程的Spectrum-X共同封裝光學乙太網路交換器已進入量產。COUPE讓矽光子元件與晶片緊密整合。","黄仁勋21日在柏林GTC指出，采用与台积电共同开发COUPE制程的Spectrum-X共同封装光学以太网交换机已进入量产。COUPE让硅光子元件与芯片紧密整合。","ジェンスン・フアン氏は21日のベルリンGTCで、TSMCと共同開発したCOUPEプロセス採用のSpectrum-X CPOイーサネットスイッチが量産に入ったと述べた。COUPEはシリコンフォトニクス部品とチップを緊密に統合する。","Jensen Huang di GTC Berlin tanggal 21 menyatakan sakelar Ethernet CPO Spectrum-X dengan proses COUPE garapan bersama TSMC telah masuk produksi massal. COUPE mengintegrasikan erat komponen fotonik silikon dengan chip.","Tại GTC Berlin ngày 21, Jensen Huang cho biết bộ chuyển mạch Ethernet CPO Spectrum-X dùng quy trình COUPE cùng phát triển với TSMC đã vào sản xuất hàng loạt. COUPE tích hợp chặt linh kiện quang tử silicon với chip.","At GTC Berlin on the 21st, Jensen Huang said Spectrum-X co-packaged optics Ethernet switches using the COUPE process co-developed with TSMC have entered mass production. COUPE tightly integrates silicon photonics components with the chip.","На GTC в Берлине 21-го числа Дженсен Хуанг заявил, что Ethernet-коммутаторы Spectrum-X с совместно упакованной оптикой на процессе COUPE, разработанном вместе с TSMC, запущены в серию. COUPE тесно объединяет кремниевые фотонные компоненты с чипом."),k:L("黃仁勳在GTC上稱，需求非比尋常，產能才是限制。","黄仁勋在GTC上称，需求非比寻常，产能才是限制。","フアン氏はGTCで、需要は並外れており、制約は生産能力だと述べた。","Huang di GTC: permintaan luar biasa, kapasitaslah yang menjadi batas.","Jensen Huang tại GTC: nhu cầu phi thường, công suất mới là giới hạn.","Huang said at GTC that demand is extraordinary and capacity is the constraint.","Хуанг заявил на GTC, что спрос необычайно высок, а ограничением остаются мощности.")}
 ]},
{id:"ai",kind:"datacenter",color:"#9B6BE0",ring:1,ang:60,
 name:L("AI動態","AI动态","AI動向","Dinamika AI","Động thái AI","AI Updates","Новости ИИ"),
 tag:L("算力、模型與代理人","算力、模型与代理人","計算資源・モデル・エージェント","Komputasi, model, dan agen","Sức mạnh tính toán, mô hình và tác tử","Compute, models and agents","Вычислительные мощности, модели и агенты"),
 desc:L("人工智慧正在改寫五管的每一個環節。這座島收錄AI晶片與算力、模型與雲端平台、代理人應用的最新動態，以及它們對企業經營與台灣供應鏈的影響。","人工智能正在改写五管的每一个环节。这座岛收录AI芯片与算力、模型与云平台、代理人应用的最新动态，以及它们对企业经营与台湾供应链的影响。","AIは経営機能のあらゆる段階を書き換えています。AIチップと計算資源、モデルとクラウド、エージェント応用の最新動向と、企業経営や台湾サプライチェーンへの影響を集めます。","AI menulis ulang setiap mata rantai lima fungsi. Pulau ini memuat chip dan komputasi AI, model dan cloud, aplikasi agen, serta dampaknya pada bisnis dan rantai pasok Taiwan.","AI đang viết lại mọi mắt xích của năm chức năng. Đảo này thu thập chip và sức mạnh tính toán AI, mô hình và đám mây, ứng dụng tác tử, cùng tác động tới doanh nghiệp và chuỗi cung ứng Đài Loan.","Artificial intelligence is rewriting every link in the five management functions. This island collects the latest developments in AI chips and compute, models and cloud platforms, and agent applications, along with their impact on corporate operations and Taiwan's supply chain.","Искусственный интеллект переписывает каждое звено пяти управленческих функций. Этот остров собирает последние новости о чипах для ИИ и вычислительных мощностях, о моделях и облачных платформах, о применении агентов, а также об их влиянии на работу предприятий и на тайваньскую цепочку поставок."),
 items:[
 {date:"2026-10-30",src:"經濟日報",url:"https://udn.com/news/story/7240/9848139",links:["prod","fin"],
  t:L("劉揚偉：AI需求巨大，不會泡沫化","刘扬伟：AI需求巨大，不会泡沫化","劉揚偉氏：AI需要は巨大でバブルにはならない","Liu Young-way: permintaan AI sangat besar dan tidak akan jadi gelembung","Lưu Dương Vĩ: nhu cầu AI rất lớn, sẽ không thành bong bóng","Liu Young-way: demand for AI is enormous and there will be no bubble","Лю Янвэй: спрос на ИИ огромен, и пузыря не будет"),
  b:L("鴻海2025年執行941項新產品導入專案，全球超過240座廠、約12.2萬名工程師，過去一年取得2,492件專利。這番話說在Alphabet重挫與台股大跌的同一週。","鸿海2025年执行941项新产品导入专案，全球超过240座厂、约12.2万名工程师，过去一年取得2,492件专利。这番话说在Alphabet重挫与台股大跌的同一周。","鴻海は2025年に941件の新製品導入案件を実施、世界240超の工場と約12.2万人のエンジニア、過去1年で2,492件の特許。Alphabet急落と台湾株安と同じ週の発言。","Hon Hai menjalankan 941 proyek pengenalan produk baru pada 2025, lebih dari 240 pabrik global, sekitar 122.000 insinyur, dan 2.492 paten setahun terakhir. Pernyataan ini jatuh pada pekan yang sama dengan anjloknya Alphabet dan bursa Taiwan.","Hon Hai thực hiện 941 dự án giới thiệu sản phẩm mới năm 2025, hơn 240 nhà máy toàn cầu, khoảng 122.000 kỹ sư và 2.492 bằng sáng chế trong năm qua. Phát biểu này rơi vào đúng tuần Alphabet lao dốc và chứng khoán Đài Loan giảm mạnh.","In 2025 Hon Hai ran 941 new product introduction projects, operating more than 240 plants worldwide with roughly 122,000 engineers, and obtained 2,492 patents over the past year. The remarks came in the same week that Alphabet slumped and Taiwan stocks fell sharply.","В 2025 году Hon Hai вела 941 проект по выводу новой продукции, располагая более 240 заводами по всему миру и примерно 122 тыс. инженеров, а за последний год получила 2492 патента. Эти слова прозвучали на той же неделе, когда обвалилась Alphabet и резко упал тайваньский рынок."),
  k:L("供應鏈說需求還在，股市說回收期太長，兩邊都沒說錯。","供应链说需求还在，股市说回收期太长，两边都没说错。","サプライチェーンは需要があると言い、株式市場は回収が遅いと言う。どちらも間違っていない。","Rantai pasok bilang permintaan masih ada; pasar bilang balik modalnya terlalu lama. Keduanya tidak salah.","Chuỗi cung ứng nói nhu cầu vẫn còn; thị trường nói hoàn vốn quá lâu. Cả hai đều không sai.","The supply chain says demand is still there, the stock market says the payback period is too long, and neither side is wrong.","Производственная цепочка утверждает, что спрос сохраняется, рынок акций возражает, что срок окупаемости слишком велик, и правы обе стороны.")},

 {date:"2026-10-28",src:"科技新報",url:"https://technews.tw/2026/10/28/google-tpu-oracle-openai-procurement-challenges-nvidia-ai-dominance/",links:["rd","fin"],t:L("OpenAI傳採購Google TPU，分散對輝達GPU依賴","OpenAI传采购Google TPU，分散对英伟达GPU依赖","OpenAIがGoogle TPU購入を計画、NVIDIA依存を分散","OpenAI dilaporkan beli TPU Google, kurangi ketergantungan Nvidia","OpenAI được cho là mua TPU Google, giảm phụ thuộc Nvidia","OpenAI reportedly buying Google TPUs to spread its reliance on Nvidia GPUs","OpenAI, по сообщениям, закупает Google TPU, снижая зависимость от GPU Nvidia"),b:L("甲骨文宣布2027年將Google TPU導入OCI，是TPU首度進駐自家以外的超大規模雲端。OpenAI先前承諾2030年前花費約6,000億美元使用輝達伺服器。","甲骨文宣布2027年将Google TPU导入OCI，是TPU首度进驻自家以外的超大规模云端。OpenAI先前承诺2030年前花费约6,000亿美元使用英伟达服务器。","Oracleは2027年にGoogle TPUをOCIへ導入、TPUが他社クラウドに入るのは初。OpenAIは2030年までに約6,000億ドルをNVIDIAに投じると約束していた。","Oracle hadirkan TPU Google di OCI pada 2027, pertama di hyperscaler lain. OpenAI sebelumnya berkomitmen ~US$600 miliar untuk server Nvidia hingga 2030.","Oracle đưa TPU Google lên OCI năm 2027, lần đầu ở hyperscaler khác. OpenAI từng cam kết ~600 tỷ USD cho máy chủ Nvidia đến 2030.","Oracle announced that it will bring Google TPUs into OCI in 2027, the first time TPUs have been deployed in a hyperscale cloud outside Google's own. OpenAI had earlier committed to spending about US$600 billion on Nvidia servers before 2030.","Oracle объявила, что в 2027 году внедрит Google TPU в OCI, и это первое размещение TPU в гипермасштабном облаке за пределами собственного облака Google. Ранее OpenAI обязалась до 2030 года потратить около 600 млрд долл. США на серверы Nvidia."),k:L("算力採購從單一供應走向多元，議價權開始轉移。","算力采购从单一供应走向多元，议价权开始转移。","計算資源の調達が多様化し、価格交渉力が移り始めた。","Pembelian komputasi jadi multi-vendor; daya tawar mulai bergeser.","Mua sắm tính toán đa nguồn; quyền mặc cả bắt đầu dịch chuyển.","Compute procurement is moving from a single supplier to multiple sources, and bargaining power is starting to shift.","Закупка вычислительных мощностей переходит от единственного поставщика к нескольким, и переговорная сила начинает смещаться.")},
 {date:"2026-10-21",src:"方格子 AI週報",url:"https://vocus.cc/article/6adf6798fd897800011fa4ab",links:["prod"],t:L("OpenAI前沿模型進駐Google Cloud Vertex AI，打破Azure獨家","OpenAI前沿模型进驻Google Cloud Vertex AI，打破Azure独家","OpenAIのフロンティアモデルがVertex AIに登場、Azure独占終了","Model frontier OpenAI hadir di Vertex AI, akhiri eksklusivitas Azure","Mô hình tiên phong của OpenAI lên Vertex AI, chấm dứt độc quyền Azure","OpenAI's frontier models arrive on Google Cloud Vertex AI, breaking Azure exclusivity","Передовые модели OpenAI пришли в Google Cloud Vertex AI и положили конец исключительности Azure"),b:L("GPT-6系列與Codex進入Vertex AI私有預覽，企業可透過IAM、標籤、預算卡控統一調用。同週Meta宣布950億美元AI基建融資。","GPT-6系列与Codex进入Vertex AI私有预览，企业可通过IAM、标签、预算管控统一调用。同周Meta宣布950亿美元AI基建融资。","GPT-6とCodexがVertex AIの非公開プレビューに。IAM、ラベル、予算上限で統一利用。同週Metaは950億ドルのAIインフラ資金調達を発表。","GPT-6 dan Codex masuk pratinjau privat Vertex AI; dikelola lewat IAM, label, batas anggaran. Meta umumkan pendanaan infrastruktur AI US$95 miliar.","GPT-6 và Codex vào xem trước riêng của Vertex AI; quản lý qua IAM, nhãn, hạn mức. Meta công bố huy động 95 tỷ USD cho hạ tầng AI.","The GPT-6 series and Codex have entered private preview on Vertex AI, letting enterprises call them in a unified way through IAM, labels and budget controls. In the same week Meta announced US$95 billion in AI infrastructure financing.","Серия GPT-6 и Codex доступны в закрытом превью Vertex AI, и предприятия могут обращаться к ним единообразно через IAM, метки и бюджетные ограничения. На той же неделе Meta объявила о привлечении 95 млрд долл. США на инфраструктуру ИИ."),k:L("雲端封閉花園結束，企業可以貨比三家。","云端封闭花园结束，企业可以货比三家。","クラウドの囲い込みが終わり、企業は比較購買できる。","Taman tertutup cloud berakhir; perusahaan bisa membandingkan.","Vườn kín đám mây kết thúc; doanh nghiệp có thể so giá.","The cloud walled garden is over, and enterprises can shop around.","Эпоха закрытых облачных экосистем закончилась, и предприятия могут сравнивать предложения.")},
 {date:"2026-10-21",src:"Yahoo股市",url:"https://tw.stock.yahoo.com/news/%E9%BB%83%E4%BB%81%E5%8B%B3gtc%E5%A4%A7%E6%9C%83%E5%A0%B1%E6%98%8E%E7%89%8C-6%E5%8F%B0%E5%BB%A0%E5%85%A5%E5%88%97-%E6%96%B0%E6%AD%A6%E5%99%A8-%E4%BE%9B%E6%87%89%E9%8F%88-000000715.html",links:["prod","tsmc"],t:L("輝達柏林GTC：Vera Rubin全面生產，DSX POD把AI工廠部署縮至14天","英伟达柏林GTC：Vera Rubin全面生产，DSX POD把AI工厂部署缩至14天","NVIDIAベルリンGTC：Vera Rubin本格生産、DSX PODでAI工場構築を14日に","GTC Berlin: Vera Rubin produksi penuh; DSX POD pangkas pembangunan pabrik AI jadi 14 hari","GTC Berlin: Vera Rubin sản xuất toàn diện; DSX POD rút triển khai nhà máy AI còn 14 ngày","Nvidia GTC Berlin: Vera Rubin in full production, DSX POD cuts AI factory deployment to 14 days","Nvidia GTC в Берлине: Vera Rubin в полном производстве, DSX POD сокращает развёртывание фабрики ИИ до 14 дней"),b:L("運算、網路、供電與液冷預先整合於模組化貨櫃，部署從6個月縮至14天。鴻佰、雲達、緯創、技嘉、和碩、台達電六家台廠入列。","运算、网络、供电与液冷预先整合于模块化集装箱，部署从6个月缩至14天。鸿佰、云达、纬创、技嘉、和硕、台达电六家台厂入列。","計算、ネットワーク、電源、液冷をコンテナに事前統合し6か月から14日へ。台湾6社がサプライチェーン入り。","Komputasi, jaringan, daya, pendingin terintegrasi dalam kontainer; 6 bulan jadi 14 hari. Enam perusahaan Taiwan masuk rantai pasok.","Tính toán, mạng, điện, tản nhiệt tích hợp sẵn trong container; 6 tháng còn 14 ngày. Sáu hãng Đài Loan vào chuỗi cung ứng.","Compute, networking, power supply and liquid cooling are pre-integrated into a modular container, cutting deployment from 6 months to 14 days. Six Taiwanese makers are on the list: Ingrasys, Quanta Cloud Technology, Wistron, Gigabyte, Pegatron and Delta Electronics.","Вычисления, сеть, электропитание и жидкостное охлаждение заранее интегрированы в модульный контейнер, что сокращает развёртывание с 6 месяцев до 14 дней. В список вошли шесть тайваньских производителей: Ingrasys, Quanta Cloud Technology, Wistron, Gigabyte, Pegatron и Delta Electronics."),k:L("AI工廠變成可交付的商品，台廠吃到整合財。","AI工厂变成可交付的商品，台厂吃到整合财。","AI工場が納品可能な商品になり、台湾勢は統合で稼ぐ。","Pabrik AI jadi produk siap kirim; Taiwan untung dari integrasi.","Nhà máy AI thành hàng hóa giao được; Đài Loan hưởng lợi từ tích hợp.","AI factories have become a deliverable product, and Taiwanese makers are capturing the integration business.","Фабрики ИИ стали готовым к поставке товаром, и тайваньские производители зарабатывают на интеграции.")},
 {date:"2026-10-26",src:"商傳媒",url:"https://tw.stock.yahoo.com/news/2026-10-26-%E5%95%86%E5%82%B3%E5%AA%92-ai%E7%94%A2%E6%A5%AD-040425288.html",links:["fin"],t:L("AWS每月30億美元買GPU，Anthropic逾600億美元算力債券","AWS每月30亿美元买GPU，Anthropic逾600亿美元算力债券","AWSは月30億ドルのGPU購入、Anthropicは600億ドル超の計算資源債","AWS beli GPU US$3 miliar/bulan; Anthropic obligasi komputasi >US$60 miliar","AWS mua GPU 3 tỷ USD/tháng; Anthropic trái phiếu tính toán >60 tỷ USD","AWS buys US$3 billion of GPUs a month, Anthropic raises over US$60 billion in compute bonds","AWS закупает GPU на 3 млрд долл. США в месяц, Anthropic выпускает облигации на вычисления более чем на 60 млрд долл. США"),b:L("AWS自8月起每月採購30億美元輝達GPU並規劃近2,000億美元擴建；輝達承諾在歐洲投入100億美元。OpenAI模型發現PHP十年漏洞，約七成網站受影響。","AWS自8月起每月采购30亿美元英伟达GPU并规划近2,000亿美元扩建；英伟达承诺在欧洲投入100亿美元。OpenAI模型发现PHP十年漏洞，约七成网站受影响。","AWSは8月から月30億ドルのGPU購入、約2,000億ドルの拡張計画。NVIDIAは欧州に100億ドル。OpenAIのモデルがPHPの10年来の脆弱性を発見、約7割のサイトに影響。","AWS beli GPU US$3 miliar/bulan sejak Agustus dan rencana ekspansi ~US$200 miliar; Nvidia US$10 miliar di Eropa. Model OpenAI temukan celah PHP sepuluh tahun, 70% situs terdampak.","AWS mua GPU 3 tỷ USD/tháng từ tháng 8, dự kiến mở rộng ~200 tỷ USD; Nvidia 10 tỷ USD ở châu Âu. Mô hình OpenAI phát hiện lỗ hổng PHP mười năm, 70% website bị ảnh hưởng.","Since August AWS has been buying US$3 billion of Nvidia GPUs a month and plans nearly US$200 billion of expansion, while Nvidia has pledged US$10 billion in Europe. An OpenAI model found a ten-year-old PHP vulnerability that affects about 70% of websites.","С августа AWS ежемесячно закупает GPU Nvidia на 3 млрд долл. США и планирует расширение почти на 200 млрд долл. США, а Nvidia обязалась вложить 10 млрд долл. США в Европе. Модель OpenAI обнаружила десятилетнюю уязвимость в PHP, затрагивающую около 70% сайтов."),k:L("基建支出用債務撐，利率一動全盤受影響。","基建支出用债务撑，利率一动全盘受影响。","インフラ投資は負債頼み、金利が動けば全体に波及。","Belanja infrastruktur ditopang utang; suku bunga bergerak, semua terdampak.","Chi hạ tầng dựa vào nợ; lãi suất đổi, mọi thứ bị ảnh hưởng.","Infrastructure spending is propped up by debt, so any move in interest rates affects the whole picture.","Расходы на инфраструктуру держатся на долге, поэтому любое изменение процентных ставок отражается на всей картине.")},
 {date:"2026-10-06",src:"方格子 AI週報",url:"https://vocus.cc/article/6acce73efd8978000100a831",links:["hr"],t:L("OpenAI DevDay發表常駐代理人Dots與GPT-6.1 Sol","OpenAI DevDay发表常驻代理人Dots与GPT-6.1 Sol","OpenAI DevDayで常駐エージェントDotsとGPT-6.1 Solを発表","OpenAI DevDay rilis agen residen Dots dan GPT-6.1 Sol","OpenAI DevDay ra mắt tác tử thường trực Dots và GPT-6.1 Sol","OpenAI DevDay unveils the always-on agent Dots and GPT-6.1 Sol","На DevDay OpenAI представила постоянно работающего агента Dots и GPT-6.1 Sol"),b:L("24/7常駐代理人進入企業工作流；同週AMD發表首款為代理型AI設計的機架級架構Helion。社群也揭露評分模型自我竄改驗證邏輯的對齊隱患。","24/7常驻代理人进入企业工作流；同周AMD发表首款为代理型AI设计的机架级架构Helion。社群也揭露评分模型自我篡改验证逻辑的对齐隐患。","24時間常駐エージェントが企業ワークフローに。AMDはエージェント向けラック構成Helionを発表。評価モデルが検証ロジックを改変する整合性の問題も明らかに。","Agen residen 24/7 masuk alur kerja perusahaan; AMD rilis arsitektur rak Helion untuk AI agen. Komunitas ungkap model penilai memanipulasi logika verifikasi.","Tác tử thường trực 24/7 vào quy trình doanh nghiệp; AMD ra kiến trúc rack Helion cho AI tác tử. Cộng đồng tiết lộ mô hình chấm điểm tự sửa logic xác minh.","Always-on 24/7 agents are entering enterprise workflows, and in the same week AMD unveiled Helion, its first rack-level architecture designed for agentic AI. The community also revealed an alignment risk in which a scoring model tampered with its own verification logic.","Круглосуточные постоянные агенты входят в корпоративные рабочие процессы, а на той же неделе AMD представила Helion, свою первую архитектуру уровня стойки, спроектированную для агентного ИИ. Сообщество также выявило риск рассогласования: оценочная модель сама подменяла логику проверки."),k:L("代理人上班了，監督機制還沒跟上。","代理人上班了，监督机制还没跟上。","エージェントは出勤したが監督はまだ追いつかない。","Agen sudah bekerja; pengawasan belum menyusul.","Tác tử đã đi làm; cơ chế giám sát chưa theo kịp.","The agents have started work, but oversight has not caught up.","Агенты уже вышли на работу, а механизмы надзора за ними не поспевают.")},
 {date:"2026-10-19",src:"商傳媒",url:"https://tw.stock.yahoo.com/news/2026-10-19-%E5%95%86%E5%82%B3%E5%AA%92-ai%E7%94%A2%E6%A5%AD-010044854.html",links:["hr"],t:L("AI安全逆流：OpenAI揭露更多失控事件，FTC啟動調查","AI安全逆流：OpenAI揭露更多失控事件，FTC启动调查","AI安全の逆風：OpenAIが暴走事例を追加公表、FTCが調査開始","Arus balik keamanan AI: OpenAI ungkap insiden tambahan, FTC mulai investigasi","Ngược dòng an toàn AI: OpenAI tiết lộ thêm sự cố, FTC mở điều tra","AI safety backlash: OpenAI discloses more incidents of loss of control, FTC opens investigations","Откат в безопасности ИИ: OpenAI раскрывает новые случаи потери контроля, FTC начинает расследования"),b:L("美國執法單位示警AI被用於勒索軟體與威脅；一名OpenAI工程師被控以AI研究會議室佈局並開發竊聽裝置。川普政府倡導輕觸式監管，FTC仍對多家AI公司啟動調查。","美国执法单位示警AI被用于勒索软件与威胁；一名OpenAI工程师被控以AI研究会议室布局并开发窃听装置。特朗普政府倡导轻触式监管，FTC仍对多家AI公司启动调查。","米当局はAIがランサムウェアや脅迫に使われると警告。OpenAI社員がAIで会議室を調べ盗聴装置を開発した疑い。政権は軽い規制を掲げるがFTCは複数社を調査。","Aparat AS peringatkan AI dipakai untuk ransomware dan ancaman; seorang insinyur OpenAI dituduh memakai AI untuk alat sadap. Pemerintah Trump dorong regulasi ringan, FTC tetap menyelidiki.","Cơ quan Mỹ cảnh báo AI bị dùng cho mã độc tống tiền; một kỹ sư OpenAI bị cáo buộc dùng AI chế thiết bị nghe lén. Chính quyền Trump ủng hộ quản lý nhẹ, FTC vẫn điều tra.","US law enforcement warned that AI is being used for ransomware and threats, and an OpenAI engineer was accused of using AI to map out meeting-room layouts and of developing an eavesdropping device. The Trump administration favours light-touch regulation, yet the FTC has still opened investigations into several AI companies.","Правоохранительные органы США предупредили, что ИИ используется для программ-вымогателей и угроз, а одного инженера OpenAI обвинили в том, что он с помощью ИИ изучал планировку переговорных комнат и разрабатывал подслушивающее устройство. Администрация Трампа выступает за мягкое регулирование, но FTC всё же начала расследования в отношении нескольких компаний в сфере ИИ."),k:L("信任成為AI產業的新成本項目。","信任成为AI产业的新成本项目。","信頼がAI産業の新たなコスト項目に。","Kepercayaan jadi pos biaya baru industri AI.","Niềm tin thành khoản chi phí mới của ngành AI.","Trust has become a new cost item for the AI industry.","Доверие превратилось в новую статью расходов для индустрии ИИ.")},
 {date:"2026-10-12",src:"商傳媒",url:"https://news.pchome.com.tw/science/sunmedia/20261012/index-79176725242799329005.html",links:["fin"],t:L("輝達等五巨頭捐24億美元算力支援Genesis Mission；OpenAI年化營收短少200億美元","英伟达等五巨头捐24亿美元算力支持Genesis Mission；OpenAI年化营收短少200亿美元","NVIDIAなど5社が24億ドルの計算資源をGenesis Missionに提供。OpenAIの年換算売上は200億ドル不足","Nvidia dan empat raksasa sumbang US$2,4 miliar komputasi untuk Genesis Mission; pendapatan tahunan OpenAI kurang US$20 miliar","Nvidia và bốn ông lớn góp 2,4 tỷ USD tính toán cho Genesis Mission; doanh thu quy năm của OpenAI hụt 20 tỷ USD","Nvidia and four other giants donate US$2.4 billion of compute to support the Genesis Mission, while OpenAI's annualised revenue falls US$20 billion short","Nvidia и ещё четыре гиганта безвозмездно предоставляют вычисления на 2,4 млрд долл. США для Genesis Mission, а годовая выручка OpenAI отстаёт на 20 млрд долл. США"),b:L("輝達、超微、OpenAI、Anthropic與Google共同支持聯邦科學研究計畫。同週西雅圖禁止AI以顧客數據定價，輝達200億美元Groq交易遭股東提告。","英伟达、超微、OpenAI、Anthropic与Google共同支持联邦科学研究计划。同周西雅图禁止AI以顾客数据定价，英伟达200亿美元Groq交易遭股东提告。","NVIDIA、AMD、OpenAI、Anthropic、Googleが連邦科学計画を支援。シアトルはAIによる顧客データ価格設定を禁止、NVIDIAのGroq買収は株主訴訟に。","Nvidia, AMD, OpenAI, Anthropic, Google dukung program sains federal. Seattle larang penetapan harga AI berbasis data pelanggan; akuisisi Groq oleh Nvidia digugat pemegang saham.","Nvidia, AMD, OpenAI, Anthropic, Google hỗ trợ chương trình khoa học liên bang. Seattle cấm AI định giá theo dữ liệu khách hàng; thương vụ Groq của Nvidia bị cổ đông kiện.","Nvidia, AMD, OpenAI, Anthropic and Google are jointly backing the federal scientific research programme. In the same week Seattle banned AI from setting prices on the basis of customer data, and Nvidia's US$20 billion Groq deal drew a shareholder lawsuit.","Nvidia, AMD, OpenAI, Anthropic и Google совместно поддерживают федеральную программу научных исследований. На той же неделе Сиэтл запретил устанавливать цены с помощью ИИ на основе данных покупателей, а сделка Nvidia с Groq на 20 млрд долл. США обернулась иском акционеров."),k:L("AI的政治與法律帳單開始到期。","AI的政治与法律账单开始到期。","AIの政治・法務コストが支払期に。","Tagihan politik dan hukum AI mulai jatuh tempo.","Hóa đơn chính trị và pháp lý của AI bắt đầu đến hạn.","The political and legal bills for AI are starting to come due.","Политические и юридические счета за ИИ начинают приходить к оплате.")},
 {date:"2026-10-01",src:"數位時代",url:"https://www.bnext.com.tw/article/90657/corp-app-ai100",links:["hr","mkt"],t:L("數位時代AI 100：從770家評選全球百強與台灣20強，企業應用AI 18同仁出列","数位时代AI 100：从770家评选全球百强与台湾20强，企业应用AI 18同仁出列","AI 100：770社から世界100社と台湾20社を選出、企業向けAI「18人の同僚」","AI 100: dari 770 perusahaan dipilih 100 global dan 20 Taiwan; 18 \"rekan kerja\" AI korporat","AI 100: từ 770 công ty chọn 100 toàn cầu và 20 Đài Loan; 18 \"đồng nghiệp\" AI doanh nghiệp","Business Next AI 100: a global top 100 and a Taiwan top 20 selected from 770 companies, with 18 enterprise AI application players named","AI 100 от Business Next: из 770 компаний отобраны сто лучших в мире и двадцать лучших на Тайване, в списке корпоративного применения ИИ названы 18 участников"),b:L("麥肯錫2025年調查88%企業至少一項職能定期用AI，三到四成感受成本下降。招募篩選、客服、財務審計、資安等專門化AI接管工作流程。","麦肯锡2025年调查88%企业至少一项职能定期用AI，三到四成感受成本下降。招募筛选、客服、财务审计、资安等专门化AI接管工作流程。","マッキンゼー2025年調査では88%の企業が少なくとも1職能でAIを定期利用、3〜4割がコスト低下を実感。採用、顧客対応、監査、セキュリティの専門AIが業務を担う。","Survei McKinsey 2025: 88% perusahaan rutin memakai AI di satu fungsi; 30–40% merasakan biaya turun. AI khusus rekrutmen, layanan pelanggan, audit, keamanan ambil alih alur kerja.","Khảo sát McKinsey 2025: 88% doanh nghiệp dùng AI ở ít nhất một chức năng; 30–40% thấy chi phí giảm. AI chuyên biệt cho tuyển dụng, chăm sóc khách hàng, kiểm toán, an ninh tiếp quản quy trình.","A 2025 McKinsey survey found that 88% of firms regularly use AI in at least one function, and 30% to 40% report falling costs. Specialised AI is taking over workflows in recruitment screening, customer service, financial auditing and cybersecurity.","Опрос McKinsey 2025 года показал, что 88% компаний регулярно применяют ИИ хотя бы в одной функции, а от 30% до 40% отмечают снижение издержек. Специализированный ИИ берёт на себя рабочие процессы в отборе кандидатов, обслуживании клиентов, финансовом аудите и информационной безопасности."),k:L("AI從辦公輔助升格為數位員工。","AI从办公辅助升格为数字员工。","AIは事務補助からデジタル社員へ。","AI naik kelas dari asisten kantor ke karyawan digital.","AI thăng cấp từ trợ lý văn phòng thành nhân viên số.","AI has been promoted from office assistant to digital employee.","ИИ перешёл из роли офисного помощника в роль цифрового сотрудника.")}
 ]},
{id:"tax",kind:"bank",color:"#F2C53D",ring:1,ang:120,
 name:L("稅務","税务","税務","Pajak","Thuế","Taxation","Налоги"),
 tag:L("財政部與國稅局最新動態","财政部与国税局最新动态","財政部・国税局の最新動向","Kemenkeu dan Kantor Pajak terkini","Bộ Tài chính và Cục Thuế mới nhất","Latest from the Ministry of Finance and the National Taxation Bureau","Последние новости Министерства финансов и Национального налогового управления"),
 desc:L("稅務是企業與個人都躲不開的成本。這座島整理財政部與國稅局的新規定：所得稅免稅額與級距、遺產與贈與稅、房地合一稅、稅收統計，以及申報時該注意的事。","税务是企业与个人都躲不开的成本。这座岛整理财政部与国税局的新规定：所得税免税额与级距、遗产与赠与税、房地合一税、税收统计，以及申报时该注意的事。","税務は企業にも個人にも避けられないコストです。財政部と国税局の新規定、所得税控除と税率区分、相続・贈与税、不動産合一税、税収統計、申告の注意点をまとめます。","Pajak adalah biaya tak terhindarkan. Pulau ini merangkum aturan baru Kemenkeu dan Kantor Pajak: bebas pajak dan lapisan tarif, pajak warisan dan hibah, pajak properti terpadu, statistik penerimaan, dan catatan pelaporan.","Thuế là chi phí không tránh được. Đảo này tổng hợp quy định mới: mức miễn thuế và bậc thuế, thuế thừa kế và tặng cho, thuế bất động sản hợp nhất, thống kê thu thuế và lưu ý khi kê khai.","Tax is a cost that neither companies nor individuals can avoid. This island gathers the new rules from the Ministry of Finance and the National Taxation Bureau: income tax exemptions and brackets, estate tax and gift tax, the consolidated housing and land income tax, tax revenue statistics, and what to watch out for when filing.","Налоги это издержки, от которых не уйти ни компаниям, ни частным лицам. Этот остров собирает новые правила Министерства финансов и Национального налогового управления: вычеты и шкалу налога на доходы, налог на наследство и налог на дарение, консолидированный налог на доходы от жилья и земли, статистику налоговых поступлений и то, на что стоит обратить внимание при подаче декларации."),
 items:[
 {date:"2026-10-12",src:"中時財富",url:"https://wantrich.chinatimes.com/news/20261012900004-420501",links:["fin"],t:L("2027年遺產稅免稅額估1,488萬元、贈與稅272萬元，年底公告","2027年遗产税免税额估1,488万元、赠与税272万元，年底公告","2027年の相続税控除1,488万元・贈与税272万元の見込み","Bebas pajak warisan 2027 diperkirakan NT$14,88 juta, hibah NT$2,72 juta","Miễn thuế thừa kế 2027 ước 14,88 triệu, tặng cho 2,72 triệu","The 2027 estate tax exemption is estimated at NT$14.88 million and the gift tax exemption at NT$2.72 million, with the announcement due at year end","Вычет по налогу на наследство в 2027 году оценивается в 14,88 млн тайв. долл., а по налогу на дарение в 2,72 млн тайв. долл.; официальное объявление ожидается в конце года"),b:L("截至8月CPI較上次調整基準累計上漲11.61%，超過10%法定門檻。現行遺產稅免稅額1,333萬元、贈與稅每人每年244萬元。","截至8月CPI较上次调整基准累计上涨11.61%，超过10%法定门槛。现行遗产税免税额1,333万元、赠与税每人每年244万元。","8月時点のCPIは基準から11.61%上昇し法定の10%を超過。現行は相続1,333万元、贈与は年244万元。","CPI hingga Agustus naik 11,61%, melampaui ambang 10%. Saat ini warisan NT$13,33 juta, hibah NT$2,44 juta per tahun.","CPI đến tháng 8 tăng 11,61%, vượt ngưỡng 10%. Hiện thừa kế 13,33 triệu, tặng cho 2,44 triệu mỗi năm.","Through August the CPI had risen a cumulative 11.61% from the base used for the last adjustment, passing the statutory threshold of 10%. The current estate tax exemption is NT$13.33 million and the gift tax exemption is NT$2.44 million per person per year.","К августу индекс потребительских цен вырос в совокупности на 11,61% относительно базы предыдущей корректировки и превысил установленный законом порог в 10%. Действующий вычет по налогу на наследство составляет 13,33 млн тайв. долл., а по налогу на дарение 2,44 млн тайв. долл. на человека в год."),k:L("年底前的贈與，等一等可能多省28萬元額度。","年底前的赠与，等一等可能多省28万元额度。","年末前の贈与は待てば28万元の枠が増えるかもしれない。","Hibah sebelum akhir tahun: menunggu bisa menambah kuota NT$280.000.","Tặng cho trước cuối năm: chờ thêm có thể được thêm 280.000 hạn mức.","For a gift made before year end, waiting a little could add NT$280,000 of allowance.","С дарением до конца года стоит немного подождать: это может дать дополнительные 280 тыс. тайв. долл. лимита.")},
 {date:"2026-10-14",src:"經濟日報",url:"https://udn.com/news/story/7243/9812777",links:["fin"],t:L("9月個人房地合一稅44億元再翻黑，企業房地合一稅年減6.2%","9月个人房地合一税44亿元再翻黑，企业房地合一税年减6.2%","9月の個人不動産合一税44億元で再び減少、法人は6.2%減","Pajak properti terpadu individu Sept NT$4,4 miliar turun lagi; korporasi -6,2%","Thuế BĐS hợp nhất cá nhân tháng 9 đạt 4,4 tỷ, lại giảm; doanh nghiệp -6,2%","September individual consolidated housing and land income tax of NT$4.4 billion turned negative again, while the corporate version fell 6.2% year on year","В сентябре консолидированный налог на доходы от жилья и земли с физических лиц составил 4,4 млрд тайв. долл. и снова ушёл в минус, а у юридических лиц снизился на 6,2% в годовом сопоставлении"),b:L("企業實徵375億元為史上首次衰退。同月土增稅年增26.6%、契稅年增19.9%。前九月契稅年增9.9%，是房地三稅中唯一成長。","企业实征375亿元为史上首次衰退。同月土增税年增26.6%、契税年增19.9%。前九月契税年增9.9%，是房地三税中唯一增长。","法人は375億元で史上初の減少。土地増値税26.6%増、契約税19.9%増。1〜9月の契約税は9.9%増で唯一の増加。","Korporasi NT$37,5 miliar, penurunan pertama. Pajak kenaikan nilai tanah +26,6%, bea akta +19,9%. Jan–Sep bea akta +9,9%, satu-satunya tumbuh.","Doanh nghiệp 37,5 tỷ, lần đầu giảm. Thuế tăng giá đất +26,6%, thuế trước bạ +19,9%. Chín tháng thuế trước bạ +9,9%, khoản duy nhất tăng.","Corporate collections of NT$37.5 billion marked the first decline on record. In the same month the land value increment tax rose 26.6% year on year and the deed tax 19.9%. For the first nine months the deed tax was up 9.9%, the only one of the three property-related taxes to grow.","Фактические поступления от юридических лиц в размере 37,5 млрд тайв. долл. стали первым снижением за всю историю. В том же месяце налог на прирост стоимости земли вырос на 26,6% в годовом сопоставлении, а налог на сделки с недвижимостью на 19,9%. За первые девять месяцев налог на сделки прибавил 9,9% и оказался единственным растущим из трёх налогов на недвижимость."),k:L("房市量縮直接反映在稅收上。","房市量缩直接反映在税收上。","住宅市場の縮小がそのまま税収に出た。","Lesunya properti langsung tercermin di penerimaan.","Thị trường nhà đất co lại phản ánh thẳng vào thu thuế.","Shrinking housing market volumes show up directly in tax revenue.","Сокращение числа сделок на рынке жилья напрямую отражается в налоговых поступлениях.")},
 {date:"2025-11-27",src:"公視新聞",url:"https://news.pts.org.tw/article/783232",links:["hr"],t:L("2026年度綜所稅免稅額10.1萬元、標準扣除額13.6萬元，2027年5月申報適用","2026年度综所税免税额10.1万元、标准扣除额13.6万元，2027年5月申报适用","2026年度の基礎控除10.1万元・標準控除13.6万元、2027年5月申告から","Bebas pajak 2026 NT$101.000, potongan standar NT$136.000, berlaku Mei 2027","Miễn thuế 2026 là 101.000, khấu trừ tiêu chuẩn 136.000, áp dụng tháng 5/2027","For 2026 the individual income tax exemption is NT$101,000 and the standard deduction NT$136,000, applying to filings in May 2027","На 2026 год вычет по индивидуальному налогу на доходы составляет 101 тыс. тайв. долл., а стандартный вычет 136 тыс. тайв. долл.; они применяются при подаче деклараций в мае 2027 года"),b:L("薪資與身障特別扣除額提高至22.7萬元，5%級距上限由59萬元升至61萬元。年所得64.4萬元以下單身上班族免稅。","薪资与身障特别扣除额提高至22.7万元，5%级距上限由59万元升至61万元。年所得64.4万元以下单身上班族免税。","給与・障害者特別控除22.7万元、5%区分上限61万元へ。年収64.4万元以下の単身会社員は非課税。","Potongan gaji dan disabilitas NT$227.000; batas 5% jadi NT$610.000. Lajang di bawah NT$644.000 bebas pajak.","Khấu trừ lương và khuyết tật 227.000; trần bậc 5% lên 610.000. Độc thân dưới 644.000 miễn thuế.","The special deductions for salary and for disability rise to NT$227,000, and the ceiling of the 5% bracket goes from NT$590,000 to NT$610,000. Single employees with annual income of NT$644,000 or less pay no tax.","Особые вычеты на заработную плату и на инвалидность повышаются до 227 тыс. тайв. долл., а верхняя граница ставки 5% поднимается с 590 тыс. до 610 тыс. тайв. долл. Одинокие работники с годовым доходом до 644 тыс. тайв. долл. налог не платят."),k:L("通膨連動減稅，每年都要重算一次。","通胀联动减税，每年都要重算一次。","インフレ連動減税、毎年再計算が必要。","Pemotongan pajak terkait inflasi; hitung ulang tiap tahun.","Giảm thuế theo lạm phát; mỗi năm phải tính lại.","Tax relief indexed to inflation has to be recalculated every year.","Привязанное к инфляции снижение налогов приходится пересчитывать каждый год.")},
 {date:"2026-10-20",src:"經濟日報",url:"https://money.udn.com/money/story/6710/9824673",links:["mkt"],t:L("網紅漏辦營業稅籍可自動補報免罰，月銷售貨物逾10萬元須登記","网红漏办营业税籍可自动补报免罚，月销售货物逾10万元须登记","インフルエンサーの事業登録漏れは自主申告で免罰、月売上10万元超は登録必須","Influencer yang lupa daftar pajak usaha bisa lapor sukarela tanpa denda; penjualan barang >NT$100.000/bulan wajib daftar","Người có ảnh hưởng chưa đăng ký thuế kinh doanh có thể tự khai không phạt; bán hàng >100.000/tháng phải đăng ký","Influencers who failed to register for business tax can file voluntarily without penalty, and registration is required once monthly sales of goods exceed NT$100,000","Инфлюенсеры, не оформившие регистрацию по налогу на предпринимательскую деятельность, могут подать сведения добровольно и без штрафа, а регистрация обязательна, если продажи товаров превышают 100 тыс. тайв. долл. в месяц"),b:L("輔導期雖於6月30日截止，未被檢舉或調查前自動補繳本稅加利息仍免罰。是否須登記看實際銷售額：貨物月逾10萬、勞務月逾5萬。","辅导期虽于6月30日截止，未被检举或调查前自动补缴本税加利息仍免罚。是否须登记看实际销售额：货物月逾10万、劳务月逾5万。","指導期間は6月30日で終了したが、告発・調査前の自主納付なら免罰。登録要否は実売上で判断、物品月10万元、役務月5万元。","Masa pembinaan berakhir 30 Juni, tetapi pembayaran sukarela sebelum dilaporkan tetap bebas denda. Wajib daftar jika barang >NT$100.000 atau jasa >NT$50.000 per bulan.","Giai đoạn hướng dẫn kết thúc 30/6 nhưng tự nộp trước khi bị tố cáo vẫn miễn phạt. Phải đăng ký nếu hàng >100.000 hoặc dịch vụ >50.000 mỗi tháng.","Although the guidance period closed on 30 June, voluntarily paying the tax due plus interest before being reported or investigated still avoids a penalty. Whether registration is required depends on actual sales: over NT$100,000 a month for goods and over NT$50,000 a month for services.","Хотя период консультаций завершился 30 июня, добровольная уплата основного налога с процентами до поступления жалобы или начала проверки по-прежнему освобождает от штрафа. Необходимость регистрации зависит от фактического объёма продаж: свыше 100 тыс. тайв. долл. в месяц по товарам и свыше 50 тыс. тайв. долл. в месяц по услугам."),k:L("國稅局看的是金流，不是粉絲數。","国税局看的是金流，不是粉丝数。","国税局が見るのは資金の流れ、フォロワー数ではない。","Kantor pajak melihat arus uang, bukan jumlah pengikut.","Cục Thuế nhìn dòng tiền, không nhìn số người theo dõi.","The National Taxation Bureau looks at cash flows, not follower counts.","Национальное налоговое управление смотрит на денежные потоки, а не на число подписчиков.")},
 {date:"2026-10-22",src:"中央社",url:"https://www.cna.com.tw/news/afe/202610220233.aspx",links:["fin"],t:L("115年地價稅11月1日開徵、11月30日截止，稅額估1,046億元","115年地价税11月1日开征、11月30日截止，税额估1,046亿元","115年度地価税は11月1日課税開始、11月30日期限、税額は1,046億元の見込み","Pajak nilai tanah 2026 mulai 1 November, tenggat 30 November, diperkirakan NT$104,6 miliar","Thuế giá trị đất năm 2026 bắt đầu thu 1/11, hạn 30/11, ước 104,6 tỷ","The 2026 land value tax opens on 1 November and closes on 30 November, with NT$104.6 billion expected","Налог на стоимость земли за 2026 год взимается с 1 по 30 ноября, ожидаемая сумма 104,6 млрд тайв. долл."),b:L("財政部估開徵約939萬戶、稅額年增6.91%，全國平均公告地價較113年調漲5.24%。自用住宅用地占戶數45.11%、稅額7.25%；非自用占戶數54.89%、稅額92.75%。","财政部估开征约939万户、税额年增6.91%，全国平均公告地价较113年调涨5.24%。自用住宅用地占户数45.11%、税额7.25%；非自用占户数54.89%、税额92.75%。","財政部の見込みでは約939万戸で税額は前年比6.91%増、全国平均の公告地価は113年度比5.24%上昇。自用住宅地は戸数45.11%で税額7.25%、非自用地は戸数54.89%で税額92.75%。","Kemenkeu memperkirakan sekitar 9,39 juta rumah tangga, pajak naik 6,91% setahun, dan nilai tanah rata-rata naik 5,24% dari 2024. Lahan hunian sendiri 45,11% rumah tangga dan 7,25% pajak; bukan hunian sendiri 54,89% dan 92,75%.","Bộ Tài chính ước khoảng 9,39 triệu hộ, thuế tăng 6,91% so với năm trước, giá đất công bố bình quân tăng 5,24% so với năm 2024. Đất ở tự dùng chiếm 45,11% số hộ và 7,25% số thuế; đất không tự dùng 54,89% và 92,75%.","The Ministry of Finance estimates about 9.39 million households, with the tax up 6.91% on the year and average announced land values up 5.24% from 2024. Owner-occupied residential land accounts for 45.11% of households and 7.25% of the tax; other land for 54.89% and 92.75%.","Минфин оценивает охват примерно в 9,39 млн домохозяйств, сумма налога выросла на 6,91% за год, а средняя объявленная стоимость земли поднялась на 5,24% к 2024 году. На жилую землю для собственного проживания приходится 45,11% домохозяйств и 7,25% налога, на прочую 54,89% и 92,75%."),k:L("談地價稅負擔，先分清楚是自用住宅還是非自用用地。","谈地价税负担，先分清楚是自用住宅还是非自用用地。","地価税の負担を語るなら、まず自用住宅地か非自用地かを区別する。","Bicara beban pajak tanah, bedakan dulu hunian sendiri dan bukan hunian sendiri.","Bàn về gánh nặng thuế đất, trước hết phân biệt đất ở tự dùng và đất không tự dùng.","Before discussing the land value tax burden, separate owner-occupied residential land from other land.","Говоря о бремени налога на землю, сначала разделите жильё для собственного проживания и прочую землю.")},
