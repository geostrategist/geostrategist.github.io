 {q:L("DSX POD把AI工廠部署時間縮短到最快幾天？","DSX POD把AI工厂部署时间缩短到最快几天？","DSX PODでAI工場の構築は最短何日？","DSX POD memangkas pembangunan pabrik AI jadi berapa hari?","DSX POD rút triển khai nhà máy AI còn mấy ngày?","DSX POD shortens AI factory deployment to as few as how many days?","До какого минимального числа дней DSX POD сокращает развёртывание ИИ-фабрики?"),o:[L("60天","60天","60日","60 hari","60 ngày","60 days","60 дней"),L("14天","14天","14日","14 hari","14 ngày","14 days","14 дней"),L("3天","3天","3日","3 hari","3 ngày","3 days","3 дня")],a:1},
 {q:L("OpenAI前沿模型新進駐哪個雲端平台？","OpenAI前沿模型新进驻哪个云平台？","OpenAIのモデルが新たに入ったクラウドは？","Model OpenAI baru hadir di platform cloud mana?","Mô hình OpenAI mới lên nền tảng đám mây nào?","OpenAI's frontier models have newly arrived on which cloud platform?","На какой облачной платформе теперь размещены передовые модели OpenAI?"),o:[L("AWS Bedrock","AWS Bedrock","AWS Bedrock","AWS Bedrock","AWS Bedrock","AWS Bedrock","AWS Bedrock"),L("阿里雲","阿里云","Alibaba Cloud","Alibaba Cloud","Alibaba Cloud","Alibaba Cloud","Alibaba Cloud"),L("Google Cloud Vertex AI","Google Cloud Vertex AI","Google Cloud Vertex AI","Google Cloud Vertex AI","Google Cloud Vertex AI","Google Cloud Vertex AI","Google Cloud Vertex AI")],a:2}]},
tax:{npcs:[
 {n:L("國稅局阿姨","国税局阿姨","国税局のおばさん","Ibu petugas pajak","Cô cán bộ thuế","Tax Office Auntie","Тётушка из налоговой"),s:L("明年遺產稅免稅額可能調到1,488萬，贈與稅272萬。年底公告前，有些贈與可以等一等。","明年遗产税免税额可能调到1,488万，赠与税272万。年底公告前，有些赠与可以等一等。","来年は相続控除1,488万元、贈与272万元になりそう。年末の告示まで待つ贈与もある。","Tahun depan bebas warisan mungkin NT$14,88 juta, hibah NT$2,72 juta. Sebelum diumumkan, sebagian hibah bisa ditunda.","Năm sau miễn thừa kế có thể 14,88 triệu, tặng cho 2,72 triệu. Trước khi công bố, một số khoản tặng có thể chờ.","Next year the estate tax exemption may be raised to NT$14.88 million and the gift tax exemption to NT$2.72 million. Before the year-end announcement, some gifts are worth holding off on.","В следующем году необлагаемый минимум по налогу на наследство может вырасти до 14,88 млн тайв. долл., а по налогу на дарение до 2,72 млн тайв. долл. До объявления в конце года с некоторыми дарениями стоит подождать."),h:L("提示：CPI累計漲幅超過10%才調整。","提示：CPI累计涨幅超过10%才调整。","ヒント：CPIが累計10%超で調整。","Petunjuk: disesuaikan jika CPI naik >10%.","Gợi ý: điều chỉnh khi CPI tăng lũy kế >10%.","Hint: Adjustment happens only when the cumulative CPI rise exceeds 10%.","Подсказка: корректировка происходит только при накопленном росте индекса потребительских цен более 10%.")},
 {n:L("網紅小Q","网红小Q","インフルエンサーのQ","Influencer Q","Người ảnh hưởng Q","Influencer Xiao-Q","Инфлюэнсер Сяо-Кью"),s:L("我以為粉絲少就不用辦稅籍，結果國稅局看的是金流。還好主動補報不罰。","我以为粉丝少就不用办税籍，结果国税局看的是金流。还好主动补报不罚。","フォロワーが少ないから登録不要だと思ってた。国税局が見るのは資金の流れ。自主申告で罰はなし。","Kukira pengikut sedikit tak perlu daftar; ternyata kantor pajak melihat arus uang. Untung lapor sukarela tak kena denda.","Tôi tưởng ít người theo dõi thì không cần đăng ký; hóa ra Cục Thuế nhìn dòng tiền. May mà tự khai không bị phạt.","I thought that with few followers I did not need to register for tax, but what the tax office looks at is the money flow. Luckily, filing voluntarily to make up the difference carries no penalty.","Я думала, что при небольшом числе подписчиков в налоговой регистрироваться не нужно, но налоговая смотрит на денежные потоки. К счастью, за добровольную доподачу отчётности не штрафуют."),h:L("提示：貨物月銷售逾10萬元就要登記。","提示：货物月销售逾10万元就要登记。","ヒント：物品の月売上10万元超で登録。","Petunjuk: barang >NT$100.000/bulan wajib daftar.","Gợi ý: bán hàng >100.000/tháng phải đăng ký.","Hint: Monthly sales of goods above NT$100,000 require registration.","Подсказка: при месячных продажах товаров свыше 100 000 тайв. долл. нужна регистрация.")},
 {n:L("房仲大哥","房仲大哥","不動産屋の兄さん","Agen properti","Anh môi giới nhà đất","Realtor Da-Ge","Риелтор Да-Гэ"),s:L("9月個人房地合一稅又翻黑了，企業那邊史上第一次衰退。房市量縮，稅收最誠實。","9月个人房地合一税又翻黑了，企业那边史上第一次衰退。房市量缩，税收最诚实。","9月の個人不動産合一税はまた減少、法人は史上初の減少。市場縮小は税収に正直に出る。","September pajak properti individu turun lagi; korporasi turun pertama kalinya. Pasar lesu, penerimaan paling jujur.","Tháng 9 thuế BĐS cá nhân lại giảm; doanh nghiệp lần đầu giảm. Thị trường co, thu thuế nói thật nhất.","In September individual consolidated housing and land tax revenue went into the red again, and on the corporate side it declined for the first time ever. Transaction volume is shrinking, and tax revenue is the most honest indicator.","В сентябре поступления объединённого налога на жильё и землю с физических лиц снова ушли в минус, а по юридическим лицам падение случилось впервые в истории. Объём сделок на рынке жилья сжимается, и налоговые сборы говорят об этом честнее всего."),h:L("提示：115年地價稅11月1日開徵，稅額估1,046億元。","提示：115年地价税11月1日开征，税额估1,046亿元。","ヒント：115年度地価税は11月1日課税開始、税額は1,046億元の見込み。","Petunjuk: pajak nilai tanah 2026 mulai 1 November, diperkirakan NT$104,6 miliar.","Gợi ý: thuế giá trị đất năm 2026 thu từ 1/11, ước 104,6 tỷ.","Hint: the 2026 land value tax opens on 1 November, with NT$104.6 billion expected.","Подсказка: налог на стоимость земли за 2026 год взимается с 1 ноября, ожидается 104,6 млрд тайв. долл.")}],
 qs:[
 {q:L("現行贈與稅每人每年免稅額是？","现行赠与税每人每年免税额是？","現行の贈与税の年間控除額は？","Bebas pajak hibah per orang per tahun saat ini?","Mức miễn thuế tặng cho mỗi người mỗi năm hiện nay?","What is the current annual gift tax exemption per person?","Каков действующий ежегодный необлагаемый минимум по налогу на дарение на человека?"),o:[L("244萬元","244万元","244万元","NT$2,44 juta","2,44 triệu","NT$2.44 million","2,44 млн тайв. долл."),L("220萬元","220万元","220万元","NT$2,2 juta","2,2 triệu","NT$2.2 million","2,2 млн тайв. долл."),L("272萬元","272万元","272万元","NT$2,72 juta","2,72 triệu","NT$2.72 million","2,72 млн тайв. долл.")],a:0},
 {q:L("網紅銷售貨物月超過多少元須辦營業登記？","网红销售货物月超过多少元须办营业登记？","インフルエンサーの物品販売、月いくら超で登録？","Penjualan barang influencer di atas berapa per bulan wajib daftar?","Người ảnh hưởng bán hàng vượt bao nhiêu mỗi tháng phải đăng ký?","Above what level of monthly goods sales must an influencer register a business?","При каких месячных продажах товаров инфлюэнсер обязан зарегистрировать деятельность?"),o:[L("5萬元","5万元","5万元","NT$50.000","50.000","NT$50,000","50 000 тайв. долл."),L("10萬元","10万元","10万元","NT$100.000","100.000","NT$100,000","100 000 тайв. долл."),L("20萬元","20万元","20万元","NT$200.000","200.000","NT$200,000","200 000 тайв. долл.")],a:1},
 {q:L("2026年度綜所稅免稅額調為每人多少元？","2026年度综所税免税额调为每人多少元？","2026年度の基礎控除は一人いくら？","Bebas pajak penghasilan 2026 per orang?","Mức miễn thuế thu nhập 2026 mỗi người?","To what amount per person is the 2026 individual income tax exemption raised?","До какой суммы на человека повышен необлагаемый минимум по налогу на доходы физических лиц в 2026 году?"),o:[L("9.7萬元","9.7万元","9.7万元","NT$97.000","97.000","NT$97,000","97 000 тайв. долл."),L("13.6萬元","13.6万元","13.6万元","NT$136.000","136.000","NT$136,000","136 000 тайв. долл."),L("10.1萬元","10.1万元","10.1万元","NT$101.000","101.000","NT$101,000","101 000 тайв. долл.")],a:2}]},
prod:{npcs:[
 {n:L("採購經理阿鋼","采购经理阿钢","購買マネージャーのアガン","Manajer pengadaan A-Gang","Trưởng phòng mua hàng A-Cương","Purchasing Manager Ah-Gang","Менеджер по закупкам А-Ган"),s:L("玻纖布和CCL 11月又要漲一到一成五，我的成本表每個月都要重寫。","玻纤布和CCL 11月又要涨一到一成五，我的成本表每个月都要重写。","ガラスクロスとCCLが11月にまた10〜15%値上げ。原価表は毎月書き直し。","Fiberglass dan CCL naik lagi 10-15% November; tabel biayaku ditulis ulang tiap bulan.","Vải sợi thủy tinh và CCL tháng 11 lại tăng 10-15%; bảng chi phí của tôi viết lại mỗi tháng.","Glass fiber fabric and CCL are going up another 10% to 15% in November, so I have to rewrite my cost sheet every month.","Стеклоткань и CCL в ноябре подорожают ещё на 10-15%, поэтому калькуляцию затрат мне приходится переписывать каждый месяц."),h:L("提示：本波漲幅約10%至15%，實際依規格與供應商而異。","提示：本波涨幅约10%至15%，实际依规格与供应商而异。","ヒント：今回の上げ幅は約10%から15%で、規格と供給元で異なる。","Petunjuk: kenaikan sekitar 10% hingga 15%, tergantung spesifikasi dan pemasok.","Gợi ý: đợt tăng khoảng 10% đến 15%, tùy quy cách và nhà cung cấp.","Hint: this round is about 10% to 15% and varies by specification and supplier.","Подсказка: повышение составит около 10-15% и зависит от спецификации и поставщика.")},
 {n:L("泰國廠長Somchai","泰国厂长Somchai","タイ工場長Somchai","Kepala pabrik Thailand Somchai","Giám đốc nhà máy Thái Lan Somchai","Thailand Plant Manager Somchai","Директор тайского завода Сомчай"),s:L("騰輝在大城府的新廠年底量產，隔壁金居、聯茂也在東南亞擴產。擴產地圖正在往南移。","腾辉在大城府的新厂年底量产，隔壁金居、联茂也在东南亚扩产。扩产地图正在往南移。","騰輝のアユタヤ工場は年末量産、隣の金居や聯茂も東南アジアで増産。地図は南へ。","Pabrik Ventec di Ayutthaya produksi massal akhir tahun; Co-Tech dan ITEQ juga ekspansi di Asia Tenggara. Peta bergeser ke selatan.","Nhà máy Ventec ở Ayutthaya sản xuất hàng loạt cuối năm; Co-Tech và ITEQ cũng mở rộng ở Đông Nam Á. Bản đồ dịch về nam.","Ventec' new plant in Ayutthaya starts mass production at the end of the year, and its neighbors Co-Tech and ITEQ are expanding in Southeast Asia too. The expansion map is moving south.","Новый завод Ventec в Аюттхае выйдет на массовое производство к концу года, а рядом Co-Tech и ITEQ тоже расширяют мощности в Юго-Восточной Азии. Карта расширения сдвигается на юг."),h:L("提示：東協六國與台灣貿易額今年估2,700億美元。","提示：东盟六国与台湾贸易额今年估2,700亿美元。","ヒント：ASEAN6か国と台湾の貿易額は今年2,700億ドル見込み。","Petunjuk: perdagangan Taiwan-ASEAN6 ~US$270 miliar tahun ini.","Gợi ý: thương mại Đài Loan-ASEAN6 ước 270 tỷ USD năm nay.","Hint: Trade between the six ASEAN countries and Taiwan is estimated at US$270 billion this year.","Подсказка: товарооборот шести стран АСЕАН с Тайванем оценивается в этом году в 270 млрд долл.")},
 {n:L("貨運員小飛","货运员小飞","貨物担当のシャオフェイ","Petugas kargo Xiao-Fei","Nhân viên vận tải Tiểu Phi","Freight Agent Xiao-Fei","Экспедитор Сяо-Фэй"),s:L("美國航空公司每月派一百架包機來台灣搶AI貨，每公斤運價已經破400元。","美国航空公司每月派一百架包机来台湾抢AI货，每公斤运价已经破400元。","米航空会社は月100便のチャーターでAI貨物を運ぶ。運賃は1kg400元超。","Maskapai AS kirim 100 charter sebulan untuk kargo AI; tarif sudah >NT$400/kg.","Hãng Mỹ cử 100 chuyến thuê bao mỗi tháng chở hàng AI; cước đã vượt 400/kg.","US airlines send a hundred charter flights to Taiwan every month to grab AI cargo, and the rate per kilogram has already passed NT$400.","Американские авиакомпании ежемесячно отправляют на Тайвань сто чартеров, чтобы перехватить ИИ-грузы, а тариф за килограмм уже перевалил за 400 тайв. долл."),h:L("提示：物流成本正在吃掉AI硬體的毛利。","提示：物流成本正在吃掉AI硬件的毛利。","ヒント：物流コストがAIハードの粗利を削る。","Petunjuk: biaya logistik menggerus margin perangkat keras AI.","Gợi ý: chi phí logistics đang ăn bớt biên lợi nhuận phần cứng AI.","Hint: Logistics costs are eating into AI hardware margins.","Подсказка: логистические расходы съедают маржу ИИ-оборудования.")}],
 qs:[

 {q:L("鴻海2026年9月營收首度突破多少？","鸿海2026年9月营收首度突破多少？","鴻海の2026年9月売上が初めて超えたのは？","Pendapatan Hon Hai September 2026 pertama kali menembus?","Doanh thu Foxconn tháng 9/2026 lần đầu vượt?","Hon Hai's September 2026 revenue topped what level for the first time?","Какой уровень выручка Hon Hai впервые превысила в сентябре 2026 года?"),o:[L("1兆元","1兆元","1兆元","NT$1 triliun","1 nghìn tỷ","NT$1 trillion","1 трлн тайв. долл."),L("5,000億元","5,000亿元","5,000億元","NT$500 miliar","500 tỷ","NT$500 billion","500 млрд тайв. долл."),L("3兆元","3兆元","3兆元","NT$3 triliun","3 nghìn tỷ","NT$3 trillion","3 трлн тайв. долл.")],a:0},

 {n:L("店長小桃","店长小桃","店長のモモ","Manajer toko Momo","Quản lý cửa hàng Tiểu Đào","Store Manager Xiao-Tao","Управляющая магазином Сяо-Тао"),s:L("雙11三大平台27日同時開打，折扣大家都有，差異在誰的AI助理更懂顧客。","双11三大平台27日同时开打，折扣大家都有，差异在谁的AI助理更懂顾客。","ダブル11は3社が27日に同時開始。割引は皆同じ、違いはAI助手がどれだけ客を理解するか。","Double 11 tiga platform mulai serentak 27 Okt; diskon sama, bedanya asisten AI siapa yang paling paham pelanggan.","Double 11 ba nền tảng cùng khởi động 27/10; giảm giá ai cũng có, khác biệt ở trợ lý AI nào hiểu khách hơn.","The three big platforms all opened their Double 11 campaigns on the 27th. Everyone has discounts, so the difference is whose AI assistant understands customers better.","Три крупные платформы начали распродажу 11.11 одновременно 27-го числа. Скидки есть у всех, разница в том, чей ИИ-помощник лучше понимает покупателей."),h:L("提示：Yahoo購物推出「AI懂買」。","提示：Yahoo购物推出「AI懂买」。","ヒント：Yahooは「AI懂買」を投入。","Petunjuk: Yahoo meluncurkan \"AI懂買\".","Gợi ý: Yahoo ra mắt \"AI懂買\".","Hint: Yahoo Shopping launched its \"AI Smart Buy\" feature.","Подсказка: Yahoo Shopping запустила функцию «AI Smart Buy».")},
 {n:L("品牌經理Ivy","品牌经理Ivy","ブランドマネージャーIvy","Manajer merek Ivy","Giám đốc thương hiệu Ivy","Brand Manager Ivy","Бренд-менеджер Айви"),s:L("現在顧客問ChatGPT而不是搜尋。被人看見不夠，還要被AI引用。這叫GEO。","现在顾客问ChatGPT而不是搜索。被人看见不够，还要被AI引用。这叫GEO。","客は検索ではなくChatGPTに聞く。人に見られるだけでなくAIに引用されねば。これがGEO。","Pelanggan kini bertanya ke ChatGPT, bukan mencari. Dilihat orang tak cukup; harus dikutip AI. Itu GEO.","Khách giờ hỏi ChatGPT thay vì tìm kiếm. Được người thấy chưa đủ, phải được AI trích dẫn. Đó là GEO.","Customers now ask ChatGPT instead of searching. Being seen by people is not enough, you also have to be cited by the AI. That is called GEO.","Теперь покупатели спрашивают ChatGPT, а не ищут в поисковике. Недостаточно, чтобы тебя видели люди, нужно, чтобы тебя цитировал ИИ. Это называется GEO."),h:L("提示：OpenAI在ChatGPT試行對話原生廣告。","提示：OpenAI在ChatGPT试行对话原生广告。","ヒント：OpenAIはChatGPTで会話型広告を試験。","Petunjuk: OpenAI menguji iklan native di ChatGPT.","Gợi ý: OpenAI thử quảng cáo gốc trong ChatGPT.","Hint: OpenAI is testing conversation-native ads in ChatGPT.","Подсказка: OpenAI тестирует в ChatGPT рекламу, встроенную в диалог.")},
 {n:L("排隊的果粉阿杰","排队的果粉阿杰","行列に並ぶApple好きのアジエ","Penggemar Apple A-Jie yang antre","Fan Apple A-Kiệt đang xếp hàng","Queueing Apple Fan Ah-Jie","Эппл-фанат А-Цзе в очереди"),s:L("iPhone Duo開賣當天就沒貨了，蘋果還追加三成訂單。缺貨本身就是最好的廣告。","iPhone Duo开卖当天就没货了，苹果还追加三成订单。缺货本身就是最好的广告。","iPhone Duoは発売当日に完売、Appleは3割追加発注。品薄が最高の広告。","iPhone Duo ludes hari pertama; Apple tambah 30% pesanan. Kelangkaan adalah iklan terbaik.","iPhone Duo hết hàng ngay ngày đầu; Apple thêm 30% đơn. Khan hàng là quảng cáo tốt nhất.","The iPhone Duo sold out on launch day, and Apple added another 30% to its orders. Being out of stock is itself the best advertising.","iPhone Duo распродали в первый же день продаж, и Apple увеличила заказы ещё на 30%. Дефицит сам по себе лучшая реклама."),h:L("提示：91APP被駭事件涉1,329個品牌，恐影響479.8萬名消費者。","提示：91APP被黑事件涉1,329个品牌，恐影响479.8万名消费者。","ヒント：91APPの不正侵入は1,329ブランド、最大479.8万人の消費者に影響の恐れ。","Petunjuk: peretasan 91APP melibatkan 1.329 merek dan dapat memengaruhi 4,798 juta konsumen.","Gợi ý: vụ tấn công 91APP liên quan 1.329 thương hiệu, có thể ảnh hưởng 4,798 triệu người tiêu dùng.","Hint: the 91APP hack involves 1,329 brands and may affect 4.798 million consumers.","Подсказка: взлом 91APP касается 1329 брендов и может затронуть 4,798 млн потребителей.")}],

 {q:L("GEO指的是什麼？","GEO指的是什么？","GEOとは？","Apa itu GEO?","GEO là gì?","What does GEO mean?","Что означает GEO?"),o:[L("地理資訊優化","地理信息优化","地理情報最適化","Optimasi geografis","Tối ưu địa lý","Geographic information optimization","Оптимизация географической информации"),L("生成式引擎優化","生成式引擎优化","生成エンジン最適化","Generative Engine Optimization","Tối ưu công cụ sinh","Generative engine optimization","Оптимизация под генеративные движки"),L("全球電商營運","全球电商营运","グローバルEC運営","Operasi e-commerce global","Vận hành thương mại điện tử toàn cầu","Global e-commerce operations","Глобальные операции электронной коммерции")],a:1},
 {q:L("雙11期間哪家平台推出AI購物助理？","双11期间哪家平台推出AI购物助理？","ダブル11でAIショッピング助手を出したのは？","Platform mana yang meluncurkan asisten belanja AI untuk Double 11?","Nền tảng nào ra trợ lý mua sắm AI dịp Double 11?","Which platform launched an AI shopping assistant for Double 11?","Какая платформа запустила ИИ-помощника для покупок во время распродажи 11.11?"),o:[L("蝦皮","虾皮","Shopee","Shopee","Shopee","Shopee","Shopee"),L("PChome","PChome","PChome","PChome","PChome","PChome","PChome"),L("Yahoo購物","Yahoo购物","Yahooショッピング","Yahoo Shopping","Yahoo Shopping","Yahoo Shopping","Yahoo Shopping")],a:2}]},

 {n:L("人資主管Lin","人资主管Lin","人事部長Lin","Kepala SDM Lin","Trưởng phòng nhân sự Lin","HR Director Lin","HR-директор Линь"),s:L("明年最低工資月薪30,900元，餐飲和零售的人事預算要重算。我們得先盤點技能再買AI工具。","明年最低工资月薪30,900元，餐饮和零售的人事预算要重算。我们得先盘点技能再买AI工具。","来年の最低賃金は月30,900元。飲食と小売は人件費予算を再計算。AIツールを買う前にスキル棚卸しを。","Upah minimum tahun depan NT$30.900; anggaran restoran dan ritel dihitung ulang. Audit skill dulu, baru beli alat AI.","Lương tối thiểu năm sau 30.900; ngân sách ăn uống và bán lẻ phải tính lại. Kiểm kê kỹ năng trước rồi mới mua công cụ AI.","Next year the minimum monthly wage is NT$30,900, so food service and retail have to recalculate their payroll budgets. We need to take stock of skills before buying AI tools.","В следующем году минимальная месячная зарплата составит 30 900 тайв. долл., и в общепите и ритейле придётся пересчитывать бюджет на персонал. Сначала нам нужно оценить имеющиеся навыки, а потом покупать ИИ-инструменты."),h:L("提示：調幅4.745%，連續第11年調漲。","提示：调幅4.745%，连续第11年调涨。","ヒント：4.745%引き上げ、11年連続。","Petunjuk: naik 4,745%, sebelas tahun berturut-turut.","Gợi ý: tăng 4,745%, năm thứ 11 liên tiếp.","Hint: The increase is 4.745%, the 11th straight year of raises.","Подсказка: повышение на 4,745%, 11-й год подряд.")},
 {n:L("求職者小宇","求职者小宇","求職者のシャオユー","Pencari kerja Xiao-Yu","Người tìm việc Tiểu Vũ","Job Seeker Xiao-Yu","Соискатель Сяо-Юй"),s:L("大家都說AI會搶工作，可是科技業職缺回升到28萬個。改變的是工作內容，不是職缺數。","大家都说AI会抢工作，可是科技业职缺回升到28万个。改变的是工作内容，不是职缺数。","AIが仕事を奪うと言われるが、テック求人は28万件に回復。変わったのは仕事の中身。","Katanya AI merebut pekerjaan, tetapi lowongan teknologi pulih ke 280.000. Yang berubah isi kerjanya, bukan jumlahnya.","Ai cũng nói AI cướp việc, nhưng tin tuyển dụng công nghệ phục hồi lên 280.000. Thay đổi là nội dung việc, không phải số việc.","Everyone says AI will take jobs, yet tech openings have rebounded to 280,000. What changed is the content of the work, not the number of openings.","Все говорят, что ИИ отнимет работу, но число вакансий в технологическом секторе восстановилось до 280 000. Изменилось содержание работы, а не количество вакансий."),h:L("提示：企業招募轉向實戰能力與數據素養。","提示：企业招募转向实战能力与数据素养。","ヒント：採用は実践力とデータ素養重視へ。","Petunjuk: rekrutmen beralih ke kemampuan praktis dan literasi data.","Gợi ý: tuyển dụng chuyển sang năng lực thực chiến và hiểu dữ liệu.","Hint: Employers are shifting hiring toward hands-on skills and data literacy.","Подсказка: при найме компании всё больше смотрят на практические навыки и умение работать с данными.")},
 {n:L("銀行櫃員阿金","银行柜员阿金","銀行員のアジン","Teller bank A-Jin","Giao dịch viên A-Kim","Bank Teller Ah-Jin","Банковский кассир А-Цзинь"),s:L("渣打說2030年前後台要減15%職位。台灣銀行員反而創新高，但派遣和初階職缺最先被AI接手。","渣打说2030年前后台要减15%职位。台湾银行员反而创新高，但派遣和初阶职缺最先被AI接手。","スタンチャートは2030年までにバックオフィス15%削減。台湾の銀行員は最多だが、派遣と初級職からAIに。","StanChart pangkas 15% back office hingga 2030. Pegawai bank Taiwan justru rekor, tetapi alih daya dan junior yang lebih dulu diambil AI.","StanChart cắt 15% hậu trường đến 2030. Nhân viên ngân hàng Đài Loan lại kỷ lục, nhưng phái cử và cấp thấp bị AI tiếp quản trước.","Standard Chartered says it will cut 15% of back office positions by around 2030. In Taiwan bank headcount has hit a record high instead, but dispatched and entry-level jobs are the first ones AI takes over.","Standard Chartered заявляет, что примерно к 2030 году сократит 15% позиций в бэк-офисе. На Тайване же число банковских сотрудников вышло на рекорд, но заёмный труд и начальные позиции ИИ забирает первыми."),h:L("提示：後台先熄燈，前台的人更貴。","提示：后台先熄灯，前台的人更贵。","ヒント：バックオフィスが先に消え、フロントは高くなる。","Petunjuk: back office padam dulu; front office lebih mahal.","Gợi ý: hậu trường tắt trước; tuyến đầu đắt hơn.","Hint: The back office goes dark first, and front office people get more expensive.","Подсказка: сначала гаснет свет в бэк-офисе, а люди во фронт-офисе становятся дороже.")}],

 {q:L("2027年最低工資月薪是多少？","2027年最低工资月薪是多少？","2027年の最低賃金（月給）は？","Upah minimum bulanan 2027?","Lương tối thiểu tháng năm 2027?","What is the minimum monthly wage for 2027?","Какова минимальная месячная зарплата в 2027 году?"),o:[L("29,500元","29,500元","29,500元","NT$29.500","29.500","NT$29,500","29 500 тайв. долл."),L("30,900元","30,900元","30,900元","NT$30.900","30.900","NT$30,900","30 900 тайв. долл."),L("31,500元","31,500元","31,500元","NT$31.500","31.500","NT$31,500","31 500 тайв. долл.")],a:1},
 {q:L("美光桃園工會10月22日有幾名幹部罷工一天？","美光桃园工会10月22日有几名干部罢工一天？","マイクロン桃園労組で10月22日に1日ストをした幹部は何人？","Berapa pengurus serikat Micron Taoyuan yang mogok sehari pada 22 Oktober?","Bao nhiêu cán bộ công đoàn Micron Đào Viên đình công một ngày 22/10?","How many Micron Taoyuan union officers struck for one day on 22 October?","Сколько руководителей профсоюза Micron в Таоюане бастовали один день 22 октября?"),o:[L("11名","11名","11人","11 orang","11 người","11","11"),L("110名","110名","110人","110 orang","110 người","110","110"),L("1,100名","1,100名","1,100人","1.100 orang","1.100 người","1,100","1100")],a:0},
 {q:L("TrueUp統計科技業職缺回升突破多少？","TrueUp统计科技业职缺回升突破多少？","TrueUp調査でテック求人は何件超？","Lowongan teknologi menurut TrueUp pulih ke lebih dari?","Tin tuyển dụng công nghệ theo TrueUp phục hồi vượt?","By TrueUp's count, tech job openings rebounded past what level?","По данным TrueUp, число вакансий в технологическом секторе восстановилось и превысило какой уровень?"),o:[L("8萬","8万","8万","80.000","80.000","80,000","80 000"),L("18萬","18万","18万","180.000","180.000","180,000","180 000"),L("28萬","28万","28万","280.000","280.000","280,000","280 000")],a:2}]},
rd:{npcs:[
 {n:L("研發長小光","研发长小光","研究開発責任者のシャオグァン","Kepala R&D Xiao-Guang","Giám đốc R&D Tiểu Quang","R&D Chief Xiao-Guang","Директор по НИОКР Сяо-Гуан"),s:L("A14製程2027年試產、2028年量產。節點每兩年一代，研發費只會更高。","A14制程2027年试产、2028年量产。节点每两年一代，研发费只会更高。","A14は2027年試作、2028年量産。2年ごとに世代交代、研究開発費は増える一方。","A14 uji 2027, massal 2028. Satu generasi tiap dua tahun; biaya R&D hanya naik.","A14 thử 2027, hàng loạt 2028. Hai năm một thế hệ; chi R&D chỉ tăng.","The A14 process goes to trial production in 2027 and volume production in 2028. A new node every two years means R&D costs only climb.","Техпроцесс A14 выходит на пробное производство в 2027 году и на массовое в 2028 году. Новый узел каждые два года, значит расходы на НИОКР будут только расти."),h:L("提示：N2家族2027年產能倍增。","提示：N2家族2027年产能倍增。","ヒント：N2は2027年に能力倍増。","Petunjuk: kapasitas N2 berlipat dua pada 2027.","Gợi ý: năng lực N2 gấp đôi năm 2027.","Hint: N2 family capacity doubles in 2027.","Подсказка: мощности семейства N2 удвоятся в 2027 году.")},
 {n:L("光子博士Lu","光子博士Lu","フォトニクス博士Lu","Dr. Lu fotonik","Tiến sĩ quang tử Lu","Dr. Lu, Photonics","Доктор Лу, фотоника"),s:L("我們用一顆雷射做出23個通道，七芯光纖跑到34 Tbit/s。AI競賽已從搶晶片延伸到搶光通訊產能。","我们用一颗激光做出23个通道，七芯光纤跑到34 Tbit/s。AI竞赛已从抢芯片延伸到抢光通信产能。","1つのレーザーで23チャネルを作り、7コア光ファイバーで34 Tbit/sに達した。AI競争はチップ争奪から光通信能力の争奪へ広がった。","Kami membuat 23 kanal dari satu laser, serat tujuh inti mencapai 34 Tbit/s. Persaingan AI meluas dari berebut chip ke kapasitas komunikasi optik.","Chúng tôi tạo 23 kênh từ một laser, sợi quang bảy lõi đạt 34 Tbit/s. Cuộc đua AI đã lan từ giành chip sang giành công suất truyền thông quang.","We made 23 channels from one laser, and seven-core fibre reached 34 Tbit/s. The AI race has spread from securing chips to securing optical communications capacity.","Мы получили 23 канала от одного лазера, а семижильное волокно достигло 34 Тбит/с. Гонка ИИ перешла от борьбы за чипы к борьбе за мощности оптической связи."),h:L("提示：鴻海研究院與陽明交大合作。","提示：鸿海研究院与阳明交大合作。","ヒント：鴻海研究院と陽明交大の共同研究。","Petunjuk: kerja sama HHRI dan NYCU.","Gợi ý: hợp tác giữa HHRI và NYCU.","Hint: a collaboration between the Hon Hai Research Institute and NYCU.","Подсказка: совместная работа Исследовательского института Hon Hai и университета Ян Мин Цзяотун.")},
 {n:L("封裝師傅老王","封装师傅老王","パッケージング職人の王さん","Master pengemasan Pak Wang","Thợ đóng gói bác Vương","Packaging veteran Lao Wang","Мастер корпусирования Лао Ван"),s:L("CoWoS 5X全球只有我們做得出來，9X和14X還在開發。封裝技術決定AI晶片的上限。","CoWoS 5X全球只有我们做得出来，9X和14X还在开发。封装技术决定AI芯片的上限。","CoWoS 5Xを作れるのは世界で我々だけ。9Xと14Xは開発中。パッケージングがAIチップの上限を決める。","CoWoS 5X hanya kami yang bisa; 9X dan 14X masih dikembangkan. Pengemasan menentukan batas chip AI.","CoWoS 5X chỉ chúng tôi làm được; 9X và 14X đang phát triển. Đóng gói quyết định giới hạn chip AI.","We are the only ones in the world who can make CoWoS 5X, and 9X and 14X are still in development. Packaging technology sets the ceiling for AI chips.","CoWoS 5X в мире умеем делать только мы, 9X и 14X ещё в разработке. Технология корпусирования задаёт предел для ИИ-чипов."),h:L("提示：景碩在探索氮化鋁陶瓷載板核心。","提示：景硕在探索氮化铝陶瓷载板核心。","ヒント：景碩は窒化アルミ基板コアを探索中。","Petunjuk: Kinsus menjajaki inti substrat AlN.","Gợi ý: Kinsus đang thăm dò lõi substrate AlN.","Hint: Kinsus is exploring aluminum nitride ceramic substrate cores.","Подсказка: Kinsus изучает керамические сердечники подложек из нитрида алюминия.")}],

 {n:L("財務長Chen","财务长Chen","CFOのChen","CFO Chen","Giám đốc tài chính Chen","CFO Chen","Финансовый директор Чэнь"),s:L("台達電營收創高但獲利季減6.5%。季減比年增更值得追問，這是我每季開會的第一題。","台达电营收创高但盈利季减6.5%。季减比年增更值得追问，这是我每季开会的第一题。","台達電は売上最高でも利益は前期比6.5%減。前年比増より前期比減を問う、それが毎四半期の最初の議題。","Pendapatan Delta rekor tetapi laba -6,5% QoQ. Penurunan QoQ lebih layak ditanya daripada kenaikan YoY.","Doanh thu Delta kỷ lục nhưng lãi -6,5% so quý trước. Giảm so quý trước đáng hỏi hơn tăng so cùng kỳ.","Delta Electronics posted record revenue, but profit fell 6.5% from the previous quarter. A quarterly decline deserves more scrutiny than an annual gain, and it is my first question at every quarterly meeting.","У Delta Electronics рекордная выручка, но прибыль упала на 6,5% по сравнению с предыдущим кварталом. Квартальное падение стоит разбирать внимательнее, чем годовой рост, и это мой первый вопрос на каждом квартальном совещании."),h:L("提示：台達電第三季EPS 9.04元。","提示：台达电第三季度EPS 9.04元。","ヒント：台達電の第3四半期EPSは9.04元。","Petunjuk: EPS Q3 Delta NT$9,04.","Gợi ý: EPS Q3 Delta là 9,04.","Hint: Delta Electronics posted third-quarter EPS of NT$9.04.","Подсказка: прибыль на акцию Delta Electronics за третий квартал составила 9,04 тайв. долл.")},
 {n:L("基金經理人Kay","基金经理人Kay","ファンドマネージャーKay","Manajer dana Kay","Quản lý quỹ Kay","Fund manager Kay","Управляющий фондом Кей"),s:L("AI泡沫疑慮讓費半和台股大跌，但台積電把全年成長上調到44%。回檔是估值修正，不是需求消失。","AI泡沫疑虑让费半和台股大跌，但台积电把全年增长上调到44%。回档是估值修正，不是需求消失。","AIバブル懸念でSOXと台湾株が急落。でもTSMCは通年成長を44%へ上方修正。調整はバリュエーション修正で需要消失ではない。","Kekhawatiran gelembung AI menjatuhkan SOX dan Taiex, tetapi TSMC naikkan pertumbuhan ke 44%. Koreksi adalah penyesuaian valuasi.","Lo ngại bong bóng AI khiến SOX và Taiex giảm mạnh, nhưng TSMC nâng tăng trưởng lên 44%. Điều chỉnh là sửa định giá.","Worries about an AI bubble sent the SOX and Taiwan stocks sharply lower, yet TSMC raised its full-year growth forecast to 44%. The pullback is a valuation correction, not a disappearance of demand.","Опасения пузыря в ИИ обвалили индекс SOX и тайваньский рынок, но TSMC повысила прогноз роста на год до 44%. Откат это коррекция оценок, а не исчезновение спроса."),h:L("提示：10月30日台股重挫1,156點。","提示：10月30日台股重挫1,156点。","ヒント：10月30日の台湾株は1,156ポイント安。","Petunjuk: Taiex anjlok 1.156 poin pada 30 Oktober.","Gợi ý: Taiex giảm 1.156 điểm ngày 30/10.","Hint: Taiwan stocks plunged 1,156 points on 30 October.","Подсказка: 30 октября тайваньский рынок обвалился на 1156 пунктов.")},
 {n:L("Fed觀察員Sam","Fed观察员Sam","FRBウォッチャーSam","Pengamat Fed Sam","Quan sát viên Fed Sam","Fed watcher Sam","Наблюдатель за Федрезервом Сэм"),s:L("Fed維持3.75%到4%，但兩位官員想升息。OpenAI還下調估值到1.25兆美元。AI的融資成本假設要改了。","Fed维持3.75%到4%，但两位官员想升息。OpenAI还下调估值到1.25兆美元。AI的融资成本假设要改了。","FRBは3.75〜4%据え置き、だが2人が利上げ派。OpenAIは評価額を1.25兆ドルに下方修正。AIの資金コスト前提は見直し。","Fed tahan 3,75–4%, tetapi dua pejabat ingin naik. OpenAI pangkas valuasi ke US$1,25 triliun. Asumsi biaya pendanaan AI harus diubah.","Fed giữ 3,75–4%, nhưng hai quan chức muốn tăng. OpenAI hạ định giá xuống 1,25 nghìn tỷ USD. Giả định chi phí vốn AI phải đổi.","The Fed held at 3.75% to 4%, but two officials wanted a hike. OpenAI also cut its valuation to US$1.25 trillion. The financing-cost assumptions behind AI need rewriting.","ФРС сохранила диапазон от 3,75% до 4%, но двое чиновников хотели повышения. OpenAI к тому же снизила оценку до 1,25 трлн долл. Предпосылки о стоимости финансирования ИИ придётся переписать."),h:L("提示：供應商借錢給客戶買自己的產品，叫循環融資。","提示：供应商借钱给客户买自己的产品，叫循环融资。","ヒント：供給側が顧客に自社製品購入資金を貸すのが循環融資。","Petunjuk: pemasok meminjami pelanggan untuk beli produknya disebut pendanaan melingkar.","Gợi ý: nhà cung cấp cho khách vay mua sản phẩm của mình gọi là tài trợ vòng tròn.","Hint: when a supplier lends a customer money to buy its own products, that is circular financing.","Подсказка: когда поставщик даёт клиенту в долг на покупку собственной продукции, это называется круговым финансированием.")}],

 {n:L("農夫阿田","农夫阿田","農家のアティエン","Petani A-Tian","Nông dân A-Điền","Farmer A-Tian","Фермер А-Тянь"),s:L("11月2日玉米報4.48美元、黃豆12.16美元，泰國米10月21日週報價494美元。","11月2日玉米报4.48美元、大豆12.16美元，泰国米10月21日周报价494美元。","11月2日のトウモロコシは4.48ドル、大豆は12.16ドル、タイ米は10月21日の週間価格で494ドル。","Pada 2 November jagung 4.48 USD, kedelai 12.16 USD; beras Thailand 494 USD (harga mingguan 21 Oktober).","Ngày 2/11 ngô 4.48 USD, đậu tương 12.16 USD; gạo Thái 494 USD (giá tuần 21/10).","On 2 November corn was 4.48 and soybeans 12.16 dollars; Thai rice was 494 dollars on the 21 October weekly price.","2 ноября кукуруза 4.48, соевые бобы 12.16 долл.; тайский рис 494 долл. (недельная цена на 21 октября)."),h:L("提示：玉米與黃豆以美元／英斗計。","提示：玉米与大豆以美元/蒲式耳计。","ヒント：トウモロコシと大豆はドル/ブッシェル建て。","Petunjuk: jagung dan kedelai dihitung dalam USD/bushel.","Gợi ý: ngô và đậu tương tính theo USD/giạ.","Hint: corn and soybeans are priced in USD per bushel.","Подсказка: кукуруза и соя котируются в долл. за бушель.")}],

ibm:{npcs:[
 {n:L("系主任","系主任","学科主任","Ketua Program","Trưởng khoa","Department Chair","Заведующий кафедрой"),
  s:L("歡迎來到群島的母港。這個系有五個組別，從公司理財到韓國文創，選組就是先選一條產業路線。","欢迎来到群岛的母港。这个系有五个组别，从公司理财到韩国文创，选组就是先选一条产业路线。","群島の母港へようこそ。この学科には5つのコースがあり、コース選択は産業の進路選択でもあります。","Selamat datang di pelabuhan induk. Program ini punya lima jalur; memilih jalur berarti memilih lintasan industri.","Chào mừng tới cảng mẹ. Khoa có năm hướng; chọn hướng là chọn trước một tuyến ngành.","Welcome to the home port of the archipelago. This department has five tracks, from corporate finance to Korean cultural industries, so picking a track means picking an industry path first.","Добро пожаловать в родной порт архипелага. На кафедре пять направлений, от корпоративных финансов до креативных индустрий Кореи, и выбор направления это прежде всего выбор отраслевого пути."),
  h:L("提示：四個申請入學組別各招9名。","提示：四个申请入学组别各招9名。","ヒント：申請入学の4コースは各9名。","Petunjuk: empat jalur aplikasi masing-masing 9 kursi.","Gợi ý: bốn hướng xét hồ sơ mỗi hướng 9 chỉ tiêu.","Hint: each of the four application-based admission tracks takes 9 students.","Подсказка: по каждому из четырёх направлений приёма по заявлению набирают 9 человек.")},
 {n:L("大四學姐阿萱","大四学姐阿萱","4年生の先輩シュエン","Senior tingkat akhir A-Xuan","Chị khóa trên A-Huyên","Senior student A-Xuan","Студентка четвёртого курса А-Сюань"),
  s:L("我讀日韓商務與貿易組，英日語四技能是每天的事。系上把語言、專業與電子商務綁在一起教。","我读日韩商务与贸易组，英日语四技能是每天的事。系上把语言、专业与电子商务绑在一起教。","私は日韓ビジネス貿易コース。英語と日本語の四技能は毎日の課題です。学科は言語と専門と電子商取引を束ねて教えます。","Saya di jalur Bisnis Jepang-Korea; empat keterampilan bahasa Inggris dan Jepang jadi rutinitas. Program mengikat bahasa, keahlian, dan e-commerce.","Em học hướng Thương mại Nhật-Hàn; bốn kỹ năng tiếng Anh và tiếng Nhật là việc mỗi ngày. Khoa dạy gắn ngôn ngữ, chuyên môn và thương mại điện tử.","I am in the Japan-Korea Business and Trade track, where the four skills in English and Japanese are daily work. The department teaches languages, professional subjects and e-commerce as one package.","Я учусь на направлении японско-корейского бизнеса и торговли, и четыре языковых навыка в английском и японском это ежедневная работа. Кафедра преподаёт языки, специальность и электронную торговлю вместе."),
  h:L("提示：系所特色之一是重視電子商務應用與資訊技術。","提示：系所特色之一是重视电子商务应用与信息技术。","ヒント：特色の一つは電子商取引と情報技術の重視。","Petunjuk: salah satu ciri adalah menekankan e-commerce dan TI.","Gợi ý: một đặc điểm là chú trọng thương mại điện tử và công nghệ thông tin.","Hint: one hallmark of the department is its emphasis on e-commerce applications and information technology.","Подсказка: одна из особенностей кафедры это внимание к приложениям электронной торговли и информационным технологиям.")},
 {n:L("招生組同仁","招生组同仁","入試担当","Staf penerimaan","Cán bộ tuyển sinh","Admissions office staff","Сотрудник приёмной комиссии"),
  s:L("除了申請入學，還有繁星推薦、考試分發、四技甄選、特殊選才、身障甄試與運動績優。分數不是唯一的門。","除了申请入学，还有繁星推荐、考试分发、四技甄选、特殊选才、身障甄试与运动绩优。分数不是唯一的门。","申請入学のほか、繁星推薦、試験配分、四技選抜、特別選抜、障害学生選抜、スポーツ推薦があります。点数だけが門ではありません。","Selain jalur aplikasi ada rekomendasi bintang, penempatan ujian, seleksi vokasi, bakat khusus, disabilitas, dan atlet. Nilai bukan satu-satunya pintu.","Ngoài xét hồ sơ còn có tiến cử, phân bổ theo kỳ thi, tuyển sinh kỹ thuật, tuyển chọn đặc biệt, diện khuyết tật và vận động viên. Điểm số không phải cánh cửa duy nhất.","Besides application-based admission, there are Star Program recommendations, exam placement, four-year technical program selection, special talent admission, admission tests for students with disabilities and athletic distinction. Scores are not the only door.","Кроме приёма по заявлению есть рекомендации по программе Star, распределение по экзаменам, отбор в четырёхлетние технические программы, приём по особым талантам, экзамены для абитуриентов с инвалидностью и приём за спортивные достижения. Баллы это не единственная дверь."),
  h:L("提示：繁星推薦共6名。","提示：繁星推荐共6名。","ヒント：繁星推薦は計6名。","Petunjuk: rekomendasi bintang total 6 kursi.","Gợi ý: diện tiến cử tổng cộng 6 chỉ tiêu.","Hint: the Star Program recommendation quota is 6.","Подсказка: по программе Star всего 6 мест.")}],
 qs:[
 {q:L("國際企業管理學系在哪個校區？","国际企业管理学系在哪个校区？","国際企業管理学科はどのキャンパス？","Di kampus mana program IBM berada?","Khoa Quản trị Kinh doanh Quốc tế ở cơ sở nào?","Which campus is the International Business Management Department on?","На каком кампусе находится кафедра международного управления бизнесом?"),

 {q:L("下列何者不是本系的學程組別？","下列何者不是本系的学程组别？","本学科のコースでないものは？","Mana yang bukan jalur program ini?","Đâu không phải hướng chuyên ngành của khoa?","Which of the following is not a track in this department?","Что из перечисленного не является направлением кафедры?"),
  o:[L("外匯數位金融組","外汇数字金融组","外国為替デジタル金融コース","Valas dan Keuangan Digital","Ngoại hối và Tài chính Số","Foreign Exchange and Digital Finance track","Направление валютных операций и цифровых финансов"),L("品牌行銷企劃組","品牌行销企划组","ブランドマーケティング企画コース","Perencanaan Merek dan Pemasaran","Hoạch định Thương hiệu và Tiếp thị","Brand Marketing and Planning track","Направление брендового маркетинга и планирования"),L("核能工程組","核能工程组","原子力工学コース","Teknik Nuklir","Kỹ thuật Hạt nhân","Nuclear Engineering track","Направление ядерной инженерии")],a:2},
 {q:L("114學年度每學期學費為多少？","114学年度每学期学费为多少？","2025年度の1学期の学費は？","Berapa biaya kuliah per semester 2025?","Học phí mỗi học kỳ năm 2025 là bao nhiêu?","What is the tuition per semester in academic year 114 (2025-2026)?","Какова плата за обучение за семестр в 114 учебном году (2025-2026)?"),
  o:[L("35,938元","35,938元","35,938元","NT$35.938","35.938","NT$35,938","35 938 тайв. долл."),L("25,938元","25,938元","25,938元","NT$25.938","25.938","NT$25,938","25 938 тайв. долл."),L("45,938元","45,938元","45,938元","NT$45.938","45.938","NT$45,938","45 938 тайв. долл.")],a:0}]},
sec:{npcs:[
 {n:L("資安工程師","网络安全工程师","セキュリティエンジニア","Insinyur Keamanan Siber","Kỹ sư An ninh mạng","Cybersecurity Engineer","Инженер по кибербезопасности"),s:L("這次憑證問題出在產製端，不是外部入侵，各機關要做的是換發。","这次证书问题出在生成端，不是外部入侵，各机关要做的是更换。","今回の証明書の問題は発行側にあり、外部侵入ではありません。各機関がすべきことは交換です。","Masalah sertifikat kali ini ada di sisi penerbitan, bukan peretasan. Tugas tiap instansi adalah menggantinya.","Vấn đề chứng thư lần này nằm ở khâu tạo, không phải xâm nhập từ ngoài. Các cơ quan cần làm là thay mới.","This certificate problem lies with issuing, not an outside intrusion. What agencies need to do is replace them.","Проблема сертификатов возникла при выпуске, а не из-за внешнего взлома. Ведомствам нужно их заменить."),h:L("數位發展部稱，問題憑證由台灣網路認證公司核發，各機關應於11月6日前完成更新。","数字发展部称，问题证书由台湾网络认证公司签发，各机关应于11月6日前完成更新。","数位発展部によると、問題の証明書はTWCAの発行で、各機関は11月6日までに更新する必要がある。","Kementerian Urusan Digital: sertifikat bermasalah diterbitkan TWCA, dan tiap instansi harus memperbarui sebelum 6 November.","Bộ Phát triển Số: chứng thư có vấn đề do TWCA cấp, các cơ quan phải cập nhật trước 6/11.","The Ministry of Digital Affairs says TWCA issued the affected certificates, and agencies must update by November 6.","Минцифры: проблемные сертификаты выпустила TWCA, ведомства должны обновить их до 6 ноября.")},
 {n:L("海纜維運人員","海缆运维人员","海底ケーブル保守員","Petugas Pemeliharaan Kabel Laut","Nhân viên Vận hành Cáp biển","Subsea Cable Technician","Специалист по обслуживанию подводных кабелей"),s:L("障礙頁只列纜名、障礙日期和預計修復日，成因沒有寫。","故障页只列缆名、故障日期和预计修复日，成因没有写。","障害ページにあるのはケーブル名、障害日、修復予定日だけで、原因は書かれていません。","Halaman gangguan hanya memuat nama kabel, tanggal gangguan, dan target perbaikan; penyebabnya tidak ditulis.","Trang sự cố chỉ ghi tên cáp, ngày sự cố và ngày dự kiến sửa xong, không ghi nguyên nhân.","The fault page lists only cable name, fault date and expected repair date. It does not give a cause.","На странице повреждений указаны только название кабеля, дата и ожидаемый срок ремонта. Причины нет."),h:L("11月1日新增障礙的臺金二號，連接臺灣本島與金門。","11月1日新增故障的台金二号，连接台湾本岛与金门。","11月1日に障害が加わった台金2号は、台湾本島と金門を結ぶ。","Taiwan-Kinmen No. 2, yang gangguannya bertambah pada 1 November, menghubungkan pulau utama Taiwan dengan Kinmen.","Tuyến Đài Loan-Kim Môn số 2, có sự cố mới ngày 1/11, nối đảo chính Đài Loan với Kim Môn.","Taiwan-Kinmen No. 2, with the new November 1 fault, links Taiwan's main island and Kinmen.","Кабель Тайвань-Цзиньмэнь № 2, повреждённый 1 ноября, соединяет основной остров Тайваня с Цзиньмэнем.")},
 {n:L("航線規劃專員","航线规划专员","路線計画担当者","Staf Perencanaan Rute","Chuyên viên Quy hoạch Đường bay","Route Planning Officer","Специалист по планированию маршрутов"),s:L("巴基斯坦空域許可到明年3月27日，之後還要再申請夏季班表。","巴基斯坦空域许可到明年3月27日，之后还要再申请夏季时刻表。","パキスタン空域の許可は来年3月27日までで、その後は夏ダイヤを改めて申請します。","Izin wilayah udara Pakistan berlaku hingga 27 Maret tahun depan, lalu jadwal musim panas harus diajukan lagi.","Giấy phép không phận Pakistan đến 27/3 năm sau, sau đó phải xin lại lịch mùa hè.","The Pakistan airspace approval runs to March 27 next year; after that the summer schedule must be applied for.","Разрешение Пакистана действует до 27 марта следующего года, затем нужна заявка на летнее расписание."),h:L("交通部稱，10月28日至2027年3月27日為國際航空所稱冬季班表期間，航路每季提出申請。","交通部称，10月28日至2027年3月27日为国际航空所称冬季航班时刻表期间，航路每季提出申请。","交通部によると、10月28日から2027年3月27日までは国際航空でいう冬ダイヤ期間で、航路は四半期ごとに申請する。","Kementerian Transportasi: 28 Oktober hingga 27 Maret 2027 adalah periode jadwal musim dingin penerbangan internasional; rute diajukan tiap musim.","Bộ Giao thông: từ 28/10 đến 27/3/2027 là kỳ lịch bay mùa đông của hàng không quốc tế; đường bay nộp đơn theo mùa.","The transport ministry says October 28 to March 27, 2027 is the international winter schedule period, with routes applied for each season.","Минтранс: с 28 октября по 27 марта 2027 года идёт международное зимнее расписание, маршруты подаются посезонно.")},
 ],

nuc:{npcs:[
 {n:L("運轉值班主管","运行值班主管","運転当直長","Kepala Shift Operasi","Trưởng ca vận hành","Operations Shift Supervisor","Начальник смены эксплуатации"),s:L("古里3、4號機拿到的是繼續運轉的核准，不是明天就能開機。兩部機組目前都沒有運轉。","古里3、4号机拿到的是继续运行的批准，不是明天就能开机。两台机组目前都没有运行。","古里3・4号機が得たのは継続運転の承認で、明日すぐ動かせるわけではありません。両機とも現在は運転していません。","Kori 3 dan 4 memperoleh persetujuan untuk terus beroperasi, bukan berarti bisa dinyalakan besok. Keduanya saat ini belum beroperasi.","Kori 3 và 4 nhận được chấp thuận tiếp tục vận hành, không có nghĩa là ngày mai có thể khởi động. Hiện cả hai đều chưa vận hành.","Kori 3 and 4 received approval to keep operating, which does not mean they can start tomorrow. Neither unit is running now.","Кори-3 и Кори-4 получили одобрение на продолжение работы, но это не значит, что их можно запустить завтра. Сейчас оба блока не работают."),h:L("核子安全針對意外與失效。KHNP計畫2027年上半年重啟古里3、4號機，這是業者計畫，不是管制期日。","核安全针对意外与失效。KHNP计划2027年上半年重启古里3、4号机，这是业者计划，不是监管期限。","原子力安全は事故と故障を対象とします。KHNPは古里3・4号機を2027年上半期に再起動する計画ですが、これは事業者の計画で規制上の期日ではありません。","Keselamatan nuklir menangani kecelakaan dan kegagalan. KHNP merencanakan restart Kori 3 dan 4 pada paruh pertama 2027; ini rencana operator, bukan tenggat regulator.","An toàn hạt nhân nhắm tới sự cố và hỏng hóc. KHNP dự kiến khởi động lại Kori 3 và 4 vào nửa đầu năm 2027; đây là kế hoạch doanh nghiệp, không phải thời hạn quản lý.","Nuclear safety addresses accidents and failures. KHNP plans to restart Kori 3 and 4 in the first half of 2027; that is an operator plan, not a regulatory date.","Ядерная безопасность касается аварий и отказов. KHNP планирует перезапуск Кори-3 и Кори-4 в первой половине 2027 года; это план оператора, а не срок регулятора.")},
 {n:L("電廠保安主管","电厂安保主管","発電所セキュリティ管理者","Kepala Keamanan Pembangkit","Trưởng bộ phận an ninh nhà máy","Plant Security Manager","Руководитель физической защиты станции"),s:L("巴拉卡3號機的廠外電源喪失起因於無人機攻擊。IAEA任務認定應處有效，也建議強化安全與保安措施的整合。","巴拉卡3号机的厂外电源丧失起因于无人机攻击。IAEA任务认定应对有效，也建议加强安全与安保措施的整合。","バラカ3号機の外部電源喪失の原因は無人機攻撃でした。IAEA調査団は対応を有効と認定し、安全とセキュリティの措置の統合強化も勧告しました。","Hilangnya daya luar lokasi di Barakah 3 berawal dari serangan drone. Misi IAEA menilai respons efektif dan juga merekomendasikan penguatan integrasi langkah keselamatan dan keamanan.","Việc Barakah 3 mất điện ngoài nhà máy bắt nguồn từ tấn công bằng drone. Phái đoàn IAEA đánh giá ứng phó có hiệu quả và cũng khuyến nghị tăng cường tích hợp các biện pháp an toàn và an ninh.","The loss of off-site power at Barakah 3 began with a drone attack. The IAEA mission found the response effective and also recommended stronger integration of safety and security measures.","Потеря внешнего электроснабжения на Барака-3 началась с атаки дронов. Миссия МАГАТЭ признала действия эффективными и рекомендовала усилить интеграцию мер безопасности и физической защиты."),h:L("核子保安針對惡意行為者。東海第二的特定重大事故等對處施設，規範依據是故意行為，所以晨報歸入保安。","核安保针对恶意行为者。东海第二的特定重大事故等应对设施，规范依据是故意行为，所以晨报归入安保。","核セキュリティは悪意ある行為者を対象とします。東海第二の特定重大事故等対処施設は規範的根拠が故意の行為なので、朝刊はセキュリティに分類しています。","Keamanan nuklir menangani pelaku jahat. Fasilitas penanganan kecelakaan berat tertentu di Tokai 2 berdasar pada tindakan disengaja, sehingga Brief menggolongkannya ke keamanan.","An ninh hạt nhân nhắm tới tác nhân ác ý. Cơ sở ứng phó tai nạn nghiêm trọng đặc định ở Tokai 2 có căn cứ quy phạm là hành vi cố ý, nên Bản tin xếp vào an ninh.","Nuclear security addresses malicious actors. Tokai 2's specified severe accident response facility has intentional acts as its normative basis, so the Brief files it under security.","Физическая ядерная безопасность касается злоумышленников. Нормативная основа объекта реагирования на особые тяжёлые аварии на Токай-2 связана с умышленными действиями, поэтому бюллетень относит его к физической защите.")},
 {n:L("保防視察員","保障核查员","保障措置査察官","Inspektur Safeguards","Thanh sát viên","Safeguards Inspector","Инспектор по гарантиям"),s:L("日本擬為六ヶ所再處理設施新設因應IAEA 24小時查核的公的機關，概要案的意見公募到11月27日。","日本拟为六ヶ所再处理设施新设应对IAEA 24小时核查的公共机关，概要案公开征求意见至11月27日。","日本は六ヶ所再処理施設のため、IAEAの24時間査察に対応する公的機関の新設を検討しており、概要案の意見公募は11月27日までです。","Jepang berencana membentuk badan publik baru bagi fasilitas pemrosesan ulang Rokkasho untuk menangani inspeksi IAEA 24 jam; konsultasi publik draf berlangsung hingga 27 November.","Nhật Bản dự kiến lập cơ quan công mới cho cơ sở tái chế Rokkasho để ứng phó thanh sát 24 giờ của IAEA; việc lấy ý kiến về dự thảo kéo dài đến ngày 27 tháng 11.","Japan proposes a new public body for the Rokkasho reprocessing facility to handle 24-hour IAEA inspections; public comment on the draft runs to November 27.","Япония предлагает новый государственный орган для завода в Роккасё, чтобы обеспечить 24-часовые инспекции МАГАТЭ; обсуждение проекта идёт до 27 ноября."),h:L("核子保防針對國家移作他用，判準來源是保防協定；核子保安的判準來源則是國家威脅評估（DBT）。","核保障针对国家移作他用，判断依据是保障协定；核安保的判断依据则是国家威胁评估（DBT）。","保障措置は国家による転用を対象とし、判断基準は保障措置協定です。核セキュリティの判断基準は国の脅威評価（DBT）です。","Safeguards nuklir menangani pengalihan oleh negara, dengan acuan perjanjian safeguards; acuan keamanan nuklir adalah penilaian ancaman nasional (DBT).","Thanh sát hạt nhân nhắm tới việc quốc gia chuyển đổi mục đích sử dụng, căn cứ là hiệp định thanh sát; căn cứ của an ninh hạt nhân là đánh giá mối đe dọa quốc gia (DBT).","Nuclear safeguards address diversion by states and rest on safeguards agreements; nuclear security rests on national threat assessment (DBT).","Ядерные гарантии касаются переключения материалов государством и основаны на соглашениях о гарантиях; физическая ядерная безопасность основана на национальной оценке угроз (DBT).")}
 ],
 qs:[
 {q:L("核子保防的判準來源是什麼？","核保障的判断依据是什么？","保障措置の判断基準は何ですか。","Apa acuan penilaian safeguards nuklir?","Căn cứ của thanh sát hạt nhân là gì?","What is the basis for judging nuclear safeguards?","Что служит основой для ядерных гарантий?"),

 {q:L("古里3、4號機獲准繼續運轉後，KHNP計畫何時重啟？","古里3、4号机获准继续运行后，KHNP计划何时重启？","古里3・4号機の継続運転承認後、KHNPはいつ再起動を計画していますか。","Setelah Kori 3 dan 4 disetujui beroperasi lagi, kapan KHNP merencanakan restart?","Sau khi Kori 3 và 4 được chấp thuận tiếp tục vận hành, KHNP dự kiến khởi động lại khi nào?","After Kori 3 and 4 were approved to keep operating, when does KHNP plan to restart them?","Когда KHNP планирует перезапуск Кори-3 и Кори-4 после одобрения продолжения работы?"),

 {q:L("晨報為何把東海第二的特定重大事故等對處施設工程歸入核子保安？","晨报为何把东海第二的特定重大事故等应对设施工程归入核安保？","朝刊はなぜ東海第二の特定重大事故等対処施設の工事を核セキュリティに分類したのですか。","Mengapa Brief menggolongkan pekerjaan fasilitas penanganan kecelakaan berat tertentu di Tokai 2 ke keamanan nuklir?","Vì sao Bản tin xếp công trình cơ sở ứng phó tai nạn nghiêm trọng đặc định ở Tokai 2 vào an ninh hạt nhân?","Why does the Brief file Tokai 2's specified severe accident response facility works under nuclear security?","Почему бюллетень относит работы на объекте реагирования на особые тяжёлые аварии на Токай-2 к физической ядерной безопасности?"),
  o:[L("規範依據是地震與海嘯等自然事件","规范依据是地震与海啸等自然事件","規範的根拠が地震や津波などの自然事象だから","Dasar normanya peristiwa alam seperti gempa dan tsunami","Căn cứ quy phạm là sự kiện tự nhiên như động đất và sóng thần","Its normative basis is natural events such as earthquakes and tsunamis","Нормативная основа связана с природными явлениями, такими как землетрясения и цунами"),L("規範依據是保防協定","规范依据是保障协定","規範的根拠が保障措置協定だから","Dasar normanya perjanjian safeguards","Căn cứ quy phạm là hiệp định thanh sát","Its normative basis is a safeguards agreement","Нормативная основа связана с соглашением о гарантиях"),L("規範依據是故意行為","规范依据是故意行为","規範的根拠が故意の行為だから","Dasar normanya tindakan disengaja","Căn cứ quy phạm là hành vi cố ý","Its normative basis is intentional acts","Нормативная основа связана с умышленными действиями")],a:2}

mil:{npcs:[
 {n:L("海巡值勤員","海巡值勤员","海巡当直員","Petugas jaga penjaga pantai","Nhân viên trực tuần duyên","Coast guard duty officer","Дежурный береговой охраны"),s:L("中央社報導的11月2日金門案例，海巡署調派4艘巡防艇，對4艘中國海警採一對一併航監控。","中央社报导的11月2日金门案例，海巡署调派4艘巡防艇，对4艘中国海警采一对一并航监控。","中央社が報じた11月2日の金門の事例では、海巡署は巡視艇4隻を派遣し、中国海警4隻を1対1で並走監視しました。","Dalam kasus Kinmen 2 November yang dilaporkan CNA, CGA mengerahkan 4 kapal patroli untuk membayangi 4 kapal penjaga pantai China satu lawan satu.","Trong vụ Kim Môn ngày 2/11 do CNA đưa tin, Cục Tuần duyên điều 4 tàu tuần tra bám sát một đối một 4 tàu hải cảnh Trung Quốc.","In the Nov 2 Kinmen case reported by CNA, the CGA sent 4 patrol boats to shadow 4 China Coast Guard ships one-on-one.","В случае у Цзиньмэня 2 ноября, о котором сообщило ЦАГ, береговая охрана направила 4 катера для сопровождения 4 судов береговой охраны КНР один к одному."),h:L("提示：海巡署調派的巡防艇為4艘，4艘海警船於下午5時3分航出。","提示：海巡署调派的巡防艇为4艘，4艘海警船于下午5时3分航出。","ヒント：海巡署が派遣した巡視艇は4隻で、海警4隻は午後5時3分に退出しました。","Petunjuk: CGA mengerahkan 4 kapal patroli, dan 4 kapal penjaga pantai China keluar pukul 17.03.","Gợi ý: Cục Tuần duyên điều 4 tàu tuần tra, 4 tàu hải cảnh rời đi lúc 17:03.","Hint: the CGA sent 4 patrol boats, and the 4 coast guard ships left at 17:03.","Подсказка: береговая охрана направила 4 катера, а 4 судна КНР вышли в 17:03.")},
 {n:L("軍事數據分析員","军事数据分析员","軍事データ分析員","Analis data militer","Nhà phân tích dữ liệu quân sự","Military data analyst","Аналитик военных данных"),s:L("國防部的數字要逐項看。11月2日通報的公務船6艘，是前七日均值2.86艘的2.10倍，但晨報不據此推論侵擾強度。","国防部的数字要逐项看。11月2日通报的公务船6艘，是前七日均值2.86艘的2.10倍，但晨报不据此推论侵扰强度。","国防部の数字は項目ごとに見る必要があります。11月2日通報の公船6隻は過去7日平均2.86隻の2.10倍ですが、朝報はここから強度を推論しません。","Angka Kemhan harus dilihat per pos. 6 kapal dinas pada laporan 2 November adalah 2,10 kali rata-rata tujuh hari (2,86), tetapi buletin tidak menyimpulkan intensitas darinya.","Số liệu của Bộ Quốc phòng cần xem từng mục. 6 tàu công vụ trong thông báo 2/11 gấp 2,10 lần trung bình 7 ngày (2,86), nhưng bản tin không suy ra cường độ từ đó.","MND figures should be read item by item. The 6 official ships in the Nov 2 report were 2.10 times the seven-day average of 2.86, but the brief does not infer intensity from that.","Данные Минобороны нужно читать по пунктам. 6 служебных судов в сводке от 2 ноября в 2,10 раза выше среднего за семь дней (2,86), но сводка не делает из этого вывод об интенсивности."),h:L("提示：11月2日通報共機為19架次，11月1日通報為32架次。","提示：11月2日通报共机为19架次，11月1日通报为32架次。","ヒント：11月2日の通報は中国軍機19機次、11月1日の通報は32機次です。","Petunjuk: laporan 2 November mencatat 19 sortie pesawat PLA, laporan 1 November 32 sortie.","Gợi ý: thông báo 2/11 ghi 19 lượt máy bay PLA, thông báo 1/11 ghi 32 lượt.","Hint: the Nov 2 report listed 19 PLA aircraft sorties, and the Nov 1 report listed 32.","Подсказка: в сводке от 2 ноября 19 вылетов самолётов НОАК, в сводке от 1 ноября 32.")},
 {n:L("防務記者","防务记者","防衛担当記者","Jurnalis pertahanan","Phóng viên quốc phòng","Defense reporter","Военный корреспондент"),s:L("黃岩島這次配油，菲律賓海岸防衛隊有它的說法。中方沒有說明原因，我就不替它推定。","黄岩岛这次配油，菲律宾海岸防卫队有它的说法。中方没有说明原因，我就不替它推定。","スカボロー礁での今回の給油について、フィリピン沿岸警備隊には独自の説明があります。中国側は理由を説明しておらず、私が推定することはしません。","Soal pengisian bahan bakar di Scarborough kali ini, Penjaga Pantai Filipina punya keterangannya sendiri. Pihak Tiongkok tidak menjelaskan alasannya, jadi saya tidak menduganya.","Về đợt tiếp dầu lần này ở bãi cạn Scarborough, Lực lượng Bảo vệ Bờ biển Philippines có cách nói của mình. Phía Trung Quốc không nêu lý do, nên tôi không suy đoán thay.","On this refueling at Scarborough Shoal, the Philippine Coast Guard has given its account. China has not explained its reasons, so I will not guess at them.","Об этой заправке у отмели Скарборо береговая охрана Филиппин дала своё описание. Китай причин не объяснил, поэтому я не строю догадок."),h:L("提示：菲海岸防衛隊稱，10月27日中方船舶在進路水域未干擾；7月同類任務中，中國海警曾施放水砲。","提示：菲海岸防卫队称，10月27日中方船舶在进路水域未干扰；7月同类任务中，中国海警曾施放水炮。","ヒント：フィリピン沿岸警備隊によると、10月27日に中国船は進路の水域にいたが妨害しなかった。7月の同種任務では中国海警が放水した。","Petunjuk: menurut Penjaga Pantai Filipina, pada 27 Oktober kapal Tiongkok berada di perairan jalur masuk tetapi tidak mengganggu; pada misi serupa bulan Juli, Penjaga Pantai Tiongkok menembakkan meriam air.","Gợi ý: Theo Lực lượng Bảo vệ Bờ biển Philippines, ngày 27/10 tàu Trung Quốc ở vùng nước lối vào nhưng không cản trở; trong nhiệm vụ tương tự tháng 7, Hải cảnh Trung Quốc từng phun vòi rồng.","Hint: The Philippine Coast Guard says Chinese vessels stayed in the approach waters without interfering on 27 October; on a similar July mission, the China Coast Guard used water cannons.","Подсказка: по словам береговой охраны Филиппин, 27 октября китайские суда находились в водах на подходе, но не мешали; в аналогичной июльской миссии береговая охрана Китая применяла водомёты.")}
 ],

con:{npcs:[
 {n:L("區域研究員","区域研究员","地域研究員","Peneliti Kawasan","Nhà nghiên cứu khu vực","Regional Researcher","Региональный исследователь"),s:L("安古爾阿達10月27日的交火，塔利班國防部與巴基斯坦新聞廣播部各有說法，沒有第三方核實，我只能並列記錄。","安古尔阿达10月27日的交火，塔利班国防部与巴基斯坦新闻广播部各有说法，没有第三方核实，我只能并列记录。","アングール・アッダの10月27日の交戦は、タリバン国防省とパキスタン情報放送省で主張が異なり、第三者の確認もありません。私は併記するしかありません。","Soal baku tembak Angoor Adda 27 Oktober, Kementerian Pertahanan Taliban dan Kementerian Informasi dan Penyiaran Pakistan punya versi masing-masing tanpa verifikasi pihak ketiga. Saya hanya bisa mencatat keduanya berdampingan.","Về vụ đấu súng ở Angoor Adda ngày 27/10, Bộ Quốc phòng Taliban và Bộ Thông tin và Phát thanh Pakistan mỗi bên một cách nói, không có bên thứ ba xác minh. Tôi chỉ có thể ghi song song.","On the October 27 clash at Angoor Adda, the Taliban defense ministry and Pakistan's information and broadcasting ministry each have their own account, with no third-party verification. All I can do is record them side by side.","О перестрелке в Ангур-Адде 27 октября у Минобороны талибов и Министерства информации и вещания Пакистана свои версии, третья сторона их не подтвердила. Я могу лишь записать их рядом."),h:L("看中亞也要看文件：美國與中亞五國10月19日的撒馬爾罕聯合聲明未提阿富汗，重點是跨裏海路線與關鍵礦產。","看中亚也要看文件：美国与中亚五国10月19日的撒马尔罕联合声明未提阿富汗，重点是跨里海路线与关键矿产。","中央アジアは文書も見てください。米国と中央アジア5か国の10月19日サマルカンド共同声明はアフガニスタンに触れず、重点はカスピ海横断ルートと重要鉱物です。","Lihat juga dokumennya untuk Asia Tengah: pernyataan bersama AS dan lima negara Asia Tengah di Samarkand 19 Oktober tidak menyebut Afghanistan, fokusnya rute lintas Kaspia dan mineral kritis.","Xem Trung Á cũng phải xem văn bản: tuyên bố chung của Mỹ và năm nước Trung Á tại Samarkand ngày 19/10 không nhắc Afghanistan, trọng tâm là tuyến xuyên Caspi và khoáng sản thiết yếu.","For Central Asia, read the documents too: the October 19 Samarkand joint statement by the US and five Central Asian states omits Afghanistan and focuses on trans-Caspian routes and critical minerals.","По Центральной Азии смотрите и документы: совместное заявление США и пяти стран региона в Самарканде 19 октября не упоминает Афганистан, в центре транскаспийские маршруты и критически важные минералы.")},
 {n:L("入境審查官員","入境审查官员","入国審査官","Petugas Imigrasi","Cán bộ xuất nhập cảnh","Immigration Officer","Сотрудник иммиграционной службы"),s:L("北馬里亞納群島的免簽方案一暫停，既有旅行許可一律撤銷，恢復時程也還沒訂，櫃檯前要先把這點講清楚。","北马里亚纳群岛的免签方案一暂停，既有旅行许可一律撤销，恢复时程也还没订，柜台前要先把这点讲清楚。","北マリアナ諸島のビザ免除制度が停止されると、既存の旅行許可はすべて取り消され、再開時期も未定です。窓口ではまずこの点を説明します。","Begitu program bebas visa Kepulauan Mariana Utara ditangguhkan, izin perjalanan yang ada dicabut seluruhnya dan jadwal pemulihan belum ditetapkan. Di loket, hal ini harus dijelaskan lebih dulu.","Khi chương trình miễn thị thực của quần đảo Bắc Mariana tạm ngừng, mọi giấy phép đi lại hiện có đều bị thu hồi và chưa định lịch khôi phục. Tại quầy, phải nói rõ điều này trước.","Once the Northern Mariana Islands visa waiver is suspended, all existing travel authorizations are revoked and no resumption date is set. At the counter, that has to be made clear first.","Как только безвизовая программа Северных Марианских островов приостановлена, все действующие разрешения на поездки отзываются, а срок возобновления не назначен. У стойки это нужно объяснить в первую очередь."),h:L("暫停的是對中國公民的免簽方案，自美東時間10月30日14時生效。","暂停的是对中国公民的免签方案，自美东时间10月30日14时生效。","停止されるのは中国国民向けのビザ免除制度で、米東部時間10月30日14時に発効します。","Yang ditangguhkan adalah program bebas visa bagi warga Tiongkok, berlaku pukul 14.00 waktu bagian timur AS tanggal 30 Oktober.","Chương trình bị tạm ngừng là miễn thị thực cho công dân Trung Quốc, có hiệu lực lúc 14 giờ ngày 30/10 giờ miền Đông Mỹ.","What is suspended is the visa waiver for Chinese citizens, effective at 2 p.m. US Eastern Time on October 30.","Приостановлена безвизовая программа для граждан Китая, с 30 октября в 14:00 по восточному времени США.")},

let lang="tw";
try{const s=localStorage.getItem("sc-lang");if(s&&UI.brand[s])lang=s;}catch(e){}
const byId=Object.fromEntries(ISL.map(i=>[i.id,i]));
const totalItems=ISL.reduce((n,i)=>n+i.items.length,0);

const T=k=>UI[k][lang];

function applyLang(){
  document.documentElement.lang={tw:"zh-Hant",cn:"zh-Hans",ja:"ja",id:"id",vi:"vi",en:"en",ru:"ru"}[lang];
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=T(el.dataset.i)});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  renderLegend();renderLog();renderList();renderTime();
  ISL.forEach(i=>{const t=tagEls[i.id];if(t){t.firstChild.textContent=i.name[lang];t.lastChild.textContent=i.items.length+" "+T("items");}});
  document.getElementById("cert-name").placeholder=RPGUI.certname[lang];
  if(typeof updBar==="function")updBar();
  if(selected)openPanel(selected,false);
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("sc-lang",lang)}catch(e){}applyLang();}));

function renderLegend(){
  document.getElementById("legend").innerHTML=ISL.map(i=>`<span style="--c:${i.color}"><i></i>${i.name[lang]}</span>`).join("");
}
function allItems(){const a=[];ISL.forEach(i=>i.items.forEach(it=>a.push({isl:i,it})));a.sort((x,y)=>y.it.date.localeCompare(x.it.date));return a;}
function renderLog(){
  document.getElementById("log-body").innerHTML=allItems().map(({isl,it})=>`<div class="ln" style="--c:${isl.color}"><span class="d">${it.date.slice(5)}</span><button data-go="${isl.id}"><b>${isl.name[lang]}</b>${it.t[lang]}</button></div>`).join("");
}
function renderList(){
  document.getElementById("list-grid").innerHTML=ISL.map(i=>`<div class="card" style="--c:${i.color}"><h3>${i.name[lang]}</h3><div class="n">${i.tag[lang]} · ${i.items.length} ${T("items")}</div><p class="cd">${i.desc[lang]}</p><ul>${i.items.map(it=>`<li><span class="d">${it.date.slice(5)}</span><button data-go="${i.id}">${it.t[lang]}${it.k?`<em>${it.k[lang]}</em>`:""}</button></li>`).join("")}</ul></div>`).join("");
}
function renderTime(){
  document.getElementById("tl").innerHTML=allItems().map(({isl,it})=>`<div class="row" style="--c:${isl.color}"><span class="d">${it.date}</span><div class="t"><span class="isl">${isl.name[lang]}</span><button data-go="${isl.id}"><b>${it.t[lang]}</b></button></div></div>`).join("");
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;setView("3d");focusIsland(b.dataset.go);});

  const isl=byId[id];selected=id;
  panel.style.setProperty("--c",isl.color);

    <div class="meta"><span class="d">${it.date}</span>${it.src?`<span>${it.src}</span>`:""}</div>
    <h3>${it.t[lang]}</h3>${it.q?`<div class="quote"><b>${it.q.v}</b><span>${it.q.c}</span><i>${it.q.u}</i></div>`:""}<p>${it.b[lang]}</p>${it.k?`<p class="k"><span>${T("insight")}</span>${it.k[lang]}</p>`:""}
    ${it.links&&it.links.length?`<div class="links"><span class="src">${T("related")}</span>${it.links.map(l=>`<button data-go="${l}" style="--c:${byId[l].color}">${byId[l].name[lang]}</button>`).join("")}</div>`:""}

/* distant green mountains */
const mountains=new THREE.Group();scene.add(mountains);
(function(){const rnd=seeded(3);for(let i=0;i<26;i++){const a=i/26*Math.PI*2+rnd()*.2;const d=104+rnd()*26;const h=10+rnd()*14,w=14+rnd()*14;
  const g=new THREE.ConeGeometry(w,h,7);const shade=[0x3f9a5f,0x4caa6a,0x5bb875,0x3a8d58][i%4];const m=new THREE.Mesh(g,mat(shade,1));m.position.set(Math.cos(a)*d,h/2-1.2,Math.sin(a)*d);m.rotation.y=rnd()*6;mountains.add(m);

  for(let i=0;i<18;i++){const a=i/18*Math.PI*2+.1;const d=146+rnd()*28;const h=18+rnd()*22,w=24+rnd()*18;const m=new THREE.Mesh(new THREE.ConeGeometry(w,h,6),mat(0x2f7a4e,1));m.position.set(Math.cos(a)*d,h/2-1.2,Math.sin(a)*d);mountains.add(m);}

  meshes.forEach(m=>{const t=tagEls[m.userData.id];if(!t.classList.contains("on"))return;v3.set(m.position.x,m.position.y+4.0,m.position.z).project(camera);
    const x=(v3.x+1)/2*w,y=(1-v3.y)/2*h;t.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`;t.style.opacity=v3.z<1?"":"0";});
  renderer.render(scene,camera);requestAnimationFrame(frame);
}

const R={xp:0,done:{},stamps:{}};
try{const sv=JSON.parse(localStorage.getItem("sc-rpg")||"{}");if(sv&&sv.done){R.xp=sv.xp||0;R.done=sv.done||{};R.stamps=sv.stamps||{};}}catch(e){}
function saveR(){try{localStorage.setItem("sc-rpg",JSON.stringify(R))}catch(e){}}
const lvOf=x=>Math.min(5,1+Math.floor(x/60));
function rank(){return RPGUI.ranks[Math.min(4,lvOf(R.xp)-1)][lang];}
function stampCount(){return Object.keys(R.stamps).length;}
function updBar(){
  const lv=lvOf(R.xp),nxt=lv*60;
  document.getElementById("r-lv").textContent=RPGUI.lv[lang]+" "+lv+" · "+rank();
  document.getElementById("r-xp").textContent=R.xp+" "+RPGUI.xp[lang];
  document.getElementById("r-fill").style.width=(lv>=5?100:(R.xp%60)/60*100)+"%";
  document.getElementById("r-st").textContent="🏅 "+stampCount()+"/"+ISL.length;
  const ok=stampCount()>=ISL.length;
  const cb=document.getElementById("r-cert");cb.disabled=!ok;cb.textContent=ok?RPGUI.certgo[lang]:RPGUI.certneed[lang];
}
function addXP(n){R.xp+=n;saveR();updBar();}
function islDone(id){const d=R.done[id]||[];return d.length>=3;}
function checkStamp(id){if(islDone(id)&&!R.stamps[id]){R.stamps[id]=1;addXP(30);toast("🏅 "+byId[id].name[lang]+" · "+RPGUI.done[lang]);}saveR();updBar();}
let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2600);}
function renderRPG(id){
  if(!rpgOn)return"";
  const d=RPG[id];if(!d)return"";
  const done=R.done[id]||[];
  return `<div class="rpg">
    <div class="rpg-h">⚔️ ${RPGUI.mode[lang]} · ${done.length}/3</div>
    ${d.npcs.map((n,i)=>`<div class="npc"><div class="who">${["🧑‍🌾","🧑‍💼","🧑‍🔧"][i]} ${n.n[lang]}</div><p>${n.s[lang]}</p><p class="tip">💡 ${n.h[lang]}</p></div>`).join("")}
    ${d.qs.map((q,i)=>`<div class="qz${done.includes(i)?" ok":""}" data-q="${id}:${i}">
      <div class="qh">${RPGUI.quest[lang]} ${i+1}${done.includes(i)?" ✅":""}</div>
      <p>${q.q[lang]}</p>
      <div class="opts">${q.o.map((o,j)=>`<button data-ans="${id}:${i}:${j}">${o[lang]}</button>`).join("")}</div>
      <div class="fb"></div></div>`).join("")}
  </div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-ans]");if(!b)return;
  const [id,qi,ai]=b.dataset.ans.split(":");const q=RPG[id].qs[+qi];
  const box=b.closest(".qz"),fb=box.querySelector(".fb");
  if(+ai===q.a){
    const d=R.done[id]||(R.done[id]=[]);
    if(!d.includes(+qi)){d.push(+qi);addXP(10);fb.textContent="✅ "+RPGUI.right[lang]+" "+RPGUI.got[lang]+" 10 "+RPGUI.xp[lang];}
    else fb.textContent="✅ "+RPGUI.right[lang];
    box.classList.add("ok");box.querySelector(".qh").textContent=RPGUI.quest[lang]+" "+(+qi+1)+" ✅";
    saveR();checkStamp(id);
    const hd=document.querySelector(".rpg-h");if(hd)hd.textContent="⚔️ "+RPGUI.mode[lang]+" · "+(R.done[id]||[]).length+"/3";
  }else{fb.textContent="❌ "+RPGUI.wrong[lang];box.classList.add("bad");setTimeout(()=>box.classList.remove("bad"),500);}
});
let rpgOn=false;
document.getElementById("m-rpg").addEventListener("click",()=>{
  rpgOn=!rpgOn;document.getElementById("m-rpg").setAttribute("aria-pressed",String(rpgOn));
  document.getElementById("rbar").hidden=!rpgOn;syncBars();
  markers.visible=rpgOn;
  if(selected)openPanel(selected,false);
  if(rpgOn){updBar();toast("⚔️ "+RPGUI.mode[lang]+" ON");}
});
document.getElementById("r-cert").addEventListener("click",()=>{
  const nm=(document.getElementById("cert-name").value||"").trim();
  document.getElementById("cert-who").textContent=nm||RPGUI.defname[lang];
  document.getElementById("cert-rank").textContent=rank()+" · "+RPGUI.lv[lang]+" "+lvOf(R.xp);
  document.getElementById("cert-body").textContent=RPGUI.certtext[lang];
  document.getElementById("cert-stats").textContent=ISL.length+" "+RPGUI.stamp[lang]+" · "+(ISL.length*3)+" "+RPGUI.quest[lang]+" · "+R.xp+" "+RPGUI.xp[lang];
  document.getElementById("cert-date").textContent=new Date().toISOString().slice(0,10);
  document.getElementById("cert-stamps").innerHTML=ISL.map(i=>`<span style="--c:${i.color}">${i.name[lang]}</span>`).join("");
  document.getElementById("cert").hidden=false;
});
document.getElementById("cert-close").addEventListener("click",()=>{document.getElementById("cert").hidden=true;});

/* keep rbar and hint above the toolbar however it wraps */
function syncBars(){const st=document.documentElement.style,rb=document.getElementById("rbar");st.setProperty("--barh",document.getElementById("bar").offsetHeight+"px");st.setProperty("--rbarh",(rb.hidden?0:rb.offsetHeight+6)+"px");}
new ResizeObserver(syncBars).observe(document.getElementById("bar"));new ResizeObserver(syncBars).observe(document.getElementById("rbar"));syncBars();

document.getElementById("loading").hidden=true;
document.getElementById("go").addEventListener("click",()=>{document.getElementById("intro").classList.add("off");cam.targetR=homeR();});

applyLang();
