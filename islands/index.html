 name:L("研發與技術","研发与技术","研究開発・技術","R&D dan Teknologi","R&D và công nghệ","R&D and Technology","НИОКР и технологии"),
 tag:L("五管：研發管理","五管：研发管理","五管：研究開発管理","Lima fungsi: R&D","Năm chức năng: R&D","Five management functions: R&D management","Пять функций управления: управление НИОКР"),
 desc:L("研發管理是把技術變成競爭力：製程與產品開發、專利、產學合作、研發投入與回收。這座島看半導體先進製程、先進封裝、矽光子與新材料的最新進展。","研发管理是把技术变成竞争力：制程与产品开发、专利、产学合作、研发投入与回收。这座岛看半导体先进制程、先进封装、硅光子与新材料的最新进展。","研究開発管理は技術を競争力に変えることです。プロセスと製品開発、特許、産学連携、投資と回収。先端プロセス、先端パッケージング、シリコンフォトニクス、新材料の進展を見ます。","Manajemen R&D mengubah teknologi menjadi daya saing: proses dan produk, paten, kerja sama kampus, investasi dan hasil. Pulau ini mengamati node canggih, pengemasan canggih, silicon photonics, dan material baru.","Quản trị R&D biến công nghệ thành năng lực cạnh tranh: tiến trình và sản phẩm, bằng sáng chế, hợp tác trường-viện, đầu tư và thu hồi. Đảo này xem tiến trình tiên tiến, đóng gói tiên tiến, quang silicon và vật liệu mới.","R&D management turns technology into competitiveness: process and product development, patents, industry-academia collaboration, and R&D spending and returns. This island follows the latest progress in advanced semiconductor processes, advanced packaging, silicon photonics and new materials.","Управление НИОКР превращает технологии в конкурентоспособность: разработка техпроцессов и продуктов, патенты, сотрудничество с университетами, вложения в исследования и их отдача. Этот остров следит за новейшими достижениями в передовых полупроводниковых техпроцессах, передовой упаковке, кремниевой фотонике и новых материалах."),
 items:[
 {date:"2026-10-15",src:"股感",url:"https://www.stockfeel.com.tw/?p=277770",links:["tsmc"],t:L("台積電A14製程2027年試產、2028年量產，N2家族2027年產能倍增","台积电A14制程2027年试产、2028年量产，N2家族2027年产能倍增","TSMCのA14は2027年試作・2028年量産、N2は2027年に能力倍増","A14 TSMC uji 2027, massal 2028; kapasitas N2 berlipat 2027","A14 của TSMC thử 2027, hàng loạt 2028; năng lực N2 gấp đôi 2027","TSMC's A14 process goes to trial production in 2027 and volume production in 2028, while N2 family capacity doubles in 2027","Техпроцесс A14 у TSMC выйдет на пробное производство в 2027 году и на массовое в 2028 году, а мощности семейства N2 удвоятся в 2027 году"),b:L("2026年服務534家客戶、305種製程、12,682種產品。先進製程占晶圓營收79%：3奈米33%、5奈米28%、7奈米10%、2奈米8%。","2026年服务534家客户、305种制程、12,682种产品。先进制程占晶圆营收79%：3纳米33%、5纳米28%、7纳米10%、2纳米8%。","2026年は534社、305プロセス、12,682製品。先端プロセスは79%：3nm 33%、5nm 28%、7nm 10%、2nm 8%。","2026: 534 pelanggan, 305 proses, 12.682 produk. Node canggih 79%: 3nm 33%, 5nm 28%, 7nm 10%, 2nm 8%.","2026: 534 khách hàng, 305 tiến trình, 12.682 sản phẩm. Tiến trình tiên tiến 79%: 3nm 33%, 5nm 28%, 7nm 10%, 2nm 8%.","In 2026 it served 534 customers with 305 process technologies and 12,682 products. Advanced processes made up 79% of wafer revenue: 3nm 33%, 5nm 28%, 7nm 10% and 2nm 8%.","В 2026 году компания обслужила 534 заказчика, применяя 305 техпроцессов и выпуская 12 682 вида продукции. На передовые техпроцессы пришлось 79% выручки от пластин: 3 нм 33%, 5 нм 28%, 7 нм 10%, 2 нм 8%."),k:L("節點每兩年一代，研發支出只會更高。","节点每两年一代，研发支出只会更高。","2年ごとの世代交代で研究開発費は増える一方。","Satu generasi tiap dua tahun; belanja R&D hanya akan naik.","Hai năm một thế hệ; chi R&D chỉ có tăng.","A new node every two years means R&D spending can only go higher.","Новое поколение техпроцесса каждые два года означает, что расходы на НИОКР будут только расти.")},
 {date:"2026-10-15",src:"股感",url:"https://www.stockfeel.com.tw/?p=277770",links:["tsmc","prod"],t:L("CoWoS 5X尺寸量產良率優異，全球唯一；9X、14X開發中","CoWoS 5X尺寸量产良率优异，全球唯一；9X、14X开发中","CoWoS 5Xを量産し歩留まり良好、世界唯一。9X・14X開発中","CoWoS 5X massal dengan yield unggul, satu-satunya; 9X, 14X dikembangkan","CoWoS 5X sản xuất hàng loạt yield xuất sắc, duy nhất thế giới; 9X, 14X đang phát triển","CoWoS at 5X size is in volume production with excellent yield and is the only such capability in the world, while 9X and 14X are in development","CoWoS формата 5X находится в массовом производстве с превосходным выходом годных и остаётся единственным в мире, а версии 9X и 14X разрабатываются"),b:L("先進封裝仍供不應求，委外訂單陸續釋出，設備排程已到2027年；WMCM產能近三年也將倍數增長。","先进封装仍供不应求，委外订单陆续释出，设备排程已到2027年；WMCM产能近三年也将倍数增长。","先端パッケージングは供給不足が続き外注が放出、装置計画は2027年まで。WMCMも3年で倍増へ。","Pengemasan canggih masih kekurangan; alih daya dilepas; jadwal alat hingga 2027; kapasitas WMCM berlipat dalam tiga tahun.","Đóng gói tiên tiến vẫn thiếu; đơn gia công được giao; lịch thiết bị tới 2027; WMCM tăng gấp bội trong ba năm.","Advanced packaging is still in short supply, outsourced orders keep being released, and equipment schedules already run into 2027. WMCM capacity will also grow several times over in the next three years.","Передовая упаковка по-прежнему в дефиците, заказы постепенно передаются подрядчикам, а графики поставки оборудования заполнены уже до 2027 года. Мощности WMCM за ближайшие три года также вырастут в несколько раз."),k:L("封裝技術正在決定AI晶片的上限。","封装技术正在决定AI芯片的上限。","パッケージング技術がAIチップの上限を決めている。","Teknologi pengemasan menentukan batas chip AI.","Công nghệ đóng gói đang quyết định giới hạn của chip AI.","Packaging technology is what now sets the ceiling for AI chips.","Технологии упаковки сегодня задают предел для ИИ-чипов.")},
 {date:"2026-10-28",src:"DIGITIMES",url:"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000772700_XZ28KGOKLJ893A1FRR6DB",links:["prod"],t:L("景碩探索氮化鋁陶瓷載板核心，玻璃核心面臨脆性與可靠度挑戰","景硕探索氮化铝陶瓷载板核心，玻璃核心面临脆性与可靠度挑战","景碩が窒化アルミ基板コアを探索、ガラスコアは脆さと信頼性が課題","Kinsus jajaki inti keramik AlN; inti kaca hadapi kerapuhan dan keandalan","Kinsus thăm dò lõi gốm AlN; lõi thủy tinh gặp thách thức độ giòn và độ tin cậy","Kinsus explores aluminum nitride ceramic substrate cores as glass cores run into brittleness and reliability challenges","Kinsus изучает керамические сердечники подложек из нитрида алюминия, тогда как стеклянные сердечники сталкиваются с проблемами хрупкости и надёжности"),b:L("景碩研發副總在TPCA Show指出玻璃核心有材料優勢，但大型先進封裝需要另一條技術路線。美光則稱4F² DRAM只是神話，押注3D DRAM。","景硕研发副总在TPCA Show指出玻璃核心有材料优势，但大型先进封装需要另一条技术路线。美光则称4F² DRAM只是神话，押注3D DRAM。","景碩はTPCA Showでガラスコアの利点を認めつつ、大型先端パッケージには別路線が必要と説明。マイクロンは4F² DRAMを神話と呼び3D DRAMに賭ける。","Kinsus di TPCA Show: inti kaca unggul material, tetapi pengemasan besar butuh jalur lain. Micron sebut 4F² DRAM mitos, bertaruh pada 3D DRAM.","Kinsus tại TPCA Show: lõi thủy tinh có lợi thế vật liệu nhưng đóng gói lớn cần hướng khác. Micron gọi 4F² DRAM là huyền thoại, đặt cược 3D DRAM.","Kinsus's vice president for R&D said at the TPCA Show that glass cores have material advantages but that large advanced packages need a different technology path. Micron, for its part, calls 4F² DRAM a myth and is betting on 3D DRAM.","Вице-президент Kinsus по НИОКР заявил на выставке TPCA Show, что стеклянные сердечники обладают преимуществами по материалу, однако для крупной передовой упаковки нужен другой технологический путь. Micron же называет 4F² DRAM мифом и делает ставку на 3D DRAM."),k:L("材料路線分歧，研發押注開始分化。","材料路线分歧，研发押注开始分化。","材料路線が分岐し、研究開発の賭けが分かれ始めた。","Jalur material bercabang; taruhan R&D mulai berbeda.","Hướng vật liệu phân nhánh; đặt cược R&D bắt đầu khác nhau.","Material roadmaps are diverging, and R&D bets are starting to split apart.","Пути развития материалов расходятся, и ставки в НИОКР начинают расслаиваться.")},
 {date:"2026-10-21",src:"工商時報",url:"https://www.ctee.com.tw/news/20261022700046-430502",links:["ai","tsmc"],t:L("輝達與台積電COUPE製程的Spectrum-X CPO交換器進入量產","英伟达与台积电COUPE制程的Spectrum-X CPO交换机进入量产","NVIDIAとTSMCのCOUPEプロセスを用いたSpectrum-X CPOスイッチが量産入り","Sakelar CPO Spectrum-X dengan proses COUPE Nvidia dan TSMC masuk produksi massal","Bộ chuyển mạch CPO Spectrum-X dùng quy trình COUPE của Nvidia và TSMC vào sản xuất hàng loạt","Spectrum-X CPO switches on the Nvidia and TSMC COUPE process enter mass production","Коммутаторы Spectrum-X CPO на процессе COUPE от Nvidia и TSMC запущены в серию"),b:L("工商時報稱AI競賽已從搶晶片延伸到搶光通訊產能。COUPE讓矽光子元件與晶片緊密整合，縮短傳統PCB訊號路徑，提升高速傳輸品質。","工商时报称AI竞赛已从抢芯片延伸到抢光通信产能。COUPE让硅光子元件与芯片紧密整合，缩短传统PCB信号路径，提升高速传输质量。","工商時報は、AI競争がチップ争奪から光通信能力の争奪へ広がったとする。COUPEはシリコンフォトニクス部品とチップを緊密に統合し、従来のPCB信号経路を短縮して高速伝送の品質を高める。","Commercial Times: persaingan AI meluas dari berebut chip ke berebut kapasitas komunikasi optik. COUPE mengintegrasikan erat komponen fotonik silikon dengan chip, memperpendek jalur sinyal PCB dan meningkatkan kualitas transmisi cepat.","Theo Công thương Thời báo, cuộc đua AI đã lan từ giành chip sang giành công suất truyền thông quang. COUPE tích hợp chặt linh kiện quang tử silicon với chip, rút ngắn đường tín hiệu PCB và nâng chất lượng truyền tốc độ cao.","The Commercial Times says the AI race has spread from securing chips to securing optical communications capacity. COUPE tightly integrates silicon photonics components with the chip, shortening conventional PCB signal paths and improving high-speed transmission quality.","Commercial Times пишет, что гонка ИИ перешла от борьбы за чипы к борьбе за мощности оптической связи. COUPE тесно объединяет кремниевые фотонные компоненты с чипом, сокращая традиционные сигнальные пути PCB и повышая качество высокоскоростной передачи."),k:L("工商時報稱台灣供應鏈在AI高速網路的參與持續深化。","工商时报称台湾供应链在AI高速网络的参与持续深化。","工商時報は、AI高速ネットワークへの台湾サプライチェーンの関与が深まっているとする。","Commercial Times: keterlibatan rantai pasok Taiwan dalam jaringan AI cepat terus mendalam.","Công thương Thời báo: chuỗi cung ứng Đài Loan tham gia ngày càng sâu vào mạng tốc độ cao cho AI.","The Commercial Times says Taiwan's supply chain is deepening its role in high-speed AI networking.","Commercial Times отмечает, что участие цепочки поставок Тайваня в высокоскоростных сетях для ИИ углубляется.")},
 {date:"2026-10-15",src:"鴻海",url:"https://www.foxconn.com/zh-tw/press-center/press-releases/latest-news/2121",links:["ai"],t:L("鴻海研究院攜陽明交大：單一雷射23通道、七芯光纖達34.132 Tbit/s，獲未來科技獎","鸿海研究院携阳明交大：单一激光23通道、七芯光纤达34.132 Tbit/s，获未来科技奖","鴻海研究院と陽明交大：単一レーザー23チャネル、7コアファイバーで34.132 Tbit/s、未来科技賞受賞","HHRI dan NYCU: satu laser 23 kanal, serat tujuh inti 34,132 Tbit/s, raih Future Technology Award","HHRI cùng NYCU: một laser 23 kênh, sợi bảy lõi đạt 34,132 Tbit/s, giành giải Công nghệ Tương lai","Hon Hai Research Institute with National Yang Ming Chiao Tung University: 23 channels from a single laser over seven-core fiber reach 34.132 Tbit/s, winning a Future Tech Award","Исследовательский институт Hon Hai вместе с Университетом Ян Мин Цзяо Тун: 23 канала от одного лазера по семижильному волокну достигли 34,132 Тбит/с и получили премию Future Tech Award"),b:L("兆位元級矽光子技術登上Optics Express，為共同封裝光學立下新里程碑，鎖定AI資料中心傳輸極限。","兆位级硅光子技术登上Optics Express，为共同封装光学立下新里程碑，锁定AI数据中心传输极限。","テラビット級シリコンフォトニクスがOptics Expressに掲載、CPOの新たな里程標。AIデータセンターの伝送限界を狙う。","Silicon photonics kelas terabit terbit di Optics Express, tonggak baru CPO, membidik batas transmisi pusat data AI.","Quang silicon cấp terabit đăng trên Optics Express, cột mốc mới cho CPO, nhắm giới hạn truyền dẫn của trung tâm dữ liệu AI.","The terabit-class silicon photonics work was published in Optics Express, setting a new milestone for co-packaged optics and taking aim at the transmission limits of AI data centers.","Работа по кремниевой фотонике терабитного класса опубликована в Optics Express, что стало новой вехой для со-упакованной оптики и нацелено на предел передачи данных в ИИ-центрах обработки данных."),k:L("產學合作的成果正直接接上產線。","产学合作的成果正直接接上产线。","産学連携の成果が生産ラインに直結し始めた。","Hasil kerja sama kampus-industri langsung masuk lini produksi.","Thành quả hợp tác trường-viện nối thẳng vào dây chuyền.","The results of industry-academia collaboration are plugging straight into production lines.","Результаты сотрудничества промышленности и университетов попадают прямо на производственные линии.")},
 {date:"2026-10-20",src:"DIGITIMES",url:"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000770282_Z8V36BPC7AHUAT3BH51D9",links:["hr"],t:L("二維半導體技術轉化加速，台灣學界攻頂研究頻傳佳音","二维半导体技术转化加速，台湾学界攻顶研究频传佳音","二次元半導体の技術移転が加速、台湾の学界で成果続出","Konversi teknologi semikonduktor 2D dipercepat; riset Taiwan cetak hasil","Chuyển giao công nghệ bán dẫn 2D tăng tốc; giới học thuật Đài Loan liên tiếp có kết quả","Commercialization of two-dimensional semiconductor technology is speeding up as Taiwan's academic teams report one top-tier research result after another","Коммерциализация двумерных полупроводниковых технологий ускоряется, а тайваньские научные коллективы один за другим сообщают о результатах высшего уровня"),b:L("台灣團隊精準調控二硫化鉬原子堆疊，突破二維材料發光限制；北美智權報列出半導體光電通訊七大前瞻技術。","台湾团队精准调控二硫化钼原子堆叠，突破二维材料发光限制；北美智权报列出半导体光电通信七大前瞻技术。","台湾チームが二硫化モリブデンの原子積層を精密制御し二次元材料の発光限界を突破。北美智権報は光電通信の7大先端技術を列挙。","Tim Taiwan mengendalikan tumpukan atom MoS₂ dan menembus batas emisi material 2D; NAIP memuat tujuh teknologi optoelektronik mutakhir.","Nhóm Đài Loan điều khiển chính xác lớp nguyên tử MoS₂, vượt giới hạn phát sáng của vật liệu 2D; NAIP liệt kê bảy công nghệ quang điện tiên phong.","A Taiwanese team precisely tuned the atomic stacking of molybdenum disulfide and broke through the light-emission limits of two-dimensional materials, while North America Intellectual Property listed seven frontier technologies in semiconductor optoelectronics and communications.","Тайваньская группа добилась точного управления атомной укладкой дисульфида молибдена и преодолела ограничения светоизлучения двумерных материалов, а издание North America Intellectual Property перечислило семь перспективных технологий в полупроводниковой оптоэлектронике и связи."),k:L("下一代材料的專利布局現在就要開始。","下一代材料的专利布局现在就要开始。","次世代材料の特許戦略は今から始めるべき。","Strategi paten material generasi berikut harus dimulai sekarang.","Bố trí bằng sáng chế vật liệu thế hệ mới phải bắt đầu ngay.","Patent positioning for next-generation materials has to begin right now.","Выстраивать патентный портфель по материалам следующего поколения нужно начинать уже сейчас.")},
 {date:"2026-10-24",src:"中央社",url:"https://www.cna.com.tw/news/afe/202610240025.aspx",links:["cmd","prod"],t:L("工研院擬於工業區建稀土示範廠，2030年底拚年產500噸","工研院拟于工业区建稀土示范厂，2030年底拼年产500吨","工研院が工業区に希土類実証工場を計画、2030年末に年産500トン目標","ITRI rencanakan pabrik demonstrasi tanah jarang di kawasan industri, target 500 ton per tahun akhir 2030","ITRI dự kiến xây nhà máy trình diễn đất hiếm tại khu công nghiệp, nhắm 500 tấn mỗi năm cuối 2030","ITRI plans rare earth demonstration plant in an industrial park, targeting 500 tonnes a year by end-2030","ITRI планирует демонстрационный завод редкоземельных металлов в промзоне: 500 тонн в год к концу 2030 года"),b:L("院長張培仁稱，示範廠希望2028年底完成建置，2030年底前調出配方並達年產500噸，供台灣50%需求；現有實驗線年產約5,000公斤。商業模式仍待討論。","院长张培仁称，示范厂希望2028年底完成建置，2030年底前调出配方并达年产500吨，供台湾50%需求；现有实验线年产约5,000公斤。商业模式仍待讨论。","張培仁院長は、実証工場は2028年末の完成を目指し、2030年末までに配合を確立して年産500トン、台湾の需要の50%を賄うと述べた。現在の実験線は年産約5,000キロ。事業モデルは今後の議論。","Presiden Chang Pei-zen: pabrik ditargetkan selesai akhir 2028, formula siap dan 500 ton per tahun pada akhir 2030, memenuhi 50% kebutuhan Taiwan. Lini uji kini sekitar 5.000 kg per tahun. Model bisnis masih dibahas.","Viện trưởng Trương Bồi Nhân: nhà máy mong hoàn thành cuối 2028, trước cuối 2030 có công thức và đạt 500 tấn mỗi năm, đáp ứng 50% nhu cầu Đài Loan. Dây chuyền thí nghiệm hiện khoảng 5.000 kg mỗi năm. Mô hình kinh doanh còn bàn.","President Chang Pei-zen said the plant aims for completion by end-2028, with formulas set and output of 500 tonnes a year by end-2030, meeting 50% of Taiwan's demand. The current pilot line makes about 5,000 kg a year. The business model is still under discussion.","Президент института Чжан Пэйжэнь заявил, что завод планируется завершить к концу 2028 года, а к концу 2030 года отработать рецептуры и выйти на 500 тонн в год, покрывая 50% спроса Тайваня. Нынешняя опытная линия даёт около 5000 кг в год. Бизнес-модель ещё обсуждается."),k:L("張培仁稱台灣需求量不大，但稀土很關鍵，沒有它不行。","张培仁称台湾需求量不大，但稀土很关键，没有它不行。","張氏は、台湾の需要は大きくないが希土類は重要で、なくてはならないと述べた。","Chang: kebutuhan Taiwan tidak besar, tetapi tanah jarang krusial dan tak tergantikan.","Ông Trương: nhu cầu Đài Loan không lớn, nhưng đất hiếm rất then chốt, không thể thiếu.","Chang said Taiwan's demand is not large, but rare earths are critical and indispensable.","Чжан заявил, что спрос Тайваня невелик, но редкоземельные металлы критически важны и незаменимы.")},
 {date:"2026-10-28",src:"科技新報",url:"https://technews.tw/2026/10/28/openais-procurement-of-google-tpus-enters-a-substantial-phase/",links:["ai"],t:L("OpenAI招聘TPU工程師，自研與外購晶片策略進入實質階段","OpenAI招聘TPU工程师，自研与外购芯片策略进入实质阶段","OpenAIがTPUエンジニアを採用、自社開発と外部調達のチップ戦略が実質段階へ","OpenAI rekrut insinyur TPU; strategi chip internal dan eksternal masuk tahap nyata","OpenAI tuyển kỹ sư TPU; chiến lược chip tự phát triển và mua ngoài vào giai đoạn thực chất","OpenAI is hiring TPU engineers, and its strategy of in-house design alongside outside purchases moves into a concrete phase","OpenAI набирает инженеров по TPU, и её стратегия сочетания собственных разработок с закупками у сторонних поставщиков переходит в практическую фазу"),b:L("路透指OpenAI去年6月已租用Google AI晶片；Alphabet預期TPU銷售協議營收多在2027年認列。大型AI業者自研與多元採購並進，GPU獨大格局鬆動。","路透指OpenAI去年6月已租用Google AI芯片；Alphabet预期TPU销售协议营收多在2027年认列。大型AI业者自研与多元采购并进，GPU独大格局松动。","ロイターによればOpenAIは昨年6月からGoogleチップを借用。AlphabetはTPU販売収入の大半を2027年に計上予定。自社開発と多様調達が並行しGPU一強が揺らぐ。","Reuters: OpenAI menyewa chip Google sejak Juni tahun lalu; Alphabet akui sebagian besar pendapatan TPU pada 2027. Pengembangan internal dan pembelian multi-vendor berjalan bersama.","Reuters: OpenAI thuê chip Google từ tháng 6 năm ngoái; Alphabet ghi nhận phần lớn doanh thu TPU vào 2027. Tự phát triển và mua đa nguồn song song, thế độc tôn GPU lung lay.","Reuters reports that OpenAI was already renting Google AI chips in June last year, and Alphabet expects most of the revenue from its TPU sales agreements to be recognized in 2027. Large AI players are pursuing in-house design and diversified procurement at the same time, and the GPU's dominance is loosening.","Агентство Reuters сообщает, что OpenAI уже в июне прошлого года арендовала ИИ-чипы Google, а Alphabet ожидает признания большей части выручки по соглашениям о продаже TPU в 2027 году. Крупные игроки рынка ИИ одновременно ведут собственные разработки и диверсифицируют закупки, из-за чего доминирование GPU расшатывается."),k:L("晶片設計能力變成AI公司的核心研發。","芯片设计能力变成AI公司的核心研发。","チップ設計力がAI企業の中核研究開発に。","Kemampuan desain chip jadi R&D inti perusahaan AI.","Năng lực thiết kế chip thành R&D cốt lõi của công ty AI.","Chip design capability has become core R&D for AI companies.","Способность проектировать чипы стала ядром НИОКР для компаний в сфере ИИ.")}
 ]},
{id:"fin",kind:"tower",color:"#B98A2E",ring:2,ang:270,
 name:L("財務與市場","财务与市场","財務・市場","Keuangan dan Pasar","Tài chính và thị trường","Finance and Markets","Финансы и рынки"),
 tag:L("五管：財務管理","五管：财务管理","五管：財務管理","Lima fungsi: keuangan","Năm chức năng: tài chính","Five management functions: financial management","Пять функций управления: финансовый менеджмент"),
 desc:L("財務管理是替企業管錢：資金籌措、投資決策、現金流與財報解讀，並連到股市反應。這座島看獲利數字如何變成股價，以及AI投資熱潮的融資結構與風險。","财务管理是替企业管钱：资金筹措、投资决策、现金流与财报解读，并连到股市反应。这座岛看盈利数字如何变成股价，以及AI投资热潮的融资结构与风险。","財務管理は企業のお金を管理すること。資金調達、投資判断、キャッシュフロー、決算の読み方、株式市場の反応。利益がどう株価になるか、AI投資ブームの資金構造とリスクを見ます。","Manajemen keuangan mengelola uang perusahaan: pendanaan, investasi, arus kas, membaca laporan, reaksi pasar. Pulau ini melihat bagaimana laba jadi harga saham serta struktur pendanaan dan risiko ledakan investasi AI.","Quản trị tài chính là quản lý tiền doanh nghiệp: huy động vốn, đầu tư, dòng tiền, đọc báo cáo, phản ứng thị trường. Đảo này xem lợi nhuận biến thành giá cổ phiếu ra sao, cùng cấu trúc tài trợ và rủi ro của làn sóng AI.","Financial management is about handling a company's money: raising funds, investment decisions, cash flow and reading financial statements, and it connects through to how the stock market reacts. This island looks at how profit figures turn into share prices, and at the financing structure and risks of the AI investment boom.","Финансовый менеджмент это управление деньгами компании: привлечение средств, инвестиционные решения, денежные потоки и чтение финансовой отчётности, и всё это связано с реакцией фондового рынка. Этот остров рассматривает, как цифры прибыли превращаются в курс акций, а также структуру финансирования и риски инвестиционного бума вокруг ИИ."),
 items:[
 {date:"2026-10-29",src:"24/7 Wall St.",url:"https://247wallst.com/investing/2026/10/29/alphabet-sinks-11-as-ai-spending-pushes-cash-flow-negative-again-microsoft-and-meta-edge-higher-amazon-slips/",links:["ai","mkts"],
  t:L("Alphabet單日重挫逾一成，自由現金流連兩季為負","Alphabet单日重挫逾一成，自由现金流连两季为负","Alphabetが一日で1割超下落、フリーキャッシュフローは2四半期連続マイナス","Alphabet anjlok lebih dari 10% dalam sehari; arus kas bebas negatif dua kuartal berturut-turut","Alphabet lao dốc hơn 10% trong ngày; dòng tiền tự do âm hai quý liên tiếp","Alphabet plunged more than 10% in a single session as free cash flow stayed negative for a second straight quarter","Alphabet обвалилась более чем на 10% за одну сессию: свободный денежный поток остался отрицательным второй квартал подряд"),
  b:L("資本支出由上季的449億美元增至513億美元，自由現金流為負91億美元。同日微軟上漲約2%、Meta上漲約1%、亞馬遜下跌約2%。","资本支出由上季的449亿美元增至513亿美元，自由现金流为负91亿美元。同日微软上涨约2%、Meta上涨约1%、亚马逊下跌约2%。","設備投資は前期の449億ドルから513億ドルへ増え、フリーキャッシュフローはマイナス91億ドル。同日マイクロソフトは約2%高、Metaは約1%高、アマゾンは約2%安。","Belanja modal naik dari US$44,9 miliar menjadi US$51,3 miliar; arus kas bebas minus US$9,1 miliar. Hari itu Microsoft +2%, Meta +1%, Amazon -2%.","Chi đầu tư tăng từ 44,9 tỷ lên 51,3 tỷ USD; dòng tiền tự do âm 9,1 tỷ USD. Cùng ngày Microsoft +2%, Meta +1%, Amazon -2%.","Capital expenditure rose from US$44.9 billion in the previous quarter to US$51.3 billion, leaving free cash flow at negative US$9.1 billion. The same day Microsoft gained about 2%, Meta about 1%, and Amazon fell about 2%.","Капитальные затраты выросли с 44,9 млрд долл. в предыдущем квартале до 51,3 млрд долл., из-за чего свободный денежный поток оказался отрицательным и составил минус 9,1 млрд долл. В тот же день Microsoft прибавила около 2%, Meta около 1%, а Amazon потеряла около 2%."),
  k:L("同樣砸錢做AI，市場只罰現金流轉負的那一家。","同样砸钱做AI，市场只罚现金流转负的那一家。","同じくAIに投じても、罰を受けたのはキャッシュフローが赤字の一社だけ。","Sama-sama jor-joran AI, pasar hanya menghukum yang arus kasnya negatif.","Cùng đổ tiền vào AI, thị trường chỉ trừng phạt bên có dòng tiền âm.","Everyone is pouring money into AI, yet the market only punishes the one whose cash flow has turned negative.","Деньги в ИИ вкладывают все, но рынок наказывает только того, у кого денежный поток ушёл в минус.")},

 {date:"2026-10-15",src:"nStock",url:"https://www.nstock.tw/author/article?id=2348",links:["tsmc"],t:L("法說當天台股重挫1,655.96點，台積電前三季EPS 78.75元","法说当天台股重挫1,655.96点，台积电前三季度EPS 78.75元","決算説明会当日に台湾株1,655.96ポイント急落、TSMCの1〜9月EPS 78.75元","Taiex anjlok 1.655,96 poin hari konferensi; EPS sembilan bulan TSMC NT$78,75","Taiex giảm 1.655,96 điểm ngày họp; EPS chín tháng TSMC 78,75","Taiwan stocks plunged 1,655.96 points on the day of the earnings call, with TSMC reporting EPS of NT$78.75 for the first three quarters","В день отчётной телеконференции тайваньский рынок рухнул на 1 655,96 пункта, а прибыль TSMC на акцию за первые три квартала составила 78,75 тайв. долл."),b:L("前三季稅後純益約2兆421億元、年增68.5%。第四季財測中值高於預期，但毛利率中值66%與對2027年的審慎態度讓市場需要消化。","前三季度税后净利约2兆421亿元、年增68.5%。第四季度财测中值高于预期，但毛利率中值66%与对2027年的审慎态度让市场需要消化。","1〜9月純利益約2兆421億元で68.5%増。第4四半期中央値は予想超えだが粗利率66%と2027年への慎重姿勢を市場は消化中。","Laba sembilan bulan ~NT$2,0421 triliun, +68,5%. Panduan Q4 di atas ekspektasi, tetapi margin 66% dan kehati-hatian 2027 perlu dicerna.","Lãi chín tháng ~2,0421 nghìn tỷ, +68,5%. Dự báo Q4 vượt kỳ vọng nhưng biên 66% và thận trọng về 2027 cần tiêu hóa.","Net income after tax for the first three quarters was about NT$2.0421 trillion, up 68.5% year on year. The midpoint of fourth-quarter guidance came in above expectations, but the 66% gross margin midpoint and a cautious stance on 2027 left the market with something to digest.","Чистая прибыль после налогообложения за первые три квартала составила около 2,0421 трлн тайв. долл., что на 68,5% больше, чем годом ранее. Середина прогноза на четвёртый квартал оказалась выше ожиданий, однако средняя оценка валовой маржи в 66% и осторожная позиция по 2027 году дали рынку повод задуматься."),k:L("好財報不等於好股價，市場看的是下一季。","好财报不等于好股价，市场看的是下一季。","好決算は株高を意味しない、市場は次の四半期を見る。","Laporan bagus bukan jaminan harga naik; pasar melihat kuartal depan.","Báo cáo tốt không đồng nghĩa giá tăng; thị trường nhìn quý sau.","Good results do not mean a good share price, because the market is looking at the next quarter.","Хорошая отчётность не равна хорошему курсу акций, рынок смотрит на следующий квартал.")},
 {date:"2026-10-28",src:"ETtoday",url:"https://finance.ettoday.net/news/3262219",links:["mkts","tsmc"],t:L("台股28日大漲939點收47,036點，成交7,221億元","台股28日大涨939点收47,036点，成交7,221亿元","台湾株は28日に939ポイント高の47,036、売買代金7,221億元","Taiex 28 Okt naik 939 poin ke 47.036; nilai transaksi NT$722,1 miliar","Taiex 28/10 tăng 939 điểm lên 47.036; giá trị giao dịch 722,1 tỷ","Taiwan stocks surged 939 points on the 28th to close at 47,036, with turnover of NT$722.1 billion","28-го числа тайваньский рынок вырос на 939 пунктов и закрылся на 47 036 пунктах при обороте 722,1 млрд тайв. долл."),b:L("法人買超414.6億元，櫃買指數漲2.84%。台積電漲25元收2,425元。前一日美股四大指數同步收高。","法人买超414.6亿元，柜买指数涨2.84%。台积电涨25元收2,425元。前一日美股四大指数同步收高。","機関投資家は414.6億元の買い越し、店頭指数は2.84%高。TSMCは25元高の2,425元。前日の米4指数はそろって上昇。","Investor institusi beli bersih NT$41,46 miliar; indeks OTC +2,84%. TSMC +NT$25 ke 2.425. Empat indeks AS naik sehari sebelumnya.","Khối tổ chức mua ròng 41,46 tỷ; chỉ số OTC +2,84%. TSMC +25 lên 2.425. Bốn chỉ số Mỹ cùng tăng phiên trước.","Institutional investors were net buyers of NT$41.46 billion and the OTC index rose 2.84%. TSMC gained NT$25 to close at NT$2,425. The four main US indices had all closed higher the day before.","Институциональные инвесторы купили на 41,46 млрд тайв. долл. больше, чем продали, а индекс внебиржевого рынка вырос на 2,84%. Акции TSMC подорожали на 25 тайв. долл. и закрылись на 2 425 тайв. долл. Днём ранее все четыре основных индекса США закрылись в плюсе."),k:L("法人回頭買，量能是能否站穩的關鍵。","法人回头买，量能是能否站稳的关键。","機関投資家が戻り、出来高が定着の鍵。","Institusi kembali beli; volume jadi kunci bertahan.","Khối tổ chức quay lại mua; thanh khoản là chìa khóa giữ vững.","Institutions are buying again, and trading volume is the key to whether the level holds.","Институциональные инвесторы вернулись к покупкам, и ключом к удержанию уровня станут объёмы торгов.")},
 {date:"2026-10-26",src:"經濟日報",url:"https://udn.com/news/story/7251/9836554",links:["ai"],t:L("AI泡沫疑慮再起，費半、韓股、台股高科技比重股市大幅壓回","AI泡沫疑虑再起，费半、韩股、台股高科技比重股市大幅压回","AIバブル懸念再燃、SOX・韓国・台湾のハイテク市場が大幅調整","Kekhawatiran gelembung AI kembali; SOX, Korea, Taiwan terkoreksi tajam","Lo ngại bong bóng AI trở lại; SOX, Hàn Quốc, Đài Loan điều chỉnh mạnh","Doubts about an AI bubble return, pulling the Philadelphia Semiconductor Index, Korean shares and Taiwan's high-tech-heavy market sharply lower","Сомнения в существовании пузыря ИИ вернулись и резко откатили вниз Филадельфийский полупроводниковый индекс, корейские акции и насыщенный высокими технологиями тайваньский рынок"),b:L("市場焦點從資本支出規模轉向AI商業化與實質獲利。凱基台灣ETF經理人認為企業端訊號直接，台積電全年成長上調至44%，AI供應鏈不看淡。","市场焦点从资本支出规模转向AI商业化与实质盈利。凯基台湾ETF经理人认为企业端信号直接，台积电全年增长上调至44%，AI供应链不看淡。","焦点は投資規模からAI商業化と実利益へ。凱基台湾ETFは企業側のシグナルは明確とし、TSMC通年44%成長を根拠にAI供給網を弱気視せず。","Fokus bergeser dari skala capex ke komersialisasi AI dan laba riil. Manajer ETF KGI: sinyal korporasi jelas, TSMC naikkan pertumbuhan ke 44%, rantai AI tidak lemah.","Tâm điểm chuyển từ quy mô capex sang thương mại hóa AI và lợi nhuận thực. Quản lý ETF KGI: tín hiệu doanh nghiệp rõ, TSMC nâng tăng trưởng lên 44%, chuỗi AI không yếu.","Market attention has shifted from the scale of capital expenditure to AI commercialization and real profits. A KGI Taiwan ETF manager sees the signals from corporate clients as direct, notes that TSMC's full-year growth forecast was raised to 44%, and is not bearish on the AI supply chain.","Внимание рынка переместилось с масштабов капитальных затрат на коммерциализацию ИИ и реальную прибыль. Управляющий тайваньским ETF компании KGI считает сигналы со стороны корпоративных клиентов прямыми, отмечает повышение прогноза роста TSMC за год до 44% и не смотрит на цепочку поставок ИИ пессимистично."),k:L("回檔是估值修正，不是需求消失。","回档是估值修正，不是需求消失。","調整はバリュエーション修正であり需要消失ではない。","Koreksi adalah penyesuaian valuasi, bukan hilangnya permintaan.","Điều chỉnh là sửa định giá, không phải cầu biến mất.","The pullback is a valuation correction, not a disappearance of demand.","Откат это коррекция оценок, а не исчезновение спроса.")},
 {date:"2026-10-28",src:"工商時報",url:"https://www.ctee.com.tw/news/20261028700733-430704",links:["ai"],t:L("OpenAI下調估值至1.25兆美元，年化營收較預期短少200億美元","OpenAI下调估值至1.25兆美元，年化营收较预期短少200亿美元","OpenAIが評価額を1.25兆ドルに引き下げ、年換算売上は予想を200億ドル下回る","OpenAI pangkas valuasi ke US$1,25 triliun; pendapatan tahunan kurang US$20 miliar","OpenAI hạ định giá xuống 1,25 nghìn tỷ USD; doanh thu quy năm hụt 20 tỷ USD","OpenAI's valuation is cut to US$1.25 trillion, with annualized revenue US$20 billion short of expectations","Оценка OpenAI снижена до 1,25 трлн долл. США, а годовая выручка в пересчёте оказалась на 20 млрд долл. США ниже ожиданий"),b:L("AI支出憂慮與投資人需求轉冷，OpenAI加速募資300億美元並傳轉向採購Google TPU；輝達先前承諾逾1,000億美元信貸支援。","AI支出忧虑与投资人需求转冷，OpenAI加速募资300亿美元并传转向采购Google TPU；英伟达先前承诺逾1,000亿美元信贷支持。","AI支出懸念と投資家需要の冷え込みで、OpenAIは300億ドル調達を急ぎGoogle TPU購入へ。NVIDIAは1,000億ドル超の信用支援を約束済み。","Kekhawatiran belanja AI; OpenAI percepat penggalangan US$30 miliar dan beralih ke TPU Google; Nvidia sebelumnya janji kredit >US$100 miliar.","Lo ngại chi tiêu AI; OpenAI đẩy nhanh huy động 30 tỷ USD và chuyển sang TPU Google; Nvidia từng cam kết tín dụng >100 tỷ USD.","With worries about AI spending and cooling investor demand, OpenAI is speeding up a US$30 billion fundraising and is reported to be turning to purchases of Google TPUs. Nvidia had earlier pledged more than US$100 billion in credit support.","На фоне опасений по поводу расходов на ИИ и остывающего интереса инвесторов OpenAI ускоряет привлечение 30 млрд долл. США и, по сообщениям, переходит к закупкам TPU у Google. Ранее Nvidia обещала кредитную поддержку более чем на 100 млрд долл. США."),k:L("供應商借錢給客戶買自己的產品，循環融資要盯。","供应商借钱给客户买自己的产品，循环融资要盯。","供給側が顧客に自社製品購入資金を貸す循環融資に注意。","Pemasok meminjami pelanggan untuk beli produknya; pendanaan melingkar perlu diawasi.","Nhà cung cấp cho khách vay mua sản phẩm của mình; tài trợ vòng tròn cần theo dõi.","A supplier lending money to customers so they can buy its own products is circular financing, and it needs watching.","Поставщик даёт в долг клиентам, чтобы те покупали его же продукцию, и за такой круговой схемой финансирования нужно следить.")},
 {date:"2026-10-28",src:"EurAsia Business News",url:"https://eurasiabusinessnews.com/2026/10/28/stock-market-today-fed-holds-rates-steady-dow-sp-500-and-nasdaq-post-modest-gains/",links:["mkts","cmd"],t:L("Fed維持利率3.75%至4.00%，兩位官員主張升息；美股小漲","Fed维持利率3.75%至4.00%，两位官员主张升息；美股小涨","FRBは3.75〜4.00%で据え置き、2人が利上げ主張。米株は小幅高","Fed tahan suku bunga 3,75–4,00%, dua pejabat ingin naik; saham AS naik tipis","Fed giữ lãi suất 3,75–4,00%, hai quan chức muốn tăng; chứng khoán Mỹ nhích lên","The Fed holds rates at 3.75% to 4.00% with two officials arguing for a hike, and US stocks edge higher","Федеральная резервная система сохранила ставку на уровне от 3,75% до 4,00%, двое чиновников выступили за повышение, а американские акции немного выросли"),b:L("10比2表決，Cook與Hammack傾向升息一碼，12月升息仍有可能。道瓊52,478.91（+0.19%）、S&P 500 7,744.27（+0.28%）、那斯達克26,549.85（+0.27%）。","10比2表决，Cook与Hammack倾向升息一码，12月升息仍有可能。道琼斯52,478.91（+0.19%）、标普500 7,744.27（+0.28%）、纳斯达克26,549.85（+0.27%）。","10対2でCookとHammackは0.25%利上げを主張、12月利上げの可能性残る。ダウ52,478.91（+0.19%）、S&P 7,744.27（+0.28%）、ナスダック26,549.85（+0.27%）。","Voting 10–2; Cook dan Hammack ingin naik 25 bp; kenaikan Desember masih mungkin. Dow 52.478,91 (+0,19%), S&P 7.744,27 (+0,28%), Nasdaq 26.549,85 (+0,27%).","Biểu quyết 10–2; Cook và Hammack muốn tăng 25 điểm; tháng 12 vẫn có thể tăng. Dow 52.478,91 (+0,19%), S&P 7.744,27 (+0,28%), Nasdaq 26.549,85 (+0,27%).","The vote was 10 to 2, with Cook and Hammack leaning toward a quarter-point hike, and a December increase is still possible. Dow 52,478.91 (+0.19%), S&P 500 7,744.27 (+0.28%), Nasdaq 26,549.85 (+0.27%).","Голосование прошло со счётом 10 против 2, Cook и Hammack склонялись к повышению на четверть пункта, и повышение в декабре по-прежнему возможно. Dow 52 478,91 (+0,19%), S&P 500 7 744,27 (+0,28%), Nasdaq 26 549,85 (+0,27%)."),k:L("升息派抬頭，AI融資成本的假設要改。","升息派抬头，AI融资成本的假设要改。","利上げ派が台頭、AI資金コストの前提は見直しが必要。","Kubu kenaikan menguat; asumsi biaya pendanaan AI harus diubah.","Phe tăng lãi suất nổi lên; giả định chi phí vốn AI phải đổi.","The hawks are gaining ground, so assumptions about AI financing costs need to be revised.","Сторонники повышения ставки набирают вес, значит, предпосылки о стоимости финансирования ИИ придётся пересмотреть.")},
 {date:"2026-10-29",src:"經濟日報",url:"https://udn.com/news/story/7252/9842932",links:["prod"],t:L("台達電第三季EPS 9.04元，小摩示警泰達電毛利率下降","台达电第三季度EPS 9.04元，小摩示警泰达电毛利率下降","台達電の第3四半期EPS 9.04元、JPモルガンはタイ子会社の粗利率低下を警告","EPS Q3 Delta NT$9,04; JPMorgan peringatkan margin Delta Thailand turun","EPS Q3 Delta 9,04; JPMorgan cảnh báo biên lợi nhuận Delta Thái Lan giảm","Delta Electronics posts third-quarter EPS of NT$9.04, and J.P. Morgan flags a falling gross margin at Delta Electronics Thailand","Прибыль Delta Electronics на акцию за третий квартал составила 9,04 тайв. долл., а J.P. Morgan предупредил о снижении валовой маржи Delta Electronics Thailand"),b:L("獲利年增26%但季減6.5%，毛利率34.08%。市場關注海外子公司毛利率與AI電源產品組合的變化。","盈利年增26%但季减6.5%，毛利率34.08%。市场关注海外子公司毛利率与AI电源产品组合的变化。","利益は前年比26%増、前期比6.5%減、粗利率34.08%。海外子会社の粗利率とAI電源の製品構成に注目。","Laba +26% YoY tetapi -6,5% QoQ; margin 34,08%. Pasar cermati margin anak usaha luar negeri dan bauran produk daya AI.","Lãi +26% so cùng kỳ nhưng -6,5% so quý trước; biên 34,08%. Thị trường theo dõi biên công ty con nước ngoài và cơ cấu sản phẩm nguồn AI.","Profit rose 26% year on year but fell 6.5% from the previous quarter, with a gross margin of 34.08%. The market is watching the gross margin of overseas subsidiaries and changes in the AI power product mix.","Прибыль выросла на 26% в годовом сопоставлении, но снизилась на 6,5% по сравнению с предыдущим кварталом, валовая маржа составила 34,08%. Рынок следит за валовой маржой зарубежных дочерних компаний и изменениями в структуре продуктов питания для ИИ-систем."),k:L("季減比年增更值得追問。","季减比年增更值得追问。","前年比増より前期比減を問うべき。","Penurunan QoQ lebih layak ditanyakan daripada kenaikan YoY.","Giảm so quý trước đáng hỏi hơn tăng so cùng kỳ.","The quarter-on-quarter decline deserves more questions than the year-on-year gain.","Квартальное снижение заслуживает больше вопросов, чем годовой рост.")},
 {date:"2026-10-13",src:"鉅亨網",url:"https://m.cnyes.com/news/id/6621806",links:["prod"],t:L("鴻海第三季營收3.03兆元優於預期7%，科技日前夕市場看EPS","鸿海第三季度营收3.03兆元优于预期7%，科技日前夕市场看EPS","鴻海の第3四半期売上3.03兆元は予想比7%上振れ、テックデー前にEPSに注目","Pendapatan Q3 Hon Hai NT$3,03 triliun, 7% di atas estimasi; pasar tunggu EPS jelang Tech Day","Doanh thu Q3 Hon Hai 3,03 nghìn tỷ, vượt dự báo 7%; thị trường chờ EPS trước Tech Day","Hon Hai's third-quarter revenue of NT$3.03 trillion beat expectations by 7%, and on the eve of its Tech Day the market is watching EPS","Выручка Hon Hai за третий квартал в 3,03 трлн тайв. долл. превысила ожидания на 7%, и накануне технологического дня рынок следит за прибылью на акцию"),b:L("9月營收首破兆元。市場估值重點從營收轉到AI伺服器毛利率與營業利益率能否同步提升。","9月营收首破兆元。市场估值重点从营收转到AI服务器毛利率与营业利益率能否同步提升。","9月売上は初の1兆元超。評価の焦点は売上からAIサーバーの粗利率と営業利益率へ。","September pertama kali tembus NT$1 triliun. Fokus valuasi bergeser dari pendapatan ke margin server AI.","Tháng 9 lần đầu vượt 1 nghìn tỷ. Trọng tâm định giá chuyển từ doanh thu sang biên lợi nhuận máy chủ AI.","September revenue topped NT$1 trillion for the first time. The focus of valuation has moved from revenue to whether AI server gross margin and operating margin can rise together.","Выручка за сентябрь впервые превысила 1 трлн тайв. долл. В оценке акций акцент сместился с выручки на то, смогут ли валовая маржа по ИИ-серверам и операционная маржа расти одновременно."),k:L("營收創高之後，市場只問毛利率。","营收创高之后，市场只问毛利率。","売上最高の次に市場が問うのは粗利率だけ。","Setelah pendapatan rekor, pasar hanya tanya margin.","Sau doanh thu kỷ lục, thị trường chỉ hỏi biên lợi nhuận.","After a record revenue figure, the market asks about nothing but gross margin.","После рекордной выручки рынок спрашивает только о валовой марже.")},
 {date:"2026-10-29",src:"中央社",url:"https://www.cna.com.tw/news/afe/202610290197.aspx",links:["tsmc","prod"],t:L("友達388億元出售台中二期廠房予台積電，處分利益估185億元","友达388亿元出售台中二期厂房予台积电，处分利益估185亿元","AUOが台中第2期工場をTSMCに388億元で売却、処分益は185億元の見込み","AUO jual pabrik Taichung tahap 2 ke TSMC NT$38,8 miliar, keuntungan diperkirakan NT$18,5 miliar","AUO bán nhà máy Đài Trung giai đoạn 2 cho TSMC 38,8 tỷ, lãi xử lý ước 18,5 tỷ","AUO sells Taichung phase 2 plant to TSMC for NT$38.8 billion, with an estimated NT$18.5 billion gain","AUO продаёт TSMC вторую очередь завода в Тайчжуне за 38,8 млрд тайв. долл., ожидаемая прибыль 18,5 млрд"),b:L("中央社報導，台積電公告取得友達台中廠二期廠房及相關廠務附屬設施，交易總金額約388億元；友達預計處分利益約185億元，已扣除交易費用及預估稅費。","中央社报道，台积电公告取得友达台中厂二期厂房及相关厂务附属设施，交易总金额约388亿元；友达预计处分利益约185亿元，已扣除交易费用及预估税费。","中央社によると、TSMCはAUO台中工場第2期の建屋と関連付帯設備の取得を公告し、総額は約388億元。AUOの処分益は取引費用と見込み税を除き約185億元の見通し。","CNA: TSMC mengumumkan akuisisi gedung pabrik Taichung tahap 2 AUO dan fasilitas terkait, total sekitar NT$38,8 miliar. AUO memperkirakan keuntungan sekitar NT$18,5 miliar setelah biaya transaksi dan estimasi pajak.","Theo CNA, TSMC công bố mua nhà xưởng giai đoạn 2 của AUO tại Đài Trung và các tiện ích liên quan, tổng khoảng 38,8 tỷ. AUO dự kiến lãi xử lý khoảng 18,5 tỷ sau chi phí giao dịch và thuế ước tính.","CNA reports TSMC announced it will acquire AUO's Taichung phase 2 plant and related facilities for about NT$38.8 billion in total. AUO expects a disposal gain of about NT$18.5 billion after transaction costs and estimated taxes.","По данным CNA, TSMC объявила о покупке второй очереди завода AUO в Тайчжуне и связанных объектов примерно за 38,8 млрд тайв. долл. AUO ожидает прибыль от продажи около 18,5 млрд после транзакционных издержек и расчётных налогов."),k:L("388億元是總價，185億元是扣除費用與稅費後的損益，口徑不同。","388亿元是总价，185亿元是扣除费用与税费后的损益，口径不同。","388億元は総額、185億元は費用と税を除いた損益で、基準が異なる。","NT$38,8 miliar adalah harga total, NT$18,5 miliar laba setelah biaya dan pajak; dasarnya berbeda.","38,8 tỷ là tổng giá, 18,5 tỷ là lãi sau chi phí và thuế; hai con số khác cơ sở.","NT$38.8 billion is the total price and NT$18.5 billion the gain after costs and taxes, so the bases differ.","38,8 млрд это общая цена, а 18,5 млрд прибыль после издержек и налогов, база расчёта разная.")}
 ]},

  b:L("10月21日週報價，較前週上漲約5美元。亞洲主食價格在能源與金屬劇烈波動中維持平穩，是這波市場動盪中少數的穩定項。","10月21日周报价，较前周上涨约5美元。亚洲主食价格在能源与金属剧烈波动中维持平稳，是这波市场动荡中少数的稳定项。","10月21日の週次で前週比約5ドル高。エネルギーと金属が乱高下する中、アジアの主食価格は安定を保っている。","Kuotasi mingguan 21 Oktober, naik sekitar US$5. Harga pangan pokok Asia tetap stabil di tengah gejolak energi dan logam.","Báo giá tuần 21/10, tăng khoảng 5 USD. Giá lương thực châu Á vẫn ổn định giữa biến động mạnh của năng lượng và kim loại.","The weekly quote for 21 October, up about US$5 from the week before. Asia's staple food price has held steady through violent swings in energy and metals, one of the few stable items in this bout of market turmoil.","Недельная котировка на 21 октября, примерно на 5 долл. выше, чем неделей ранее. Цена основного продукта питания Азии остаётся устойчивой на фоне резких колебаний энергоносителей и металлов и оказывается одной из немногих стабильных позиций в нынешней рыночной турбулентности."),
  k:L("糧價是這波動盪裡唯一沒在抖的項目。","粮价是这波动荡里唯一没在抖的项目。","穀物価格はこの混乱で唯一揺れていない。","Harga pangan satu-satunya yang tidak bergetar dalam gejolak ini.","Giá lương thực là thứ duy nhất không rung lắc trong đợt biến động này.","Food prices are the only thing not shaking in this turmoil.","Цены на продовольствие остаются единственным, что не дрожит в этой турбулентности.")},

  t:L("工業物資：薄玻纖布與CCL 11月看漲10%至15%","工业物资：薄玻纤布与CCL 11月看涨10%至15%","工業素材：薄型ガラスクロスとCCLは11月に10%から15%の値上げ見通し","Bahan industri: kain kaca tipis dan CCL diperkirakan naik 10% hingga 15% pada November","Vật tư công nghiệp: vải thủy tinh mỏng và CCL dự kiến tăng 10% đến 15% vào tháng 11","Industrial materials: thin glass cloth and CCL look set to rise 10% to 15% in November","Промышленные материалы: тонкая стеклоткань и CCL могут подорожать на 10-15% в ноябре"),
  b:L("南亞稱市場供應不足，許多同業轉向高階產品線，一般級產品需求仍大。供應鏈評估缺貨壓力可能至2027年下半年至2028年間逐步緩解。","南亚称市场供应不足，许多同业转向高端产品线，一般级产品需求仍大。供应链评估缺货压力可能至2027年下半年至2028年间逐步缓解。","南亜は、供給不足の中で同業の多くが高付加価値品へ移り、一般品の需要はなお大きいとする。供給網は品薄の緩和を2027年下半期から2028年にかけてと見る。","Nan Ya: pasokan kurang, banyak pesaing beralih ke lini kelas atas, permintaan produk umum tetap besar. Rantai pasok menilai tekanan kelangkaan mungkin mereda bertahap pada paruh kedua 2027 hingga 2028.","Nan Ya: nguồn cung thiếu, nhiều đối thủ chuyển sang dòng cao cấp, nhu cầu hàng phổ thông vẫn lớn. Chuỗi cung ứng đánh giá áp lực thiếu hàng có thể giảm dần từ nửa cuối 2027 đến 2028.","Nan Ya says supply is short, many peers have moved to high-end lines and demand for general-grade products remains large. The supply chain estimates shortage pressure may ease gradually between the second half of 2027 and 2028.","Nan Ya заявляет, что предложения не хватает, многие конкуренты перешли на продукцию высокого класса, а спрос на обычную продукцию остаётся большим. Цепочка поставок считает, что дефицит может постепенно ослабнуть со второго полугодия 2027 года до 2028 года."),
  k:L("本波漲幅約10%至15%，實際依產品規格及供應商而異。","本波涨幅约10%至15%，实际依产品规格及供应商而异。","今回の上げ幅は約10%から15%で、実際は製品規格と供給元で異なる。","Kenaikan kali ini sekitar 10% hingga 15%, tergantung spesifikasi dan pemasok.","Đợt tăng này khoảng 10% đến 15%, tùy quy cách sản phẩm và nhà cung cấp.","This round is about 10% to 15% and varies by product specification and supplier.","Нынешнее повышение составит около 10-15% и зависит от спецификации продукта и поставщика.")}

 name:L("實踐國企系","实践国企系","実践国企学科","Prodi IBM Shih Chien","Khoa IBM Thực Tiễn","Shih Chien IBM Department","Кафедра IBM Шицзянь"),
 tag:L("實踐大學高雄校區國際企業管理學系","实践大学高雄校区国际企业管理学系","実践大学高雄キャンパス国際企業管理学科","Departemen Manajemen Bisnis Internasional, Kampus Kaohsiung","Khoa Quản trị Kinh doanh Quốc tế, cơ sở Cao Hùng","Department of International Business Management, Shih Chien University Kaohsiung Campus","Департамент международного бизнес-менеджмента, кампус Гаосюн Университета Шицзянь"),
 desc:L("這座島是群島的母港：實踐大學高雄校區國際企業管理學系。系所培養具國際視野之專才，強化英日語聽說讀寫與國際商務談判，重視電子商務與資訊能力，並以全人教育為基礎。島上整理系所定位、五個學程組別、招生管道與名額、學雜費與聯絡方式。","这座岛是群岛的母港：实践大学高雄校区国际企业管理学系。系所培养具国际视野之专才，强化英日语听说读写与国际商务谈判，重视电子商务与信息能力，并以全人教育为基础。岛上整理系所定位、五个学程组别、招生管道与名额、学杂费与联系方式。","この島は群島の母港、実践大学高雄キャンパス国際企業管理学科です。国際的視野を持つ専門人材を育て、英語と日本語の聞く話す読む書くと国際商務交渉を強化し、電子商取引と情報技術を重視し、全人教育を基礎とします。学科の位置づけ、5つのコース、入試枠、学費、連絡先をまとめます。","Pulau ini adalah pelabuhan induk kepulauan: Departemen Manajemen Bisnis Internasional, Universitas Shih Chien Kampus Kaohsiung. Program ini membentuk tenaga ahli berwawasan internasional, memperkuat bahasa Inggris dan Jepang serta negosiasi bisnis internasional, menekankan e-commerce dan kemampuan TI, dengan dasar pendidikan holistik.","Đảo này là cảng mẹ của quần đảo: Khoa Quản trị Kinh doanh Quốc tế, Đại học Thực Tiễn cơ sở Cao Hùng. Khoa đào tạo nhân lực có tầm nhìn quốc tế, tăng cường nghe nói đọc viết tiếng Anh và tiếng Nhật cùng đàm phán thương mại quốc tế, chú trọng thương mại điện tử và năng lực công nghệ thông tin, trên nền giáo dục toàn diện.","This island is the home port of the archipelago: the Department of International Business Management at Shih Chien University's Kaohsiung campus. The department trains specialists with an international outlook, strengthens listening, speaking, reading and writing in English and Japanese along with international business negotiation, emphasizes e-commerce and IT skills, and builds on whole-person education. The island gathers the department's positioning, its five program tracks, admission channels and quotas, tuition and fees, and contact details.","Этот остров и есть родной порт всего архипелага: департамент международного бизнес-менеджмента кампуса Гаосюн Университета Шицзянь. Департамент готовит специалистов с международным взглядом, развивает навыки аудирования, речи, чтения и письма на английском и японском вместе с умением вести международные деловые переговоры, делает ставку на электронную коммерцию и информационные технологии и опирается на целостное образование личности. На острове собраны позиционирование департамента, пять программных направлений, каналы и квоты приёма, плата за обучение и контакты."),
 items:[
 {date:"2026-10-31",src:"大學問",url:"https://www.unews.com.tw/School/Department/65/1753",links:["hub","mkt"],
  t:L("系所定位：培養具國際視野之專才","系所定位：培养具国际视野之专才","学科の位置づけ：国際的視野を持つ専門人材の育成","Posisi program: membentuk tenaga ahli berwawasan internasional","Định vị khoa: đào tạo chuyên gia có tầm nhìn quốc tế","Department positioning: training specialists with an international outlook","Позиционирование департамента: подготовка специалистов с международным взглядом"),
  b:L("四大特色：強化英日語聽說讀寫以建立國際商務與談判能力；以國際視野訓練各專業領域；重視電子商務應用與資訊技術；以全人教育培養科學知識與生命意義。","四大特色：强化英日语听说读写以建立国际商务与谈判能力；以国际视野训练各专业领域；重视电子商务应用与信息技术；以全人教育培养科学知识与生命意义。","4つの特色。英語と日本語の四技能を強化し国際商務と交渉力を養う。国際的視野で各専門領域を訓練する。電子商取引と情報技術を重視する。全人教育で科学知識と生命の意味を育む。","Empat ciri: memperkuat empat keterampilan bahasa Inggris dan Jepang untuk bisnis dan negosiasi internasional; melatih berbagai bidang profesional dengan perspektif internasional; menekankan e-commerce dan teknologi informasi; pendidikan holistik yang membangun pengetahuan ilmiah dan makna hidup.","Bốn đặc điểm: tăng cường bốn kỹ năng tiếng Anh và tiếng Nhật cho thương mại và đàm phán quốc tế; đào tạo các lĩnh vực chuyên môn với tầm nhìn quốc tế; chú trọng thương mại điện tử và công nghệ thông tin; giáo dục toàn diện xây dựng tri thức khoa học và ý nghĩa cuộc sống.","Four features: strengthening English and Japanese listening, speaking, reading and writing to build international business and negotiation skills; training every professional field through an international lens; emphasizing e-commerce applications and information technology; and using whole-person education to cultivate scientific knowledge and a sense of life's meaning.","Четыре особенности: усиление аудирования, речи, чтения и письма на английском и японском для международного бизнеса и переговоров; подготовка по всем профессиональным направлениям с международным взглядом; акцент на применении электронной коммерции и информационных технологий; целостное образование, формирующее научные знания и понимание смысла жизни."),
  k:L("語言加專業加資訊，是這個系的三支腳。","语言加专业加信息，是这个系的三支脚。","言語と専門と情報、この学科の三本足。","Bahasa, keahlian, dan TI adalah tiga kaki program ini.","Ngôn ngữ, chuyên môn và công nghệ là ba chân của khoa.","Languages plus a specialty plus IT are the three legs this department stands on.","Языки, специальность и информационные технологии и есть три опоры этого департамента.")},
 {date:"2026-10-31",src:"大學問",url:"https://www.unews.com.tw/School/Department/65/1753",links:["fin","mkt","mkts"],
  t:L("五個學程組別：從公司理財到韓國文創","五个学程组别：从公司理财到韩国文创","5つのコース：コーポレートファイナンスから韓国文化創造産業まで","Lima jalur: dari keuangan korporat hingga industri kreatif Korea","Năm hướng chuyên ngành: từ tài chính doanh nghiệp đến công nghiệp sáng tạo Hàn Quốc","Five program tracks: from corporate finance to Korean cultural and creative industries","Пять программных направлений: от корпоративных финансов до креативных индустрий Кореи"),
  b:L("公司理財投資組、外匯數位金融組、品牌行銷企劃組、日韓商務與貿易組，以及列於繁星推薦的韓國文創產業經營組。組別橫跨財務、行銷與區域商務三條路線。","公司理财投资组、外汇数字金融组、品牌行销企划组、日韩商务与贸易组，以及列于繁星推荐的韩国文创产业经营组。组别横跨财务、营销与区域商务三条路线。","コーポレートファイナンス投資コース、外国為替デジタル金融コース、ブランドマーケティング企画コース、日韓ビジネス貿易コース、そして繁星推薦枠の韓国文化創造産業経営コース。財務、マーケティング、地域ビジネスの三系統にまたがる。","Jalur Keuangan dan Investasi Korporat, Valas dan Keuangan Digital, Perencanaan Merek dan Pemasaran, Bisnis dan Perdagangan Jepang-Korea, serta Manajemen Industri Kreatif Korea pada jalur rekomendasi bintang. Mencakup keuangan, pemasaran, dan bisnis kawasan.","Hướng Tài chính và Đầu tư Doanh nghiệp, Ngoại hối và Tài chính Số, Hoạch định Thương hiệu và Tiếp thị, Thương mại Nhật-Hàn, cùng Quản trị Công nghiệp Sáng tạo Hàn Quốc trong diện tiến cử. Trải trên ba tuyến tài chính, tiếp thị và kinh doanh khu vực.","Corporate Finance and Investment, Foreign Exchange and Digital Finance, Brand Marketing and Planning, Japan and Korea Business and Trade, plus Korean Cultural and Creative Industry Management, which is listed under the Star Program recommendation route. The tracks span three routes: finance, marketing and regional business.","Корпоративные финансы и инвестиции, валютные операции и цифровые финансы, брендовый маркетинг и планирование, бизнес и торговля с Японией и Кореей, а также управление креативными индустриями Кореи, которое идёт по каналу рекомендательного приёма. Направления охватывают три линии: финансы, маркетинг и региональный бизнес."),
  k:L("組別選擇等於先選一條產業路線。","组别选择等于先选一条产业路线。","コース選択は産業の進路選択でもある。","Memilih jalur berarti memilih lintasan industri.","Chọn hướng chuyên ngành là chọn trước một tuyến ngành nghề.","Choosing a track means choosing an industry path up front.","Выбор направления и есть выбор отраслевого пути заранее.")},
 {date:"2026-10-31",src:"大學問",url:"https://www.unews.com.tw/School/Department/65/1753",links:["hub"],
  t:L("115學年度申請入學：四組各9名","115学年度申请入学：四组各9名","2026年度の申請入学：4コース各9名","Penerimaan jalur aplikasi 2026: 9 kursi tiap jalur","Tuyển sinh theo hồ sơ năm 2026: mỗi hướng 9 chỉ tiêu","Academic year 115 application admissions: 9 places in each of four tracks","Приём по заявкам на 115 учебный год: по 9 мест в каждом из четырёх направлений"),
  b:L("公司理財投資組、外匯數位金融組、品牌行銷企劃組、日韓商務與貿易組各招9名，前三組各含離島生1名。公司理財投資組英文檢定底標、篩選倍率5.5；品牌行銷企劃組採計社會、篩選倍率由114學年的4調整為5.5。","公司理财投资组、外汇数字金融组、品牌行销企划组、日韩商务与贸易组各招9名，前三组各含离岛生1名。公司理财投资组英文检定底标、筛选倍率5.5；品牌行销企划组采计社会、筛选倍率由114学年的4调整为5.5。","4コースが各9名。前3コースには離島枠1名を含む。コーポレートファイナンス投資コースは英語が最低基準、選抜倍率5.5。ブランドマーケティング企画コースは社会科を採用し、倍率は前年度の4から5.5へ。","Empat jalur masing-masing 9 kursi; tiga jalur pertama termasuk 1 kursi pelajar pulau terpencil. Jalur Keuangan Korporat memakai ambang bahasa Inggris dengan rasio seleksi 5,5; jalur Merek memakai Ilmu Sosial, rasio naik dari 4 menjadi 5,5.","Bốn hướng mỗi hướng 9 chỉ tiêu; ba hướng đầu gồm 1 suất học sinh đảo xa. Hướng Tài chính Doanh nghiệp xét tiếng Anh với tỷ lệ sàng lọc 5,5; hướng Thương hiệu xét môn Xã hội, tỷ lệ tăng từ 4 lên 5,5.","Corporate Finance and Investment, Foreign Exchange and Digital Finance, Brand Marketing and Planning, and Japan and Korea Business and Trade each take 9 students, with the first three reserving 1 place for students from the outlying islands. Corporate Finance and Investment requires the base level on the English test with a screening multiple of 5.5; Brand Marketing and Planning counts social studies and raised its screening multiple from 4 in academic year 114 to 5.5.","Корпоративные финансы и инвестиции, валютные операции и цифровые финансы, брендовый маркетинг и планирование, бизнес и торговля с Японией и Кореей набирают по 9 студентов, причём первые три направления оставляют по 1 месту для абитуриентов с отдалённых островов. На направлении корпоративных финансов требуется базовый порог по английскому при коэффициенте отбора 5,5; направление брендового маркетинга учитывает общественные науки, а его коэффициент отбора вырос с 4 в 114 учебном году до 5,5."),
  k:L("篩選倍率放寬，代表入口比去年寬一些。","筛选倍率放宽，代表入口比去年宽一些。","倍率の緩和は入口が前年より広いことを意味する。","Rasio seleksi yang longgar berarti pintu masuk lebih lebar dari tahun lalu.","Tỷ lệ sàng lọc nới ra nghĩa là cửa vào rộng hơn năm ngoái.","A looser screening multiple means the door is a bit wider than last year.","Ослабленный коэффициент отбора значит, что вход стал чуть шире, чем в прошлом году.")},
 {date:"2026-10-31",src:"大學問",url:"https://www.unews.com.tw/School/Department/65/1753",links:["hr"],
  t:L("其他入學管道：繁星6名、考試分發5名、特殊選才1名","其他入学管道：繁星6名、考试分发5名、特殊选才1名","他の入学経路：繁星推薦6名、試験配分5名、特別選抜1名","Jalur lain: 6 rekomendasi bintang, 5 penempatan ujian, 1 bakat khusus","Các diện khác: 6 tiến cử, 5 phân bổ theo kỳ thi, 1 tuyển chọn đặc biệt","Other admission channels: 6 Star Program places, 5 exam placement places, 1 special talent place","Другие каналы приёма: 6 мест по рекомендательной программе, 5 по распределению по результатам экзаменов, 1 по отбору особых талантов"),
  b:L("繁星推薦6名，其中韓國文創產業經營組一般生1名；考試分發5名，一般生2名；四技甄選2名，保留給低收或中低收入戶；身心障礙學生甄試2名（學習障礙生）；運動優良學生甄審1名（排球）。","繁星推荐6名，其中韩国文创产业经营组一般生1名；考试分发5名，一般生2名；四技甄选2名，保留给低收或中低收入户；身心障碍学生甄试2名（学习障碍生）；运动优良学生甄审1名（排球）。","繁星推薦6名、うち韓国文化創造産業経営コースの一般枠1名。試験配分5名、一般2名。四技選抜2名は低所得世帯向け。障害学生選抜2名、学習障害。スポーツ優秀選抜1名、バレーボール。","Rekomendasi bintang 6, termasuk 1 kursi umum jalur Industri Kreatif Korea; penempatan ujian 5 dengan 2 kursi umum; seleksi vokasi 2 untuk keluarga berpenghasilan rendah; seleksi disabilitas 2 untuk kesulitan belajar; seleksi atlet 1 untuk bola voli.","Tiến cử 6 suất, trong đó 1 suất thường cho hướng Công nghiệp Sáng tạo Hàn Quốc; phân bổ theo kỳ thi 5 suất với 2 suất thường; tuyển sinh kỹ thuật 2 suất dành cho hộ thu nhập thấp; tuyển sinh khuyết tật 2 suất cho khó khăn học tập; tuyển vận động viên 1 suất bóng chuyền.","6 places by Star Program recommendation, including 1 general place in Korean Cultural and Creative Industry Management; 5 by exam placement, of which 2 are general places; 2 by four-year technical program selection, reserved for low income and lower-middle income households; 2 by selection for students with disabilities (learning disabilities); and 1 by selection for outstanding student athletes (volleyball).","6 мест по рекомендательной программе, включая 1 общее место на направлении управления креативными индустриями Кореи; 5 мест по распределению по результатам экзаменов, из них 2 общих; 2 места по отбору в четырёхлетние технические программы, зарезервированные для семей с низким и ниже среднего доходом; 2 места по отбору для студентов с инвалидностью (нарушения обучаемости); 1 место по отбору для спортсменов (волейбол)."),
  k:L("七種管道並行，分數不是唯一的門。","七种管道并行，分数不是唯一的门。","7つの経路が並ぶ、点数だけが門ではない。","Tujuh jalur berjalan bersama; nilai bukan satu-satunya pintu.","Bảy diện song song; điểm số không phải cánh cửa duy nhất.","Seven channels run in parallel, so scores are not the only door.","Семь каналов работают параллельно, и баллы уже не единственная дверь.")},
 {date:"2026-10-31",src:"大學問",url:"https://www.unews.com.tw/School/Department/65/1753",links:["tax","fin"],
  t:L("114學年度學雜費：學費35,938元、雜費7,918元","114学年度学杂费：学费35,938元、杂费7,918元","2025年度の学費35,938元、雑費7,918元","Biaya 2025: kuliah NT$35.938, administrasi NT$7.918","Học phí 2025: 35.938 Đài tệ, phí khác 7.918","Academic year 114 tuition and fees: tuition NT$35,938, miscellaneous fees NT$7,918","Плата за 114 учебный год: обучение 35 938 тайв. долл., прочие сборы 7 918 тайв. долл."),
  b:L("兩項皆為每學期金額，合計每學期43,856元。以四年八學期估算，學雜費總額約35萬元，尚未計入住宿、書籍與生活費。","两项皆为每学期金额，合计每学期43,856元。以四年八学期估算，学杂费总额约35万元，尚未计入住宿、书籍与生活费。","いずれも1学期あたり。合計43,856元。4年8学期で約35万元、寮費や書籍費、生活費は含まない。","Keduanya per semester, total NT$43.856. Untuk delapan semester sekitar NT$350.000, belum termasuk asrama, buku, dan biaya hidup.","Cả hai tính theo học kỳ, tổng 43.856. Tám học kỳ khoảng 350.000, chưa gồm ký túc xá, sách vở và sinh hoạt phí.","Both figures are per semester, totaling NT$43,856 a semester. Over four years and eight semesters that comes to roughly NT$350,000 in tuition and fees, before housing, books and living costs.","Обе суммы указаны за семестр и в совокупности дают 43 856 тайв. долл. за семестр. За четыре года и восемь семестров это около 350 000 тайв. долл. без учёта жилья, книг и расходов на жизнь."),
  k:L("把四年學費當成一筆投資，報酬要用就業去算。","把四年学费当成一笔投资，回报要用就业去算。","4年の学費は投資、回収は就職で測る。","Anggap biaya empat tahun sebagai investasi; hasilnya diukur dari karier.","Xem học phí bốn năm là một khoản đầu tư; lợi tức đo bằng việc làm.","Treat four years of tuition as an investment and measure the return by employment.","Считайте плату за четыре года инвестицией, а отдачу измеряйте трудоустройством.")},
  {date:"2026-10-31",src:"大學問",url:"https://www.unews.com.tw/School/Department/65/1753",links:["hub","hr"],
  t:L("學群歸屬：財經學群國際企業學類","学群归属：财经学群国际企业学类","学群の区分：財経学群の国際企業学類","Rumpun keilmuan: klaster keuangan, bidang bisnis internasional","Phân nhóm học thuật: nhóm tài chính, ngành kinh doanh quốc tế","Academic grouping: finance cluster, international business field","Академическая группа: финансовый кластер, направление международного бизнеса"),
  b:L("學類歸入財經學群的國際企業學類，技職體系則對應商業與管理群。主要學制為日間四年制學士班，113學年度上學期校際選課人數2人。","学类归入财经学群的国际企业学类，技职体系则对应商业与管理群。主要学制为日间四年制学士班，113学年度上学期校际选课人数2人。","学類は財経学群の国際企業学類に属し、職業教育体系では商業管理群に対応する。主な学制は昼間4年制学士課程で、2024年度前期の他大学履修は2名。","Program ini masuk klaster keuangan pada bidang bisnis internasional, dan pada jalur vokasi setara kelompok bisnis dan manajemen. Bentuk utamanya adalah program sarjana empat tahun reguler.","Chương trình thuộc nhóm tài chính, ngành kinh doanh quốc tế, và tương ứng nhóm kinh doanh và quản trị trong hệ kỹ thuật nghề. Hình thức chính là cử nhân bốn năm ban ngày.","The programme sits in the finance cluster under the international business field, and maps to the business and management group on the vocational track. The main format is the daytime four-year bachelor programme.","Программа относится к финансовому кластеру, направление международного бизнеса, а в системе профессионального образования соответствует группе бизнеса и управления. Основная форма обучения это дневной четырёхлетний бакалавриат."),
  k:L("先看學類再看組別，路線才不會選錯。","先看学类再看组别，路线才不会选错。","まず学類、次にコース。進路選びはその順番。","Lihat bidangnya dulu, baru jalurnya; begitu cara menghindari salah arah.","Xem ngành trước rồi mới xem hướng; như vậy mới không chọn nhầm lối.","Check the field first, then the track; that is how you avoid picking the wrong path.","Сначала смотрите направление, потом трек: так не ошибётесь с маршрутом.")},
 {date:"2026-10-31",src:"系所官網",url:"https://ibm.kh.usc.edu.tw/",links:["hub"],
  t:L("系所位置與聯絡：高雄市內門區大學路200號","系所位置与联系：高雄市内门区大学路200号","学科所在地：高雄市内門区大学路200号","Lokasi: Jl. Daxue 200, Distrik Neimen, Kaohsiung","Địa chỉ: số 200 đường Đại Học, quận Nội Môn, Cao Hùng","Department location and contact: No. 200, Daxue Road, Neimen District, Kaohsiung","Адрес и контакты департамента: Гаосюн, район Нэймэнь, улица Дасюэ, 200"),
  b:L("電話(07)6678888分機4230。系所官網為ibm.kh.usc.edu.tw，招生資訊另見實踐大學招生考試資訊網recruit.usc.edu.tw。","电话(07)6678888分机4230。系所官网为ibm.kh.usc.edu.tw，招生信息另见实践大学招生考试信息网recruit.usc.edu.tw。","電話(07)6678888内線4230。学科サイトはibm.kh.usc.edu.tw、入試情報はrecruit.usc.edu.tw。","Telepon (07)6678888 ext. 4230. Situs program ibm.kh.usc.edu.tw; informasi penerimaan di recruit.usc.edu.tw.","Điện thoại (07)6678888 máy lẻ 4230. Trang khoa ibm.kh.usc.edu.tw; thông tin tuyển sinh tại recruit.usc.edu.tw.","Phone (07) 6678888 extension 4230. The department website is ibm.kh.usc.edu.tw, and admissions information is also available on Shih Chien University's admissions site at recruit.usc.edu.tw.","Телефон (07) 6678888, добавочный 4230. Сайт департамента ibm.kh.usc.edu.tw, информация о приёме также на сайте приёмной кампании Университета Шицзянь recruit.usc.edu.tw."),
  k:L("內門校區在山上，交通時間要先算進來。","内门校区在山上，交通时间要先算进来。","内門キャンパスは山手にあり、通学時間を先に計算すべき。","Kampus Neimen di perbukitan; hitung waktu perjalanan sejak awal.","Cơ sở Nội Môn ở vùng đồi; hãy tính trước thời gian di chuyển.","The Neimen campus sits up in the hills, so factor travel time in first.","Кампус Нэймэнь стоит в горах, поэтому время на дорогу стоит учесть заранее.")},
 {date:"2026-10-31",src:"實踐國企群島",url:"https://geostrategist.github.io/islands/",links:["prod","mkt","hr","rd","fin"],
  t:L("課程地圖：五管如何對應這座群島","课程地图：五管如何对应这座群岛","カリキュラム地図：五管と群島の対応","Peta kurikulum: bagaimana lima fungsi memetakan kepulauan","Bản đồ chương trình: năm chức năng ứng với quần đảo","Curriculum map: how the five management functions map onto this archipelago","Карта курсов: как пять функций управления ложатся на этот архипелаг"),
  b:L("生產與供應鏈島對應生產管理，行銷島對應行銷管理，人力資源島對應人資，研發島對應研發管理，財務與市場島對應財務管理。AI與稅務兩島是跨機能的共同語言，台積電與兩座行情島提供真實案例。","生产与供应链岛对应生产管理，营销岛对应营销管理，人力资源岛对应人资，研发岛对应研发管理，财务与市场岛对应财务管理。AI与税务两岛是跨机能的共同语言，台积电与两座行情岛提供真实案例。","生産島は生産管理、マーケティング島はマーケティング管理、人事島は人的資源管理、研究開発島は研究開発管理、財務島は財務管理に対応する。AI島と税務島は機能横断の共通言語、TSMCと相場2島は実例を提供する。","Pulau produksi untuk manajemen produksi, pulau pemasaran untuk pemasaran, pulau SDM untuk sumber daya manusia, pulau R&D untuk litbang, pulau keuangan untuk manajemen keuangan. Pulau AI dan pajak adalah bahasa bersama lintas fungsi; TSMC dan dua pulau harga memberi kasus nyata.","Đảo sản xuất ứng với quản trị sản xuất, đảo tiếp thị ứng với tiếp thị, đảo nhân sự ứng với nhân lực, đảo R&D ứng với nghiên cứu phát triển, đảo tài chính ứng với quản trị tài chính. Đảo AI và đảo thuế là ngôn ngữ chung xuyên chức năng; TSMC và hai đảo giá cung cấp tình huống thật.","The Production and Supply Chain island maps to production management, the Marketing island to marketing management, the Human Resources island to HR, the R&D island to R&D management, and the Finance and Markets island to financial management. The AI and Tax islands are the shared language across functions, while TSMC and the two market islands supply real cases.","Остров производства и цепочки поставок отвечает за производственный менеджмент, остров маркетинга за маркетинг, остров человеческих ресурсов за управление персоналом, остров НИОКР за управление разработками, остров финансов и рынков за финансовый менеджмент. Острова ИИ и налогов служат общим языком между функциями, а TSMC и два острова котировок дают реальные кейсы."),
  k:L("先走完五管五島，再看台積電的財報就不一樣。","先走完五管五岛，再看台积电的财报就不一样。","五管の5島を回ってからTSMCの決算を見ると違って見える。","Kelilingi lima pulau fungsi dulu; laporan TSMC akan terbaca berbeda.","Đi hết năm đảo chức năng rồi đọc báo cáo TSMC sẽ khác hẳn.","Walk all five management islands first, and TSMC's financials will read differently.","Обойдите сначала все пять островов управления, и отчётность TSMC будет читаться иначе.")}
 ]},
{id:"sec",kind:"guard",color:"#3F5E8C",ring:3,ang:285,
 name:L("國家安全","国家安全","国家安全","Keamanan Nasional","An ninh Quốc gia","National Security","Национальная безопасность"),
 tag:L("國家安全晨報 2026-11-03","国家安全晨报 2026-11-03","国家安全朝刊 2026-11-03","Laporan Pagi Keamanan Nasional 2026-11-03","Bản tin sáng An ninh Quốc gia 2026-11-03","National Security Daily Brief 2026-11-03","Утренняя сводка по национальной безопасности, 2026-11-03"),
 desc:L("本島追蹤認知作戰與資訊操縱、滲透統戰與情報活動、關鍵基礎設施與資安、海纜、經濟脅迫與供應鏈韌性、移民與邊境、境外案例及法制治理。資料取自國家安全晨報，保留機關與媒體的歸因語氣，偵查中案件不作有罪認定，未確認事項如實標示。","本岛追踪认知作战与信息操纵、渗透统战与情报活动、关键基础设施与网络安全、海缆、经济胁迫与供应链韧性、移民与边境、境外案例及法制治理。资料取自国家安全晨报，保留机关与媒体的归因语气，侦查中案件不作有罪认定，未确认事项如实标示。","この島は認知戦と情報操作、浸透・統一戦線工作と情報活動、重要インフラとサイバーセキュリティ、海底ケーブル、経済的威圧とサプライチェーンの強靱性、移民と国境、海外事例、法制とガバナンスを追跡します。資料は国家安全朝刊に基づき、機関や報道の帰属表現を保ち、捜査中の事件を有罪とは扱わず、未確認事項はその旨を示します。","Pulau ini memantau perang kognitif dan manipulasi informasi, infiltrasi, front persatuan dan kegiatan intelijen, infrastruktur vital dan keamanan siber, kabel laut, paksaan ekonomi dan ketahanan rantai pasok, migrasi dan perbatasan, kasus luar negeri, serta hukum dan tata kelola. Data diambil dari Laporan Pagi Keamanan Nasional, atribusi lembaga dan media dipertahankan, kasus yang masih diselidiki tidak ditulis sebagai bersalah, dan hal yang belum terkonfirmasi ditandai apa adanya.","Đảo này theo dõi tác chiến nhận thức và thao túng thông tin, xâm nhập, mặt trận thống nhất và hoạt động tình báo, hạ tầng trọng yếu và an ninh mạng, cáp biển, cưỡng ép kinh tế và khả năng chống chịu của chuỗi cung ứng, di trú và biên giới, các trường hợp ở nước ngoài, cùng pháp luật và quản trị. Dữ liệu lấy từ Bản tin sáng An ninh Quốc gia, giữ nguyên cách quy nguồn của cơ quan và báo chí, không coi vụ đang điều tra là có tội, và nêu rõ điều chưa được xác nhận.","This island tracks cognitive warfare and information manipulation, infiltration, united front and intelligence activity, critical infrastructure and cybersecurity, subsea cables, economic coercion and supply chain resilience, migration and borders, overseas cases, and law and governance. Its data comes from the National Security Daily Brief, keeps the attribution used by agencies and media, does not treat cases under investigation as guilt, and marks what remains unconfirmed.","Остров отслеживает когнитивную войну и манипуляции информацией, проникновение, деятельность единого фронта и разведки, критическую инфраструктуру и кибербезопасность, подводные кабели, экономическое принуждение и устойчивость цепочек поставок, миграцию и границы, зарубежные примеры, право и управление. Данные взяты из Утренней сводки по национальной безопасности; атрибуция ведомств и СМИ сохранена, дела на стадии расследования не трактуются как вина, неподтверждённое отмечено."),
 items:[
 {date:"2026-11-02",src:"法務部調查局",url:"https://www.mjib.gov.tw/news/Details/1/1224",links:["ai"],t:L("調查局偵辦台北市長候選人深偽音檔案，報導載法院裁定交保10萬元","调查局侦办台北市长候选人深度伪造音频案，报道称法院裁定交保10万元","調査局が台北市長候補の音声ディープフェイク事件を捜査、報道によれば裁判所は保釈金10万台湾元を決定","Biro Investigasi menyelidiki kasus audio deepfake calon Wali Kota Taipei; menurut laporan, pengadilan menetapkan jaminan NT$100.000","Cục Điều tra điều tra vụ âm thanh deepfake về ứng viên thị trưởng Đài Bắc; theo đưa tin, tòa án cho tại ngoại với 100.000 Đài tệ","Investigation Bureau probes deepfake audio about a Taipei mayoral candidate; court reportedly set NT$100,000 bail","Бюро расследований ведёт дело о дипфейк-аудио о кандидате в мэры Тайбэя; по сообщениям, суд назначил залог 100 000 новых тайваньских долларов"),b:L("調查局稱10月30日網路巡察時發現影音檔，鑑識確認音頻係深偽，涉選罷法第104條，桃園地檢署聲請羈押禁見。中央社報導載，桃園地院10月31日裁定交保並限制出境、出海8個月。案件仍在偵查。","调查局称10月30日网络巡查时发现影音文件，鉴识确认音频系深度伪造，涉选罢法第104条，桃园地检署声请羁押禁见。中央社报道称，桃园地方法院10月31日裁定交保并限制出境、出海8个月。案件仍在侦查。","調査局によると、10月30日のネット巡回で動画を発見し、鑑定で音声がディープフェイクと確認された。選挙罷免法第104条に関わり、桃園地検が勾留と接見禁止を請求した。中央社によれば桃園地裁は10月31日、保釈と8か月の出国・出海制限を決定した。捜査は継続中。","Biro Investigasi menyatakan file video ditemukan saat patroli daring 30 Oktober dan forensik memastikan audionya deepfake; terkait Pasal 104 UU Pemilihan dan Recall, kejaksaan Taoyuan meminta penahanan tanpa kunjungan. Menurut CNA, Pengadilan Taoyuan pada 31 Oktober menetapkan jaminan serta larangan ke luar negeri dan melaut 8 bulan. Penyidikan berlanjut.","Cục Điều tra cho biết phát hiện tệp video khi tuần tra mạng ngày 30/10, giám định xác nhận âm thanh là deepfake, liên quan Điều 104 Luật Bầu cử và Bãi miễn; Viện kiểm sát Đào Viên đề nghị tạm giam cấm tiếp xúc. Theo CNA, ngày 31/10 Tòa Đào Viên cho tại ngoại và cấm xuất cảnh, ra biển 8 tháng. Vụ án vẫn đang điều tra.","The bureau says an online patrol found the video on October 30 and forensics confirmed the audio was a deepfake, under Article 104 of the election and recall law; Taoyuan prosecutors sought detention incommunicado. CNA reports the Taoyuan court on October 31 ordered bail and an 8-month ban on leaving the country or going to sea. The investigation continues.","По данным бюро, файл обнаружен при онлайн-патрулировании 30 октября, экспертиза подтвердила дипфейк аудио; дело связано со статьёй 104 закона о выборах и отзыве, прокуратура Таоюаня просила арест без свиданий. По сообщению ЦАН, суд Таоюаня 31 октября назначил залог и запрет на выезд и выход в море на 8 месяцев. Расследование продолжается."),k:L("深偽條項已進入司法程序，案件偵查中，調查局新聞稿未就境外連結作陳述。","深度伪造条款已进入司法程序，案件侦查中，调查局新闻稿未就境外关联作陈述。","ディープフェイク条項が司法手続きに入ったが捜査中で、調査局の発表は海外との関連に言及していない。","Pasal deepfake telah masuk proses peradilan; kasus masih diselidiki dan siaran pers biro tidak menyatakan apa pun soal kaitan luar negeri.","Điều khoản deepfake đã vào quy trình tư pháp; vụ án còn điều tra và thông cáo của Cục không nói gì về liên hệ nước ngoài.","The deepfake clause has entered the judicial process; the case is still under investigation and the bureau's release says nothing on foreign links.","Норма о дипфейках вошла в судебную практику; дело расследуется, а в пресс-релизе бюро о зарубежных связях ничего не сказано.")},
 {date:"2026-11-02",src:"中央社",url:"https://www.cna.com.tw/news/asoc/202611020249.aspx",links:["con"],t:L("一名無黨籍立委11月2日以被告身分遭約談並限制出境出海，案仍在偵查","一名无党籍立法委员11月2日以被告身份被约谈并限制出境出海，案件仍在侦查","無党籍の立法委員1人が11月2日に被告として聴取され出国・出海を制限、捜査は継続中","Seorang legislator independen dipanggil sebagai tersangka pada 2 November dan dilarang ke luar negeri serta melaut; penyidikan berlanjut","Một nghị sĩ không đảng phái bị thẩm vấn với tư cách bị can ngày 2/11 và bị cấm xuất cảnh, ra biển; vụ án vẫn đang điều tra","An independent legislator was questioned as a defendant on November 2 and barred from leaving the country or going to sea; the probe continues","Беспартийный депутат 2 ноября допрошен в качестве обвиняемого, ему запрещён выезд и выход в море; расследование продолжается"),b:L("中央社報導載，高檢署指揮調查局偵辦該委員助理涉收受中國資金、在台發展組織，涉國家安全法等罪。兩名公費助理9月經裁准羈押禁見2個月；該委員訊後無保請回。起訴與否未載。","中央社报道称，高检署指挥调查局侦办该委员助理涉收受中国资金、在台发展组织，涉国家安全法等罪。两名公费助理9月经裁准羁押禁见2个月；该委员讯后无保释放。是否起诉未载。","中央社によると、高等検察署の指揮で調査局が同委員の助手について、中国資金の受領と台湾での組織発展の疑いで国家安全法違反などを捜査している。公費助手2人は9月に2か月の勾留と接見禁止が認められ、同委員は聴取後に保釈金なしで帰宅した。起訴の有無は記載がない。","Menurut CNA, Kejaksaan Tinggi memimpin Biro Investigasi menyelidiki asisten legislator itu atas dugaan menerima dana Tiongkok dan membangun organisasi di Taiwan, antara lain melanggar UU Keamanan Nasional. Dua asisten berbiaya negara ditahan 2 bulan sejak September; legislator dipulangkan tanpa jaminan. Soal dakwaan tidak disebutkan.","Theo CNA, Viện kiểm sát cấp cao chỉ đạo Cục Điều tra điều tra trợ lý của nghị sĩ này vì nghi nhận tiền Trung Quốc và phát triển tổ chức tại Đài Loan, liên quan Luật An ninh Quốc gia. Hai trợ lý công được chuẩn tạm giam 2 tháng từ tháng 9; nghị sĩ được cho về không cần bảo lãnh. Chưa nêu có truy tố hay không.","CNA reports that high prosecutors, working with the Investigation Bureau, are probing the legislator's aide over alleged receipt of Chinese funds and building an organization in Taiwan, including National Security Act offenses. Two publicly funded aides were detained for 2 months in September; the legislator was released without bail. Whether charges follow is not stated.","По сообщению ЦАН, Высшая прокуратура и Бюро расследований проверяют помощника депутата по подозрению в получении китайских средств и создании организации на Тайване, в том числе по закону о нацбезопасности. Двое помощников на госоплате в сентябре арестованы на 2 месяца; депутат отпущен без залога. О предъявлении обвинения не сообщается."),k:L("晨報所記首件涉現任立委的國安法偵查案，限制出境不含犯罪事實認定。","晨报所记首件涉现任立法委员的国安法侦查案，限制出境不含犯罪事实认定。","朝刊が記録する現職立法委員に関わる初の国安法捜査で、出国制限は犯罪事実の認定を含まない。","Ini kasus penyidikan UU Keamanan Nasional pertama yang dicatat laporan ini terkait legislator aktif; larangan ke luar negeri bukan penetapan fakta pidana.","Đây là vụ điều tra theo Luật An ninh Quốc gia đầu tiên mà bản tin ghi nhận liên quan nghị sĩ đương nhiệm; lệnh cấm xuất cảnh không phải kết luận về hành vi phạm tội.","This is the first National Security Act probe the brief has recorded involving a sitting legislator; a travel ban is not a finding of criminal fact.","Это первое отмеченное сводкой расследование по закону о нацбезопасности с участием действующего депутата; запрет на выезд не означает установления факта преступления.")},
 {date:"2026-11-02",src:"數位發展部",url:"https://moda.gov.tw/press/press-releases/21226",links:["rd"],t:L("政府網站憑證不符國際標準，涉962個機關9772張，須於11月6日前更新","政府网站证书不符国际标准，涉962个机关9772张，须于11月6日前更新","政府サイト証明書のシリアル乱数長が国際基準に不適合、962機関9772枚が対象で11月6日までに更新","Panjang acak nomor seri sertifikat situs pemerintah tak sesuai standar internasional; 962 instansi, 9.772 sertifikat harus diperbarui sebelum 6 November","Độ dài số ngẫu nhiên của số sê-ri chứng thư website chính phủ không đạt chuẩn quốc tế; 962 cơ quan, 9.772 chứng thư phải cập nhật trước 6/11","Government website certificates fall short of international serial-number randomness rules; 962 agencies and 9,772 certificates must update by November 6","Длина случайной части серийных номеров сертификатов госсайтов не отвечает международному стандарту: 962 ведомства и 9772 сертификата нужно обновить до 6 ноября"),b:L("數位發展部稱，國際社群Bugzilla於10月30日通報台灣網路認證公司核發的部分憑證有此問題。該公司11月1日完成重新產製，至11月2日晚間926張完成更新；該部將調查違約情事，依約罰款及求償。","数字发展部称，国际社区Bugzilla于10月30日通报台湾网络认证公司签发的部分证书有此问题。该公司11月1日完成重新生成，至11月2日晚间926张完成更新；该部将调查违约情况，依约罚款及求偿。","数位発展部によると、国際コミュニティBugzillaが10月30日、TWCA発行の一部証明書の問題を通報した。同社は11月1日に再発行を完了し、11月2日夜までに926枚が更新された。同部は契約違反を調査し、契約に基づき違約金と賠償を求める。","Kementerian Urusan Digital menyatakan komunitas internasional Bugzilla melaporkan masalah sebagian sertifikat TWCA pada 30 Oktober. TWCA selesai menerbitkan ulang pada 1 November; hingga malam 2 November, 926 sertifikat telah diperbarui. Kementerian akan menyelidiki pelanggaran kontrak, mengenakan denda, dan menuntut ganti rugi sesuai kontrak.","Bộ Phát triển Số cho biết cộng đồng quốc tế Bugzilla ngày 30/10 thông báo vấn đề ở một phần chứng thư do TWCA cấp. TWCA hoàn tất tạo lại ngày 1/11; đến tối 2/11 có 926 chứng thư đã cập nhật. Bộ sẽ điều tra vi phạm hợp đồng, phạt và đòi bồi thường theo hợp đồng.","The Ministry of Digital Affairs says the international Bugzilla community reported the problem in some TWCA-issued certificates on October 30. TWCA finished reissuing them on November 1, and 926 had been updated by the evening of November 2. The ministry will investigate breach of contract and seek penalties and compensation under the contract.","Минцифры сообщает, что международное сообщество Bugzilla 30 октября указало на проблему части сертификатов TWCA. Компания завершила перевыпуск 1 ноября, к вечеру 2 ноября обновлено 926 сертификатов. Министерство расследует нарушение договора и потребует штраф и возмещение по договору."),k:L("問題出在受託機構產製品質而非外部入侵，未換發的網站將對使用者顯示警示。","问题出在受托机构生成质量而非外部入侵，未更换的网站将向用户显示警告。","原因は外部侵入ではなく受託機関の生成品質にあり、未更新のサイトは利用者に警告を表示する。","Masalahnya ada pada mutu penerbitan oleh lembaga yang ditunjuk, bukan peretasan; situs yang belum diganti akan menampilkan peringatan kepada pengguna.","Vấn đề nằm ở chất lượng tạo chứng thư của đơn vị được ủy thác, không phải xâm nhập; website chưa thay sẽ hiện cảnh báo cho người dùng.","The fault lies in the contractor's issuing quality, not an outside intrusion; sites that do not replace certificates will show users warnings.","Причина в качестве выпуска у подрядчика, а не во внешнем взломе; сайты без замены сертификата будут показывать пользователям предупреждение.")},
 {date:"2026-11-02",src:"數位發展部",url:"https://moda.gov.tw/major-policies/subseacable/fault/1749",links:["con"],t:L("海纜未修復障礙增為8條11筆，新增臺金二號11月1日障礙，該頁未載成因","海缆未修复故障增为8条11笔，新增台金二号11月1日故障，该页未载成因","未修復の海底ケーブル障害が8本11件に増加、台金2号の11月1日障害が新規、原因の記載なし","Gangguan kabel laut yang belum pulih menjadi 8 kabel 11 kejadian, termasuk Taiwan-Kinmen No. 2 pada 1 November; penyebab tidak dicantumkan","Sự cố cáp biển chưa khắc phục tăng lên 8 tuyến 11 lượt, thêm tuyến Đài Loan-Kim Môn số 2 ngày 1/11; trang không nêu nguyên nhân","Unrepaired subsea cable faults rise to 11 on 8 cables, adding Taiwan-Kinmen No. 2 on November 1; the page gives no cause","Неустранённых повреждений подводных кабелей стало 11 на 8 линиях, добавился кабель Тайвань-Цзиньмэнь № 2 (1 ноября); причины не указаны"),b:L("數位發展部海纜障礙狀況頁11月2日更新：臺金二號預計12月31日修復；橫太平洋快速另增10月30日一筆；東亞交匯一號預計修復日由11月15日延後至11月30日，延後15日。各筆成因均未載。","数字发展部海缆故障状况页11月2日更新：台金二号预计12月31日修复；横太平洋快速另增10月30日一笔；东亚交汇一号预计修复日由11月15日推迟至11月30日，推迟15日。各笔成因均未载。","数位発展部の障害ページは11月2日更新。台金2号の修復予定は12月31日、トランスパシフィック・エクスプレスに10月30日の障害1件が追加、東アジア・クロッシング1号の修復予定は11月15日から11月30日へ15日延期。いずれも原因の記載はない。","Halaman gangguan Kementerian Urusan Digital diperbarui 2 November: Taiwan-Kinmen No. 2 ditargetkan pulih 31 Desember; Trans Pacific Express bertambah satu gangguan 30 Oktober; East Asia Crossing 1 mundur 15 hari dari 15 ke 30 November. Penyebab setiap gangguan tidak dicantumkan.","Trang sự cố của Bộ Phát triển Số cập nhật ngày 2/11: tuyến Đài Loan-Kim Môn số 2 dự kiến sửa xong 31/12; Trans Pacific Express thêm một lượt ngày 30/10; East Asia Crossing 1 lùi 15 ngày, từ 15/11 sang 30/11. Trang không nêu nguyên nhân của từng lượt.","The Ministry of Digital Affairs fault page, updated November 2, expects Taiwan-Kinmen No. 2 repaired by December 31, adds an October 30 fault on Trans Pacific Express, and moves East Asia Crossing 1 back 15 days from November 15 to November 30. No causes are listed.","Страница Минцифры от 2 ноября: ремонт кабеля Тайвань-Цзиньмэнь № 2 ожидается к 31 декабря, у Trans Pacific Express добавилось повреждение от 30 октября, срок для East Asia Crossing 1 сдвинут на 15 дней, с 15 на 30 ноября. Причины не указаны."),k:L("官方未載成因與備援安排，不宜以單一障礙推論服務中斷或作歸因。","官方未载成因与备援安排，不宜以单一故障推论服务中断或作归因。","公式には原因も代替手段も示されておらず、単一の障害からサービス停止や帰属を推論すべきでない。","Pemerintah tidak mencantumkan penyebab dan cadangan, jadi satu gangguan tak boleh dijadikan dasar menyimpulkan putusnya layanan atau pelakunya.","Phía chính thức không nêu nguyên nhân và phương án dự phòng, nên không thể từ một sự cố mà suy ra gián đoạn dịch vụ hay quy trách nhiệm.","Officials list neither cause nor backup arrangements, so a single fault should not be read as a service outage or attributed to anyone.","Власти не указали ни причин, ни резервных мер, поэтому по одному повреждению нельзя судить о перебоях связи или о виновных.")},
 {date:"2026-10-30",src:"中央社",url:"https://www.cna.com.tw/news/aipl/202610300002.aspx",links:["con"],t:L("美國務院背景回覆稱反對脅迫，歡迎巴基斯坦推翻拒絕台灣民航業者使用空域決定","美国国务院背景回复称反对胁迫，欢迎巴基斯坦推翻拒绝台湾民航业者使用空域决定","米国務省が背景説明形式で威圧行為に反対と回答、パキスタンが台湾の民間航空会社への空域拒否を覆したことを歓迎","Deplu AS menjawab secara latar belakang bahwa menentang paksaan dan menyambut Pakistan membatalkan penolakan wilayah udara bagi maskapai Taiwan","Bộ Ngoại giao Mỹ trả lời theo hình thức nền rằng phản đối cưỡng ép, hoan nghênh Pakistan đảo ngược quyết định từ chối hãng hàng không Đài Loan dùng không phận","US State Department replies on background that it opposes coercion and welcomes Pakistan reversing its denial of airspace to Taiwan carriers","Госдеп США в фоновом ответе заявил о неприятии принуждения и приветствовал отмену Пакистаном отказа тайваньским авиакомпаниям в воздушном пространстве"),b:L("彭博引述文件經中央社報導，巴基斯坦民航局10月28日核准中華航空與長榮航空使用空域至2027年3月27日。交通部稱該期間為國際冬季班表期間，航路每季申請，到明年3月再申請夏季班表。核准文件原文未公開。","中央社援引彭博称，据文件，巴基斯坦民航局10月28日批准中华航空与长荣航空使用空域至2027年3月27日。交通部称该期间为国际冬季航班时刻表期间，航路每季申请，到明年3月再申请夏季时刻表。批准文件原文未公开。","中央社が伝えたブルームバーグによると、パキスタン民航局は10月28日、チャイナエアラインとエバー航空の空域使用を2027年3月27日まで認めた。交通部は同期間を国際的な冬ダイヤ期間とし、航路は四半期ごとに申請し、来年3月に夏ダイヤを申請するとした。承認文書の原文は未公開。","CNA mengutip Bloomberg: otoritas penerbangan Pakistan pada 28 Oktober mengizinkan China Airlines dan EVA Air memakai wilayah udaranya hingga 27 Maret 2027. Kementerian Transportasi menyebut periode itu jadwal musim dingin internasional; rute diajukan tiap musim dan jadwal musim panas diajukan Maret depan. Dokumen asli belum dipublikasikan.","CNA dẫn Bloomberg: ngày 28/10, cơ quan hàng không Pakistan chấp thuận China Airlines và EVA Air dùng không phận đến 27/3/2027. Bộ Giao thông nói đó là kỳ lịch bay mùa đông quốc tế, đường bay nộp đơn theo mùa, tháng 3 năm sau nộp lịch mùa hè. Văn bản gốc chưa công bố.","CNA, citing Bloomberg, says Pakistan's aviation authority on October 28 approved China Airlines and EVA Air using its airspace until March 27, 2027. The transport ministry calls that the international winter schedule period, with routes applied for each season and the summer schedule next March. The approval document is unpublished.","ЦАН со ссылкой на Bloomberg: 28 октября авиавласти Пакистана разрешили China Airlines и EVA Air пользоваться воздушным пространством до 27 марта 2027 года. Минтранс называет это периодом международного зимнего расписания: маршруты подаются посезонно, летнее расписание подаётся в марте. Текст разрешения не опубликован."),k:L("第三國行政許可也可成為對台施壓工具，明年3月夏季班表申請結果是觀察點。","第三国行政许可也可成为对台施压工具，明年3月夏季时刻表申请结果是观察点。","第三国の行政許可も対台湾の圧力手段になり得る。来年3月の夏ダイヤ申請の結果が注目点となる。","Izin administratif negara ketiga juga bisa menjadi alat tekanan terhadap Taiwan; hasil pengajuan jadwal musim panas Maret depan patut diamati.","Giấy phép hành chính của nước thứ ba cũng có thể thành công cụ gây sức ép với Đài Loan; kết quả xin lịch mùa hè tháng 3 tới là điểm cần theo dõi.","A third country's administrative permit can also become a pressure tool on Taiwan; next March's summer schedule application is the point to watch.","Административное разрешение третьей страны тоже может стать средством давления на Тайвань; ключевой момент: итог заявки на летнее расписание в марте.")},
