 {date:"2026-10-13",src:"鉅亨網",url:"https://news.cnyes.com/news/id/6629476",links:["fin","mkts"],t:L("前9月全國稅收3.57兆元、年增24.4%，預算達成率115%","前9月全国税收3.57兆元、年增24.4%，预算达成率115%","1月から9月の全国税収は3.57兆元、前年比24.4%増、予算達成率115%","Penerimaan pajak nasional Januari hingga September NT$3,57 triliun, naik 24,4%, capaian anggaran 115%","Thu thuế toàn quốc 9 tháng đạt 3,57 nghìn tỷ, tăng 24,4%, đạt 115% dự toán","National tax revenue for the first nine months reached NT$3.57 trillion, up 24.4%, at 115% of budget","Налоговые поступления за девять месяцев составили 3,57 трлн тайв. долл., рост на 24,4%, выполнение бюджета 115%"),b:L("鉅亨網報導，9月證交稅534億元、連續14個月正成長。前9月證交稅增3,077億元、營所稅增1,853億元、營業稅增1,203億元，為最主要成長引擎。","钜亨网报道，9月证交税534亿元、连续14个月正成长。前9月证交税增3,077亿元、营所税增1,853亿元、营业税增1,203亿元，为最主要成长引擎。","鉅亨網によると、9月の証券取引税は534億元で14カ月連続のプラス。1月から9月は証券取引税3,077億元増、法人税1,853億元増、営業税1,203億元増が主な牽引役。","Cnyes: pajak transaksi sekuritas September NT$53,4 miliar, tumbuh 14 bulan beruntun. Sembilan bulan: pajak sekuritas naik NT$307,7 miliar, pajak badan NT$185,3 miliar, pajak usaha NT$120,3 miliar, motor utama pertumbuhan.","Theo Cnyes, thuế giao dịch chứng khoán tháng 9 đạt 53,4 tỷ, tăng 14 tháng liên tiếp. Chín tháng: thuế chứng khoán tăng 307,7 tỷ, thuế doanh nghiệp 185,3 tỷ, thuế kinh doanh 120,3 tỷ, là động lực tăng trưởng chính.","Cnyes reports September securities transaction tax of NT$53.4 billion, the 14th straight month of growth. Over nine months, securities tax rose NT$307.7 billion, corporate income tax NT$185.3 billion and business tax NT$120.3 billion, the main growth engines.","По данным Cnyes, налог на операции с ценными бумагами в сентябре составил 53,4 млрд тайв. долл., рост четырнадцатый месяц подряд. За девять месяцев он вырос на 307,7 млрд, налог на прибыль на 185,3 млрд, налог на бизнес на 120,3 млрд, это главные двигатели роста."),k:L("鉅亨網載前9月實徵淨額已占全年預算數78.8%。","钜亨网载前9月实征净额已占全年预算数78.8%。","鉅亨網によると、1月から9月の実徴収純額は通年予算の78.8%。","Cnyes: realisasi bersih sembilan bulan setara 78,8% anggaran setahun.","Cnyes: số thu ròng thực tế 9 tháng chiếm 78,8% dự toán cả năm.","Cnyes says net collections over nine months already equal 78.8% of the full-year budget.","По данным Cnyes, чистые сборы за девять месяцев составляют 78,8% годового бюджета.")},
 {date:"2026-10-23",src:"財政部中區國稅局",url:"https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=0c43a4c326d54c78bd3d20ab7ff9a022",links:["fin"],t:L("國稅局：營利事業逾期繳稅三日內補繳，仍可適用盈虧互抵","国税局：营利事业逾期缴税三日内补缴，仍可适用盈亏互抵","国税局：法人が納税遅延でも3日以内の補納なら欠損金控除を適用可","Kantor Pajak: badan usaha yang telat bayar tetap bisa kompensasi rugi jika dilunasi dalam tiga hari","Cục Thuế: doanh nghiệp nộp trễ nhưng nộp bù trong ba ngày vẫn được bù trừ lỗ","Tax bureau: companies paying late can still offset losses if they pay within three days","Налоговое управление: компании при просрочке могут зачесть убытки, если доплатят в течение трёх дней"),b:L("須於法定期限申報，且為藍色申報書或會計師查核簽證案件；申報期屆滿翌日起三日內補繳、未達加徵滯納金標準，仍視為如期申報。超過三日者加徵滯納金，也不得盈虧互抵。","须于法定期限申报，且为蓝色申报书或会计师查核签证案件；申报期届满翌日起三日内补缴、未达加征滞纳金标准，仍视为如期申报。超过三日者加征滞纳金，也不得盈亏互抵。","法定期限内の申告で、青色申告または会計士監査証明の案件が対象。申告期限翌日から3日以内の補納で延滞金基準に達しなければ期限内申告とみなす。3日を超えると延滞金が課され、欠損金控除も不可。","Harus lapor tepat waktu dan memakai formulir biru atau diaudit akuntan; pelunasan dalam tiga hari setelah tenggat tanpa denda dianggap tepat waktu. Lewat tiga hari kena denda dan tidak dapat kompensasi rugi.","Phải kê khai đúng hạn, dùng tờ khai xanh hoặc được kế toán viên kiểm toán; nộp bù trong ba ngày kể từ sau hạn, chưa đến mức phạt chậm nộp, vẫn coi là đúng hạn. Quá ba ngày sẽ bị phạt và không được bù trừ lỗ.","The return must be filed on time, on a blue return or certified by an accountant. Payment within three days after the deadline, below the late-fee threshold, still counts as on-time filing. Beyond three days, a late fee applies and losses cannot be offset.","Декларация должна быть подана в срок, по синей форме или с заверением бухгалтера. Уплата в течение трёх дней после срока, не достигающая порога пени, считается своевременной. После трёх дней начисляется пеня, а зачёт убытков невозможен."),k:L("遲繳超過三日，賠上的是前10年虧損扣抵。","迟缴超过三日，赔上的是前10年亏损扣抵。","3日を超える遅延で失うのは過去10年分の欠損金控除だ。","Telat lebih dari tiga hari berarti kehilangan kompensasi rugi 10 tahun sebelumnya.","Trễ quá ba ngày sẽ mất quyền bù trừ lỗ của 10 năm trước.","Paying more than three days late costs the offset against losses from the previous 10 years.","Просрочка более трёх дней лишает зачёта убытков за предыдущие 10 лет.")},
 {date:"2026-10-22",src:"中央社",url:"https://www.cna.com.tw/news/afe/202610220385.aspx",links:["fin"],t:L("金管會擬推TISA租稅優惠，綜所稅每人每年可減除2.4萬元","金管会拟推TISA税收优惠，综所税每人每年可减除2.4万元","金管会がTISA税優遇を計画、総合所得税で1人年2.4万元まで控除","FSC rencanakan insentif pajak TISA, pengurang pajak penghasilan NT$24.000 per orang per tahun","FSC dự kiến ưu đãi thuế TISA, khấu trừ thuế thu nhập 24.000 mỗi người mỗi năm","FSC plans TISA tax break, with NT$24,000 per person per year deductible from income","FSC планирует налоговую льготу TISA: вычет 24 000 тайв. долл. на человека в год"),b:L("中央社報導，初步規劃本人、配偶及受扶養未成年子女每人每年2.4萬元額度內可自綜合所得總額減除，3口之家合計7.2萬元。金管會盼年底前展開60天預告，2028年報稅適用。","中央社报道，初步规划本人、配偶及受抚养未成年子女每人每年2.4万元额度内可自综合所得总额减除，3口之家合计7.2万元。金管会盼年底前展开60天预告，2028年报税适用。","中央社によると、本人、配偶、扶養未成年子女は1人年2.4万元まで総合所得から控除する案で、3人家族で計7.2万元。金管会は年内に60日の予告を始め、2028年の申告から適用を目指す。","CNA: rencana awal, wajib pajak, pasangan dan anak di bawah umur tanggungan masing-masing dapat mengurangkan hingga NT$24.000 per tahun, keluarga bertiga NT$72.000. FSC berharap mulai pra-pengumuman 60 hari sebelum akhir tahun, berlaku untuk pelaporan 2028.","Theo CNA, dự kiến bản thân, vợ chồng và con vị thành niên phụ thuộc được khấu trừ tối đa 24.000 mỗi người mỗi năm, gia đình ba người tổng 72.000. FSC mong bắt đầu lấy ý kiến 60 ngày trước cuối năm, áp dụng từ kỳ khai thuế 2028.","CNA reports that under the preliminary plan taxpayers, spouses and dependent minor children could each deduct up to NT$24,000 a year, or NT$72,000 for a family of three. The FSC hopes to begin a 60-day pre-announcement by year-end, applying to 2028 filing.","По данным CNA, по предварительному плану налогоплательщик, супруг и несовершеннолетние иждивенцы смогут вычитать до 24 000 тайв. долл. на человека в год, семья из трёх человек 72 000. FSC рассчитывает до конца года начать 60-дневное предварительное обсуждение и применять льготу с деклараций 2028 года."),k:L("不符免稅條件而提領，歷年提撥合計數將併入提領年度所得課稅。","不符免税条件而提领，历年提拨合计数将并入提领年度所得课税。","免税条件を満たさず引き出すと、過去の拠出累計が引出年度の所得に算入され課税される。","Penarikan tanpa syarat bebas pajak membuat total setoran masuk ke penghasilan tahun penarikan.","Rút khi không đủ điều kiện miễn thuế, tổng số đã góp sẽ cộng vào thu nhập năm rút để tính thuế.","Withdrawals that fail the exemption conditions add all past contributions to that year's taxable income.","При снятии без соблюдения условий все прошлые взносы включаются в налогооблагаемый доход года снятия.")}
 ]},
{id:"prod",kind:"factory",color:"#E85D3A",ring:1,ang:180,
 name:L("生產與供應鏈","生产与供应链","生産・サプライチェーン","Produksi dan Rantai Pasok","Sản xuất và chuỗi cung ứng","Production and Supply Chain","Производство и цепочка поставок"),
 tag:L("五管：生產管理","五管：生产管理","五管：生産管理","Lima fungsi: produksi","Năm chức năng: sản xuất","Five management functions: production management","Пять управленческих функций: управление производством"),
 desc:L("生產與供應鏈管理，是把原料變成產品、再送到客戶手上的整個流程：產能規劃、採購、工廠布局、物流與庫存。這座島追蹤台灣製造業的擴產、缺料、漲價與海外設廠。","生产与供应链管理，是把原料变成产品、再送到客户手上的整个流程：产能规划、采购、工厂布局、物流与库存。这座岛追踪台湾制造业的扩产、缺料、涨价与海外设厂。","生産・サプライチェーン管理は原材料を製品にし顧客へ届ける流れ全体です。生産能力計画、調達、工場配置、物流、在庫。この島は台湾製造業の増産、部材不足、値上げ、海外工場を追います。","Manajemen produksi dan rantai pasok adalah alur mengubah bahan baku menjadi produk sampai ke pelanggan: kapasitas, pengadaan, tata letak pabrik, logistik, persediaan. Pulau ini melacak ekspansi, kelangkaan, kenaikan harga, dan pabrik luar negeri.","Quản trị sản xuất và chuỗi cung ứng là quy trình biến nguyên liệu thành sản phẩm tới khách hàng: công suất, mua hàng, bố trí nhà máy, logistics, tồn kho. Đảo này theo dõi mở rộng, thiếu hụt, tăng giá và nhà máy nước ngoài.","Production and supply chain management is the whole process of turning raw materials into products and getting them into customers' hands: capacity planning, procurement, plant layout, logistics and inventory. This island tracks capacity expansion, material shortages, price increases and overseas plants in Taiwan's manufacturing sector.","Управление производством и цепочкой поставок это весь путь превращения сырья в продукт и доставки его клиенту: планирование мощностей, закупки, планировка заводов, логистика и запасы. Этот остров отслеживает расширение мощностей, нехватку материалов, рост цен и строительство зарубежных заводов в тайваньской обрабатывающей промышленности."),
 items:[
 {date:"2026-10-30",src:"科技新報",url:"https://technews.tw/2026/10/30/foxconn-hhtd26/",links:["ai","rd","tsmc"],
  t:L("鴻海科技日：AI機櫃跨十二級分工，Vera Rubin運算盤組裝從兩小時縮到20分鐘","鸿海科技日：AI机柜跨十二级分工，Vera Rubin运算盘组装从两小时缩到20分钟","鴻海テックデー：AIラックは12段階の分業、Vera Rubin計算トレイの組立は2時間超から20分へ","Hon Hai Tech Day: rak AI dibagi dua belas tingkat; perakitan compute tray Vera Rubin dari dua jam jadi 20 menit","Hon Hai Tech Day: tủ rack AI chia mười hai cấp; lắp khay tính toán Vera Rubin từ hơn hai giờ còn 20 phút","Hon Hai Tech Day: AI racks span a twelve-tier division of labour, and assembly of the Vera Rubin compute tray has gone from two hours to 20 minutes","Tech Day компании Hon Hai: производство стоек для ИИ разбито на двенадцать уровней, а сборка вычислительного лотка Vera Rubin сократилась с двух часов до 20 минут"),
  b:L("台灣與越南做零組件、新竹做主機板、桃園負責系統整合，美國與墨西哥承接第11與12級。共同封裝光學的對位、組裝與測試已從實驗室走進可重複的量產。劉揚偉說鴻海並非單純從事組裝的代工廠，核心是精密加工、系統整合與跨國量產能力。","台湾与越南做零组件、新竹做主板、桃园负责系统整合，美国与墨西哥承接第11与12级。共同封装光学的对位、组装与测试已从实验室走进可重复的量产。刘扬伟说鸿海并非单纯从事组装的代工厂，核心是精密加工、系统整合与跨国量产能力。","台湾とベトナムが部品、新竹がマザーボード、桃園がシステム統合、米国とメキシコが第11と12段階を担う。CPOの位置合わせ、組立、試験は実験室から再現可能な量産へ。劉揚偉氏は鴻海は単なる組立の受託工場ではなく、精密加工、システム統合、国際量産能力が核心だと述べた。","Taiwan dan Vietnam membuat komponen, Hsinchu motherboard, Taoyuan integrasi sistem, AS dan Meksiko menangani tingkat 11 dan 12. Penjajaran, perakitan, dan pengujian CPO kini produksi massal yang berulang. Liu Young-way menyebut Hon Hai bukan sekadar pabrik perakitan.","Đài Loan và Việt Nam làm linh kiện, Tân Trúc làm bo mạch chủ, Đào Viên tích hợp hệ thống, Mỹ và Mexico đảm nhiệm cấp 11 và 12. Căn chỉnh, lắp ráp và kiểm thử CPO đã từ phòng thí nghiệm bước vào sản xuất hàng loạt lặp lại được. Lưu Dương Vĩ nói Hon Hai không chỉ là xưởng lắp ráp gia công.","Taiwan and Vietnam make components, Hsinchu makes motherboards and Taoyuan handles system integration, while the United States and Mexico take on tiers 11 and 12. Alignment, assembly and testing for co-packaged optics (CPO) have moved out of the laboratory into repeatable mass production. Liu Young-way said Hon Hai is not simply a contract assembler; its core lies in precision machining, system integration and the ability to mass-produce across borders.","Тайвань и Вьетнам выпускают комплектующие, Синьчжу делает материнские платы, Таоюань отвечает за системную интеграцию, а США и Мексика берут на себя 11-й и 12-й уровни. Совмещение, сборка и тестирование совместно упакованной оптики (CPO) вышли из лаборатории в воспроизводимое массовое производство. Лю Янвэй заявил, что Hon Hai не просто контрактный сборщик: её основа это точная механическая обработка, системная интеграция и умение организовать массовый выпуск в разных странах."),
  k:L("把兩小時變成20分鐘，才是代工廠真正的護城河。","把两小时变成20分钟，才是代工厂真正的护城河。","2時間を20分にすること、それが受託製造の本当の堀。","Mengubah dua jam menjadi 20 menit, itulah parit sesungguhnya sebuah manufaktur kontrak.","Biến hai giờ thành 20 phút mới là hào lũy thật của nhà gia công.","Turning two hours into 20 minutes is the real moat of a contract manufacturer.","Превратить два часа в 20 минут вот настоящий защитный рубеж контрактного производителя.")},

 {date:"2026-10-22",src:"工商時報",url:"https://www.ctee.com.tw/news/20261022700072-439901",links:["rd","fin"],t:L("薄玻纖布、CCL 11月看漲10%至15%，PCB上游缺貨延燒","薄玻纤布、CCL 11月看涨10%至15%，PCB上游缺货延烧","薄型ガラスクロスとCCLは11月に10%から15%の値上げ見通し、PCB上流の品薄が波及","Kain kaca tipis dan CCL diperkirakan naik 10% hingga 15% pada November, kelangkaan hulu PCB meluas","Vải thủy tinh mỏng và CCL dự kiến tăng 10% đến 15% vào tháng 11, thiếu hụt thượng nguồn PCB lan rộng","Thin glass cloth and CCL prices look set to rise 10% to 15% in November as upstream PCB shortages spread","Тонкая стеклоткань и CCL могут подорожать на 10-15% в ноябре: дефицит в верхнем звене цепочки PCB расширяется"),b:L("工商時報載本波調漲幅度約10%至15%，可望於11月生效，實際依產品規格及供應商而異。供應鏈評估缺貨壓力可能至2027年下半年至2028年間逐步緩解。","工商时报载本波调涨幅度约10%至15%，可望于11月生效，实际依产品规格及供应商而异。供应链评估缺货压力可能至2027年下半年至2028年间逐步缓解。","工商時報によると今回の値上げ幅は約10%から15%で、11月に発効する見通し。実際には製品規格と供給元で異なる。供給網は品薄の緩和を2027年下半期から2028年にかけてと見る。","Commercial Times: kenaikan kali ini sekitar 10% hingga 15%, diharapkan berlaku November, tergantung spesifikasi dan pemasok. Rantai pasok menilai tekanan kelangkaan mungkin mereda bertahap pada paruh kedua 2027 hingga 2028.","Theo Công thương Thời báo, đợt tăng này khoảng 10% đến 15%, dự kiến có hiệu lực tháng 11, tùy quy cách và nhà cung cấp. Chuỗi cung ứng đánh giá áp lực thiếu hàng có thể giảm dần từ nửa cuối 2027 đến 2028.","The Commercial Times reports this round of increases at about 10% to 15%, expected to take effect in November and varying by product specification and supplier. The supply chain estimates shortage pressure may ease gradually between the second half of 2027 and 2028.","Commercial Times сообщает, что нынешнее повышение составит около 10-15% и может вступить в силу в ноябре, в зависимости от спецификации и поставщика. Цепочка поставок считает, что дефицит может постепенно ослабнуть со второго полугодия 2027 года до 2028 года."),k:L("南亞稱高階化趨勢明確，一般產品缺口持續，供需失衡尚未解除。","南亚称高端化趋势明确，一般产品缺口持续，供需失衡尚未解除。","南亜は、高付加価値化の流れは明確だが一般品の不足が続き、需給の不均衡は解消していないとする。","Nan Ya: tren kelas atas jelas, kekurangan produk umum berlanjut, ketidakseimbangan belum teratasi.","Nan Ya: xu hướng cao cấp rõ ràng, thiếu hụt hàng phổ thông vẫn tiếp diễn, mất cân đối chưa được giải quyết.","Nan Ya says the shift to high-end products is clear, the gap in general-grade products persists and the supply-demand imbalance is unresolved.","Nan Ya заявляет, что сдвиг к высокому классу очевиден, нехватка обычной продукции сохраняется, а дисбаланс спроса и предложения не устранён.")},
 {date:"2026-10-26",src:"中央社",url:"https://www.cna.com.tw/news/afe/202610260166.aspx",links:["fin"],t:L("騰輝-KY泰國新廠啟用、2026年底量產，昆山同步擴產15億元","腾辉-KY泰国新厂启用、2026年底量产，昆山同步扩产15亿元","騰輝-KYがタイ新工場を稼働、昆山も15億元で増産","Ventec-KY resmikan pabrik Thailand; Kunshan ekspansi NT$1,5 miliar","Ventec-KY khai trương nhà máy Thái Lan; Côn Sơn mở rộng 1,5 tỷ","Ventec-KY's new Thai plant has opened and will reach volume production by the end of 2026, with a parallel NT$1.5 billion expansion in Kunshan","Новый завод Ventec-KY в Таиланде введён в эксплуатацию и выйдет на серийное производство к концу 2026 года, параллельно идёт расширение в Куньшане на 1,5 млрд тайв. долл."),b:L("東南亞首座生產基地鎖定AI高算力電子材料；昆山擴產2027年第二季完成。同週金居馬來西亞高階銅箔新廠、聯茂中泰擴產。","东南亚首座生产基地锁定AI高算力电子材料；昆山扩产2027年第二季度完成。同周金居马来西亚高端铜箔新厂、联茂中泰扩产。","東南アジア初の拠点でAI向け高性能材料を狙う。昆山は2027年第2四半期完了。同週、金居のマレーシア銅箔工場、聯茂の中国・タイ増産も。","Basis pertama di Asia Tenggara bidik material AI; Kunshan rampung Q2 2027. Co-Tech bangun pabrik foil tembaga Malaysia; ITEQ ekspansi China dan Thailand.","Cơ sở đầu tiên ở Đông Nam Á nhắm vật liệu AI; Côn Sơn hoàn tất Q2/2027. Co-Tech xây nhà máy lá đồng Malaysia; ITEQ mở rộng Trung Quốc và Thái Lan.","Its first production base in Southeast Asia targets electronic materials for high-performance AI computing, and the Kunshan expansion will be completed in the second quarter of 2027. In the same week Co-Tech opened a new high-end copper foil plant in Malaysia and ITEQ expanded in China and Thailand.","Первая производственная площадка в Юго-Восточной Азии ориентирована на электронные материалы для высокопроизводительных вычислений ИИ, а расширение в Куньшане завершится во втором квартале 2027 года. На той же неделе Co-Tech открыла в Малайзии новый завод по выпуску медной фольги высокого класса, а ITEQ расширила мощности в Китае и Таиланде."),k:L("台廠擴產地圖正往泰國與馬來西亞移。","台厂扩产地图正往泰国与马来西亚移。","台湾勢の増産地図はタイとマレーシアへ。","Peta ekspansi Taiwan bergeser ke Thailand dan Malaysia.","Bản đồ mở rộng của Đài Loan dịch về Thái Lan và Malaysia.","The map of Taiwanese capacity expansion is shifting towards Thailand and Malaysia.","Карта расширения мощностей тайваньских производителей смещается в Таиланд и Малайзию.")},
 {date:"2026-10-26",src:"經濟日報",url:"https://money.udn.com/money/story/5607/9836957",links:["ai","mkt"],t:L("AI業搶貨，美國線航空貨運運價每公斤突破400元","AI业抢货，美国线航空货运运价每公斤突破400元","AI企業の争奪で米国向け航空貨物運賃が1kg 400元超","Perebutan kargo AI: tarif udara rute AS tembus NT$400/kg","Doanh nghiệp AI tranh hàng: cước hàng không tuyến Mỹ vượt 400/kg","With the AI industry scrambling for space, air freight rates on US routes have passed NT$400 per kilogram","Из-за борьбы за грузовые места в индустрии ИИ тарифы на авиаперевозки на американских маршрутах превысили 400 тайв. долл. за килограмм"),b:L("美籍航空業者調派包機來台，單月近百架次，急單運價漲逾一成創今年新高，長榮航表示仍有調升空間。","美籍航空业者调派包机来台，单月近百架次，急单运价涨逾一成创今年新高，长荣航表示仍有调升空间。","米系航空会社がチャーター便を月100便近く投入。緊急便運賃は1割超上昇し今年最高、エバー航空は更なる上昇余地と。","Maskapai AS kerahkan hampir 100 charter sebulan; tarif mendesak naik >10%, tertinggi tahun ini. EVA Air: masih ada ruang naik.","Hãng Mỹ điều gần 100 chuyến thuê bao mỗi tháng; cước đơn gấp tăng >10%, cao nhất năm. EVA Air: vẫn còn dư địa.","US carriers have dispatched charter flights to Taiwan, close to a hundred in a single month, and rates for rush orders have risen more than 10% to this year's high, with EVA Air saying there is still room for further increases.","Американские авиаперевозчики направили на Тайвань чартеры, почти сотню рейсов за месяц, а тарифы по срочным заказам выросли более чем на 10% и достигли максимума этого года; EVA Air говорит, что возможности для повышения ещё остаются."),k:L("物流成本正在吃掉AI硬體的一部分毛利。","物流成本正在吃掉AI硬件的一部分毛利。","物流コストがAIハードの粗利を削っている。","Biaya logistik menggerus sebagian margin perangkat keras AI.","Chi phí logistics đang ăn bớt biên lợi nhuận phần cứng AI.","Logistics costs are eating into part of the gross margin on AI hardware.","Логистические издержки съедают часть валовой маржи на оборудовании для ИИ.")},
 {date:"2026-10-22",src:"工商時報",url:"https://www.ctee.com.tw/news/20261022700046-430502",links:["tsmc","rd"],t:L("輝達攜矽品擴CPO光引擎產能，2027年中15倍、2028年底30倍","英伟达携矽品扩CPO光引擎产能，2027年中15倍、2028年底30倍","NVIDIAと矽品がCPO光エンジン能力を増強、2027年半ばに15倍、2028年末に30倍","Nvidia dan SPIL perluas kapasitas mesin optik CPO: 15 kali pada pertengahan 2027, 30 kali pada akhir 2028","Nvidia cùng SPIL mở rộng công suất động cơ quang CPO: 15 lần giữa 2027, 30 lần cuối 2028","Nvidia and SPIL expand CPO optical engine capacity: 15 times by mid-2027, 30 times by end-2028","Nvidia и SPIL расширяют мощности оптических движков CPO: в 15 раз к середине 2027 года и в 30 раз к концу 2028 года"),b:L("輝達與日月光投控旗下矽品規畫擴充台灣CPO光學引擎產能，2027年中目標擴至15倍，2028年底再倍增至30倍。輝達另提供京元電11億美元產能預付款。","英伟达与日月光投控旗下矽品规划扩充台湾CPO光学引擎产能，2027年中目标扩至15倍，2028年底再倍增至30倍。英伟达另提供京元电11亿美元产能预付款。","NVIDIAはASEホールディングス傘下の矽品と台湾のCPO光学エンジン能力増強を計画し、2027年半ばに15倍、2028年末にさらに倍の30倍を目指す。京元電には11億ドルの能力前払い金を提供する。","Nvidia dan SPIL milik ASE berencana memperluas kapasitas mesin optik CPO di Taiwan: target 15 kali pada pertengahan 2027 dan berlipat menjadi 30 kali pada akhir 2028. Nvidia juga memberi KYEC uang muka kapasitas US$1,1 miliar.","Nvidia và SPIL thuộc ASE dự kiến mở rộng công suất động cơ quang CPO tại Đài Loan, mục tiêu 15 lần vào giữa 2027 và gấp đôi lên 30 lần cuối 2028. Nvidia còn trả trước công suất 1,1 tỷ USD cho KYEC.","Nvidia and ASE-owned SPIL plan to expand CPO optical engine capacity in Taiwan, targeting 15 times by mid-2027 and doubling to 30 times by end-2028. Nvidia is also providing KYEC with a US$1.1 billion capacity prepayment.","Nvidia и входящая в ASE компания SPIL планируют расширить мощности оптических движков CPO на Тайване: в 15 раз к середине 2027 года и вдвое больше, до 30 раз, к концу 2028 года. Nvidia также выделяет KYEC предоплату за мощности в размере 1,1 млрд долл. США."),k:L("工商時報稱這些布局為台灣供應鏈帶來新一波成長動能。","工商时报称这些布局为台湾供应链带来新一波成长动能。","工商時報は、これらの布石が台湾サプライチェーンに新たな成長の勢いをもたらすとする。","Commercial Times: langkah ini membawa momentum pertumbuhan baru bagi rantai pasok Taiwan.","Công thương Thời báo: các bố trí này mang lại đà tăng trưởng mới cho chuỗi cung ứng Đài Loan.","The Commercial Times says these moves bring a new wave of growth momentum to Taiwan's supply chain.","Commercial Times считает, что эти шаги дают новый импульс роста цепочке поставок Тайваня.")},
 {date:"2026-10-13",src:"鉅亨網",url:"https://m.cnyes.com/news/id/6621806",links:["fin","ai"],t:L("鴻海9月營收首破兆元，第三季3.03兆元年增47%","鸿海9月营收首破兆元，第三季度3.03兆元年增47%","鴻海の9月売上が初の1兆元超、第3四半期3.03兆元で47%増","Pendapatan Hon Hai September pertama kali tembus NT$1 triliun; Q3 NT$3,03 triliun, +47%","Doanh thu Foxconn tháng 9 lần đầu vượt 1 nghìn tỷ; Q3 đạt 3,03 nghìn tỷ, +47%","Hon Hai's September revenue topped NT$1 trillion for the first time, and third quarter revenue of NT$3.03 trillion was up 47% year on year","Выручка Hon Hai в сентябре впервые превысила 1 трлн тайв. долл., а за третий квартал составила 3,03 трлн тайв. долл., прибавив 47% в годовом сопоставлении"),b:L("9月營收1.16兆元、年增38%，第三季優於市場預期2.83兆元約7%，AI伺服器與雲端網通是主要動力。鴻海科技日10月30日登場。","9月营收1.16兆元、年增38%，第三季度优于市场预期2.83兆元约7%，AI服务器与云端网通是主要动力。鸿海科技日10月30日登场。","9月は1.16兆元で38%増、第3四半期は市場予想2.83兆元を約7%上回る。AIサーバーとクラウド網通が牽引。鴻海テックデーは10月30日。","September NT$1,16 triliun (+38%); Q3 ~7% di atas estimasi NT$2,83 triliun; server AI dan jaringan cloud jadi motor. Hon Hai Tech Day 30 Oktober.","Tháng 9 đạt 1,16 nghìn tỷ (+38%); Q3 cao hơn dự báo 2,83 nghìn tỷ khoảng 7%; máy chủ AI và mạng đám mây là động lực. Hon Hai Tech Day ngày 30/10.","September revenue was NT$1.16 trillion, up 38% year on year, and the third quarter beat the market forecast of NT$2.83 trillion by about 7%, driven mainly by AI servers and cloud networking. Hon Hai Tech Day takes place on 30 October.","Выручка в сентябре составила 1,16 трлн тайв. долл. и выросла на 38% в годовом сопоставлении, а результат третьего квартала примерно на 7% превысил рыночный прогноз в 2,83 трлн тайв. долл.; главными драйверами стали серверы для ИИ и облачное сетевое оборудование. Hon Hai Tech Day пройдёт 30 октября."),k:L("季末出貨集中，代表AI伺服器仍在趕工。","季末出货集中，代表AI服务器仍在赶工。","期末出荷の集中はAIサーバーがまだ増産中の証拠。","Pengiriman terpusat akhir kuartal menandakan server AI masih dikebut.","Giao hàng dồn cuối quý cho thấy máy chủ AI vẫn đang chạy gấp.","Shipments concentrated at the end of the quarter mean AI server production is still racing to keep up.","Концентрация поставок в конце квартала означает, что производство серверов для ИИ всё ещё идёт в авральном режиме.")},
 {date:"2026-10-29",src:"經濟日報",url:"https://udn.com/news/story/7252/9842932",links:["fin","ai"],t:L("台達電第三季營收1,970億元創高，EPS 9.04元歷史次高","台达电第三季度营收1,970亿元创高，EPS 9.04元历史次高","台達電の第3四半期売上1,970億元で最高、EPS 9.04元は過去2番目","Pendapatan Q3 Delta NT$197 miliar rekor; EPS NT$9,04 tertinggi kedua","Doanh thu Q3 Delta 197 tỷ kỷ lục; EPS 9,04 cao thứ hai lịch sử","Delta Electronics posted record third quarter revenue of NT$197 billion, with EPS of NT$9.04, the second highest on record","Delta Electronics показала рекордную выручку за третий квартал в 197 млрд тайв. долл., а прибыль на акцию в 9,04 тайв. долл. стала второй по величине в истории компании"),b:L("營收年增31%，毛利率34.08%年減0.79個百分點；歸屬母公司淨利235億元，年增26.3%、季減6.5%。前三季EPS 26.64元。","营收年增31%，毛利率34.08%年减0.79个百分点；归属母公司净利235亿元，年增26.3%、季减6.5%。前三季度EPS 26.64元。","売上は31%増、粗利率34.08%で0.79ポイント低下。純利益235億元で前年比26.3%増、前期比6.5%減。1〜9月EPS 26.64元。","Pendapatan +31%; margin kotor 34,08% (-0,79 poin); laba bersih NT$23,5 miliar, +26,3% YoY, -6,5% QoQ. EPS sembilan bulan NT$26,64.","Doanh thu +31%; biên gộp 34,08% (-0,79 điểm); lãi ròng 23,5 tỷ, +26,3% so cùng kỳ, -6,5% so quý trước. EPS chín tháng 26,64.","Revenue rose 31% year on year while the gross margin of 34.08% was down 0.79 percentage points. Net profit attributable to the parent company was NT$23.5 billion, up 26.3% year on year and down 6.5% quarter on quarter. EPS for the first three quarters was NT$26.64.","Выручка выросла на 31% в годовом сопоставлении, а валовая маржа в 34,08% снизилась на 0,79 процентного пункта. Чистая прибыль, относящаяся к материнской компании, составила 23,5 млрд тайв. долл., что на 26,3% больше в годовом сопоставлении и на 6,5% меньше, чем в предыдущем квартале. Прибыль на акцию за первые три квартала составила 26,64 тайв. долл."),k:L("AI電源與散熱賣得好，但毛利率開始鬆動。","AI电源与散热卖得好，但毛利率开始松动。","AI電源と冷却は好調だが粗利率は緩み始めた。","Daya dan pendingin AI laris, tetapi margin mulai longgar.","Nguồn và tản nhiệt AI bán tốt nhưng biên lợi nhuận bắt đầu lỏng.","AI power supplies and cooling are selling well, but the gross margin is starting to slip.","Блоки питания и системы охлаждения для ИИ продаются хорошо, но валовая маржа начинает сдавать.")},
 {date:"2026-10-28",src:"DIGITIMES",url:"https://www.digitimes.com.tw/tech/dt/n/shwnws.asp?id=0000772700_XZ28KGOKLJ893A1FRR6DB",links:["rd"],t:L("PCB材料大缺貨難紓解，供應鏈擴產能見度直達2029年後","PCB材料大缺货难纾解，供应链扩产能见度直达2029年后","PCB材料の大不足は解消困難、増産の見通しは2029年以降まで","Kelangkaan material PCB sulit teratasi; visibilitas ekspansi hingga setelah 2029","Thiếu vật liệu PCB khó giải tỏa; tầm nhìn mở rộng tới sau 2029","The severe shortage of PCB materials is hard to relieve, and supply chain expansion visibility now reaches beyond 2029","Сильный дефицит материалов для печатных плат трудно преодолеть, и видимость расширения мощностей в цепочке поставок простирается за 2029 год"),b:L("聯茂稱高階材料需求旺到2029年，布局中國與泰國擴產；金居馬來西亞HVLP4銅箔新廠年產能3萬噸。","联茂称高端材料需求旺到2029年，布局中国与泰国扩产；金居马来西亚HVLP4铜箔新厂年产能3万吨。","聯茂は高級材料の需要が2029年まで続くとして中国とタイで増産。金居のマレーシアHVLP4銅箔新工場は年産3万トン。","ITEQ: permintaan material kelas atas kuat hingga 2029, ekspansi China dan Thailand; pabrik foil HVLP4 Co-Tech di Malaysia berkapasitas 30.000 ton/tahun.","ITEQ: nhu cầu vật liệu cao cấp mạnh tới 2029, mở rộng Trung Quốc và Thái Lan; nhà máy lá đồng HVLP4 của Co-Tech ở Malaysia công suất 30.000 tấn/năm.","ITEQ says demand for high-end materials will stay strong through 2029 and is expanding capacity in China and Thailand, while Co-Tech's new HVLP4 copper foil plant in Malaysia has annual capacity of 30,000 tonnes.","ITEQ заявляет, что спрос на материалы высокого класса останется сильным до 2029 года, и расширяет мощности в Китае и Таиланде, а новый завод Co-Tech по выпуску медной фольги HVLP4 в Малайзии имеет годовую мощность 30 тыс. тонн."),k:L("三年能見度是材料廠的好消息，也是客戶的成本警訊。","三年能见度是材料厂的好消息，也是客户的成本警讯。","3年の見通しは材料メーカーには朗報、顧客にはコスト警報。","Visibilitas tiga tahun kabar baik bagi produsen material, peringatan biaya bagi pelanggan.","Tầm nhìn ba năm là tin vui cho nhà sản xuất vật liệu, là cảnh báo chi phí cho khách hàng.","Three years of visibility is good news for material makers and a cost warning for their customers.","Трёхлетняя видимость заказов это хорошая новость для производителей материалов и предупреждение о росте издержек для их клиентов.")},
 {date:"2026-10-21",src:"中央社",url:"https://www.cna.com.tw/news/afe/202610213001.aspx",links:["fin"],t:L("東協快訊：馬士基與Hateco規劃35億美元越南貨運網絡","东盟快讯：马士基与Hateco规划35亿美元越南货运网络","ASEAN速報：マースクとHatecoが35億ドルのベトナム貨物網を計画","Kilas ASEAN: Maersk dan Hateco rencanakan jaringan kargo Vietnam US$3,5 miliar","Tin ASEAN: Maersk và Hateco lên kế hoạch mạng lưới vận tải Việt Nam 3,5 tỷ USD","ASEAN brief: Maersk and Hateco plan a US$3.5 billion freight network in Vietnam","Коротко об АСЕАН: Maersk и Hateco планируют грузовую сеть во Вьетнаме за 3,5 млрд долл. США"),b:L("新加坡半導體材料商Mi Material擬IPO籌2.15億美元擴展美國與大馬市場。星展估台灣與東協六國貿易總額今年達2,700億美元。","新加坡半导体材料商Mi Material拟IPO筹2.15亿美元扩展美国与大马市场。星展估台湾与东盟六国贸易总额今年达2,700亿美元。","シンガポールのMi MaterialはIPOで2.15億ドルを調達し米国とマレーシアへ。DBSは台湾とASEAN6か国の貿易額が今年2,700億ドルと予測。","Mi Material Singapura IPO US$215 juta untuk ekspansi AS dan Malaysia. DBS perkirakan perdagangan Taiwan-ASEAN6 capai US$270 miliar tahun ini.","Mi Material của Singapore IPO 215 triệu USD mở rộng sang Mỹ và Malaysia. DBS ước thương mại Đài Loan với sáu nước ASEAN đạt 270 tỷ USD năm nay.","Singaporean semiconductor materials firm Mi Material plans an IPO to raise US$215 million to expand in the US and Malaysian markets. DBS estimates that total trade between Taiwan and the six ASEAN countries will reach US$270 billion this year.","Сингапурский производитель полупроводниковых материалов Mi Material планирует IPO, чтобы привлечь 215 млн долл. США на расширение на рынках США и Малайзии. По оценке DBS, товарооборот Тайваня с шестью странами АСЕАН достигнет в этом году 270 млрд долл. США."),k:L("越南與馬來西亞是台灣供應鏈的第二主場。","越南与马来西亚是台湾供应链的第二主场。","ベトナムとマレーシアは台湾サプライチェーンの第二の本拠地。","Vietnam dan Malaysia jadi kandang kedua rantai pasok Taiwan.","Việt Nam và Malaysia là sân nhà thứ hai của chuỗi cung ứng Đài Loan.","Vietnam and Malaysia are the second home ground of Taiwan's supply chain.","Вьетнам и Малайзия стали второй домашней площадкой тайваньской цепочки поставок.")}
 ]},
{id:"mkt",kind:"market",color:"#F06292",ring:1,ang:240,
 name:L("行銷","营销","マーケティング","Pemasaran","Tiếp thị","Marketing","Маркетинг"),
 tag:L("五管：行銷管理","五管：营销管理","五管：マーケティング管理","Lima fungsi: pemasaran","Năm chức năng: tiếp thị","Five management functions: marketing management","Пять управленческих функций: управление маркетингом"),
 desc:L("行銷管理是找到顧客、說服顧客、留住顧客的學問：產品定位、定價、通路與推廣，現在還加上社群、數據與AI。這座島看品牌價值、新品上市、電商促銷與行銷工具的變化。","营销管理是找到顾客、说服顾客、留住顾客的学问：产品定位、定价、渠道与推广，现在还加上社群、数据与AI。这座岛看品牌价值、新品上市、电商促销与营销工具的变化。","マーケティング管理は顧客を見つけ、説得し、つなぎとめる学問です。位置づけ、価格、チャネル、販促に加え、SNS、データ、AIも含みます。ブランド価値、新製品、EC販促、ツールの変化を見ます。","Manajemen pemasaran adalah ilmu menemukan, meyakinkan, dan mempertahankan pelanggan: positioning, harga, saluran, promosi, plus media sosial, data, AI. Pulau ini mengamati nilai merek, peluncuran produk, promosi e-commerce, dan alat pemasaran.","Quản trị tiếp thị là cách tìm, thuyết phục và giữ chân khách: định vị, giá, kênh, khuyến mãi, cộng thêm mạng xã hội, dữ liệu và AI. Đảo này xem giá trị thương hiệu, ra mắt sản phẩm, khuyến mãi thương mại điện tử và công cụ tiếp thị.","Marketing management is the study of finding customers, persuading them and keeping them: product positioning, pricing, channels and promotion, and now social media, data and AI as well. This island looks at brand value, product launches, e-commerce promotions and changes in marketing tools.","Управление маркетингом это наука о том, как найти клиента, убедить его и удержать: позиционирование продукта, цены, каналы сбыта и продвижение, а теперь ещё социальные сети, данные и ИИ. Этот остров рассматривает стоимость брендов, выход новых продуктов, акции в электронной торговле и изменения в маркетинговых инструментах."),
 items:[
 {date:"2026-10-28",src:"工商時報",url:"https://www.ctee.com.tw/news/20261028700621-430503",links:["ai"],t:L("雙11開打：PChome最高32%回饋、Yahoo推AI購物助理、蝦皮送長榮機票","双11开打：PChome最高32%回馈、Yahoo推AI购物助理、虾皮送长荣机票","ダブル11開幕：PChome最大32%還元、YahooはAIショッピング助手、Shopeeはエバー航空券","Double 11 dimulai: PChome cashback 32%, Yahoo asisten belanja AI, Shopee bagi tiket EVA Air","Double 11 khai cuộc: PChome hoàn 32%, Yahoo trợ lý mua sắm AI, Shopee tặng vé EVA Air","Double 11 kicks off: PChome offers rebates of up to 32%, Yahoo launches an AI shopping assistant and Shopee gives away EVA Air tickets","Стартует распродажа 11.11: PChome даёт возврат до 32%, Yahoo запускает ИИ-помощника для покупок, а Shopee разыгрывает билеты EVA Air"),b:L("三大平台10月27日同步起跑。PChome限時券3,500折300並主打快速到貨至11月16日；Yahoo購物祭出逾1億元購物金與最高39%回饋；蝦皮全額蝦幣回饋，抽獎總值逾200萬元至11月13日。","三大平台10月27日同步起跑。PChome限时券3,500折300并主打快速到货至11月16日；Yahoo购物祭出逾1亿元购物金与最高39%回馈；虾皮全额虾币回馈，抽奖总值逾200万元至11月13日。","3大プラットフォームが10月27日に同時開始。PChomeは3,500元で300元引きのクーポンと即日配送を11月16日まで。Yahooは1億元超のポイントと最大39%還元。Shopeeは全額コイン還元と200万元超の抽選を11月13日まで。","Tiga platform mulai serentak 27 Oktober. PChome kupon NT$300 untuk NT$3.500 dan pengiriman cepat hingga 16 November; Yahoo kredit belanja >NT$100 juta dan cashback 39%; Shopee cashback koin penuh dan undian >NT$2 juta hingga 13 November.","Ba nền tảng cùng khởi động 27/10. PChome phiếu giảm 300 cho đơn 3.500 và giao nhanh đến 16/11; Yahoo tín dụng mua sắm >100 triệu và hoàn 39%; Shopee hoàn xu toàn phần và rút thăm >2 triệu đến 13/11.","The three big platforms all started on 27 October. PChome has a limited-time coupon of NT$300 off NT$3,500 and is promoting fast delivery through 16 November; Yahoo Shopping is putting up more than NT$100 million in shopping credit and rebates of up to 39%; Shopee is offering full rebates in Shopee Coins, with prize draws worth over NT$2 million running to 13 November.","Три крупнейшие платформы начали одновременно 27 октября. У PChome есть купон ограниченного срока на 300 тайв. долл. при покупке от 3500 тайв. долл., и платформа делает ставку на быструю доставку до 16 ноября; Yahoo Shopping выделяет более 100 млн тайв. долл. бонусов на покупки и возврат до 39%; Shopee возвращает полную сумму монетами Shopee и проводит розыгрыши призов общей стоимостью более 2 млн тайв. долл. до 13 ноября."),k:L("折扣已無感，體驗與AI助理才是新差異點。","折扣已无感，体验与AI助理才是新差异点。","割引は効かなくなり、体験とAI助手が差別化の軸に。","Diskon tak lagi terasa; pengalaman dan asisten AI jadi pembeda.","Giảm giá đã bão hòa; trải nghiệm và trợ lý AI mới là điểm khác biệt.","Discounts no longer register, and experience and AI assistants are the new points of difference.","Скидки уже не впечатляют, и новыми отличиями становятся впечатления от покупки и ИИ-помощники.")},
 {date:"2026-10-20",src:"工商時報",url:"https://www.ctee.com.tw/news/20261020700185-439901",links:["ai"],t:L("電商備戰雙11用AI吸客：momo廣告聯網逾8,000品牌，Yahoo「AI懂買」上線","电商备战双11用AI吸客：momo广告联网逾8,000品牌，Yahoo「AI懂买」上线","EC各社がダブル11にAI活用：momo広告網は8,000ブランド超、Yahooは「AI懂買」投入","E-commerce pakai AI untuk Double 11: jaringan iklan momo >8.000 merek; Yahoo luncurkan \"AI懂買\"","Thương mại điện tử dùng AI cho Double 11: mạng quảng cáo momo >8.000 thương hiệu; Yahoo ra mắt \"AI懂買\"","E-commerce players use AI to draw shoppers for Double 11: momo's ad network covers more than 8,000 brands and Yahoo's AI shopping guide goes live","Электронная торговля привлекает покупателей к 11.11 с помощью ИИ: рекламная сеть momo охватывает более 8000 брендов, а у Yahoo запущен сервис «ИИ понимает покупки»"),b:L("momo Ads結合Meta爭取廣告流量，第四季推多受眾功能依購買行為分眾，廣告營收雙位數成長。Yahoo與統一合作使OPENPOINT發點量三倍；LINE把第三分頁改為電商入口「逛逛」並規劃AI代理。","momo Ads结合Meta争取广告流量，第四季度推多受众功能依购买行为分众，广告营收双位数增长。Yahoo与统一合作使OPENPOINT发点量三倍；LINE把第三分页改为电商入口「逛逛」并规划AI代理。","momo AdsはMetaと組んで広告流入を獲得、第4四半期に購買行動によるオーディエンス機能を投入し広告収入は2桁成長。Yahooは統一との提携でOPENPOINT発行3倍。LINEは第3タブをEC入口「逛逛」に。","momo Ads bermitra dengan Meta; fitur multi-audiens berdasarkan perilaku belanja pada Q4; pendapatan iklan tumbuh dua digit. Yahoo dengan Uni-President melipatgandakan OPENPOINT tiga kali; LINE ubah tab ketiga jadi pintu e-commerce.","momo Ads hợp tác Meta; tính năng đa đối tượng theo hành vi mua ở Q4; doanh thu quảng cáo tăng hai chữ số. Yahoo cùng Uni-President tăng gấp ba điểm OPENPOINT; LINE biến tab thứ ba thành cổng thương mại điện tử.","momo Ads is working with Meta to win ad traffic and will roll out a multi-audience feature in the fourth quarter that segments shoppers by purchase behaviour, with ad revenue growing at a double-digit rate. Yahoo's partnership with Uni-President has tripled OPENPOINT point issuance, and LINE has turned its third tab into an e-commerce entry point called Guangguang while planning AI agents.","momo Ads вместе с Meta борется за рекламный трафик и в четвёртом квартале запустит функцию работы с несколькими аудиториями, разделяя покупателей по поведению при покупке; рекламная выручка растёт двузначными темпами. Сотрудничество Yahoo с Uni-President утроило объём начисления баллов OPENPOINT, а LINE превратила третью вкладку в точку входа в электронную торговлю под названием Guangguang и планирует ИИ-агентов."),k:L("平台正在變成廣告公司，數據才是商品。","平台正在变成广告公司，数据才是商品。","プラットフォームは広告会社化し、データが商品に。","Platform berubah jadi perusahaan iklan; datanya yang dijual.","Nền tảng đang thành công ty quảng cáo; dữ liệu mới là hàng hóa.","The platforms are turning into advertising companies, and data is the real product.","Платформы превращаются в рекламные компании, а настоящим товаром становятся данные.")},
 {date:"2026-10-23",src:"經濟日報",url:"https://money.udn.com/money/story/5607/9836957",links:["tsmc"],t:L("iPhone Duo開賣即售罄，需求超過供給三成","iPhone Duo开卖即售罄，需求超过供给三成","iPhone Duoは発売即完売、需要は供給を3割超過","iPhone Duo ludes saat rilis; permintaan 30% di atas pasokan","iPhone Duo cháy hàng ngay khi mở bán; cầu vượt cung 30%","The iPhone Duo sold out as soon as it went on sale, with demand exceeding supply by 30%","iPhone Duo был распродан сразу после начала продаж, спрос превысил предложение на 30%"),b:L("蘋果首款折疊機在官網與各通路同步售罄，追加三成訂單的消息本身就是最強的需求訊號，為年底購物季定調高階機種的稀缺敘事。","苹果首款折叠机在官网与各渠道同步售罄，追加三成订单的消息本身就是最强的需求信号，为年底购物季定调高端机型的稀缺叙事。","Apple初の折りたたみ機は全チャネルで完売。3割の追加発注という報道自体が最強の需要シグナルとなり、年末商戦の希少性ナラティブを決めた。","Ponsel lipat pertama Apple ludes di semua kanal; kabar tambahan pesanan 30% jadi sinyal permintaan terkuat dan narasi kelangkaan musim belanja.","Máy gập đầu tiên của Apple hết hàng mọi kênh; tin thêm 30% đơn là tín hiệu cầu mạnh nhất, định hình câu chuyện khan hiếm mùa mua sắm.","Apple's first foldable sold out on its own site and across retail channels at the same time, and the news of a 30% increase in orders is in itself the strongest demand signal, setting a narrative of scarcity for high-end models in the year-end shopping season.","Первый складной смартфон Apple был распродан одновременно на официальном сайте и во всех каналах продаж, а сообщение о дополнительном заказе на 30% само по себе служит сильнейшим сигналом спроса и задаёт тон рассказу о дефицитности флагманских моделей в предновогоднем сезоне покупок."),k:L("缺貨本身就是行銷。","缺货本身就是营销。","品薄そのものがマーケティング。","Kelangkaan itu sendiri adalah pemasaran.","Khan hàng tự nó là tiếp thị.","Being out of stock is itself marketing.","Сам дефицит товара и есть маркетинг.")},
 {date:"2026-10-05",src:"方格子 AI週報",url:"https://vocus.cc/article/6acce73efd8978000100a831",links:["ai"],t:L("OpenAI在ChatGPT試行對話原生廣告，依商業查詢動態展示","OpenAI在ChatGPT试行对话原生广告，依商业查询动态展示","OpenAIがChatGPTで会話型ネイティブ広告を試験","OpenAI uji iklan native percakapan di ChatGPT","OpenAI thử quảng cáo gốc trong hội thoại ChatGPT","OpenAI is piloting conversation-native ads in ChatGPT, displayed dynamically according to commercial queries","OpenAI тестирует в ChatGPT рекламу, встроенную в диалог и показываемую динамически в зависимости от коммерческих запросов"),b:L("廣告於免費版與Plus試行，引入對話成效評估與Apps SDK整合。品牌口碑從「被人看見」延伸到「被AI引用」，生成式引擎優化（GEO）成為新戰場。","广告于免费版与Plus试行，引入对话成效评估与Apps SDK整合。品牌口碑从「被人看见」延伸到「被AI引用」，生成式引擎优化（GEO）成为新战场。","無料版とPlusで試験、会話効果測定とApps SDK統合。ブランドの評判は「人に見られる」から「AIに引用される」へ、GEOが新戦場。","Diuji di versi gratis dan Plus dengan pengukuran efektivitas dan Apps SDK. Reputasi merek bergeser dari \"dilihat orang\" ke \"dikutip AI\"; GEO jadi medan baru.","Thử ở bản miễn phí và Plus với đo hiệu quả và Apps SDK. Danh tiếng thương hiệu từ \"được người thấy\" sang \"được AI trích dẫn\"; GEO thành chiến trường mới.","The ads are being tested on the free tier and on Plus, with conversation performance measurement and Apps SDK integration. Brand reputation now extends from being seen by people to being cited by AI, and generative engine optimisation (GEO) has become the new battleground.","Реклама тестируется в бесплатной версии и в Plus вместе с оценкой результативности диалога и интеграцией Apps SDK. Репутация бренда теперь важна не только в глазах людей, но и в том, цитирует ли его ИИ, и новым полем борьбы становится оптимизация под генеративные движки (GEO)."),k:L("廣告預算的下一站是對話框。","广告预算的下一站是对话框。","広告予算の次の行き先はチャット欄。","Tujuan berikutnya anggaran iklan: kotak percakapan.","Điểm đến tiếp theo của ngân sách quảng cáo: khung chat.","The next stop for advertising budgets is the chat box.","Следующая остановка рекламных бюджетов это окно диалога.")},
 {date:"2026-10-29",src:"中央社",url:"https://www.cna.com.tw/news/afe/202610290355.aspx",links:["ai","sec"],t:L("91APP稱被駭事件恐影響479.8萬消費者、涉1,329個品牌","91APP称被黑事件恐影响479.8万消费者、涉1,329个品牌","91APP、不正侵入で最大479.8万人の消費者と1,329ブランドに影響の恐れ","91APP: peretasan dapat memengaruhi 4,798 juta konsumen dan 1.329 merek","91APP: vụ tấn công có thể ảnh hưởng 4,798 triệu người tiêu dùng và 1.329 thương hiệu","91APP says its hack may affect 4.798 million consumers and 1,329 brands","91APP: взлом может затронуть 4,798 млн потребителей и 1329 брендов"),b:L("欄位含姓名、電話、配送地址、電子郵件與訂單紀錄，不含密碼與信用卡。補償受理至2027年2月1日，11月2日起通知。479.8萬為最大可能範圍，不代表每人資料均外洩。","字段含姓名、电话、配送地址、电子邮件与订单记录，不含密码与信用卡。补偿受理至2027年2月1日，11月2日起通知。479.8万为最大可能范围，不代表每人数据均外泄。","項目は氏名、電話、配送先、メール、注文記録で、パスワードとカードは含まない。補償受付は2027年2月1日まで、通知は11月2日から。479.8万は最大範囲で、全員の情報流出を意味しない。","Data: nama, telepon, alamat kirim, email, riwayat pesanan; tanpa kata sandi dan kartu kredit. Kompensasi hingga 1 Februari 2027, pemberitahuan mulai 2 November. Angka 4,798 juta adalah cakupan maksimum, bukan berarti semua data bocor.","Dữ liệu gồm tên, điện thoại, địa chỉ giao hàng, email, lịch sử đơn; không có mật khẩu và thẻ tín dụng. Nhận bồi thường đến 1/2/2027, thông báo từ 2/11. Con số 4,798 triệu là phạm vi tối đa, không có nghĩa mọi người đều lộ dữ liệu.","Fields include name, phone, delivery address, email and order records, but not passwords or credit cards. Compensation claims run to 1 February 2027, with notices from 2 November. The 4.798 million is the widest possible scope and does not mean every person's data leaked.","Затронуты имя, телефон, адрес доставки, эл. почта и история заказов, но не пароли и карты. Заявки на компенсацию принимаются до 1 февраля 2027 года, уведомления с 2 ноября. 4,798 млн это максимальный охват, он не означает утечку данных каждого."),k:L("91APP提醒不會以訊息要求提供個資或ATM轉帳。","91APP提醒不会以信息要求提供个资或ATM转账。","91APPは、メッセージで個人情報やATM振込を求めることはないと注意喚起している。","91APP mengingatkan tidak akan meminta data pribadi atau transfer ATM lewat pesan.","91APP nhắc rằng họ không yêu cầu dữ liệu cá nhân hay chuyển khoản ATM qua tin nhắn.","91APP warns that it will not ask for personal data or ATM transfers by message.","91APP предупреждает, что не запрашивает в сообщениях личные данные или переводы через банкомат.")},
 {date:"2026-10-28",src:"經濟日報",url:"https://money.udn.com/money/story/5612/9841699",links:["prod"],t:L("台灣樂天市場雙11強化跨境購物，與四大品牌合作","台湾乐天市场双11强化跨境购物，与四大品牌合作","台湾楽天市場はダブル11で越境購買を強化、4大ブランドと提携","Rakuten Taiwan perkuat belanja lintas batas pada Double 11 dengan empat merek besar","Rakuten Đài Loan tăng mua sắm xuyên biên giới dịp Double 11 cùng bốn thương hiệu lớn","Rakuten Taiwan strengthens cross-border shopping for Double 11 with four major brand partnerships","Rakuten Тайвань усиливает кросс-граничные покупки к 11.11 и сотрудничает с четырьмя крупными брендами"),b:L("樂天以日本商品直送為差異化，對照淘寶推出台灣獨家尊榮服務，雙11從價格戰轉為跨境與服務戰。","乐天以日本商品直送为差异化，对照淘宝推出台湾独家尊荣服务，双11从价格战转为跨境与服务战。","楽天は日本商品の直送で差別化。淘宝は台湾限定のプレミアムサービスを投入。ダブル11は価格戦から越境・サービス戦へ。","Rakuten andalkan pengiriman langsung produk Jepang; Taobao luncurkan layanan premium khusus Taiwan. Double 11 bergeser dari perang harga ke perang layanan lintas batas.","Rakuten dựa vào giao hàng trực tiếp từ Nhật; Taobao ra dịch vụ cao cấp riêng cho Đài Loan. Double 11 chuyển từ cuộc chiến giá sang xuyên biên giới và dịch vụ.","Rakuten is differentiating itself with direct shipping of Japanese goods, while Taobao has rolled out exclusive premium services for Taiwan, turning Double 11 from a price war into a contest over cross-border reach and service.","Rakuten делает ставку на прямую доставку японских товаров, тогда как Taobao предложила эксклюзивный премиальный сервис для Тайваня, и распродажа 11.11 превращается из ценовой войны в соперничество в кросс-граничной торговле и сервисе."),k:L("跨境電商靠的是信任，不是折扣。","跨境电商靠的是信任，不是折扣。","越境ECは割引より信頼で勝つ。","E-commerce lintas batas menang lewat kepercayaan, bukan diskon.","Thương mại điện tử xuyên biên giới thắng nhờ niềm tin, không phải giảm giá.","Cross-border e-commerce runs on trust, not discounts.","Кросс-граничная электронная торговля держится на доверии, а не на скидках.")},
 {date:"2026-02-24",src:"數位時代",url:"https://www.bnext.com.tw/article/90141/-marketing-ai-6.0",links:["ai"],t:L("Marketing AI 6.0地圖：九層架構讓行銷人從執行者變數據決策者","Marketing AI 6.0地图：九层架构让营销人从执行者变数据决策者","Marketing AI 6.0マップ：9層構造でマーケターを実行者からデータ意思決定者へ","Peta Marketing AI 6.0: sembilan lapisan mengubah pemasar dari pelaksana menjadi pengambil keputusan berbasis data","Bản đồ Marketing AI 6.0: chín tầng đưa người làm tiếp thị từ người thực thi thành người ra quyết định dựa trên dữ liệu","Marketing AI 6.0 map: nine layers turn marketers from executors into data-driven decision makers","Карта Marketing AI 6.0: девять уровней превращают маркетологов из исполнителей в тех, кто принимает решения на основе данных"),b:L("高端訓專欄盤點9大架構、89個AI工具，涵蓋第二層分析與洞察AI、第八層代理型與工作流AI、第九層廣告與投放AI，稱AI工具將重構行銷流程。","高端训专栏盘点9大架构、89个AI工具，涵盖第二层分析与洞察AI、第八层代理型与工作流AI、第九层广告与投放AI，称AI工具将重构营销流程。","高端訓氏のコラムは9層構造と89のAIツールを整理した。第2層の分析・洞察AI、第8層のエージェント・ワークフローAI、第9層の広告・配信AIを含み、AIツールがマーケティング工程を再構築するとする。","Sebuah kolom memetakan sembilan lapisan dan 89 alat AI, termasuk lapisan 2 analitik dan wawasan, lapisan 8 agen dan alur kerja, lapisan 9 iklan dan penayangan, dan menyebut alat AI akan menata ulang proses pemasaran.","Một chuyên mục tổng hợp chín tầng và 89 công cụ AI, gồm tầng 2 phân tích và thấu hiểu, tầng 8 tác tử và quy trình, tầng 9 quảng cáo và phân phối, cho rằng công cụ AI sẽ tái cấu trúc quy trình tiếp thị.","A guest column maps nine layers and 89 AI tools, including layer 2 analytics and insight AI, layer 8 agent and workflow AI and layer 9 advertising and delivery AI, and says AI tools will restructure the marketing process.","Авторская колонка описывает девять уровней и 89 инструментов ИИ, включая второй уровень аналитики и инсайтов, восьмой уровень агентов и рабочих процессов и девятый уровень рекламы и размещения, и утверждает, что инструменты ИИ перестроят маркетинговый процесс."),k:L("作者稱生成成本趨近於零時，真正昂貴的是你說什麼故事。","作者称生成成本趋近于零时，真正昂贵的是你说什么故事。","筆者は、生成コストがゼロに近づくと本当に高価なのは何を語るかだと述べる。","Penulis: saat biaya produksi mendekati nol, yang benar-benar mahal adalah cerita yang Anda sampaikan.","Tác giả: khi chi phí tạo nội dung gần bằng không, thứ thật sự đắt là câu chuyện bạn kể.","The author says that as generation costs approach zero, what becomes truly expensive is the story you tell.","Автор считает, что когда стоимость генерации приближается к нулю, по-настоящему дорогой становится история, которую вы рассказываете.")},
 {date:"2026-10-25",src:"中央社",url:"https://www.cna.com.tw/news/afe/202610250026.aspx",links:["ai"],t:L("數發部擬推三機制，促Meta、Google、LINE落實AI生成影像標示","数发部拟推三机制，促Meta、Google、LINE落实AI生成图像标示","数位発展部が3つの仕組みを計画、Meta、Google、LINEにAI生成画像の表示を促す","Kementerian Digital rencanakan tiga mekanisme agar Meta, Google, LINE melabeli gambar buatan AI","Bộ Phát triển Số dự kiến ba cơ chế, thúc Meta, Google, LINE gắn nhãn hình ảnh do AI tạo","Digital ministry plans three mechanisms to push Meta, Google and LINE to label AI-generated images","Министерство цифрового развития планирует три механизма, чтобы Meta, Google и LINE маркировали ИИ-изображения"),b:L("三機制為上傳時自主揭露、系統偵測自動補標、政府通知與檢舉申訴管道。中央社載Google進度較快、Meta仍在調整技術，LINE先從廣告與公開內容著手。","三机制为上传时自主揭露、系统检测自动补标、政府通知与检举申诉渠道。中央社载Google进度较快、Meta仍在调整技术，LINE先从广告与公开内容着手。","3つの仕組みは投稿時の自主開示、システム検知による自動表示、政府通知と通報・申立て窓口。中央社によるとGoogleが先行し、Metaは技術調整中、LINEは広告と公開コンテンツから始める。","Tiga mekanisme: pengungkapan saat unggah, deteksi sistem dengan label otomatis, pemberitahuan pemerintah serta jalur laporan dan keberatan. CNA: Google lebih maju, Meta masih menyesuaikan teknologi, LINE mulai dari iklan dan konten publik.","Ba cơ chế: tự khai khi tải lên, hệ thống phát hiện và tự gắn nhãn, thông báo của chính phủ cùng kênh tố giác và khiếu nại. Theo CNA, Google đi nhanh hơn, Meta còn chỉnh công nghệ, LINE bắt đầu từ quảng cáo và nội dung công khai.","The three are disclosure at upload, automatic labelling when systems detect AI traits, and government notices with reporting and appeal channels. CNA says Google is further ahead, Meta is still adjusting its technology and LINE will start with advertising and public content.","Три механизма: раскрытие при загрузке, автоматическая маркировка при обнаружении системой, уведомления властей и каналы жалоб и апелляций. По данным CNA, Google продвинулась дальше, Meta ещё настраивает технологию, а LINE начнёт с рекламы и публичного контента."),k:L("數發部稱YouTube現有標示要點更多才看得到，希望改在影片下方。","数发部称YouTube现有标示要点更多才看得到，希望改在视频下方。","同部はYouTubeの表示は「もっと見る」を押さないと見えず、動画の下に出したいとする。","Kementerian: label YouTube harus klik selengkapnya untuk terlihat; ingin dipindah ke bawah video.","Bộ cho rằng nhãn YouTube phải bấm xem thêm mới thấy, muốn đưa xuống dưới video.","The ministry says YouTube's label is visible only after clicking more and wants it shown below the video.","Министерство считает, что метку YouTube видно только после нажатия «ещё», и хочет показывать её под видео.")}
 ]},
{id:"hr",kind:"town",color:"#3DBB7A",ring:1,ang:300,
 name:L("人力資源","人力资源","人事","Sumber Daya Manusia","Nhân sự","Human Resources","Человеческие ресурсы"),
 tag:L("五管：人力資源管理","五管：人力资源管理","五管：人事管理","Lima fungsi: SDM","Năm chức năng: nhân sự","Five management functions: human resource management","Пять функций управления: управление человеческими ресурсами"),
 desc:L("人力資源管理處理企業裡的人：招募、薪資、訓練、留才與勞資關係。這座島追蹤最低工資、勞動法規、人才流動，以及AI對工作方式的改變。","人力资源管理处理企业里的人：招募、薪资、训练、留才与劳资关系。这座岛追踪最低工资、劳动法规、人才流动，以及AI对工作方式的改变。","人事管理は企業の人を扱います。採用、給与、教育、定着、労使関係。最低賃金、労働法規、人材流動、AIによる働き方の変化を追います。","Manajemen SDM menangani orang di perusahaan: rekrutmen, gaji, pelatihan, retensi, hubungan industrial. Pulau ini melacak upah minimum, regulasi, mobilitas talenta, dan perubahan cara kerja akibat AI.","Quản trị nhân sự xử lý con người trong doanh nghiệp: tuyển dụng, lương, đào tạo, giữ chân, quan hệ lao động. Đảo này theo dõi lương tối thiểu, pháp luật lao động, dịch chuyển nhân tài và thay đổi cách làm việc do AI.","Human resource management deals with the people inside a company: recruiting, pay, training, retention and labor relations. This island tracks the minimum wage, labor regulation, talent mobility, and the way AI is changing how people work.","Управление человеческими ресурсами занимается людьми внутри компании: набором персонала, оплатой труда, обучением, удержанием сотрудников и трудовыми отношениями. Этот остров отслеживает минимальную заработную плату, трудовое регулирование, перемещение специалистов и то, как ИИ меняет способы работы."),
 items:[
 {date:"2026-09-24",src:"關鍵評論網",url:"https://www.thenewslens.com/article/270290",links:["fin","tax"],t:L("2027年最低工資月薪30,900元、時薪205元，調幅4.745%","2027年最低工资月薪30,900元、时薪205元，调幅4.745%","2027年の最低賃金は月30,900元・時給205元、4.745%引き上げ","Upah minimum 2027 NT$30.900/bulan, NT$205/jam, naik 4,745%","Lương tối thiểu 2027: 30.900/tháng, 205/giờ, tăng 4,745%","2027 minimum wage set at NT$30,900 a month and NT$205 an hour, an increase of 4.745%","Минимальная заработная плата на 2027 год: 30 900 тайв. долл. в месяц и 205 тайв. долл. в час, рост на 4,745%"),b:L("審議會從上午開到傍晚才拍板，月薪調升1,400元為近10年最高，連續第11年調漲，預估261萬名勞工受惠。待行政院核定後2027年1月1日實施。","审议会从上午开到傍晚才拍板，月薪调升1,400元为近10年最高，连续第11年调涨，预估261万名劳工受惠。待行政院核定后2027年1月1日实施。","審議会は朝から夕方まで協議。月1,400元の引き上げは10年で最大、11年連続、約261万人が対象。行政院承認後2027年1月1日施行。","Dewan berunding dari pagi hingga petang; kenaikan NT$1.400 terbesar dalam sepuluh tahun, ke-11 berturut-turut, 2,61 juta pekerja terdampak. Berlaku 1 Januari 2027.","Hội đồng họp từ sáng tới chiều; tăng 1.400 cao nhất mười năm, năm thứ 11 liên tiếp, 2,61 triệu lao động hưởng lợi. Hiệu lực 1/1/2027.","The review committee sat from the morning until early evening before deciding. The monthly increase of NT$1,400 is the largest in nearly 10 years and the 11th consecutive annual rise, with an estimated 2.61 million workers set to benefit. It takes effect on January 1, 2027 once the Executive Yuan approves it.","Совещательный совет заседал с утра до вечера, прежде чем принять решение. Повышение месячной ставки на 1 400 тайв. долл. стало самым большим почти за 10 лет и уже 11-м ежегодным повышением подряд, выгоду получат примерно 2,61 млн работников. Решение вступит в силу 1 января 2027 года после утверждения Исполнительным юанем."),k:L("餐飲與零售的人事預算要先重算。","餐饮与零售的人事预算要先重算。","飲食と小売は人件費予算の再計算が先。","Anggaran SDM restoran dan ritel perlu dihitung ulang dulu.","Ngân sách nhân sự ngành ăn uống và bán lẻ cần tính lại trước.","Payroll budgets in food service and retail have to be recalculated first.","Бюджеты на персонал в общественном питании и розничной торговле придётся пересчитать в первую очередь.")},
 {date:"2026-10-22",src:"中央社",url:"https://www.cna.com.tw/news/afe/202610220437.aspx",links:["fin","prod"],t:L("美光與台中工會簽勞資協議，桃園工會11名幹部10月22日罷工","美光与台中工会签劳资协议，桃园工会11名干部10月22日罢工","マイクロンが台中労組と労使協定、桃園労組の幹部11人は10月22日にスト","Micron teken kesepakatan dengan serikat Taichung, 11 pengurus serikat Taoyuan mogok 22 Oktober","Micron ký thỏa thuận với công đoàn Đài Trung, 11 cán bộ công đoàn Đào Viên đình công ngày 22/10","Micron signs labour deal with Taichung union; 11 Taoyuan union officers strike on 22 October","Micron подписала соглашение с профсоюзом Тайчжуна, 11 руководителей профсоюза Таоюаня бастовали 22 октября"),b:L("中央社報導，10月21日協議含調薪、勞退提撥與輪班津貼。桃園工會未達共識，幹部罷工1天。經濟部樂見雙方理性溝通，盼桃園廠續協商；美光在台累計投資1.6兆元。","中央社报道，10月21日协议含调薪、劳退提拨与轮班津贴。桃园工会未达共识，干部罢工1天。经济部乐见双方理性沟通，盼桃园厂续协商；美光在台累计投资1.6兆元。","中央社によると、10月21日の協定は賃上げ、退職金拠出、交替勤務手当を含む。桃園労組は合意せず幹部が1日スト。経済部は理性的な対話を歓迎し、桃園工場の協議継続を望む。マイクロンの台湾累計投資は1.6兆元。","CNA: kesepakatan 21 Oktober mencakup kenaikan gaji, iuran pensiun dan tunjangan sif. Serikat Taoyuan belum sepakat dan pengurusnya mogok sehari. Kementerian Ekonomi menyambut dialog dan berharap negosiasi Taoyuan berlanjut; investasi Micron di Taiwan NT$1,6 triliun.","Theo CNA, thỏa thuận 21/10 gồm tăng lương, đóng hưu trí và phụ cấp ca. Công đoàn Đào Viên chưa đồng thuận, cán bộ đình công một ngày. Bộ Kinh tế hoan nghênh đối thoại, mong Đào Viên tiếp tục thương lượng; Micron đầu tư lũy kế 1,6 nghìn tỷ tại Đài Loan.","CNA reports the 21 October deal covers pay rises, pension contributions and shift allowances. The Taoyuan union did not agree and its officers struck for one day. The economy ministry welcomed the dialogue and hopes Taoyuan talks continue; Micron has invested NT$1.6 trillion in Taiwan.","По данным CNA, соглашение от 21 октября включает повышение зарплат, пенсионные отчисления и сменные надбавки. Профсоюз Таоюаня не согласился, его руководители бастовали один день. Минэкономики приветствует диалог и надеется на продолжение переговоров; инвестиции Micron на Тайване 1,6 трлн тайв. долл."),k:L("同一家公司、兩個工會，一廠簽約、一廠罷工。","同一家公司、两个工会，一厂签约、一厂罢工。","同じ会社の二つの労組で、一方は協定、もう一方はスト。","Satu perusahaan, dua serikat: satu pabrik teken, satu pabrik mogok.","Cùng một công ty, hai công đoàn: một nhà máy ký kết, một nhà máy đình công.","One company, two unions: one plant signed, the other struck.","Одна компания и два профсоюза: один завод подписал, другой бастовал.")},
 {date:"2026-10-22",src:"中央社",url:"https://www.cna.com.tw/news/afe/202610223003.aspx",links:["fin"],t:L("美光回應工會訴求獎酬升級，增季度分潤獎金並調薪","美光回应工会诉求奖酬升级，增季度分润奖金并调薪","マイクロンが労組要求に応え報酬改定、四半期利益配分ボーナス追加","Micron tanggapi serikat: bonus bagi hasil kuartalan dan kenaikan gaji","Micron đáp ứng công đoàn: thêm thưởng chia lợi nhuận quý và tăng lương","Micron answers union demands by upgrading compensation, adding a quarterly profit-sharing bonus and raising pay","Micron в ответ на требования профсоюза улучшает вознаграждение, добавляя квартальную премию из прибыли и повышая зарплаты"),b:L("記憶體景氣與AI需求推升半導體人力競逐，DIGITIMES同時報導美光擬自南韓延攬人才來台。","存储景气与AI需求推升半导体人力竞逐，DIGITIMES同时报道美光拟自韩国延揽人才来台。","メモリー市況とAI需要で人材争奪が激化。DIGITIMESはマイクロンが韓国から台湾へ人材を引き抜く計画も報道。","Siklus memori dan AI memanaskan perebutan talenta; DIGITIMES laporkan Micron rekrut dari Korea ke Taiwan.","Chu kỳ bộ nhớ và AI làm nóng cuộc đua nhân lực; DIGITIMES đưa tin Micron tuyển từ Hàn Quốc sang Đài Loan.","The memory upturn and AI demand are driving fiercer competition for semiconductor talent, and DIGITIMES also reports that Micron plans to recruit people from South Korea to Taiwan.","Подъём рынка памяти и спрос со стороны ИИ усиливают борьбу за кадры в полупроводниковой отрасли, а DIGITIMES также сообщает, что Micron планирует привлекать специалистов из Южной Кореи на Тайвань."),k:L("半導體薪資戰已跨國開打。","半导体薪资战已跨国开打。","半導体の賃金競争は国境を越えた。","Perang gaji semikonduktor sudah lintas negara.","Cuộc chiến lương bán dẫn đã vượt biên giới.","The semiconductor pay war has gone cross-border.","Зарплатная война в полупроводниковой отрасли уже перешла национальные границы.")},
 {date:"2026-10-11",src:"科技新報",url:"https://technews.tw/2026/10/11/ai-was-supposed-to-kill-tech-jobs-the-data-on-job-openings-says-otherwise/",links:["ai"],t:L("AI沒搶走飯碗：科技業職缺回升突破28萬，裁員潮大幅放緩","AI没抢走饭碗：科技业职缺回升突破28万，裁员潮大幅放缓","AIは職を奪わず：テック求人は28万件超に回復、解雇は大幅減速","AI tidak merebut pekerjaan: lowongan teknologi pulih >280.000; PHK melambat tajam","AI không cướp việc: tin tuyển dụng công nghệ phục hồi >280.000; sa thải chậm hẳn","AI is not taking the jobs: tech sector openings rebound past 280,000 and the layoff wave slows sharply","ИИ не отнимает рабочие места: число вакансий в технологическом секторе восстановилось и превысило 280 тысяч, а волна сокращений заметно ослабла"),b:L("TrueUp追蹤逾9,000家科技公司，職缺自年初明顯回升；今年約19萬人被裁，遠低於2023年高峰的43萬。","TrueUp追踪逾9,000家科技公司，职缺自年初明显回升；今年约19万人被裁，远低于2023年高峰的43万。","TrueUpは9,000社超を追跡、求人は年初から明確に回復。今年の解雇は約19万人で2023年ピークの43万人を大きく下回る。","TrueUp lacak >9.000 perusahaan; lowongan naik jelas sejak awal tahun. PHK tahun ini ~190.000, jauh di bawah puncak 2023 430.000.","TrueUp theo dõi >9.000 công ty; tin tuyển dụng tăng rõ từ đầu năm. Sa thải năm nay ~190.000, thấp xa đỉnh 2023 là 430.000.","TrueUp tracks more than 9,000 technology companies and shows openings up markedly since the start of the year. About 190,000 people have been laid off this year, far below the 2023 peak of 430,000.","TrueUp отслеживает более 9 000 технологических компаний и фиксирует заметный рост числа вакансий с начала года. В этом году сокращены около 190 тысяч человек, что намного меньше пика 2023 года в 430 тысяч."),k:L("AI改變的是職務內容，不是職缺數。","AI改变的是职务内容，不是职缺数。","AIが変えるのは職務内容であって求人数ではない。","AI mengubah isi pekerjaan, bukan jumlah lowongan.","AI thay đổi nội dung công việc, không phải số việc làm.","What AI changes is the content of a job, not the number of jobs.","ИИ меняет содержание работы, а не количество рабочих мест.")},
 {date:"2026-10-28",src:"樂聯網",url:"https://n.yam.com/Article/20261028595787",links:["ai"],t:L("AI人才爭奪戰升溫：技能缺口已是現在式，HR轉向技能導向招募","AI人才争夺战升温：技能缺口已是现在式，HR转向技能导向招募","AI人材争奪が激化：スキル不足は現在進行形、HRはスキル基準採用へ","Perebutan talenta AI memanas: kesenjangan skill sudah terjadi; HR beralih ke rekrutmen berbasis skill","Cuộc đua nhân tài AI nóng lên: thiếu kỹ năng đã là hiện tại; HR chuyển sang tuyển dụng theo kỹ năng","The fight for AI talent heats up: the skills gap is already present tense, and HR is turning to skills-based hiring","Борьба за специалистов по ИИ обостряется: разрыв в навыках это уже настоящее время, и HR переходит к найму на основе навыков"),b:L("HR Morning報告指出職缺長期未補、試點停滯、AI輔助產出難以衡量。建議從客服、財務作業與行銷做技能盤點，職缺描述改強調判斷力與數據素養。","HR Morning报告指出职缺长期未补、试点停滞、AI辅助产出难以衡量。建议从客服、财务作业与营销做技能盘点，职缺描述改强调判断力与数据素养。","HR Morningは長期欠員、停滞するパイロット、AI支援業務の測定困難を指摘。顧客対応、財務、マーケから技能棚卸しを行い、求人票は判断力とデータ素養を強調せよと提言。","HR Morning: lowongan lama kosong, pilot mandek, output berbantuan AI sulit diukur. Saran: audit skill mulai dari layanan pelanggan, keuangan, pemasaran; deskripsi kerja tekankan penilaian dan literasi data.","HR Morning: vị trí trống lâu, thí điểm đình trệ, khó đo đầu ra có AI hỗ trợ. Khuyến nghị kiểm kê kỹ năng từ CSKH, tài chính, tiếp thị; mô tả công việc nhấn mạnh phán đoán và hiểu dữ liệu.","An HR Morning report points to openings that go unfilled for long stretches, stalled pilots and AI-assisted output that is hard to measure. It recommends running a skills audit in customer service, finance operations and marketing, and rewriting job descriptions to stress judgment and data literacy.","В отчёте HR Morning указаны долго не заполняемые вакансии, застопорившиеся пилотные проекты и трудно измеримый результат работы с ИИ. Авторы советуют начать инвентаризацию навыков в обслуживании клиентов, финансовых операциях и маркетинге, а в описаниях вакансий подчёркивать способность к суждению и умение работать с данными."),k:L("先盤點技能，再買工具。","先盘点技能，再买工具。","ツールを買う前にスキルを棚卸し。","Audit skill dulu, baru beli alat.","Kiểm kê kỹ năng trước, mua công cụ sau.","Audit the skills first, buy the tools second.","Сначала инвентаризация навыков, потом покупка инструментов.")},
 {date:"2026-10-01",src:"MarkRead",url:"https://www.markreadfintech.com/p/bank-ai-layoffs-2026-taiwan",links:["fin","ai"],t:L("金融業AI裁員潮：渣打2030年前減逾15%企業職能職位，台灣金控先動派遣與初階職","金融业AI裁员潮：渣打2030年前减逾15%企业职能职位，台湾金控先动派遣与初阶职","金融AI人員削減：スタンダードチャータードは2030年までに企業職能15%超削減、台湾金融は派遣と初級職から","Gelombang PHK AI perbankan: StanChart pangkas >15% posisi fungsi korporat hingga 2030; Taiwan mulai dari tenaga alih daya dan junior","Làn sóng cắt giảm vì AI trong ngân hàng: StanChart cắt >15% vị trí chức năng doanh nghiệp đến 2030; Đài Loan bắt đầu từ lao động phái cử và cấp thấp","AI-driven layoffs in finance: Standard Chartered will cut more than 15% of its corporate function roles before 2030, while Taiwan's financial holding companies start with contract and entry-level positions","Волна сокращений из-за ИИ в финансовом секторе: Standard Chartered сократит более 15% должностей в корпоративных функциях до 2030 года, а тайваньские финансовые холдинги начинают с заёмных и начальных позиций"),b:L("渣打約7,000個職位受影響，涵蓋KYC、支付作業、人資與軟體開發；Visa裁2,600人。台灣本國銀行員工2025年底16.7萬人創新高，壓力集中在派遣與客服資料登打。","渣打约7,000个职位受影响，涵盖KYC、支付作业、人资与软件开发；Visa裁2,600人。台湾本国银行员工2025年底16.7万人创新高，压力集中在派遣与客服数据录入。","スタンチャートは約7,000職が対象（KYC、決済、人事、開発）。Visaは2,600人削減。台湾の国内銀行員は2025年末16.7万人で最高、圧力は派遣とデータ入力に集中。","StanChart ~7.000 posisi (KYC, pembayaran, HR, pengembangan); Visa PHK 2.600. Pegawai bank Taiwan 167.000 pada akhir 2025, rekor; tekanan pada alih daya dan entri data.","StanChart ~7.000 vị trí (KYC, thanh toán, nhân sự, phát triển); Visa cắt 2.600. Nhân viên ngân hàng Đài Loan 167.000 cuối 2025, kỷ lục; áp lực dồn vào phái cử và nhập liệu.","About 7,000 positions at Standard Chartered are affected, covering KYC, payment operations, HR and software development, and Visa is cutting 2,600 jobs. Headcount at Taiwan's domestic banks hit a record 167,000 at the end of 2025, with the pressure concentrated in contract staff and customer service data entry.","В Standard Chartered затронуты около 7 000 должностей, включая KYC, платёжные операции, кадры и разработку программного обеспечения, а Visa сокращает 2 600 человек. Численность сотрудников национальных банков Тайваня на конец 2025 года достигла рекордных 167 тысяч, причём давление сосредоточено на заёмном персонале и вводе данных в клиентской поддержке."),k:L("後台先熄燈，前台的人反而更貴。","后台先熄灯，前台的人反而更贵。","バックオフィスから消え、フロントの人はむしろ高くなる。","Back office padam dulu; orang front office justru lebih mahal.","Hậu trường tắt đèn trước; người ở tuyến đầu lại đắt hơn.","The back office goes dark first, and the people out front only get more expensive.","Сначала гаснет свет в бэк-офисе, а люди во фронт-офисе становятся только дороже.")},
 {date:"2026-10-13",src:"中央社",url:"https://www.cna.com.tw/news/afe/202610130306.aspx",links:["ai","fin"],t:L("金管會發布代理AI諮詢文件，要求把AI代理視為數位員工","金管会发布代理AI咨询文件，要求把AI代理视为数字员工","金管会が代理AI諮問文書を公表、AIエージェントをデジタル従業員として扱う","FSC terbitkan dokumen konsultasi AI agen, minta agen AI diperlakukan sebagai karyawan digital","FSC công bố tài liệu tham vấn AI tác tử, yêu cầu coi tác tử AI như nhân viên số","FSC issues agentic AI consultation paper, treating AI agents as digital employees","FSC опубликовала консультационный документ об ИИ-агентах, предлагая считать их цифровыми сотрудниками"),b:L("對外徵詢30天，分安全治理、風險分級、安全控管三面向。林裕泰舉例：只整理客訴摘要屬中低風險，能回信給客戶屬中高風險。金融業代理AI多處試驗階段。","对外征询30天，分安全治理、风险分级、安全控管三面向。林裕泰举例：只整理客诉摘要属中低风险，能回信给客户属中高风险。金融业代理AI多处试验阶段。","意見募集は30日で、安全統治、リスク分級、安全管理の三面。林裕泰氏の例では苦情要約のみなら中低リスク、顧客へ返信できれば中高リスク。金融業の代理AIは多くが試験段階。","Konsultasi 30 hari, mencakup tata kelola, penilaian risiko dan kontrol keamanan. Lin Yu-tai: merangkum keluhan berisiko menengah-rendah, membalas nasabah menengah-tinggi. AI agen keuangan umumnya masih tahap uji.","Lấy ý kiến 30 ngày, gồm ba mặt: quản trị an toàn, phân cấp rủi ro, kiểm soát an toàn. Lâm Dụ Thái nêu ví dụ: chỉ tóm tắt khiếu nại là rủi ro trung thấp, trả lời khách là rủi ro trung cao. AI tác tử tài chính phần lớn còn thử nghiệm.","The 30-day consultation covers security governance, risk grading and security controls. Lin Yu-tai said an agent that only summarises complaints is lower-medium risk, while one that replies to customers is upper-medium risk. Most financial agents are still in trials.","Консультации на 30 дней охватывают управление безопасностью, градацию рисков и контроль. Линь Юйтай привёл пример: агент, лишь обобщающий жалобы, несёт средне-низкий риск, а отвечающий клиентам средне-высокий. Большинство финансовых агентов пока в стадии испытаний."),k:L("林裕泰稱應把代理AI視為數位員工，重點在其權限。","林裕泰称应把代理AI视为数字员工，重点在其权限。","林氏は、代理AIをデジタル従業員とみなし、権限を重視すべきだと述べた。","Lin: AI agen harus dipandang sebagai karyawan digital, kuncinya pada wewenangnya.","Ông Lâm: nên coi AI tác tử là nhân viên số, trọng tâm là quyền hạn.","Lin said agentic AI should be treated as a digital employee, with the focus on its permissions.","Линь заявил, что ИИ-агента следует считать цифровым сотрудником, главное его полномочия.")},
 {date:"2026-10-20",src:"立樂高園",url:"https://www.reeracoen.tw/employers/articles/2026_10_RA_TC_02",links:["ai"],t:L("2026台灣企業AI轉型調查：真正的缺口不是工具，而是人才戰略","2026台湾企业AI转型调查：真正的缺口不是工具，而是人才战略","2026年台湾企業AI転換調査：本当の欠落はツールではなく人材戦略","Survei transformasi AI Taiwan 2026: yang kurang bukan alat, melainkan strategi talenta","Khảo sát chuyển đổi AI Đài Loan 2026: thiếu không phải công cụ mà là chiến lược nhân tài","2026 survey of AI transformation at Taiwanese companies: the real gap is not tools but talent strategy","Исследование ИИ-трансформации тайваньских предприятий 2026 года: настоящий пробел не в инструментах, а в стратегии работы с кадрами"),b:L("上過AI課的企業招募仍卡關，問題在職務設計與考核沒有跟著改。中央社報導台灣高科技業赴馬來西亞攬才，掀起赴台就業熱潮。","上过AI课的企业招募仍卡关，问题在职务设计与考核没有跟着改。中央社报道台湾高科技业赴马来西亚揽才，掀起赴台就业热潮。","AI研修を受けても採用は停滞、原因は職務設計と評価が変わっていないこと。台湾ハイテク企業はマレーシアで採用活動、台湾就職ブームに。","Perusahaan yang sudah ikut kursus AI tetap macet merekrut karena desain pekerjaan dan penilaian tak berubah. Perusahaan teknologi Taiwan merekrut di Malaysia.","Doanh nghiệp đã học AI vẫn tắc tuyển dụng vì thiết kế công việc và đánh giá chưa đổi. Công nghệ cao Đài Loan sang Malaysia tuyển người.","Companies whose staff have taken AI courses still get stuck in hiring, because job design and performance evaluation have not changed along with it. CNA reports that Taiwan's high-tech sector is recruiting in Malaysia and has set off a surge of interest in working in Taiwan.","Компании, сотрудники которых прошли курсы по ИИ, всё равно упираются в проблемы при найме, поскольку проектирование должностей и оценка результатов за этим не изменились. Агентство CNA сообщает, что тайваньский высокотехнологичный сектор ведёт набор в Малайзии и вызвал волну интереса к работе на Тайване."),k:L("東南亞人才是台灣科技業的新水源。","东南亚人才是台湾科技业的新水源。","東南アジア人材は台湾テックの新たな水源。","Talenta Asia Tenggara jadi sumber baru industri teknologi Taiwan.","Nhân tài Đông Nam Á là nguồn nước mới của công nghệ Đài Loan.","Southeast Asian talent is the new water source for Taiwan's technology industry.","Специалисты из Юго-Восточной Азии стали новым источником кадров для технологической отрасли Тайваня.")}
 ]},
