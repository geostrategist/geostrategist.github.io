 {date:"2026-10-28",src:"中央社",url:"https://www.cna.com.tw/news/acn/202610280249.aspx",links:["hr"],t:L("陸委會重申不許一名中國藝人入境，稱其配合統戰宣傳，所依條項與管制期間未載","陆委会重申不许一名中国艺人入境，称其配合统战宣传，所依条款与管制期间未载","大陸委員会が中国人芸能人1人の入境不許可を再表明、統一戦線宣伝への協力を理由とするが根拠条項は記載なし","MAC menegaskan lagi seorang artis Tiongkok tak diizinkan masuk karena disebut mendukung propaganda front persatuan; pasal dan masa larangan tak disebut","Hội đồng Đại lục tái khẳng định không cho một nghệ sĩ Trung Quốc nhập cảnh vì phối hợp tuyên truyền mặt trận thống nhất; không nêu điều khoản và thời hạn","Mainland Affairs Council reaffirms a Chinese entertainer may not enter, citing united front propaganda; the legal clause and ban period are not stated","Совет по делам материка подтвердил запрет на въезд китайскому артисту, сославшись на пропаганду единого фронта; норма и срок запрета не названы"),b:L("中央社報導載，陸委會稱該人多次發布貶抑我國地位內容、積極配合中共對台統戰宣傳；副主委梁文傑稱歡迎兩岸人民交流，但不能成為統戰活動。國台辦10月21日先披露申請未獲許可。","中央社报道称，陆委会称该人多次发布贬抑台湾地位内容、积极配合中共对台统战宣传；副主委梁文杰称欢迎两岸人民交流，但不能成为统战活动。国台办10月21日先披露申请未获许可。","中央社によると、大陸委員会は当該人物が台湾の地位をおとしめる内容を繰り返し発信し、中国共産党の対台湾統一戦線宣伝に積極的に協力したと説明した。梁文傑副主任委員は、両岸の人的交流は歓迎するが統一戦線活動になってはならないと述べた。国務院台湾事務弁公室が10月21日に不許可を先に明らかにした。","Menurut CNA, MAC menyebut orang itu berulang kali menerbitkan konten yang merendahkan status Taiwan dan aktif mendukung propaganda front persatuan PKT. Wakil ketua Liang Wen-chieh mengatakan pertukaran warga disambut, tetapi tak boleh menjadi kegiatan front persatuan. Kantor Urusan Taiwan lebih dulu mengungkap penolakan pada 21 Oktober.","Theo CNA, Hội đồng Đại lục nói người này nhiều lần đăng nội dung hạ thấp vị thế Đài Loan và tích cực phối hợp tuyên truyền mặt trận thống nhất của ĐCS Trung Quốc. Phó chủ nhiệm Lương Văn Kiệt nói hoan nghênh giao lưu nhưng không thể thành hoạt động mặt trận thống nhất. Văn phòng Sự vụ Đài Loan công bố việc từ chối trước vào 21/10.","CNA reports the council says the person repeatedly posted content demeaning Taiwan's status and actively supported CCP united front propaganda. Deputy head Liang Wen-chieh said exchanges are welcome but must not become united front activity. China's Taiwan Affairs Office first disclosed the denied application on October 21.","По сообщению ЦАН, совет заявил, что это лицо неоднократно публиковало материалы, принижающие статус Тайваня, и активно содействовало пропаганде единого фронта КПК. Замглавы Лян Вэньцзе сказал, что обмены приветствуются, но не должны становиться такой деятельностью. Канцелярия по делам Тайваня сообщила об отказе первой, 21 октября."),k:L("依據、程序與期間皆未公布，外界無從判斷同類申請的處理是否一致。","依据、程序与期间皆未公布，外界无从判断同类申请的处理是否一致。","根拠、手続き、期間のいずれも未公表で、同種の申請の扱いが一貫しているか外部から判断できない。","Dasar, prosedur, dan masa larangan belum diumumkan, sehingga publik tak bisa menilai konsistensi penanganan permohonan serupa.","Căn cứ, thủ tục và thời hạn đều chưa công bố, nên bên ngoài không thể đánh giá các đơn tương tự có được xử lý nhất quán hay không.","With the basis, procedure and period all unpublished, outsiders cannot judge whether similar applications are handled consistently.","Основания, процедура и срок не обнародованы, поэтому извне нельзя судить, единообразно ли рассматриваются подобные заявки.")},
 {date:"2026-10-30",src:"The Record",url:"https://therecord.media/gchq-cannot-account-for-thousands-of-data-devices",links:["rd"],t:L("英國監督機關年度報告載，政府通訊總部無法掌握估計數千個可攜式儲存裝置所在","英国监督机构年度报告称，政府通信总部无法掌握估计数千个便携式存储设备所在","英監督機関の年次報告によると、GCHQは推計数千個の可搬型記憶装置の所在を把握できず","Laporan tahunan lembaga pengawas Inggris menyebut GCHQ tak dapat melacak diperkirakan ribuan perangkat penyimpanan portabel","Báo cáo năm của cơ quan giám sát Anh cho biết GCHQ không nắm được vị trí của ước tính hàng nghìn thiết bị lưu trữ di động","UK watchdog's annual report says GCHQ cannot locate an estimated thousands of portable storage devices","В годовом отчёте британского надзорного органа говорится, что GCHQ не может установить местонахождение, по оценке, тысяч переносных носителей"),b:L("The Record報導，調查權力專員辦公室2025年度報告載部分裝置可能含依調查權力法取得的資料；專員Sir Brian Leveson稱問題數年前已提出。該機關稱已糾正，但拒絕確認是否知悉未經授權存取。","The Record报道，调查权力专员办公室2025年度报告称部分设备可能含依调查权力法取得的资料；专员Sir Brian Leveson称问题数年前已提出。该机构称已纠正，但拒绝确认是否知悉未经授权访问。","The Recordによると、調査権限コミッショナー事務局の2025年度報告は、一部の装置に調査権限法に基づく資料が含まれる可能性を明らかにした。Sir Brian Leveson委員は問題は数年前に指摘済みとした。同機関は是正措置を取ったとするが、無権限アクセスの認識の有無は確認を拒んだ。","The Record melaporkan, laporan tahunan 2025 IPCO mengungkap sebagian perangkat mungkin memuat data yang diperoleh berdasarkan UU Kewenangan Penyidikan; komisioner Sir Brian Leveson menyebut masalah itu diangkat beberapa tahun lalu. GCHQ mengaku telah melakukan perbaikan, tetapi menolak memastikan apakah mengetahui akses tanpa izin.","Theo The Record, báo cáo năm 2025 của IPCO cho biết một số thiết bị có thể chứa dữ liệu thu được theo Đạo luật Quyền Điều tra; ủy viên Sir Brian Leveson nói vấn đề đã được nêu từ nhiều năm trước. GCHQ nói đã có biện pháp khắc phục nhưng từ chối xác nhận có biết việc truy cập trái phép hay không.","The Record reports that the Investigatory Powers Commissioner's Office 2025 annual report says some devices may hold data obtained under the Investigatory Powers Act; commissioner Sir Brian Leveson said the problems were raised years ago. GCHQ says it has taken corrective steps but declined to confirm whether it knows of unauthorized access.","The Record: в отчёте IPCO за 2025 год сказано, что часть носителей может содержать данные, полученные по закону о следственных полномочиях; комиссар сэр Брайан Левесон заявил, что проблемы поднимались ещё несколько лет назад. GCHQ сообщил о корректирующих мерах, но отказался подтвердить, известно ли ему о несанкционированном доступе."),k:L("我方三條外部監督管道均無就機密載具清點結果定期公開的設計。","我方三条外部监督渠道均无就机密载体清点结果定期公开的设计。","台湾の3つの外部監督経路には、機密媒体の棚卸結果を定期公開する仕組みがない。","Tiga jalur pengawasan eksternal Taiwan tidak dirancang untuk rutin mengumumkan hasil inventaris media rahasia.","Ba kênh giám sát bên ngoài của Đài Loan đều không được thiết kế để định kỳ công bố kết quả kiểm kê vật mang tin mật.","None of Taiwan's three external oversight channels is designed to regularly publish inventory results for classified media.","Ни один из трёх каналов внешнего надзора на Тайване не предусматривает регулярной публикации итогов инвентаризации секретных носителей.")},
 {date:"2026-09-30",src:"中央社",url:"https://www.cna.com.tw/news/aipl/202609300100.aspx",links:["mil","hr"],t:L("國防部官員稱體位區分標準預計10月31日施行，檢定表176項次修正160項次","国防部官员称体位区分标准预计10月31日施行，检定表176项次修正160项次","国防部当局者は体位区分基準などを10月31日に公布施行予定とし、検定基準表176項目中160項目を修正","Pejabat Kementerian Pertahanan: standar klasifikasi fisik dan lainnya direncanakan berlaku 31 Oktober; 160 dari 176 butir tabel diubah","Quan chức Bộ Quốc phòng: tiêu chuẩn phân loại thể trạng và các quy định khác dự kiến có hiệu lực 31/10; sửa 160 trên 176 mục","Defense official says physical classification standards and related rules were due to take effect October 31, revising 160 of 176 table items","Чиновник Минобороны: стандарты классификации годности и связанные правила планировалось ввести 31 октября; изменены 160 из 176 пунктов таблицы"),b:L("中央社報導載，修正後僅身體質量指數大於45或身高未達144公分者，及中度以上高血壓併發實質器官病變者免役。法規資料庫10月28日列三案修正，至11月3日晨報未見10月31日發布紀錄，是否發布未確認。","中央社报道称，修正后仅身体质量指数大于45或身高未达144厘米者，及中度以上高血压并发实质器官病变者免役。法规数据库10月28日列三案修正，至11月3日晨报未见10月31日发布记录，是否发布未确认。","中央社によると、修正後の兵役免除はBMI45超または身長144センチ未満の者、中等度以上の高血圧で実質臓器病変を併発した者に限られる。法規データベースは10月28日に3件の修正を掲載したが、11月3日朝刊時点で10月31日の公布記録はなく、公布の有無は未確認。","Menurut CNA, setelah revisi pembebasan wajib militer hanya bagi BMI di atas 45 atau tinggi di bawah 144 cm, dan hipertensi sedang ke atas dengan kerusakan organ parenkim. Basis data hukum mencantumkan tiga revisi pada 28 Oktober; hingga laporan 3 November tidak terlihat catatan terbit 31 Oktober, belum terkonfirmasi.","Theo CNA, sau sửa đổi chỉ miễn nghĩa vụ với BMI trên 45 hoặc cao dưới 144 cm, và tăng huyết áp từ trung bình trở lên kèm tổn thương cơ quan đặc. Cơ sở dữ liệu pháp luật liệt kê ba bản sửa ngày 28/10; đến bản tin 3/11 chưa thấy ghi nhận ban hành 31/10, chưa xác nhận.","CNA reports that after revision only those with BMI above 45 or height under 144 cm, or moderate or worse hypertension with parenchymal organ damage, are exempt. The law database listed three revisions on October 28; as of the November 3 brief no October 31 promulgation record was seen, so issuance is unconfirmed.","По сообщению ЦАН, после поправок от службы освобождаются лишь лица с ИМТ выше 45 или ростом менее 144 см и с гипертонией средней и выше степени с поражением паренхиматозных органов. База законов указала три поправки 28 октября; к сводке от 3 ноября записи о публикации 31 октября нет, факт не подтверждён."),k:L("三案是否發布尚待公報確認，效果在判定標準一致化而不涉役期與役別。","三案是否发布尚待公报确认，效果在判定标准一致化而不涉服役期与役别。","3件の公布は官報での確認待ちで、効果は判定基準の統一にあり、服役期間や役種には及ばない。","Penerbitan tiga revisi menunggu konfirmasi lembaran resmi; efeknya menyeragamkan standar penilaian, tidak menyangkut masa dan jenis dinas.","Việc ban hành ba bản sửa còn chờ công báo xác nhận; tác dụng là thống nhất tiêu chuẩn đánh giá, không liên quan thời hạn và loại hình nghĩa vụ.","Whether the three revisions were issued awaits the official gazette; their effect is consistent assessment standards, not service length or type.","Публикацию трёх поправок ещё должен подтвердить официальный вестник; их смысл в единых критериях оценки, а не в сроке и виде службы.")},
 ]},
{id:"nuc",kind:"reactor",color:"#6FA82B",ring:3,ang:15,
 name:L("核能","核能","原子力","Nuklir","Hạt nhân","Nuclear","Атомная энергетика"),
 tag:L("核能晨報 2026-11-03","核能晨报 2026-11-03","原子力朝刊 2026-11-03","Brief Nuklir 2026-11-03","Bản tin Hạt nhân 2026-11-03","Nuclear Brief 2026-11-03","Ядерный бюллетень 2026-11-03"),
 desc:L("本島依核子安全、核子保安、核子保防三個規範體系追蹤全球核能動態。三者分別針對意外與失效、惡意行為者、國家移作他用，判準來源為安全評估、國家威脅評估與保防協定，不得混用。資料取自核能晨報，保留原有的歸因與確定程度。","本岛依核安全、核安保、核保障三个规范体系追踪全球核能动态。三者分别针对意外与失效、恶意行为者、国家移作他用，判断依据为安全评估、国家威胁评估与保障协定，不得混用。资料取自核能晨报，保留原有的归因与确定程度。","この島は原子力安全、核セキュリティ、保障措置という三つの規範体系に沿って世界の原子力動向を追います。三者はそれぞれ事故と故障、悪意ある行為者、国家による転用を対象とし、判断基準は安全評価、国の脅威評価、保障措置協定で、混同できません。資料は原子力朝刊に基づき、出典の帰属と確度の表現を保っています。","Pulau ini memantau perkembangan nuklir global menurut tiga sistem norma: keselamatan nuklir, keamanan nuklir, dan safeguards nuklir. Ketiganya masing-masing menangani kecelakaan dan kegagalan, pelaku jahat, serta pengalihan oleh negara, dengan acuan penilaian keselamatan, penilaian ancaman nasional, dan perjanjian safeguards, sehingga tidak boleh dicampuradukkan. Data berasal dari Brief Nuklir dengan atribusi dan tingkat kepastian yang tetap dipertahankan.","Đảo này theo dõi động thái hạt nhân toàn cầu theo ba hệ thống quy phạm: an toàn hạt nhân, an ninh hạt nhân và thanh sát hạt nhân. Ba hệ thống lần lượt nhắm tới sự cố và hỏng hóc, tác nhân ác ý, và việc quốc gia chuyển đổi mục đích sử dụng, với căn cứ là đánh giá an toàn, đánh giá mối đe dọa quốc gia và hiệp định thanh sát, không được lẫn lộn. Dữ liệu lấy từ Bản tin Hạt nhân, giữ nguyên cách quy nguồn và mức độ chắc chắn.","This island tracks global nuclear developments under three separate normative systems: nuclear safety, nuclear security, and nuclear safeguards. They address accidents and failures, malicious actors, and diversion by states, respectively, and rest on safety assessment, national threat assessment, and safeguards agreements, so they must not be conflated. Data come from the Nuclear Brief, keeping its attribution and level of certainty.","Этот остров отслеживает мировые ядерные события по трём отдельным нормативным системам: ядерная безопасность, физическая ядерная безопасность и ядерные гарантии. Они касаются соответственно аварий и отказов, злоумышленников и переключения материалов государством, а их основой служат оценка безопасности, национальная оценка угроз и соглашения о гарантиях, поэтому смешивать их нельзя. Данные взяты из Ядерного бюллетеня с сохранением ссылок на источники и степени определённости."),
 items:[
 {date:"2026-10-28",src:"美國能源部",url:"https://www.energy.gov/articles/energy-department-announces-5-billion-loan-boost-nuclear-power-and-help-lower-costs",links:["fin"],t:L("美國能源部就Constellation八電廠增容核給至多50億美元有條件承諾","美国能源部就Constellation八电厂增容给予至多50亿美元有条件承诺","米エネルギー省、Constellationの8発電所の出力増強に最大50億ドルの条件付き融資確約","Departemen Energi AS memberi komitmen pinjaman bersyarat hingga 5 miliar dolar AS untuk peningkatan daya delapan pembangkit Constellation","Bộ Năng lượng Mỹ đưa ra cam kết cho vay có điều kiện tới 5 tỷ USD để nâng công suất tám nhà máy của Constellation","US Energy Department offers conditional loan commitment of up to USD 5 billion for uprates at eight Constellation plants","Минэнерго США дало условное обязательство по кредиту до 5 млрд долларов на повышение мощности восьми станций Constellation"),b:L("能源部稱此案屬Project UPRISE，涵蓋伊利諾、馬里蘭與賓州機組。有條件承諾僅表示貸款意向，Constellation須先滿足技術、法律、環境與財務條件才會撥款。","能源部称此案属Project UPRISE，涵盖伊利诺伊、马里兰与宾夕法尼亚机组。有条件承诺仅表示贷款意向，Constellation须先满足技术、法律、环境与财务条件才会拨款。","同省によると本件はProject UPRISEの一環で、イリノイ、メリーランド、ペンシルベニア各州の機組の出力増強と近代化が対象。条件付き確約は融資の意向を示すにとどまり、Constellationが技術、法律、環境、財務の条件を満たした後に正式な融資文書と資金交付に進む。","Departemen itu menyebut kasus ini bagian dari Project UPRISE, untuk peningkatan daya dan modernisasi unit di Illinois, Maryland, dan Pennsylvania. Komitmen bersyarat hanya menyatakan niat memberi pinjaman; Constellation harus lebih dulu memenuhi syarat teknis, hukum, lingkungan, dan keuangan sebelum dokumen pembiayaan resmi dan pencairan.","Bộ này cho biết khoản này thuộc Project UPRISE, dùng để nâng công suất và hiện đại hóa các tổ máy tại Illinois, Maryland và Pennsylvania. Cam kết có điều kiện chỉ thể hiện ý định cho vay; Constellation phải đáp ứng các điều kiện kỹ thuật, pháp lý, môi trường và tài chính trước khi có văn bản tài trợ chính thức và giải ngân.","The department says this falls under Project UPRISE and covers uprates and modernization at units in Illinois, Maryland, and Pennsylvania. A conditional commitment only signals intent to lend; Constellation must first meet technical, legal, environmental, and financial conditions before formal financing documents and disbursement.","По словам министерства, это часть Project UPRISE и охватывает повышение мощности и модернизацию блоков в Иллинойсе, Мэриленде и Пенсильвании. Условное обязательство лишь выражает намерение предоставить кредит; Constellation должна сначала выполнить технические, правовые, экологические и финансовые условия, и лишь затем следуют официальные документы и выплата."),k:L("融資仍屬有條件承諾，與機組層級執照修正是兩回事，不得互推。","融资仍属有条件承诺，与机组层面的执照修改是两回事，不得互推。","融資は条件付き確約の段階で、機組ごとの許可変更とは別の話であり、一方から他方を推定できない。","Pembiayaan masih berupa komitmen bersyarat dan berbeda dari perubahan izin tiap unit; yang satu tidak dapat disimpulkan dari yang lain.","Khoản vay vẫn là cam kết có điều kiện, khác với việc sửa đổi giấy phép từng tổ máy; không thể suy cái này từ cái kia.","The financing remains a conditional commitment, separate from unit-level license amendments; neither can be inferred from the other.","Финансирование остаётся условным обязательством и не равно изменению лицензий по блокам; одно нельзя выводить из другого.")},
 {date:"2026-10-29",src:"World Nuclear News",url:"https://www.world-nuclear-news.org/articles/khnp-ends-negotiations-with-construction-consortium-czech-units",links:["prod","fin"],t:L("KHNP與大宇、斗山聯合體的杜科瓦尼承攬談判破裂，將另選施工承攬商","KHNP与大宇、斗山联合体的杜科瓦尼承包谈判破裂，将另选施工承包商","KHNP、大宇・斗山連合とのドコバニ施工請負交渉が決裂し別の請負業者を選定へ","Negosiasi kontrak Dukovany antara KHNP dan konsorsium Daewoo-Doosan gagal; KHNP akan memilih kontraktor konstruksi lain","Đàm phán thầu Dukovany giữa KHNP và liên danh Daewoo, Doosan đổ vỡ; KHNP sẽ chọn nhà thầu thi công khác","KHNP's Dukovany subcontract talks with the Daewoo-Doosan consortium collapse; it will select another construction contractor","Переговоры KHNP с консорциумом Daewoo и Doosan по подряду на Дукованах сорвались; KHNP выберет другого строительного подрядчика"),b:L("捷克政府2025年6月授予KHNP 26兆韓元（194億美元）主合約。KHNP主張採基本設計基準數量的總價合約，聯合體主張依細部設計數量調整付款，雙方未能達成一致。","捷克政府2025年6月授予KHNP 26万亿韩元（194亿美元）主合同。KHNP主张采用基本设计基准数量的总价合同，联合体主张依详细设计数量调整付款，双方未能达成一致。","チェコは2025年6月、APR1000の2基についてKHNPに26兆ウォン（194億ドル）の主契約を授与した。KHNPは基本設計段階の基準数量による総価契約を主張し、連合は詳細設計で確定した数量に応じた支払い調整を主張して、合意に至らなかった。","Pada Juni 2025 Ceko memberikan kontrak utama senilai 26 triliun won (19.4 miliar dolar AS) kepada KHNP untuk dua unit APR1000. KHNP menginginkan kontrak harga tetap berdasarkan kuantitas acuan tahap desain dasar, sedangkan konsorsium menginginkan pembayaran disesuaikan dengan kuantitas desain rinci; kesepakatan tidak tercapai.","Tháng 6 năm 2025, Séc trao cho KHNP hợp đồng chính trị giá 26 nghìn tỷ won (19.4 tỷ USD) cho hai tổ máy APR1000. KHNP muốn hợp đồng trọn gói theo khối lượng cơ sở ở giai đoạn thiết kế cơ bản, liên danh muốn điều chỉnh thanh toán theo khối lượng thiết kế chi tiết; hai bên không đạt thỏa thuận.","In June 2025 the Czech government awarded KHNP the main contract worth 26 trillion won (USD 19.4 billion) for two APR1000 units. KHNP sought a lump-sum contract based on baseline quantities from basic design, while the consortium sought payment adjusted to quantities fixed in detailed design; they did not reach agreement.","В июне 2025 года Чехия присудила KHNP основной контракт на 26 трлн вон (19.4 млрд долларов США) на два блока APR1000. KHNP настаивала на контракте с твёрдой ценой по базовым объёмам стадии базового проекта, консорциум на корректировке оплаты по объёмам рабочего проекта; соглашения достичь не удалось."),k:L("數量風險由誰承擔，是台灣若重啟新建或大型延役工程也須先決的條款。","数量风险由谁承担，是台湾若重启新建或大型延寿工程也须先决的条款。","数量リスクを誰が負うかは、台湾が新設や大型の運転延長工事を再開する場合にも先に決めるべき条項である。","Siapa menanggung risiko kuantitas juga merupakan klausul yang harus diputuskan lebih dulu jika Taiwan memulai kembali pembangunan baru atau proyek perpanjangan umur besar.","Ai chịu rủi ro khối lượng cũng là điều khoản phải quyết định trước nếu Đài Loan khởi động lại dự án xây mới hoặc kéo dài tuổi thọ quy mô lớn.","Who bears quantity risk is also a clause Taiwan must settle first if it revives new-build or major life-extension projects.","Кто несёт риск объёмов: этот пункт Тайваню тоже придётся решить заранее, если он возобновит новое строительство или крупные проекты продления срока службы.")},
 {date:"2026-10-27",src:"World Nuclear News",url:"https://www.world-nuclear-news.org/articles/koreas-kori-3-and-4-get-go-ahead-to-restart",links:["rd"],t:L("古里3、4號機獲南韓原子力安全委員會核准繼續運轉各10年，目前均未運轉","古里3、4号机获韩国原子力安全委员会批准继续运行各10年，目前均未运行","古里3・4号機、韓国原子力安全委員会が各10年の継続運転を承認、現在は両機とも停止中","Kori 3 dan 4 mendapat persetujuan NSSC Korea Selatan untuk beroperasi lagi masing-masing 10 tahun; keduanya kini belum beroperasi","Kori 3 và 4 được NSSC Hàn Quốc chấp thuận tiếp tục vận hành mỗi tổ máy 10 năm; hiện cả hai đều chưa vận hành","South Korea's NSSC approves 10 more years of operation each for Kori 3 and 4; neither unit is currently running","Южнокорейская комиссия NSSC одобрила продолжение работы блоков Кори-3 и Кори-4 на 10 лет каждому; сейчас оба не работают"),b:L("兩部機組各1,025MWe，核准後3號機得運轉至2034年9月、4號機至2035年8月。KHNP計畫2027年上半年重啟，此為業者計畫而非管制期日，委員長稱將就現場查證設施改善。","两台机组各1,025MWe，批准后3号机可运行至2034年9月、4号机至2035年8月。KHNP计划2027年上半年重启，此为业者计划而非监管期限，委员长称将到现场核查设施改善。","両機は各1,025MWeで、承認により3号機は2034年9月、4号機は2035年8月まで運転できる。KHNPは2027年上半期の再起動を計画するが、これは事業者の計画で規制上の期日ではない。委員長は設備改善を現場で確認するとしている。","Masing-masing berkapasitas 1,025MWe; Kori 3 boleh beroperasi hingga September 2034 dan Kori 4 hingga Agustus 2035. KHNP merencanakan restart pada paruh pertama 2027, yang merupakan rencana operator, bukan tenggat regulator. Ketua komisi menyatakan akan memverifikasi perbaikan fasilitas di lokasi.","Mỗi tổ máy 1,025MWe; Kori 3 được vận hành đến tháng 9 năm 2034, Kori 4 đến tháng 8 năm 2035. KHNP dự kiến khởi động lại vào nửa đầu năm 2027, đây là kế hoạch của doanh nghiệp, không phải thời hạn quản lý. Chủ tịch ủy ban cho biết sẽ kiểm chứng việc cải thiện thiết bị tại hiện trường.","Each unit is 1,025MWe; Kori 3 may run until September 2034 and Kori 4 until August 2035. KHNP plans restarts in the first half of 2027, an operator plan rather than a regulatory date. The commission chair says it will verify facility improvements on site.","Каждый блок имеет мощность 1,025MWe; Кори-3 может работать до сентября 2034 года, Кори-4 до августа 2035 года. KHNP планирует перезапуск в первой половине 2027 года: это план оператора, а не срок регулятора. Председатель комиссии заявил о проверке улучшений оборудования на площадке."),k:L("核准不等於立即運轉；台灣修法放寬年限，尚無已公開的同類審查文件。","批准不等于立即运行；台湾修法放宽年限，尚无已公开的同类审查文件。","承認は即時の運転を意味しない。台湾は法改正で年限を緩和したが、同種の審査文書はまだ公開されていない。","Persetujuan tidak berarti langsung beroperasi; Taiwan telah melonggarkan batas umur lewat revisi hukum, tetapi belum ada dokumen tinjauan sejenis yang dipublikasikan.","Chấp thuận không có nghĩa là vận hành ngay; Đài Loan đã sửa luật nới giới hạn tuổi thọ nhưng chưa có tài liệu thẩm định tương tự được công bố.","Approval does not mean immediate operation; Taiwan has relaxed its age limit by law but has no comparable published review document yet.","Одобрение не означает немедленной работы; Тайвань законом смягчил предельный срок, но опубликованных аналогичных документов проверки пока нет.")},
 {date:"2026-10-27",src:"核安會",url:"https://www.nusc.gov.tw/newsdetail/headline/7692.html",links:["rd"],t:L("核安會第56報：福島第一第24批次含氚廢水排放約7,852立方公尺","核安会第56报：福岛第一第24批次含氚废水排放约7,852立方米","核安会第56報：福島第一の第24回含トリチウム水放出は約7,852立方メートル","Laporan ke-56 NUSC: pembuangan air limbah bertritium batch ke-24 Fukushima Daiichi sekitar 7,852 meter kubik","Báo cáo thứ 56 của NUSC: đợt 24 xả nước thải chứa triti tại Fukushima Daiichi khoảng 7,852 mét khối","NUSC report no. 56: Fukushima Daiichi's 24th batch of tritiated water discharge, about 7,852 cubic meters","Сообщение NUSC № 56: сброс 24-й партии тритийсодержащей воды с Фукусима-1, около 7,852 кубометра"),b:L("該批10月23日結束，共排放19天，氚活度約1.2兆貝克，第25批次自10月26日開始。第56報載台灣周圍海域無影響，海水氚濃度均低於儀器最小可測值，海域監測均無輻射異常。","该批10月23日结束，共排放19天，氚活度约1.2万亿贝可，第25批次自10月26日开始。第56报称台湾周围海域无影响，海水氚浓度均低于仪器最小可测值，海域监测均无辐射异常。","この回は10月23日に終了し、計19日間で、トリチウム放射能は約1.2兆ベクレル。第25回は10月26日に開始。第56報によると台湾周辺海域に影響はなく、海水のトリチウム濃度は機器の最小検出値を下回り、省庁横断の海域監視の結果にも放射線の異常はない。","Batch ini berakhir 23 Oktober setelah 19 hari dengan aktivitas tritium sekitar 1.2 triliun becquerel; batch ke-25 dimulai 26 Oktober. Laporan ke-56 menyatakan perairan sekitar Taiwan tidak terdampak, konsentrasi tritium air laut di bawah batas deteksi alat, dan pemantauan laut lintas lembaga tidak menemukan anomali radiasi.","Đợt này kết thúc ngày 23 tháng 10 sau 19 ngày, hoạt độ triti khoảng 1.2 nghìn tỷ becquerel; đợt 25 bắt đầu từ ngày 26 tháng 10. Báo cáo thứ 56 cho biết vùng biển quanh Đài Loan không bị ảnh hưởng, nồng độ triti trong nước biển đều dưới ngưỡng phát hiện của thiết bị, giám sát liên ngành không thấy bất thường phóng xạ.","The batch ended October 23 after 19 days, with tritium activity of about 1.2 trillion becquerels; batch 25 began October 26. Report no. 56 says waters around Taiwan are unaffected, seawater tritium concentrations are below instrument detection limits, and interagency marine monitoring found no radiation anomalies.","Партия завершена 23 октября, сброс шёл 19 дней, активность трития около 1.2 трлн беккерелей; 25-я партия начата 26 октября. Согласно сообщению № 56, воды вокруг Тайваня не затронуты, концентрация трития в морской воде ниже предела обнаружения приборов, а межведомственный морской мониторинг не выявил радиационных аномалий."),k:L("活度總量與濃度口徑不同，應與IAEA所示每公升1,500貝克之濃度目標併讀。","活度总量与浓度口径不同，应与IAEA所示每升1,500贝可的浓度目标并读。","放射能総量と濃度は別の指標であり、IAEAが示す1リットル当たり1,500ベクレルの濃度目標と併せて読む必要がある。","Total aktivitas dan konsentrasi adalah ukuran berbeda; keduanya perlu dibaca bersama target konsentrasi 1,500 becquerel per liter yang ditunjukkan IAEA.","Tổng hoạt độ và nồng độ là hai thước đo khác nhau, cần đọc cùng mục tiêu nồng độ 1,500 becquerel mỗi lít do IAEA nêu.","Total activity and concentration are different measures and should be read alongside the concentration target of 1,500 becquerels per liter cited by the IAEA.","Суммарная активность и концентрация являются разными показателями; их следует читать вместе с указанным МАГАТЭ целевым уровнем концентрации 1,500 беккерелей на литр.")},
 {date:"2026-10-21",src:"World Nuclear News",url:"https://www.world-nuclear-news.org/articles/iaea-says-barakah-drone-strike-response-was-effective",links:["con","sec"],t:L("IAEA任務認定巴拉卡3號機5月遭無人機攻擊致廠外電源喪失後應處有效","IAEA任务认定巴拉卡3号机5月遭无人机攻击致厂外电源丧失后应对有效","IAEA調査団、5月の無人機攻撃で外部電源を喪失したバラカ3号機の対応は有効と認定","Misi IAEA menilai respons efektif setelah serangan drone Mei menyebabkan Barakah 3 kehilangan daya luar lokasi","Phái đoàn IAEA đánh giá ứng phó có hiệu quả sau khi Barakah 3 mất điện ngoài nhà máy do tấn công bằng drone vào tháng 5","IAEA mission finds response effective after May drone attack caused loss of off-site power at Barakah 3","Миссия МАГАТЭ признала эффективными действия после майской атаки дронов, лишившей блок Барака-3 внешнего электроснабжения"),b:L("這項為期八日、由六人組成的任務係應阿聯政府請求辦理。專家團建議強化緊急應變整備與應變、關鍵基礎設施韌性，以及利害關係人間的協調，以確保核子安全與核子保安措施有效整合。","这项为期八日、由六人组成的任务系应阿联酋政府请求开展。专家团建议加强应急准备与响应、关键基础设施韧性，以及利益相关方之间的协调，以确保核安全与核安保措施有效整合。","8日間、6人によるこの調査団はアラブ首長国連邦政府の要請で実施された。専門家団は緊急時対応の準備と対応、重要インフラの強靱性、関係者間の調整を強化し、原子力安全と核セキュリティの措置を効果的に統合するよう勧告した。","Misi delapan hari beranggotakan enam orang ini dilakukan atas permintaan pemerintah UEA. Tim ahli merekomendasikan penguatan kesiapsiagaan dan tanggap darurat, ketahanan infrastruktur kritis, serta koordinasi antarpemangku kepentingan agar langkah keselamatan nuklir dan keamanan nuklir terintegrasi efektif.","Phái đoàn sáu người, kéo dài tám ngày này được thực hiện theo yêu cầu của chính phủ UAE. Nhóm chuyên gia khuyến nghị tăng cường chuẩn bị và ứng phó khẩn cấp, khả năng chống chịu của hạ tầng trọng yếu và phối hợp giữa các bên liên quan để tích hợp hiệu quả các biện pháp an toàn hạt nhân và an ninh hạt nhân.","The eight-day, six-person mission was held at the UAE government's request. Experts recommended strengthening emergency preparedness and response, critical infrastructure resilience, and coordination among stakeholders to ensure effective integration of nuclear safety and nuclear security measures.","Восьмидневная миссия из шести человек проведена по просьбе правительства ОАЭ. Эксперты рекомендовали усилить аварийную готовность и реагирование, устойчивость критической инфраструктуры и координацию заинтересованных сторон, чтобы обеспечить эффективную интеграцию мер ядерной безопасности и физической ядерной безопасности."),k:L("起因屬惡意行為者，復原評核涉緊急應變，安全與保安介面成了待辦事項。","起因属恶意行为者，恢复评估涉及应急响应，安全与安保的接口成了待办事项。","原因は悪意ある行為者、復旧の評価は緊急時対応に関わり、安全とセキュリティの接点が課題となった。","Penyebabnya pelaku jahat, sedangkan penilaian pemulihan menyangkut tanggap darurat; titik temu keselamatan dan keamanan menjadi pekerjaan rumah.","Nguyên nhân là tác nhân ác ý, còn đánh giá khôi phục liên quan đến ứng phó khẩn cấp; giao diện giữa an toàn và an ninh trở thành việc cần xử lý.","The cause was a malicious actor while recovery was assessed under emergency response, making the safety-security interface a to-do item.","Причиной был злоумышленник, а восстановление оценивалось по линии аварийного реагирования; стык безопасности и физической защиты стал задачей на будущее.")},
 {date:"2026-10-30",src:"原子力産業新聞",url:"https://www.jaif.or.jp/journal/japan/36534.html",links:["sec"],t:L("東海第二含特定重大事故等對處施設之工程完工期定為2029年2月","东海第二含特定重大事故等应对设施的工程完工期定为2029年2月","東海第二、特定重大事故等対処施設を含む安全性向上工事の完了時期を2029年2月に","Penyelesaian pekerjaan peningkatan keselamatan Tokai 2, termasuk fasilitas penanganan kecelakaan berat tertentu, ditetapkan Februari 2029","Công trình nâng cao an toàn Tokai 2, gồm cơ sở ứng phó tai nạn nghiêm trọng đặc định, dự kiến hoàn thành tháng 2 năm 2029","Tokai 2 sets February 2029 completion for safety upgrade works, including its specified severe accident response facility","Завершение работ по повышению безопасности на Токай-2, включая объект реагирования на особые тяжёлые аварии, назначено на февраль 2029 года"),b:L("日本原子力發電10月30日公布，較8月28日所示2028年度下期明確至月份。該類施設的規範依據是故意行為，晨報據此歸入核子保安；同一工程的防潮堤與電纜火災對策則屬核子安全。","日本原子力发电10月30日公布，较8月28日所示2028财年下半期明确到月份。该类设施的规范依据是故意行为，晨报据此归入核安保；同一工程的防潮堤与电缆火灾对策则属核安全。","日本原子力発電が10月30日に公表し、8月28日に示した2028年度下期から月単位まで明確にした。この種の施設の規範的根拠は故意の行為で、朝刊はこれを核セキュリティに分類する。同じ工事の防潮堤やケーブル火災対策は原子力安全に属する。","Japan Atomic Power mengumumkannya pada 30 Oktober, lebih rinci hingga bulan dibanding semester kedua tahun fiskal 2028 yang disebut 28 Agustus. Dasar norma fasilitas ini adalah tindakan disengaja, sehingga Brief menggolongkannya ke keamanan nuklir; tanggul laut dan penanganan kebakaran kabel termasuk keselamatan nuklir.","Japan Atomic Power công bố ngày 30 tháng 10, cụ thể đến tháng so với nửa cuối năm tài chính 2028 nêu ngày 28 tháng 8. Căn cứ quy phạm của loại cơ sở này là hành vi cố ý nên Bản tin xếp vào an ninh hạt nhân; đê chắn sóng và biện pháp chống cháy cáp trong cùng công trình thuộc an toàn hạt nhân.","Japan Atomic Power announced this on October 30, narrowing the second half of fiscal 2028 given on August 28 to a month. The facility's normative basis is intentional acts, so the Brief files it under nuclear security; the seawall and cable fire measures in the same works belong to nuclear safety.","Japan Atomic Power объявила об этом 30 октября, уточнив до месяца срок, названный 28 августа: вторая половина 2028 финансового года. Нормативная основа такого объекта связана с умышленными действиями, поэтому бюллетень относит его к физической ядерной безопасности; дамба и меры против возгорания кабелей относятся к ядерной безопасности."),k:L("晨報觀察：安全與保安併案時，單一完工期使兩者進度無從分辨，核三亦然。","晨报观察：安全与安保并案时，单一完工期使两者进度无从分辨，核三亦然。","朝刊の観察：安全とセキュリティを一括すると、単一の完了時期では両者の進捗を区別できず、台湾の第三原発も同様である。","Pengamatan Brief: bila keselamatan dan keamanan digabung, satu tanggal selesai membuat kemajuan keduanya tak terbedakan; demikian pula pembangkit nuklir ketiga Taiwan.","Nhận định của Bản tin: khi gộp an toàn và an ninh, một mốc hoàn thành duy nhất khiến không thể phân biệt tiến độ của hai bên; Nhà máy số 3 của Đài Loan cũng vậy.","The Brief observes that when safety and security are bundled, a single completion date hides the progress of each; Taiwan's third nuclear plant is similar.","Наблюдение бюллетеня: при объединении безопасности и физической защиты единая дата завершения не позволяет различить ход работ по каждой; то же и с третьей АЭС Тайваня.")},
 {date:"2026-10-28",src:"原子力産業新聞",url:"https://www.jaif.or.jp/journal/japan/36518.html",links:["sec"],t:L("日本規制委了解保防概要案，擬新設因應IAEA 24小時查核之公的機關","日本规制委了解保障概要案，拟新设应对IAEA 24小时核查的公共机关","規制委、国内保障措置制度の見直し概要案を了承、IAEAの24時間査察に対応する公的機関の新設へ","NRA Jepang menerima draf garis besar tinjauan sistem safeguards, berencana membentuk badan publik baru untuk inspeksi IAEA 24 jam","NRA Nhật Bản tiếp nhận dự thảo rà soát chế độ thanh sát, dự kiến lập cơ quan công mới ứng phó thanh sát 24 giờ của IAEA","Japan's NRA acknowledges draft outline reviewing its safeguards system, proposing a new public body to handle 24-hour IAEA inspections","Японский NRA принял проект пересмотра системы гарантий, предлагая новый государственный орган для 24-часовых инспекций МАГАТЭ"),b:L("概要案為因應六ヶ所再處理設施本格操業，擬新設公的機關，組織形態含獨立行政法人在內檢討。意見公募10月29日至11月27日，依結果由規制委決定，新機關名稱與設置時程尚未載明。","概要案为应对六ヶ所再处理设施正式运行，拟新设公共机关，组织形态含独立行政法人在内研究。公开征求意见10月29日至11月27日，依结果由规制委决定，新机关名称与设置时程尚未载明。","概要案は六ヶ所再処理施設の本格操業に備え、独立行政法人を含む組織形態を検討して公的機関を新設する内容。意見公募は10月29日から11月27日までで、結果を踏まえ規制委が決定する。新機関の名称と設置時期はまだ示されていない。","Draf ini, untuk menyambut operasi penuh fasilitas pemrosesan ulang Rokkasho, mengusulkan badan publik baru dengan bentuk organisasi yang masih dikaji, termasuk lembaga administratif independen. Konsultasi publik 29 Oktober hingga 27 November; NRA memutuskan berdasarkan hasilnya. Nama dan jadwal badan belum disebutkan.","Dự thảo nhằm chuẩn bị cho vận hành chính thức cơ sở tái chế Rokkasho, đề xuất lập cơ quan công mới, hình thức tổ chức đang được xem xét gồm cả pháp nhân hành chính độc lập. Lấy ý kiến từ 29 tháng 10 đến 27 tháng 11, NRA quyết định theo kết quả; tên và lịch thành lập chưa được nêu.","To prepare for full operation of the Rokkasho reprocessing facility, the draft proposes a new public body, with its form still under study, including an independent administrative agency. Public comment runs October 29 to November 27, and the NRA decides based on the results; its name and timing are not yet stated.","Для подготовки к полноценной эксплуатации завода по переработке в Роккасё проект предлагает новый государственный орган, форма которого изучается, включая независимое административное учреждение. Общественное обсуждение идёт с 29 октября по 27 ноября, затем решение примет NRA; название и сроки пока не указаны."),k:L("晨報指新設理由是查核密度，而非協定義務改變；台灣無再處理設施。","晨报指新设理由是核查密度，而非协定义务改变；台湾无再处理设施。","朝刊は新設の理由を査察の密度とし、協定上の義務の変更ではないと見る。台湾に再処理施設はない。","Menurut Brief, alasannya adalah kepadatan inspeksi, bukan perubahan kewajiban perjanjian; Taiwan tidak memiliki fasilitas pemrosesan ulang.","Theo Bản tin, lý do là mật độ thanh sát, không phải thay đổi nghĩa vụ hiệp định; Đài Loan không có cơ sở tái chế.","The Brief says the reason is inspection intensity, not a change in agreement obligations; Taiwan has no reprocessing facility.","По мнению бюллетеня, причина в плотности инспекций, а не в изменении обязательств по соглашению; на Тайване нет завода по переработке.")},
 {date:"2026-10-26",src:"World Nuclear News",url:"https://www.world-nuclear-news.org/articles/regulatory-milestone-for-us-laser-enrichment-plant",links:["cmd","sec"],t:L("NRC發布GLE帕杜卡雷射濃縮廠最終環評書並建議核發執照","NRC发布GLE帕迪尤卡激光浓缩厂最终环评书并建议颁发执照","NRC、GLEパデューカのレーザー濃縮工場の最終環境影響評価書を公表し許可発給を勧告","NRC menerbitkan laporan dampak lingkungan final pabrik pengayaan laser GLE Paducah dan merekomendasikan izin","NRC công bố báo cáo tác động môi trường cuối cùng của nhà máy làm giàu laser GLE Paducah, khuyến nghị cấp phép","NRC issues final environmental statement for GLE's Paducah laser enrichment plant, recommends licensing","NRC опубликовала итоговую экологическую оценку завода лазерного обогащения GLE в Падьюке и рекомендовала лицензию"),b:L("該廠產品含鈾235含量至8%之LEU+，原料為帕杜卡舊氣體擴散廠的耗乏鈾尾料。環評書是程序節點，建造與運轉執照尚未核發，預定2027年初；最終安全評估報告預定2026年底前完成。","该厂产品含铀235含量至8%的LEU+，原料为帕迪尤卡旧气体扩散厂的贫铀尾料。环评书是程序节点，建造与运行执照尚未颁发，预定2027年初；最终安全评估报告预定2026年底前完成。","製品にはウラン235含有量8%までのLEU+が含まれ、原料はパデューカの旧ガス拡散工場の劣化ウラン尾料。最終安全評価報告は2026年末までに完了予定。環境評価書は手続き上の節目で、建設・運転許可はまだ発給されておらず、2027年初めの予定。","Produknya mencakup LEU+ dengan kandungan uranium-235 hingga 8%, berbahan baku tailing uranium deplesi dari bekas pabrik difusi gas Paducah. Laporan evaluasi keselamatan akhir dijadwalkan selesai sebelum akhir 2026. Laporan lingkungan itu tahapan prosedur; izin konstruksi dan operasi belum diterbitkan dan dijadwalkan awal 2027.","Sản phẩm gồm LEU+ có hàm lượng urani-235 đến 8%, nguyên liệu là đuôi urani nghèo từ nhà máy khuếch tán khí cũ ở Paducah. Báo cáo đánh giá an toàn cuối cùng dự kiến xong trước cuối năm 2026. Báo cáo môi trường chỉ là mốc thủ tục; giấy phép xây dựng và vận hành chưa được cấp, dự kiến đầu năm 2027.","Products include LEU+ with up to 8% uranium-235, using depleted uranium tails from Paducah's former gaseous diffusion plant. The final safety evaluation report is due by the end of 2026. The environmental statement is a procedural step; construction and operating licenses have not been issued and are scheduled for early 2027.","Продукция включает LEU+ с содержанием урана-235 до 8%, сырьё составляют хвосты обеднённого урана со старого газодиффузионного завода в Падьюке. Итоговый отчёт по безопасности ожидается до конца 2026 года. Экологическая оценка является процедурным этапом; лицензии на строительство и эксплуатацию ещё не выданы, их выдача намечена на начало 2027 года."),k:L("台灣無濃縮設施；可對照的是同一保防協定下，設施型態決定量測點與盤存頻率。","台湾无浓缩设施；可对照的是同一保障协定下，设施类型决定测量点与盘存频率。","台湾に濃縮施設はないが、同じ保障措置協定の下で施設の型により測定点と棚卸し頻度が異なる点は対照できる。","Taiwan tidak memiliki fasilitas pengayaan; yang dapat dibandingkan ialah bahwa di bawah perjanjian safeguards yang sama, jenis fasilitas menentukan titik ukur dan frekuensi inventarisasi.","Đài Loan không có cơ sở làm giàu; điểm có thể đối chiếu là dưới cùng một hiệp định thanh sát, loại hình cơ sở quyết định điểm đo và tần suất kiểm kê.","Taiwan has no enrichment facility; the point of comparison is that under one safeguards agreement, facility type determines measurement points and inventory frequency.","На Тайване нет обогатительных предприятий; сопоставимо то, что при одном соглашении о гарантиях точки измерения и частота инвентаризации зависят от типа объекта.")}
 ]},
{id:"mil",kind:"fort",color:"#5F7A3A",ring:3,ang:105,
 name:L("軍事","军事","軍事","Militer","Quân sự","Military","Военное дело"),
 tag:L("軍事動態 資料至 2026-11-03","军事动态 资料至 2026-11-03","軍事動向 データは 2026-11-03 まで","Dinamika militer, data hingga 2026-11-03","Động thái quân sự, dữ liệu đến 2026-11-03","Military developments, data through 2026-11-03","Военная обстановка, данные по 2026-11-03"),
 desc:L("本島追蹤台海共機共艦架次與公務船、航艦編隊演訓、海上對峙與基地安全措施等軍事動態。資料取自國家安全晨報與國際衝突晨報，各方說法並陳並保留歸因，不作戰力或開戰機率評估。","本岛追踪台海共机共舰架次与公务船、航舰编队演训、海上对峙与基地安全措施等军事动态。资料取自国家安全晨报与国际冲突晨报，各方说法并陈并保留归因，不作战力或开战概率评估。","本島は台湾海峡周辺の中国軍機・艦艇と公船の動向、空母編隊の演習、海上での対峙、基地の安全措置などの軍事動向を追跡します。資料は国家安全朝報と国際紛争朝報から取り、各当事者の主張を併記して出所を明示し、戦力や開戦確率の評価は行いません。","Pulau ini memantau sortie pesawat dan kapal PLA serta kapal dinas di sekitar Selat Taiwan, latihan gugus kapal induk, kebuntuan di laut, dan langkah keamanan pangkalan. Data diambil dari Buletin Keamanan Nasional dan Buletin Konflik Internasional, klaim tiap pihak disajikan berdampingan dengan atribusi, tanpa penilaian kekuatan tempur atau peluang perang.","Đảo này theo dõi số lượt máy bay, tàu PLA và tàu công vụ quanh eo biển Đài Loan, các cuộc tập trận của biên đội tàu sân bay, đối đầu trên biển và biện pháp an ninh căn cứ. Dữ liệu lấy từ Bản tin An ninh Quốc gia và Bản tin Xung đột Quốc tế, tuyên bố của các bên được nêu song song kèm nguồn, không đánh giá sức chiến đấu hay xác suất chiến tranh.","This island tracks PLA aircraft sorties, ships and official ships around the Taiwan Strait, carrier group drills, maritime standoffs and base security measures. Data come from the National Security Brief and the International Conflict Brief. Each party's claims are set side by side with attribution, and no combat-power or war-probability assessment is made.","Остров отслеживает вылеты самолётов и корабли НОАК, служебные суда у Тайваньского пролива, учения авианосных групп, противостояние на море и меры безопасности на базах. Данные взяты из утренних сводок по национальной безопасности и международным конфликтам. Заявления сторон приводятся параллельно с указанием источника, оценки боевой мощи и вероятности войны не даются."),
 items:[
 {date:"2026-11-02",src:"國防部即時軍事動態 115.11.02",url:"https://www.mnd.gov.tw/news/plaact/88108",links:["sec"],t:L("國防部11月2日通報共機19架次、共艦7艘、公務船6艘","国防部11月2日通报共机19架次、共舰7艘、公务船6艘","国防部は11月2日、中国軍機19機次、艦艇7隻、公船6隻を通報","Kemhan melaporkan pada 2 November 19 sortie pesawat PLA, 7 kapal PLA, 6 kapal dinas","Bộ Quốc phòng ngày 2/11 thông báo 19 lượt máy bay PLA, 7 tàu PLA, 6 tàu công vụ","MND on Nov 2 reported 19 PLA aircraft sorties, 7 PLA ships and 6 official ships","Минобороны 2 ноября сообщило о 19 вылетах самолётов НОАК, 7 кораблях и 6 служебных судах"),b:L("國防部通報，11月1日0600時至2日0600時偵獲共機19架次，其中4架次進入西南及東部空域，共艦7艘、公務船6艘。公務船增加之成因、船型與海域分布未發布。","国防部通报，11月1日0600时至2日0600时侦获共机19架次，其中4架次进入西南及东部空域，共舰7艘、公务船6艘。公务船增加之成因、船型与海域分布未发布。","国防部の通報によると、11月1日6時から2日6時までに中国軍機19機次を探知し、うち4機次が南西及び東部空域に進入、艦艇7隻、公船6隻。公船増加の原因、船種、海域分布は未公表。","Kemhan melaporkan, dari 1 November pukul 06.00 hingga 2 November pukul 06.00 terdeteksi 19 sortie pesawat PLA, 4 di antaranya memasuki wilayah udara barat daya dan timur, serta 7 kapal PLA dan 6 kapal dinas. Penyebab kenaikan kapal dinas, jenis kapal, dan sebaran perairannya tidak dirilis.","Bộ Quốc phòng thông báo, từ 06:00 ngày 1/11 đến 06:00 ngày 2/11 phát hiện 19 lượt máy bay PLA, trong đó 4 lượt vào không phận phía tây nam và phía đông, cùng 7 tàu PLA và 6 tàu công vụ. Nguyên nhân tàu công vụ tăng, loại tàu và phân bố vùng biển chưa được công bố.","MND reported that from 06:00 on Nov 1 to 06:00 on Nov 2 it detected 19 PLA aircraft sorties, 4 of them entering southwestern and eastern airspace, plus 7 PLA ships and 6 official ships. The cause of the official-ship rise, ship types and sea areas were not released.","Минобороны сообщило: с 06:00 1 ноября до 06:00 2 ноября обнаружено 19 вылетов самолётов НОАК, из них 4 вошли в юго-западное и восточное воздушное пространство, а также 7 кораблей и 6 служебных судов. Причина роста числа служебных судов, их типы и районы не обнародованы."),k:L("公務船為前七日均值2.86艘的2.10倍，但均值受低值壓低，晨報不據此推論強度。","公务船为前七日均值2.86艘的2.10倍，但均值受低值压低，晨报不据此推论强度。","公船は過去7日平均2.86隻の2.10倍だが、平均は低い値で押し下げられており、朝報はこの倍率から強度を推論しない。","Kapal dinas 2,10 kali rata-rata tujuh hari sebelumnya (2,86), tetapi rata-rata itu tertekan nilai rendah, sehingga buletin tidak menyimpulkan intensitas darinya.","Tàu công vụ gấp 2,10 lần mức trung bình 7 ngày trước (2,86), nhưng mức này bị kéo thấp bởi các giá trị nhỏ, nên bản tin không suy ra cường độ từ tỷ lệ đó.","Official ships were 2.10 times the prior seven-day average of 2.86, but low readings depressed that average, so the brief does not infer intensity from the ratio.","Служебных судов в 2,10 раза больше среднего за семь дней (2,86), но среднее занижено низкими значениями, и сводка не делает вывод об интенсивности по этому кратному.")},
 {date:"2026-11-02",src:"中央社",url:"https://www.cna.com.tw/news/acn/202611020242.aspx",links:["sec","con"],t:L("中央社報導中國海警4艘11月2日接近金門限制水域，海巡一對一併航監控","中央社报导中国海警4艘11月2日接近金门限制水域，海巡一对一并航监控","中央社によると中国海警4隻が11月2日に金門の制限水域へ接近、海巡が1対1で並走監視","CNA: 4 kapal penjaga pantai China mendekati perairan terbatas Kinmen pada 2 November, CGA membayangi satu lawan satu","CNA: 4 tàu hải cảnh Trung Quốc tiếp cận vùng nước hạn chế Kim Môn ngày 2/11, tuần duyên Đài Loan bám sát một đối một","CNA: 4 China Coast Guard ships approached Kinmen restricted waters on Nov 2, Taiwan's CGA shadowed them one-on-one","ЦАГ: 4 судна береговой охраны КНР 2 ноября приблизились к закрытым водам Цзиньмэня, береговая охрана Тайваня сопровождала их один к одному"),b:L("中央社報導，海巡署金馬澎分署11月2日下午3時許偵獲中國海警14608等4艘接近金門限制水域，調派4艘巡防艇併航監控並以中英文廣播示警，4艘於下午5時3分航出。","中央社报导，海巡署金马澎分署11月2日下午3时许侦获中国海警14608等4艘接近金门限制水域，调派4艘巡防艇并航监控并以中英文广播示警，4艘于下午5时3分航出。","中央社によると、海巡署金馬澎分署は11月2日午後3時頃、中国海警14608など4隻が金門の制限水域に接近するのを探知し、巡視艇4隻を派遣して並走監視し中英両語で警告放送、4隻は午後5時3分に退出した。","CNA melaporkan, kantor cabang Kinmen-Matsu-Penghu CGA sekitar pukul 15.00 pada 2 November mendeteksi 4 kapal termasuk 14608 mendekati perairan terbatas Kinmen, mengerahkan 4 kapal patroli untuk membayangi dan memberi peringatan siaran dalam bahasa Mandarin dan Inggris. Keempatnya keluar pukul 17.03.","CNA cho biết, phân sở Kim Môn-Mã Tổ-Bành Hồ của Cục Tuần duyên khoảng 15:00 ngày 2/11 phát hiện 4 tàu gồm 14608 tiếp cận vùng nước hạn chế Kim Môn, điều 4 tàu tuần tra bám sát và phát cảnh báo bằng tiếng Trung, tiếng Anh. 4 tàu rời đi lúc 17:03.","CNA reported that the CGA's Kinmen-Matsu-Penghu branch detected 4 ships including 14608 approaching Kinmen restricted waters around 15:00 on Nov 2, sent 4 patrol boats to shadow them and broadcast warnings in Chinese and English. The 4 ships left at 17:03.","ЦАГ сообщает: отделение береговой охраны Цзиньмэнь-Мацзу-Пэнху около 15:00 2 ноября обнаружило 4 судна, включая 14608, у закрытых вод Цзиньмэня, направило 4 патрульных катера для сопровождения и передало предупреждения на китайском и английском. Суда вышли в 17:03."),k:L("海巡署與國防部所載機關與範圍不同，晨報分列兩組數字而不相加。","海巡署与国防部所载机关与范围不同，晨报分列两组数字而不相加。","海巡署と国防部の数字は機関も範囲も異なり、朝報は分けて記載し合算しない。","Angka CGA dan Kemhan berbeda lembaga dan cakupan, sehingga buletin mencatatnya terpisah dan tidak menjumlahkannya.","Số liệu của Cục Tuần duyên và Bộ Quốc phòng khác cơ quan và phạm vi, nên bản tin ghi riêng, không cộng gộp.","The CGA and MND figures differ in agency and scope, so the brief lists them separately and does not add them.","Данные береговой охраны и Минобороны различаются по ведомству и охвату, поэтому сводка приводит их раздельно и не суммирует.")},
 {date:"2026-11-01",src:"國防部即時軍事動態 115.11.01",url:"https://www.mnd.gov.tw/news/plaact/88101",links:["sec"],t:L("國防部11月1日通報共機32架次、逾越26架次，機型與演訓性質未載","国防部11月1日通报共机32架次、逾越26架次，机型与演训性质未载","国防部は11月1日、中国軍機32機次、うち越境26機次を通報、機種と演習の性質は記載なし","Kemhan pada 1 November melaporkan 32 sortie pesawat PLA, 26 melintas, jenis pesawat dan sifat latihan tidak dicantumkan","Bộ Quốc phòng ngày 1/11 thông báo 32 lượt máy bay PLA, 26 lượt vượt qua, không ghi loại máy bay và tính chất tập trận","MND on Nov 1 reported 32 PLA aircraft sorties, 26 crossing, with aircraft types and drill nature not stated","Минобороны 1 ноября сообщило о 32 вылетах самолётов НОАК, 26 с пересечением, типы самолётов и характер учений не указаны"),b:L("國防部115.11.01通報共機32架次，逾越中線及進入應變區26架次，共艦7艘、公務船2艘。10月26日至11月1日七期架次依序為3、3、6、6、6、13、32。","国防部115.11.01通报共机32架次，逾越中线及进入应变区26架次，共舰7艘、公务船2艘。10月26日至11月1日七期架次依序为3、3、6、6、6、13、32。","国防部の115.11.01通報は中国軍機32機次、中間線越え及び対応区域進入26機次、艦艇7隻、公船2隻。10月26日から11月1日までの7期の機次は順に3、3、6、6、6、13、32。","Laporan Kemhan 115.11.01: 32 sortie pesawat PLA, 26 melintasi garis tengah atau memasuki zona respons, 7 kapal PLA, 2 kapal dinas. Sortie tujuh laporan 26 Oktober hingga 1 November berturut-turut 3, 3, 6, 6, 6, 13, 32.","Thông báo 115.11.01 của Bộ Quốc phòng: 32 lượt máy bay PLA, 26 lượt vượt đường trung tuyến hoặc vào vùng ứng phó, 7 tàu PLA, 2 tàu công vụ. Số lượt trong 7 kỳ từ 26/10 đến 1/11 lần lượt là 3, 3, 6, 6, 6, 13, 32.","MND report 115.11.01: 32 PLA aircraft sorties, 26 crossing the median line or entering the response zone, 7 PLA ships, 2 official ships. Sorties in the seven reports from Oct 26 to Nov 1 were 3, 3, 6, 6, 6, 13, 32.","Сводка Минобороны 115.11.01: 32 вылета самолётов НОАК, 26 с пересечением срединной линии или входом в зону реагирования, 7 кораблей, 2 служебных судна. Вылеты в семи сводках с 26 октября по 1 ноября: 3, 3, 6, 6, 6, 13, 32."),k:L("本期機型、時段與演訓性質均未載，可檢驗之點為11.03起是否續在雙位數。","本期机型、时段与演训性质均未载，可检验之点为11.03起是否续在双位数。","今回の機種、時間帯、演習の性質は記載がなく、検証点は11.03以降も2桁が続くかである。","Jenis pesawat, waktu, dan sifat latihan tidak dicantumkan; yang dapat diuji adalah apakah sejak 11.03 angkanya tetap dua digit.","Loại máy bay, thời gian và tính chất tập trận đều không được ghi; điểm kiểm chứng là từ 11.03 con số có còn ở mức hai chữ số không.","Aircraft types, timing and drill nature were not stated; the point to check is whether sorties stay in double digits from 11.03.","Типы самолётов, время и характер учений не указаны; проверяемый вопрос: останется ли число вылетов двузначным с 11.03.")},
 {date:"2026-10-28",src:"中央社",url:"https://www.cna.com.tw/news/aipl/202610280319.aspx",links:["con"],t:L("吳釗燮10月28日稱遼寧號編隊在第一島鏈以東演訓，台方密切監控","吴钊燮10月28日称辽宁号编队在第一岛链以东演训，台方密切监控","呉釗燮氏は10月28日、遼寧の編隊が第一列島線以東で演習中と述べ、台湾側が監視と説明","Joseph Wu pada 28 Oktober menyatakan gugus Liaoning berlatih di timur rantai pulau pertama, Taiwan memantau ketat","Ngô Chiêu Tiếp ngày 28/10 nói biên đội Liêu Ninh tập trận ở phía đông chuỗi đảo thứ nhất, Đài Loan theo dõi sát","Joseph Wu said on Oct 28 the Liaoning group was drilling east of the first island chain, with Taiwan monitoring closely","Джозеф У 28 октября заявил, что группа «Ляонин» проводит учения восточнее первой островной цепи, Тайвань внимательно следит"),b:L("中央社報導，國安會秘書長吳釗燮在X發文稱解放軍海軍遼寧號打擊群與多艘船舶在第一島鏈以東演訓，中國海上執法船在台灣東部水域活動。晨報未取得中國國防部與海軍之發布。","中央社报导，国安会秘书长吴钊燮在X发文称解放军海军辽宁号打击群与多艘船舶在第一岛链以东演训，中国海上执法船在台湾东部水域活动。晨报未取得中国国防部与海军之发布。","中央社によると、国家安全会議の呉釗燮秘書長はXで、解放軍海軍の遼寧打撃群と複数の艦船が第一列島線以東で演習し、中国の海上法執行船が台湾東部水域で活動していると投稿した。朝報は中国国防部と海軍の発表を入手していない。","CNA melaporkan, Sekretaris Jenderal NSC Joseph Wu menulis di X bahwa gugus tempur Liaoning AL PLA dan sejumlah kapal berlatih di timur rantai pulau pertama, dan kapal penegak hukum China beroperasi di perairan timur Taiwan. Buletin tidak memperoleh rilis Kemhan atau AL China.","CNA cho biết, Tổng thư ký Hội đồng An ninh Quốc gia Ngô Chiêu Tiếp viết trên X rằng cụm tác chiến Liêu Ninh của hải quân PLA và nhiều tàu tập trận ở phía đông chuỗi đảo thứ nhất, tàu chấp pháp Trung Quốc hoạt động ở vùng biển phía đông Đài Loan. Bản tin chưa có thông cáo của Bộ Quốc phòng và hải quân Trung Quốc.","CNA reported that NSC Secretary-General Joseph Wu wrote on X that the PLA Navy's Liaoning strike group and other ships were drilling east of the first island chain and that Chinese maritime law-enforcement ships were active off eastern Taiwan. The brief obtained no statement from China's defense ministry or navy.","ЦАГ сообщает: генсек Совета нацбезопасности Джозеф У написал в X, что ударная группа «Ляонин» ВМС НОАК и другие суда проводят учения восточнее первой островной цепи, а китайские суда морской охраны действуют у восточного Тайваня. Заявлений Минобороны и ВМС КНР сводка не получила."),k:L("併列東海、台海、南海屬台方單方評估，台日菲同受威脅一說未經第三方驗證。","并列东海、台海、南海属台方单方评估，台日菲同受威胁一说未经第三方验证。","東シナ海、台湾海峡、南シナ海の併記は台湾側の一方的評価で、台日比が同じ脅威に直面との説は第三者未検証。","Penyandingan Laut China Timur, Selat Taiwan, dan Laut China Selatan adalah penilaian sepihak Taiwan; klaim ancaman bersama Taiwan, Jepang, Filipina belum diverifikasi pihak ketiga.","Việc đặt song song Biển Hoa Đông, eo biển Đài Loan và Biển Đông là đánh giá đơn phương của Đài Loan; nhận định Đài Loan, Nhật Bản, Philippines cùng chịu đe dọa chưa được bên thứ ba xác minh.","Grouping the East China Sea, Taiwan Strait and South China Sea is Taiwan's unilateral assessment; the shared threat to Taiwan, Japan and the Philippines is not third-party verified.","Объединение Восточно-Китайского моря, пролива и Южно-Китайского моря является односторонней оценкой Тайваня; общая угроза Тайваню, Японии и Филиппинам третьей стороной не подтверждена.")},
 {date:"2026-10-28",src:"韓國時報",url:"https://www.koreatimes.co.kr/foreignaffairs/northkorea/20261028/n-koreas-kim-calls-for-combat-readiness-at-photo-session-with-army-company-leaders",links:["con"],t:L("朝中社10月28日報導金正恩要求連長級幹部完全做好打一場戰爭之準備","朝中社10月28日报导金正恩要求连长级干部完全做好打一场战争之准备","朝鮮中央通信は10月28日、金正恩氏が中隊長級幹部に戦争への完全な準備を求めたと報道","KCNA pada 28 Oktober melaporkan Kim Jong Un meminta komandan kompi sepenuhnya siap berperang","KCNA ngày 28/10 đưa tin Kim Jong Un yêu cầu cấp đại đội trưởng chuẩn bị đầy đủ cho một cuộc chiến","KCNA reported on Oct 28 that Kim Jong Un told company commanders to be fully ready to fight a war","ЦТАК 28 октября сообщило: Ким Чен Ын потребовал от командиров рот полной готовности к войне"),b:L("韓國時報轉述朝中社，金正恩10月27日與人民軍連長級幹部合影時稱連長首要任務為完成作戰準備。連長大會10月22日至23日在平壤舉行，北韓未回應南韓10月23日之軍事會談提議。","韩国时报转述朝中社，金正恩10月27日与人民军连长级干部合影时称连长首要任务为完成作战准备。连长大会10月22日至23日在平壤举行，北韩未回应南韩10月23日之军事会谈提议。","韓国時報が朝鮮中央通信を引用して伝えたところ、金正恩氏は10月27日、人民軍の中隊長級幹部との記念撮影で、中隊長の第一の任務は作戦準備の完成だと述べた。中隊長大会は10月22日から23日に平壌で開催。北朝鮮は韓国の10月23日の軍事会談提案に回答していない。","The Korea Times mengutip KCNA: pada 27 Oktober, saat berfoto dengan komandan kompi KPA, Kim Jong Un menyebut tugas utama mereka menuntaskan kesiapan tempur. Konferensi komandan kompi digelar 22-23 Oktober di Pyongyang. Korea Utara belum menanggapi usulan perundingan militer Korea Selatan 23 Oktober.","The Korea Times dẫn KCNA: ngày 27/10, khi chụp ảnh với cấp đại đội trưởng Quân đội Nhân dân, Kim Jong Un nói nhiệm vụ hàng đầu của họ là hoàn thành chuẩn bị tác chiến. Đại hội đại đội trưởng họp 22-23/10 tại Bình Nhưỡng. Triều Tiên chưa đáp lại đề nghị hội đàm quân sự ngày 23/10 của Hàn Quốc.","The Korea Times, citing KCNA, said Kim Jong Un told Korean People's Army company commanders at an Oct 27 photo session that their first task was completing combat readiness. Their conference met in Pyongyang on Oct 22-23. North Korea has not answered South Korea's Oct 23 military talks proposal.","The Korea Times со ссылкой на ЦТАК: 27 октября на фотосессии с командирами рот КНА Ким Чен Ын назвал их главной задачей завершение боевой подготовки. Съезд командиров рот прошёл 22-23 октября в Пхеньяне. КНДР не ответила на предложение Южной Кореи от 23 октября о военных переговорах."),k:L("談話未提軍事分界線、擴音設備或南韓會談提議，晨報不預判北韓是否回應。","谈话未提军事分界线、扩音设备或南韩会谈提议，晨报不预判北韩是否回应。","談話は軍事境界線、拡声器、韓国の会談提案に触れず、朝報は北朝鮮の回答の有無を予断しない。","Pernyataan itu tidak menyebut garis demarkasi militer, pengeras suara, atau usulan perundingan; buletin tidak memprediksi tanggapan Korea Utara.","Phát biểu không nhắc đến đường phân giới quân sự, loa phóng thanh hay đề nghị hội đàm; bản tin không dự đoán Triều Tiên có đáp lại hay không.","The remarks did not mention the military demarcation line, loudspeakers or the talks proposal; the brief does not predict whether North Korea will respond.","В речи нет упоминания военной демаркационной линии, громкоговорителей и предложения о переговорах; сводка не прогнозирует ответ КНДР.")},
 {date:"2026-10-28",src:"台北時報",url:"https://www.taipeitimes.com/News/front/archives/2026/10/28/2003866737",links:["con","sec"],t:L("台北時報10月28日報導，美軍嘉手納基地禁止比亞迪車輛進入","台北时报10月28日报导，美军嘉手纳基地禁止比亚迪车辆进入","台北時報は10月28日、米軍嘉手納基地がBYD車両の進入を禁止したと報道","Taipei Times pada 28 Oktober melaporkan Pangkalan AS Kadena melarang kendaraan BYD masuk","Taipei Times ngày 28/10 đưa tin căn cứ Mỹ Kadena cấm xe BYD vào","Taipei Times reported on Oct 28 that US Kadena base barred BYD vehicles from entry","Taipei Times 28 октября сообщила: американская база Кадена запретила въезд автомобилям BYD"),b:L("台北時報報導，美國空軍第18聯隊發言人稱沖繩嘉手納基地當週起禁止比亞迪私人車輛、計程車與配送車輛進入，所慮為車載攝影機、感測器與衛星定位裝置之資訊外洩。比亞迪迄報導時未公開回應。","台北时报报导，美国空军第18联队发言人称冲绳嘉手纳基地当周起禁止比亚迪私人车辆、出租车与配送车辆进入，所虑为车载摄影机、感测器与卫星定位装置之资讯外泄。比亚迪迄报导时未公开回应。","台北時報によると、米空軍第18航空団の報道官は沖縄の嘉手納基地が当週からBYDの私有車、タクシー、配送車の進入を禁止したと述べた。懸念は車載カメラ、センサー、衛星測位装置からの情報漏えい。BYDは報道時点で公に回答していない。","Taipei Times melaporkan, juru bicara Sayap ke-18 AU AS menyatakan Pangkalan Kadena di Okinawa sejak pekan itu melarang kendaraan pribadi, taksi, dan kendaraan pengantar BYD masuk, karena risiko kebocoran informasi dari kamera, sensor, dan perangkat penentu posisi satelit. BYD belum menanggapi secara terbuka saat berita terbit.","Taipei Times đưa tin, phát ngôn viên Không đoàn 18 Không quân Mỹ cho biết từ tuần đó căn cứ Kadena ở Okinawa cấm xe cá nhân, taxi và xe giao hàng BYD vào, do lo ngại rò rỉ thông tin từ camera, cảm biến và thiết bị định vị vệ tinh. BYD chưa phản hồi công khai vào thời điểm đưa tin.","Taipei Times reported that a US Air Force 18th Wing spokesperson said Kadena Air Base in Okinawa barred private BYD vehicles, taxis and delivery vehicles from that week, citing information leak risks from onboard cameras, sensors and satellite positioning devices. BYD had not publicly responded at the time of the report.","Taipei Times: представитель 18-го авиакрыла ВВС США заявил, что база Кадена на Окинаве с той недели запретила въезд личным автомобилям, такси и машинам доставки BYD из-за риска утечки данных через камеры, датчики и спутниковую навигацию. BYD на момент публикации публично не ответила."),k:L("禁令影響落在沖繩當地商業往來，是否延伸至其他品牌與基地晨報不預判。","禁令影响落在冲绳当地商业往来，是否延伸至其他品牌与基地晨报不预判。","禁止の影響は沖縄現地の商取引に及び、他ブランドや他基地への拡大の有無を朝報は予断しない。","Dampak larangan jatuh pada hubungan dagang lokal Okinawa; buletin tidak memprediksi perluasan ke merek atau pangkalan lain.","Tác động của lệnh cấm rơi vào giao thương địa phương ở Okinawa; bản tin không dự đoán việc mở rộng sang thương hiệu hay căn cứ khác.","The ban's impact falls on local business in Okinawa; the brief does not predict any extension to other brands or bases.","Запрет затрагивает местную торговлю на Окинаве; сводка не прогнозирует распространение на другие марки и базы.")},
 {date:"2026-10-27",src:"菲律賓星報",url:"https://www.philstar.com/headlines/2026/10/28/2566329/chinese-ships-seen-near-ph-fuel-distribution-fishermen-scarborough-shoal-pcg",links:["con"],t:L("菲海岸防衛隊稱10月27日黃岩島配油期間中方船舶在進路水域未干擾","菲海岸防卫队称10月27日黄岩岛配油期间中方船舶在进路水域未干扰","比沿岸警備隊は10月27日のスカボロー礁での給油時、中国船は進入路水域にいたが妨害なしと説明","PCG menyatakan saat pembagian BBM di Beting Scarborough 27 Oktober, kapal China di perairan akses tidak mengganggu","Tuần duyên Philippines nói khi phát nhiên liệu ở bãi cạn Scarborough ngày 27/10, tàu Trung Quốc ở vùng tiếp cận không cản trở","PCG said Chinese ships in approach waters did not interfere with Oct 27 fuel distribution at Scarborough Shoal","Береговая охрана Филиппин: 27 октября у рифа Скарборо китайские суда в подходных водах не мешали раздаче топлива"),b:L("菲律賓星報報導，海岸防衛隊稱該日向約40至50艘漁船配油期間，中國海警與解放軍海軍船舶在進路水域未干擾。7月23日至24日同類任務，中國海警曾施放水砲，中方當時稱已驅離菲方船舶。","菲律宾星报报导，海岸防卫队称该日向约40至50艘渔船配油期间，中国海警与解放军海军船舶在进路水域未干扰。7月23日至24日同类任务，中国海警曾施放水炮，中方当时称已驱离菲方船舶。","Philstar紙によると、沿岸警備隊は当日約40から50隻の漁船への給油の間、中国海警と解放軍海軍の船舶は進入路水域にいて妨害しなかったと説明。7月23日から24日の同種任務では中国海警が放水し、中国側は当時、比船舶を退去させたとした。","Philstar melaporkan, PCG menyatakan saat pembagian BBM ke sekitar 40 hingga 50 kapal nelayan hari itu, kapal penjaga pantai China dan AL PLA di perairan akses tidak mengganggu. Pada misi serupa 23-24 Juli, penjaga pantai China menembakkan meriam air; China saat itu menyatakan telah mengusir kapal Filipina.","Philstar đưa tin, Tuần duyên Philippines cho biết khi phát nhiên liệu cho khoảng 40 đến 50 tàu cá hôm đó, tàu hải cảnh Trung Quốc và hải quân PLA ở vùng tiếp cận không cản trở. Trong nhiệm vụ tương tự ngày 23-24/7, hải cảnh Trung Quốc đã phun vòi rồng; khi đó Trung Quốc nói đã xua đuổi tàu Philippines.","Philstar reported the PCG said China Coast Guard and PLA Navy ships in approach waters did not interfere as about 40 to 50 fishing boats received fuel that day. In similar July 23-24 missions, the China Coast Guard used water cannons; China then said it had expelled Philippine ships.","Philstar: береговая охрана Филиппин заявила, что при раздаче топлива примерно 40-50 рыболовным судам китайская береговая охрана и ВМС НОАК в подходных водах не мешали. При таких же миссиях 23-24 июля береговая охрана КНР применяла водомёты; Китай тогда заявил, что вытеснил филиппинские суда."),k:L("中方本次未採物理阻止之原因無任一方說明，晨報不作推定。","中方本次未采物理阻止之原因无任一方说明，晨报不作推定。","今回中国側が物理的阻止を取らなかった理由はどの当事者も説明しておらず、朝報は推定しない。","Tidak ada pihak yang menjelaskan mengapa China kali ini tidak melakukan penghalangan fisik; buletin tidak berspekulasi.","Không bên nào giải thích vì sao lần này Trung Quốc không ngăn cản vật lý; bản tin không suy đoán.","No party explained why China did not physically obstruct this time, and the brief makes no inference.","Ни одна сторона не объяснила, почему Китай на этот раз не препятствовал физически; сводка не делает предположений.")}
 ]},
{id:"con",kind:"border",color:"#C2483D",ring:3,ang:195,
 name:L("衝突","冲突","紛争","Konflik","Xung đột","Conflict","Конфликты"),
 tag:L("國際衝突晨報 2026-10-29","国际冲突晨报 2026-10-29","国際紛争モーニングブリーフ 2026-10-29","Brief Pagi Konflik Internasional 2026-10-29","Bản tin sáng Xung đột Quốc tế 2026-10-29","International Conflict Daily Brief 2026-10-29","Утренняя сводка о международных конфликтах 2026-10-29"),
 desc:L("本島追蹤國家之間如何對抗：邊境交火的雙方說法、制裁與跨國聲明、外交場合的層級與框架之爭，範圍涵蓋南亞、中亞、南太平洋與東亞、南海。資料取自國際衝突晨報，交火與傷亡一律標明由哪一方所稱，雙方說法對立時並陳，不下結論。","本岛追踪国家之间如何对抗：边境交火的双方说法、制裁与跨国声明、外交场合的层级与框架之争，范围涵盖南亚、中亚、南太平洋与东亚、南海。资料取自国际冲突晨报，交火与伤亡一律标明由哪一方所称，双方说法对立时并陈，不下结论。","この島は国家間の対立の形を追う。国境での交戦をめぐる双方の主張、制裁と多国間声明、外交の場での出席レベルや枠組みの争いを、南アジア、中央アジア、南太平洋、東アジア、南シナ海にわたって扱う。資料は国際紛争モーニングブリーフによる。交戦と死傷はどの側の発表かを明記し、主張が対立する場合は併記して結論を出さない。","Pulau ini melacak bagaimana negara-negara saling berhadapan: klaim kedua pihak atas baku tembak perbatasan, sanksi dan pernyataan lintas negara, serta persaingan tingkat kehadiran dan kerangka kerja dalam forum diplomatik, di Asia Selatan, Asia Tengah, Pasifik Selatan, Asia Timur, dan Laut Cina Selatan. Data berasal dari Brief Pagi Konflik Internasional. Baku tembak dan korban selalu disebut menurut pihak yang menyatakannya; klaim yang bertentangan disajikan berdampingan tanpa kesimpulan.","Đảo này theo dõi cách các quốc gia đối đầu nhau: tuyên bố của hai bên về đấu súng biên giới, trừng phạt và tuyên bố đa quốc gia, tranh chấp về cấp độ tham dự và khuôn khổ trong các diễn đàn ngoại giao, tại Nam Á, Trung Á, Nam Thái Bình Dương, Đông Á và Biển Đông. Dữ liệu lấy từ Bản tin sáng Xung đột Quốc tế. Giao tranh và thương vong luôn ghi rõ do bên nào nêu; khi các bên mâu thuẫn thì trình bày song song, không kết luận.","This island tracks how states confront one another: each side's account of border clashes, sanctions and multinational statements, and contests over attendance level and frameworks at diplomatic venues, across South Asia, Central Asia, the South Pacific, East Asia and the South China Sea. Data come from the International Conflict Daily Brief. Clashes and casualties are always attributed to the party reporting them; conflicting accounts are set side by side with no verdict.","Этот остров следит за тем, как государства противостоят друг другу: версии сторон о перестрелках на границе, санкции и многосторонние заявления, споры об уровне участия и рамочных механизмах на дипломатических площадках в Южной Азии, Центральной Азии, южной части Тихого океана, Восточной Азии и Южно-Китайском море. Данные взяты из утренней сводки о международных конфликтах. Столкновения и потери всегда приводятся со ссылкой на сообщившую сторону; противоречащие версии даются рядом, без вывода."),

 {date:"2026-10-27",src:"黎明報",url:"https://www.dawn.com/news/2040481/pakistan-terms-afghan-claims-regarding-angoor-adda-incident-fabrication-of-lies",links:["mil"],t:L("安古爾阿達10月27日跨境交火，巴阿雙方就誰先開火與傷亡說法不一致","安古尔阿达10月27日跨境交火，巴阿双方就谁先开火与伤亡说法不一致","アングール・アッダで10月27日に越境交戦、誰が先に発砲したかと死傷でパキスタンとアフガニスタンの主張が食い違う","Baku tembak lintas batas di Angoor Adda 27 Oktober; Pakistan dan Afghanistan berbeda klaim soal siapa menembak lebih dulu dan korban","Đấu súng xuyên biên giới tại Angoor Adda ngày 27/10; Pakistan và Afghanistan nêu khác nhau về bên nổ súng trước và thương vong","Cross-border clash at Angoor Adda on October 27: Pakistan and Afghanistan differ on who fired first and on casualties","Перестрелка через границу в Ангур-Адде 27 октября: Пакистан и Афганистан расходятся в том, кто открыл огонь первым, и в данных о потерях"),b:L("塔利班國防部稱巴方四架無人機攻擊市場與哨所、阿方無傷亡；巴基斯坦新聞廣播部稱阿方先對平民開火、巴方反擊毀其七處哨所，巴方行政當局通報1名居民死亡、5名家屬受傷。均無第三方核實。","塔利班国防部称巴方四架无人机攻击市场与哨所、阿方无伤亡；巴基斯坦新闻广播部称阿方先对平民开火、巴方反击毁其七处哨所，巴方行政当局通报1名居民死亡、5名家属受伤。均无第三方核实。","タリバン国防省は、パキスタン側の無人機4機が市場と哨所を攻撃し、アフガニスタン側に死傷者はないと主張。パキスタン情報放送省は、アフガニスタン側が先に民間人へ発砲し、反撃で哨所7か所を破壊したと主張。パキスタンの行政当局は住民1人死亡、家族5人負傷と発表。いずれも第三者の確認はない。","Kementerian Pertahanan Taliban menyatakan empat drone Pakistan menyerang pasar dan pos, tanpa korban di pihak Afghanistan. Kementerian Informasi dan Penyiaran Pakistan menyatakan Afghanistan lebih dulu menembaki warga sipil dan serangan balasan menghancurkan tujuh pos; otoritas setempat Pakistan melaporkan 1 warga tewas dan 5 anggota keluarga terluka. Tidak ada verifikasi pihak ketiga.","Bộ Quốc phòng Taliban nói bốn máy bay không người lái của Pakistan tấn công chợ và trạm gác, phía Afghanistan không có thương vong. Bộ Thông tin và Phát thanh Pakistan nói phía Afghanistan nổ súng vào dân thường trước, đòn đáp trả đã phá hủy bảy trạm gác; chính quyền địa phương Pakistan thông báo 1 cư dân chết, 5 người trong gia đình bị thương. Không có bên thứ ba xác minh.","The Taliban defense ministry says four Pakistani drones struck a market and posts, with no Afghan casualties. Pakistan's information and broadcasting ministry says the Afghan side first fired on civilians and that return fire destroyed seven posts; Pakistani local authorities report 1 resident killed and 5 family members wounded. None of this is verified by a third party.","Минобороны талибов заявляет, что четыре пакистанских беспилотника атаковали рынок и посты, а у афганской стороны потерь нет. Министерство информации и вещания Пакистана заявляет, что афганская сторона первой открыла огонь по мирным жителям, а ответным огнём уничтожены семь постов; пакистанские местные власти сообщают об 1 погибшем жителе и 5 раненых членах семьи. Третья сторона ничего не подтвердила."),k:L("該線自10月7日以來無新空襲通報的狀態結束，人道機構的獨立統計仍缺位。","该线自10月7日以来无新空袭通报的状态结束，人道机构的独立统计仍缺位。","10月7日以来続いていた新たな空爆の通報がない状態は終わり、人道機関による独立した統計はなお得られていない。","Masa tanpa laporan serangan udara baru sejak 7 Oktober berakhir, dan statistik independen lembaga kemanusiaan masih belum ada.","Giai đoạn không có thông báo không kích mới kể từ 7/10 đã kết thúc, trong khi vẫn thiếu thống kê độc lập của các tổ chức nhân đạo.","The stretch without new airstrike reports since October 7 has ended, and independent figures from humanitarian agencies are still missing.","Период без сообщений о новых авиаударах, длившийся с 7 октября, завершился, а независимой статистики гуманитарных организаций по-прежнему нет.")},
 {date:"2026-10-19",src:"中亞時報",url:"https://timesca.com/afghanistan-c5-plus-1-us-trans-caspian-route/",links:["cmd","ibm"],t:L("美國與中亞五國10月19日撒馬爾罕聯合聲明未提阿富汗，重點轉向跨裏海路線","美国与中亚五国10月19日撒马尔罕联合声明未提阿富汗，重点转向跨里海路线","米国と中央アジア5か国の10月19日サマルカンド共同声明はアフガニスタンに触れず、重点はカスピ海横断ルートへ","Pernyataan bersama AS dan lima negara Asia Tengah di Samarkand 19 Oktober tidak menyebut Afghanistan, fokus beralih ke rute lintas Kaspia","Tuyên bố chung Mỹ và năm nước Trung Á tại Samarkand ngày 19/10 không nhắc Afghanistan, trọng tâm chuyển sang tuyến xuyên Caspi","The October 19 Samarkand joint statement by the US and five Central Asian states omits Afghanistan and shifts focus to trans-Caspian routes","Совместное заявление США и пяти стран Центральной Азии в Самарканде 19 октября не упоминает Афганистан, акцент смещён на транскаспийские маршруты"),b:L("報導稱聲明重點為跨裏海貿易路線與關鍵礦產投資，2023年7月的文件則曾為阿富汗設專場。中亞國家實務上仍推進經阿富汗鐵路，哈薩克2026年1月至7月對阿富汗出口麵粉2.16億美元。","报导称声明重点为跨里海贸易路线与关键矿产投资，2023年7月的文件则曾为阿富汗设专场。中亚国家实务上仍推进经阿富汗铁路，哈萨克2026年1月至7月对阿富汗出口面粉2.16亿美元。","タイムズ・オブ・セントラルアジアによると、声明の重点はカスピ海横断貿易ルートと中央アジアの重要鉱物への投資で、2023年7月にはアフガニスタンに専用の討議の場が設けられていた。中央アジア諸国は実務上アフガニスタン経由の鉄道を進めており、カザフスタンの2026年1月から7月の対アフガニスタン小麦粉輸出は2億1600万ドル。","Times of Central Asia melaporkan pernyataan itu berfokus pada rute dagang lintas Kaspia dan investasi mineral kritis Asia Tengah, sedangkan pada Juli 2023 ada sesi khusus Afghanistan. Negara Asia Tengah tetap memajukan rel melalui Afghanistan; ekspor tepung Kazakhstan ke Afghanistan Januari hingga Juli 2026 mencapai US$216 juta.","Times of Central Asia cho biết tuyên bố tập trung vào tuyến thương mại xuyên Caspi và đầu tư khoáng sản thiết yếu ở Trung Á, trong khi tháng 7/2023 từng có phiên riêng về Afghanistan. Các nước Trung Á trên thực tế vẫn thúc đẩy đường sắt qua Afghanistan; Kazakhstan xuất khẩu bột mì sang Afghanistan 216 triệu USD trong tháng 1 đến tháng 7/2026.","The Times of Central Asia reports the statement centers on trans-Caspian trade routes and Central Asian critical mineral investment, whereas in July 2023 Afghanistan had a dedicated session. Central Asian states still advance rail links through Afghanistan in practice; Kazakhstan's flour exports to Afghanistan reached US$216 million from January to July 2026.","The Times of Central Asia сообщает, что в центре заявления транскаспийские торговые маршруты и инвестиции в критически важные минералы Центральной Азии, тогда как в июле 2023 года Афганистану была посвящена отдельная сессия. Страны региона на практике продвигают железную дорогу через Афганистан; экспорт муки из Казахстана в Афганистан в январе-июле 2026 года составил 216 млн долларов."),k:L("美方連通性議程與中亞國家實務項目方向不一致，落差由各國自行承擔。","美方连通性议程与中亚国家实务项目方向不一致，落差由各国自行承担。","米国の連結性の議題と中央アジア諸国の実務案件は方向が一致せず、その差は各国が自ら負う。","Agenda konektivitas AS dan proyek praktis negara Asia Tengah tidak searah, dan selisihnya ditanggung masing-masing negara.","Chương trình kết nối của Mỹ và các dự án thực tế của các nước Trung Á không cùng hướng, khoảng cách đó do từng nước tự gánh.","The US connectivity agenda and Central Asian states' practical projects point in different directions, and each state bears the gap itself.","Повестка США по связанности и практические проекты стран Центральной Азии расходятся по направлению, и этот разрыв каждая страна несёт сама.")},
 {date:"2026-10-21",src:"中亞時報",url:"https://timesca.com/csto-in-no-hurry-to-help-tajikistan/",links:["mil"],t:L("集體安全條約組織塔吉阿邊境援助未交付，秘書長10月21日稱年底前出貨","集体安全条约组织塔吉阿边境援助未交付，秘书长10月21日称年底前出货","集団安全保障条約機構のタジク・アフガン国境支援は未引渡し、事務局長は10月21日に年内出荷と発言","Bantuan CSTO untuk perbatasan Tajikistan-Afghanistan belum diserahkan; Sekretaris Jenderal pada 21 Oktober menyebut pengiriman sebelum akhir tahun","Viện trợ của CSTO cho biên giới Tajikistan-Afghanistan chưa được giao; ngày 21/10 Tổng Thư ký nói sẽ xuất hàng trước cuối năm","CSTO aid for the Tajik-Afghan border remains undelivered; on October 21 the Secretary General said shipment would come by year-end","Помощь ОДКБ для таджикско-афганской границы не доставлена; генсек 21 октября заявил об отгрузке до конца года"),b:L("該計畫2024年11月核可。秘書長馬薩迪科夫稱供應商選定第一階段已完成，稱援助對阿富汗不構成威脅。塔吉克於2025年11月針對邊境附近中國工人的攻擊後要求協助，該邊境長1360公里。","该计划2024年11月核可。秘书长马萨迪科夫称供应商选定第一阶段已完成，称援助对阿富汗不构成威胁。塔吉克于2025年11月针对边境附近中国工人的攻击后要求协助，该边境长1360公里。","計画は2024年11月に承認された。マサディコフ事務局長は供給業者選定の第1段階が完了したと述べ、支援はアフガニスタンへの脅威にならないとした。タジキスタンは2025年11月の国境付近の中国人労働者への攻撃後に支援を要請した。国境の長さは1360キロ。","Rencana ini disetujui November 2024. Sekretaris Jenderal Masadykov menyatakan tahap pertama pemilihan pemasok selesai dan bantuan itu bukan ancaman bagi Afghanistan. Tajikistan meminta bantuan setelah serangan November 2025 terhadap pekerja Tiongkok di dekat perbatasan sepanjang 1360 km itu.","Kế hoạch được phê duyệt tháng 11/2024. Tổng Thư ký Masadykov nói giai đoạn đầu chọn nhà cung cấp đã xong và viện trợ không đe dọa Afghanistan. Tajikistan đề nghị hỗ trợ sau các vụ tấn công tháng 11/2025 nhằm vào công nhân Trung Quốc gần biên giới dài 1360 km này.","The plan was approved in November 2024. Secretary General Masadykov said the first stage of supplier selection is complete and that the aid poses no threat to Afghanistan. Tajikistan asked for help after the November 2025 attacks on Chinese workers near the border, which is 1360 km long.","План одобрен в ноябре 2024 года. Генсек Масадыков заявил, что первый этап выбора поставщиков завершён и что помощь не угрожает Афганистану. Таджикистан запросил содействие после нападений в ноябре 2025 года на китайских рабочих у границы протяжённостью 1360 км."),k:L("中國非該組織成員，但本案起因含中國公民安全；年底前是否出貨為下一核對點。","中国非该组织成员，但本案起因含中国公民安全；年底前是否出货为下一核对点。","中国は同機構の加盟国ではないが、本件の発端には中国国民の安全が含まれる。年内に出荷されるかが次の確認点である。","Tiongkok bukan anggota organisasi ini, tetapi pemicunya mencakup keselamatan warga Tiongkok; pengiriman sebelum akhir tahun menjadi titik cek berikutnya.","Trung Quốc không phải thành viên tổ chức này, nhưng nguyên nhân vụ việc có an toàn công dân Trung Quốc; việc xuất hàng trước cuối năm là mốc kiểm chứng tiếp theo.","China is not a member, yet the trigger includes the safety of Chinese citizens; whether shipment happens by year-end is the next point to check.","Китай не входит в организацию, но поводом стала в том числе безопасность китайских граждан; следующая точка проверки: состоится ли отгрузка до конца года.")},
 {date:"2026-10-27",src:"聯邦公報",url:"https://www.federalregister.gov/documents/2026/10/27/2026-21880/suspension-of-the-commonwealth-of-the-northern-mariana-islands-cnmi-economic-vitality-and-security",links:["sec","ibm"],t:L("美國土安全部10月27日公告暫停北馬里亞納群島對中國公民免簽方案","美国土安全部10月27日公告暂停北马里亚纳群岛对中国公民免签方案","米国土安全保障省が10月27日、北マリアナ諸島の中国国民向けビザ免除制度の停止を公告","Departemen Keamanan Dalam Negeri AS 27 Oktober mengumumkan penangguhan bebas visa warga Tiongkok ke Kepulauan Mariana Utara","Ngày 27/10 Bộ An ninh Nội địa Mỹ công bố tạm ngừng chương trình miễn thị thực cho công dân Trung Quốc đến quần đảo Bắc Mariana","On October 27 the US Department of Homeland Security announced a suspension of the Northern Mariana Islands visa waiver for Chinese citizens","Министерство внутренней безопасности США 27 октября объявило о приостановке безвизовой программы Северных Марианских островов для граждан Китая"),b:L("暫停自美東時間10月30日14時生效，相當於當地10月31日4時。所列理由含國家安全與執法利益的風險、人口走私、間諜活動可能、生育旅遊與洗錢。既有旅行許可一律撤銷，未訂恢復時程。","暂停自美东时间10月30日14时生效，相当于当地10月31日4时。所列理由含国家安全与执法利益的风险、人口走私、间谍活动可能、生育旅游与洗钱。既有旅行许可一律撤销，未订恢复时程。","停止は米東部時間10月30日14時に発効し、現地の10月31日4時に当たる。理由には国家安全保障と法執行上のリスク、人身密輸、スパイ活動の可能性、出産旅行、資金洗浄が挙げられた。既存の旅行許可はすべて取り消され、再開時期は定められていない。","Penangguhan berlaku pukul 14.00 waktu bagian timur AS tanggal 30 Oktober, atau pukul 04.00 waktu setempat tanggal 31 Oktober. Alasannya mencakup risiko keamanan nasional dan penegakan hukum, penyelundupan manusia, kemungkinan spionase, wisata melahirkan, dan pencucian uang. Izin perjalanan yang ada dicabut seluruhnya, tanpa jadwal pemulihan.","Lệnh tạm ngừng có hiệu lực lúc 14 giờ ngày 30/10 giờ miền Đông Mỹ, tức 4 giờ ngày 31/10 giờ địa phương. Lý do nêu ra gồm rủi ro an ninh quốc gia và thực thi pháp luật, đưa người lậu, khả năng gián điệp, du lịch sinh con và rửa tiền. Mọi giấy phép đi lại hiện có đều bị thu hồi, chưa định lịch khôi phục.","The suspension takes effect at 2 p.m. US Eastern Time on October 30, which is 4 a.m. local time on October 31. Listed reasons include national security omain awareness and about US$3.5 million for border inspection in Tonga.","Islands Business сообщает, что Госдепартамент объявил об этом на первой встрече министров полиции США и тихоокеанских островных государств в Лос-Анджелесе 21-22 октября. Среди других статей: почти 5,5 млн долларов на осведомлённость о морской обстановке и около 3,5 млн долларов на пограничный досмотр в Тонге."),k:L("帛琉是台灣在本區的邦交國之一，此案使其在本區執法架構中的位置上升。","帛琉是台湾在本区的邦交国之一，此案使其在本区执法架构中的位置上升。","パラオはこの地域における台湾の国交国の一つで、本件により地域の法執行体制での位置づけが高まる。","Palau adalah salah satu negara mitra diplomatik Taiwan di kawasan ini, dan posisinya dalam struktur penegakan hukum kawasan pun naik.","Palau là một trong các nước có quan hệ ngoại giao với Đài Loan tại khu vực này, và vị trí của Palau trong cấu trúc thực thi pháp luật khu vực được nâng lên.","Palau is one of Taiwan's diplomatic allies in the region, and this raises its position in the regional law enforcement structure.","Палау является одним из дипломатических союзников Тайваня в регионе, и это повышает его место в региональной правоохранительной структуре.")},

 {n:L("德州來的工程師Tom","德州来的工程师Tom","テキサスから来たエンジニアTom","Insinyur Tom dari Texas","Kỹ sư Tom đến từ Texas","Tom, an engineer from Texas","Том, инженер из Техаса"),s:L("公司派我們去德州評估設廠，還跟SpaceX的Terafab談合作。海外廠越多，毛利率稀釋越久。","公司派我们去德州评估设厂，还跟SpaceX的Terafab谈合作。海外厂越多，毛利率稀释越久。","テキサスの工場候補を調査し、SpaceXのTerafabとも協議。海外工場が増えるほど希薄化は長引く。","Kami dikirim mengevaluasi pabrik di Texas dan berdiskusi dengan Terafab SpaceX. Makin banyak pabrik luar negeri, makin lama dilusi.","Chúng tôi được cử đi đánh giá nhà máy ở Texas và bàn với Terafab của SpaceX. Càng nhiều nhà máy nước ngoài, pha loãng càng lâu.","The company sent us to Texas to assess a new fab, and we are also talking with SpaceX's Terafab about working together. The more overseas fabs there are, the longer the gross margin stays diluted.","Компания отправила нас в Техас оценить площадку под завод, и мы ещё обсуждаем сотрудничество с Terafab от SpaceX. Чем больше зарубежных заводов, тем дольше размывается валовая маржа."),h:L("提示：2奈米占第三季晶圓營收8%。","提示：2纳米占第三季度晶圆营收8%。","ヒント：2nmは第3四半期ウエハー売上の8%。","Petunjuk: 2nm 8% pendapatan wafer Q3.","Gợi ý: 2nm chiếm 8% doanh thu wafer Q3.","Hint: 2 nanometer accounted for 8% of third quarter wafer revenue.","Подсказка: на 2-нанометровый процесс пришлось 8% выручки от пластин в третьем квартале.")}],
